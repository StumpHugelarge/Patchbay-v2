/* ---------- signal-flow links: Inspector panel, picker, pick-on-screen ---------- */
function findGear(gearId){
  for(var i = 0; i < state.bays.length; i++){
    var b = state.bays[i];
    if(b.type !== "rack") continue;
    for(var j = 0; j < b.gear.length; j++){ if(b.gear[j].id === gearId) return {bay:b, gear:b.gear[j]}; }
  }
  return null;
}
function gearChannelEndpoints(g){
  var out = [];
  for(var i = 1; i <= (g.ins || 0); i++) out.push(getEndpoint(gearChId(g.id, "in", i)));
  for(var j = 1; j <= (g.outs || 0); j++) out.push(getEndpoint(gearChId(g.id, "out", j)));
  return out.filter(Boolean);
}
function setEpLabel(ep, text){
  text = String(text || "").slice(0, 60);
  if(ep.kind === "port"){ ep.port.label = text; return; }
  if(!ep.gear.chLabels) ep.gear.chLabels = {};
  var k = chKey(ep.dir, ep.n);
  if(text) ep.gear.chLabels[k] = text; else delete ep.gear.chLabels[k];
}
function jumpToEndpoint(id){
  var ep = getEndpoint(id);
  if(!ep) return;
  jumpToResult(ep.kind === "gear"
    ? {kind:"gear", bayId:ep.bay.id, itemId:ep.gear.id}
    : {kind:"port", bayId:ep.bay.id, itemId:ep.port.id});
}

/* what to light up on screen for the current selection */
var _hlCache = {key:"", val:{ports:{}, gear:{}}}, _linkedCache = {key:"", val:{}};
function selectedEndpointIds(){
  if(ui.selection.length !== 1) return [];
  var id = ui.selection[0];
  if(getEndpoint(id)) return [id];
  var hit = findGear(id);
  return hit ? gearChannelEndpoints(hit.gear).map(function(e){ return e.id; }) : [];
}
function traceHighlight(){
  var key = linkRev + "|" + (ui.showTrace ? 1 : 0) + "|" + ui.selection.join(",") + "|" + linkList().length;
  if(_hlCache.key === key && _hlCache.state === state) return _hlCache.val;
  var val = {ports:{}, gear:{}};
  if(ui.showTrace && linkList().length){
    selectedEndpointIds().forEach(function(id){
      var all = {};
      traceUp(id).forEach(function(h){ all[h.id] = true; });
      var down = traceDownSet(id);
      Object.keys(down).forEach(function(k){ all[k] = true; });
      Object.keys(all).forEach(function(k){
        var gc = parseGearCh(k);
        if(gc) val.gear[gc.gearId] = true; else val.ports[k] = true;
      });
    });
  }
  _hlCache = {key:key, state:state, val:val};
  return val;
}
// Every endpoint (and every piece of gear) that has at least one link on it.
function linkedMap(){
  var key = linkRev + "|" + linkList().length;
  if(_linkedCache.key === key && _linkedCache.state === state) return _linkedCache.val;
  var m = {};
  linkList().forEach(function(l){
    [l.from, l.to].forEach(function(id){
      var gc = parseGearCh(id);
      m[gc ? gc.gearId : id] = true;
    });
  });
  _linkedCache = {key:key, state:state, val:m};
  return m;
}

/* pick on screen */
function epChipHtml(id){
  var ep = getEndpoint(id);
  if(!ep) return "";
  var lbl = epLabel(ep);
  return '<button type="button" class="flow-chip" data-flow-jump="'+escapeAttr(id)+'" title="Go to '+escapeAttr(epWhere(ep))+'">' +
    (lbl ? '<b>'+escapeHtml(lbl)+'</b>' : '') + '<span>'+escapeHtml(epWhere(ep))+'</span></button>';
}
function pickEligible(candidateId){
  if(!ui.pick) return false;
  return !(ui.pick.role === "to" ? checkLink(ui.pick.epId, candidateId) : checkLink(candidateId, ui.pick.epId));
}
function pickGearEligible(g){
  return gearChannelEndpoints(g).some(function(e){ return pickEligible(e.id); });
}
function renderPickBanner(){
  var el = document.getElementById("pickBanner");
  if(!ui.pick){ if(el) el.remove(); document.body.classList.remove("is-picking"); return; }
  var ep = getEndpoint(ui.pick.epId);
  var who = ep ? (epLabel(ep) || epWhere(ep)) : "this connection";
  if(!el){
    el = document.createElement("div");
    el.id = "pickBanner"; el.className = "pick-banner"; el.setAttribute("role", "status");
    document.body.appendChild(el);
  }
  el.innerHTML = '<span>' + (ui.pick.role === "to" ? 'Click where “'+escapeHtml(who)+'” goes' : 'Click where “'+escapeHtml(who)+'” comes from') +
    ' — switch tabs or bays if you need to</span><button type="button" class="btn btn-sm" id="pickCancelBtn">Cancel (Esc)</button>';
  document.getElementById("pickCancelBtn").addEventListener("click", endPick);
  document.body.classList.add("is-picking");
}
function startPick(epId, role){
  if(!getEndpoint(epId)) return;
  ui.pick = {epId:epId, role:role};
  renderPickBanner();
  renderGrid();
}
function endPick(){
  if(!ui.pick) return;
  ui.pick = null;
  renderPickBanner();
  renderGrid();
}
function cancelPickSilently(){ ui.pick = null; renderPickBanner(); }
// Makes the link, then takes you back to the endpoint you started from.
function connectEndpoints(anchorId, role, targetId){
  var fromId = role === "to" ? anchorId : targetId, toId = role === "to" ? targetId : anchorId;
  historyBreak();
  var r = addLink(fromId, toId);
  if(!r.ok){ showToast(r.reason, "error"); return false; }
  var a = getEndpoint(fromId), b = getEndpoint(toId);
  showToast(r.same ? "Already connected." : "Connected " + epWhere(a) + " → " + epWhere(b) + (r.replaced ? " (replaced its previous source)." : "."), "success");
  return true;
}
function completePick(targetId){
  if(!ui.pick) return;
  var anchor = ui.pick.epId, role = ui.pick.role;
  if(!connectEndpoints(anchor, role, targetId)) return; // stay in pick mode so you can try another
  ui.pick = null;
  renderPickBanner();
  jumpToEndpoint(anchor);
}
function handlePickPort(portId){ completePick(portId); }
function handlePickGear(bay, gearId){
  var g = null;
  bay.gear.forEach(function(x){ if(x.id === gearId) g = x; });
  if(!g) return;
  var want = ui.pick.role === "to" ? "input" : "output";
  var eligible = gearChannelEndpoints(g).filter(function(e){ return pickEligible(e.id); });
  if(!eligible.length){
    showToast((g.name || "That piece") + " has no free " + want + " channels — set its channel counts in the Inspector first.", "error");
    return;
  }
  if(eligible.length === 1){ completePick(eligible[0].id); return; }
  openLinkPicker({epId:ui.pick.epId, role:ui.pick.role, onlyGearId:g.id});
}

/* the "Connect to…" list */
function openLinkPicker(opts){
  var anchor = getEndpoint(opts.epId);
  if(!anchor) return;
  var role = opts.role;
  var who = epLabel(anchor) || epWhere(anchor);
  openDialog({
    title: role === "to" ? "Send “" + who + "” to…" : "Where does “" + who + "” come from?",
    width: 600,
    bodyHtml:
      '<div class="lp-top"><input type="search" id="lpFilter" placeholder="Filter by label, bay or position…" autocomplete="off" aria-label="Filter connections" />' +
      (opts.onlyGearId ? '' : '<button type="button" class="btn btn-sm btn-primary" id="lpScreenBtn" title="Close this list and click the port or gear on screen">Pick on screen</button>') + '</div>' +
      '<p class="insp-empty" style="padding:0;" id="lpHint"></p><div class="lp-list" id="lpList"></div>',
    buttons: [{label:"Cancel", cls:"btn-ghost", onClick:function(){ if(ui.pick && opts.onlyGearId){ /* keep picking */ } }}],
    focus: "#lpFilter",
    onOpen: function(root){
      var list = root.querySelector("#lpList"), hint = root.querySelector("#lpHint"), filter = root.querySelector("#lpFilter");
      function paint(){
        var terms = searchTerms(filter.value), html = "", shown = 0, capped = false;
        state.bays.forEach(function(bay){
          if(capped) return;
          var rows = "";
          var eps = bay.type === "rack"
            ? bay.gear.filter(function(g){ return !opts.onlyGearId || g.id === opts.onlyGearId; }).reduce(function(acc, g){ return acc.concat(gearChannelEndpoints(g)); }, [])
            : (opts.onlyGearId ? [] : bay.ports.map(function(p){ return getEndpoint(p.id); }));
          eps.forEach(function(ep){
            if(capped || !ep) return;
            if(role === "to" ? !canReceiveAt(ep) : !canSendFrom(ep)) return;
            if(role === "to" ? checkLink(anchor.id, ep.id) : checkLink(ep.id, anchor.id)) return;
            var lbl = epLabel(ep);
            if(terms.length && !termsMatch(epDisplay(ep), terms)) return;
            if(shown >= 300){ capped = true; return; }
            shown++;
            var note = role === "to" && incomingLink(ep.id) ? "replaces its source" : (role === "to" && !incomingLink(ep.id) && normalledFrom(ep) ? "normalled" : "");
            rows += '<button type="button" class="lp-item" data-lp="'+escapeAttr(ep.id)+'">' + (lbl ? '<b>'+escapeHtml(lbl)+'</b>' : '') +
              '<span>'+escapeHtml(epPosition(ep))+'</span>' + (note ? '<em>'+note+'</em>' : '') + '</button>';
          });
          if(rows) html += '<div class="lp-bay">'+escapeHtml(bay.name)+'</div>' + rows;
        });
        list.innerHTML = html || '<p class="insp-empty">Nothing matches' + (opts.onlyGearId ? ' — that piece has no free channels.' : '.') + '</p>';
        hint.textContent = capped ? "Showing the first 300 — type to narrow the list." :
          (role === "to" ? "Pick where the signal goes. An input can only have one source, so choosing one that’s already fed will replace it."
                         : "Pick where the signal comes from.");
      }
      filter.addEventListener("input", paint);
      list.addEventListener("click", function(e){
        var item = e.target.closest("[data-lp]"); if(!item) return;
        var targetId = item.getAttribute("data-lp");
        if(ui.pick){ closeDialog(); completePick(targetId); return; }
        if(connectEndpoints(opts.epId, role, targetId)){ closeDialog(); renderGrid(); renderInspector(); }
      });
      var screenBtn = root.querySelector("#lpScreenBtn");
      if(screenBtn) screenBtn.addEventListener("click", function(){ closeDialog(); startPick(opts.epId, role); });
      paint();
    }
  });
}

/* the Inspector's signal-flow panel */
function flowRowHtml(ep, withLabelInput){
  var id = ep.id, html = '<div class="flow-row'+(withLabelInput ? '' : ' flow-row--solo')+'" data-ep="'+escapeAttr(id)+'">';
  if(withLabelInput){
    html += '<div class="flow-title"><span>' + escapeHtml(ep.dir === "in" ? "In " + ep.n : "Out " + ep.n) + '</span>' +
      '<input type="text" data-ch-label="'+escapeAttr(id)+'" value="'+escapeAttr(epTypedLabel(ep))+'" placeholder="Name this channel" maxlength="60" aria-label="Channel label" /></div>';
  }
  if(canReceiveAt(ep)){
    var inc = incomingLink(id), info = sourceInfo(id), norm = (!inc) ? normalledFrom(ep) : null;
    html += '<div class="flow-side"><span class="eyebrow">Comes from</span>';
    if(info){
      var chain = info.hops.slice().reverse();
      html += '<div class="flow-chain">' + chain.map(function(h, i){
        return epChipHtml(h.id) + '<span class="flow-arrow" aria-hidden="true">→</span>';
      }).join("") + '<span class="flow-norm">this</span></div>';
      if(!inc && norm) html += '<span class="flow-norm">Normalled from the jack above (column is ' + escapeHtml(ROUTING_LABELS[(getColumn(ep.bay, ep.port.index) || {}).state] || "Normal") + ').</span>';
      var lab = info.labeled, labText = lab ? epLabel(lab) : "";
      if(lab && labText !== epTypedLabel(ep)){
        html += '<div class="flow-src-label"><span>from <b>'+escapeHtml(labText)+'</b> · '+escapeHtml(epWhere(lab))+'</span>' +
          '<button type="button" class="btn btn-sm" data-flow-use-label="'+escapeAttr(id)+'" title="'+(epTypedLabel(ep) ? 'Replaces the label you typed' : 'Copy that name onto this one')+'">' + (epTypedLabel(ep) ? 'Replace label' : 'Use this label') + '</button></div>';
      }
    } else {
      html += '<span class="flow-none">Not connected.</span>';
    }
    html += '<div class="btn-row">' +
      '<button type="button" class="btn btn-sm" data-flow-pick="from">' + (inc ? 'Change source…' : 'Set source…') + '</button>' +
      (inc ? '<button type="button" class="btn btn-sm btn-ghost" data-flow-unlink="'+escapeAttr(inc.id)+'">Remove link</button>' : '') +
      '</div></div>';
  } else {
    html += '<div class="flow-side"><span class="eyebrow">Comes from</span><span class="flow-none">An output — signal starts here.</span></div>';
  }
  if(canSendFrom(ep)){
    var outs = outgoingLinks(id).filter(function(l){ return getEndpoint(l.to); }), nt = normalledTo(ep);
    html += '<div class="flow-side"><span class="eyebrow">Goes to</span>';
    if(!outs.length && !nt) html += '<span class="flow-none">Nowhere yet.</span>';
    outs.forEach(function(l){
      html += '<div class="flow-dest">' + epChipHtml(l.to) +
        '<button type="button" class="icon-btn" data-flow-unlink="'+escapeAttr(l.id)+'" title="Remove this link" aria-label="Remove link">×</button></div>';
    });
    if(nt) html += '<div class="flow-dest">' + epChipHtml(nt.id) + '<span class="flow-norm">normalled</span></div>';
    html += '<div class="btn-row"><button type="button" class="btn btn-sm" data-flow-pick="to">+ Add destination…</button></div></div>';
  } else {
    html += '<div class="flow-side"><span class="eyebrow">Goes to</span><span class="flow-none">An input — signal ends here.</span></div>';
  }
  return html + '</div>';
}
function flowTraceToggleHtml(){
  return '<label class="flow-trace"><input type="checkbox" data-flow-trace' + (ui.showTrace ? ' checked' : '') + ' /> Highlight the path on screen</label>';
}
function flowPanelHtml(kind, id){
  if(kind === "port"){
    var ep = getEndpoint(id);
    if(!ep) return "";
    return '<div class="flow-panel" data-fp-kind="port" data-fp-id="'+escapeAttr(id)+'"><div class="flow-head"><h3>Signal flow</h3>' + flowTraceToggleHtml() + '</div>' +
      '<div class="flow-rows">' + flowRowHtml(ep, false) + '</div></div>';
  }
  var hit = findGear(id);
  if(!hit) return "";
  var g = hit.gear, chans = gearChannelEndpoints(g);
  return '<div class="flow-panel" data-fp-kind="gear" data-fp-id="'+escapeAttr(id)+'"><div class="flow-head"><h3>Channels &amp; signal flow</h3>' +
    '<div class="chan-row"><label>Inputs <input type="number" id="gearInsInput" min="0" max="'+MAX_GEAR_CH+'" value="'+(g.ins || 0)+'" /></label>' +
    '<label>Outputs <input type="number" id="gearOutsInput" min="0" max="'+MAX_GEAR_CH+'" value="'+(g.outs || 0)+'" /></label></div>' +
    (chans.length ? flowTraceToggleHtml() : '') + '</div>' +
    (chans.length ? '<div class="flow-rows">' + chans.map(function(ep){ return flowRowHtml(ep, true); }).join("") + '</div>'
      : '<p class="insp-empty" style="padding:0;">Say how many inputs and outputs this piece has, and each one becomes a point you can connect — from a patchbay port, a snake channel, or another piece of gear.</p>') +
    '</div>';
}
function refreshFlowPanel(){
  var panel = document.querySelector("#inspectorBody .flow-panel");
  if(!panel) return;
  var html = flowPanelHtml(panel.getAttribute("data-fp-kind"), panel.getAttribute("data-fp-id"));
  var tmp = document.createElement("div");
  tmp.innerHTML = html;
  var fresh = tmp.firstChild;
  if(fresh){ panel.replaceWith(fresh); wireFlowPanel(); }
}
function wireFlowPanel(){
  var panel = document.querySelector("#inspectorBody .flow-panel");
  if(!panel) return;
  panel.addEventListener("click", function(e){
    var jump = e.target.closest("[data-flow-jump]");
    if(jump){ jumpToEndpoint(jump.getAttribute("data-flow-jump")); return; }
    var un = e.target.closest("[data-flow-unlink]");
    if(un){ historyBreak(); removeLink(un.getAttribute("data-flow-unlink")); renderGrid(); refreshFlowPanel(); return; }
    var pick = e.target.closest("[data-flow-pick]");
    if(pick){
      var row = pick.closest(".flow-row");
      openLinkPicker({epId:row.getAttribute("data-ep"), role:pick.getAttribute("data-flow-pick")});
      return;
    }
    var use = e.target.closest("[data-flow-use-label]");
    if(use){
      var ep = getEndpoint(use.getAttribute("data-flow-use-label")), info = ep && sourceInfo(ep.id);
      if(!ep || !info || !info.labeled) return;
      historyBreak();
      setEpLabel(ep, epLabel(info.labeled));
      markDirty();
      renderGrid(); renderInspector();
    }
  });
  panel.addEventListener("input", function(e){
    var inp = e.target.closest("[data-ch-label]");
    if(!inp) return;
    var ep = getEndpoint(inp.getAttribute("data-ch-label"));
    if(!ep) return;
    setEpLabel(ep, inp.value);
    markDirty();
  });
  panel.addEventListener("change", function(e){
    if(e.target.matches("[data-flow-trace]")){ ui.showTrace = e.target.checked; renderGrid(); return; }
    var kind = panel.getAttribute("data-fp-kind");
    if(kind === "gear" && (e.target.id === "gearInsInput" || e.target.id === "gearOutsInput")){
      var hit = findGear(panel.getAttribute("data-fp-id"));
      if(!hit) return;
      historyBreak();
      var g = hit.gear;
      g.ins = clampChannels(document.getElementById("gearInsInput").value);
      g.outs = clampChannels(document.getElementById("gearOutsInput").value);
      g.chLabels = cleanChLabels(g.chLabels, g.ins, g.outs);
      markDirty(); renderGrid(); renderInspector();
    }
  });
}
// Fills only the empty labels on the selected ports from whatever feeds them.
function fillLabelsFromSources(ports){
  var n = 0;
  ports.forEach(function(p){
    if(p.label) return;
    var info = sourceInfo(p.id);
    if(info && info.labeled){ p.label = epLabel(info.labeled).slice(0, 60); n++; }
  });
  if(n){ historyBreak(); markDirty(); renderGrid(); renderInspector(); }
  showToast(n ? "Filled " + n + " empty label" + (n === 1 ? "" : "s") + " from their sources." : "No empty labels had a labelled source to copy.", n ? "success" : undefined);
}
// A plain-text list of every signal path, one row per end point.
function exportSignalFlowCSV(){
  var rows = [["from_label","from_bay","from_position","to_label","to_bay","to_position","via"]];
  var idx = endpointIndex();
  function add(a, b, via){ rows.push([epLabel(a), a.bay.name, epPosition(a), epLabel(b), b.bay.name, epPosition(b), via]); }
  linkList().forEach(function(l){ var a = idx[l.from], b = idx[l.to]; if(a && b) add(a, b, "cable"); });
  Object.keys(idx).forEach(function(id){
    var ep = idx[id], nt = normalledTo(ep);
    if(nt) add(ep, nt, "normalled");
  });
  if(rows.length === 1){ showToast("No links yet — connect some ports first.", "error"); return; }
  saveFile("patch-sheet-signal-flow.csv", rows.map(function(r){ return r.map(csvField).join(","); }).join("\r\n"));
}

// "Tom #" + 3 -> "Tom 3"; "Overhead" + 2 -> "Overhead 2".
function numberedLabel(base, n){
  return base.indexOf("#") !== -1 ? base.replace(/#/g, String(n)) : (base + " " + n);
}
function advanceSelection(bay, dir){
  var order = bay.ports.map(function(p){return p.id;});
  var cur = ui.anchor || ui.selection[0];
  var idx = order.indexOf(cur);
  var next = Math.max(0, Math.min(order.length-1, idx+dir));
  selectPort(bay, order[next], {shift:false, ctrl:false});
}
function renderPortInGrid(p){
  var el = document.querySelector('.port[data-port="'+cssEscape(p.id)+'"]');
  if(!el) return;
  var group = p.groupId ? getGroup(p.groupId) : null;
  el.style.borderColor = group ? group.color : "var(--border-strong)";
  el.style.borderWidth = group ? "3px" : "";
  el.classList.toggle("is-dim", !!ui.highlightGroup && p.groupId !== ui.highlightGroup);
  var lbl = el.querySelector(".lbl");
  if(p.label){ lbl.className="lbl"; lbl.textContent = p.label; }
  else { lbl.className="lbl placeholder"; lbl.textContent = "—"; }
  var existingDot = el.querySelector(".note-dot");
  if(p.notes && !existingDot){ var d=document.createElement("span"); d.className="note-dot"; el.appendChild(d); }
  if(!p.notes && existingDot){ existingDot.remove(); }
}
function renderGlyphInGrid(bay, colIndex){
  var el = document.querySelector('.glyph-cell[data-col="'+colIndex+'"]');
  if(!el) return;
  var col = getColumn(bay, colIndex);
  var state = col ? col.state : "normal";
  var label = ROUTING_LABELS[state] || "Normal";
  el.innerHTML = routingGlyphHtml(state);
  el.title = "Column "+colIndex+" — "+label;
  el.setAttribute("aria-label", "Column "+colIndex+" routing: "+label);
}
function cssEscape(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g, function(c){ return "\\"+c; }); }

/* ---------- templates (saved on this device) ---------- */
// kind "project": a whole project as a starting point. kind "bay": one bay,
// rack or snake plus the device groups it uses, so it drops into any project.
function loadTemplates(){
  try{
    var parsed = JSON.parse(lsGet(TEMPLATES_KEY));
    if(Array.isArray(parsed)) return parsed.filter(function(t){ return t && t.id && t.name && t.data && (t.kind === "project" || t.kind === "bay"); });
  }catch(e){ /* ignore */ }
  return [];
}
function saveTemplates(list){
  if(!lsSet(TEMPLATES_KEY, JSON.stringify(list))){ showToast("Couldn't save templates — device storage is full.", "error"); return false; }
  renderBayMenu(); renderProjectMenu(); // the menus list templates, so refresh them now
  return true;
}
function templateTag(t){
  if(t.kind === "project") return "Project";
  var b = t.data.bay || {};
  if(b.type === "xlr") return "XLR";
  if(b.type === "trs") return "TRS " + (b.size || 48);
  if(b.type === "rack") return "Rack " + (b.heightU || "") + "U";
  if(b.type === "snake") return "Snake " + b.sends + "×" + b.returns;
  return "Bay";
}
function groupsUsedByBayRaw(bay){
  var seen = {}, out = [];
  var items = bay.type === "rack" ? bay.gear : bay.ports;
  items.forEach(function(it){
    if(it.groupId && !seen[it.groupId]){
      seen[it.groupId] = true;
      var g = getGroup(it.groupId);
      if(g) out.push({id:g.id, name:g.name, color:g.color});
    }
  });
  return out;
}
function saveBayAsTemplate(bay, name){
  var list = loadTemplates();
  list.push({id:"tpl-"+uid(), kind:"bay", name:name, created:Date.now(),
    data:{bay: JSON.parse(JSON.stringify(bay)), groups: groupsUsedByBayRaw(bay), links: bayInternalLinks(bay)}});
  if(saveTemplates(list)) showToast('Saved bay template “'+name+'”.', "success");
}
function saveProjectAsTemplate(name){
  var list = loadTemplates();
  list.push({id:"tpl-"+uid(), kind:"project", name:name, created:Date.now(), data: JSON.parse(JSON.stringify(state))});
  if(saveTemplates(list)) showToast('Saved project template “'+name+'”.', "success");

/* ---------- copying a bay (duplicate / from template) ---------- */
// Builds a fresh copy of a bay under a new id. Port ids embed the bay id and
// gear ids are their own, so both are reissued. Device groups are carried by
// name: a group that already exists in this project is reused, a missing one
// is created, so a template never silently drops its color coding.
function uniqueBayName(type, base){
  var names = baysOfType(type).map(function(b){ return b.name.toLowerCase(); });
  if(names.indexOf(base.toLowerCase()) === -1) return base;
  var n = 2;
  while(names.indexOf((base + " (" + n + ")").toLowerCase()) !== -1) n++;
  return base + " (" + n + ")";
}
function copyBayData(bayRaw, srcGroups, name, sameProject, srcLinks){
  var raw = JSON.parse(JSON.stringify(bayRaw));
  var oldId = raw.id, newId = raw.type + "-" + uid();
  var map = {}, epMap = {}; // epMap: old endpoint id -> new endpoint id, so links inside the bay survive the copy
  (srcGroups || []).forEach(function(g){
    var target = sameProject ? getGroup(g.id) : null;
    if(!target) target = state.groups.filter(function(x){ return x.name.toLowerCase() === String(g.name).toLowerCase(); })[0];
    if(!target){ target = {id:"grp-"+uid(), name:String(g.name), color:String(g.color || "#888888")}; state.groups.push(target); }
    map[g.id] = target.id;
  });
  function mapGroup(id){ return (id && map[id]) ? map[id] : null; }
  if(raw.type === "rack"){
    raw.gear = (raw.gear || []).map(function(g){
      var c = {}; Object.keys(g).forEach(function(k){ c[k] = g[k]; });
      c.id = "gear-" + uid(); c.groupId = mapGroup(g.groupId);
      for(var i = 1; i <= clampChannels(g.ins); i++) epMap[gearChId(g.id, "in", i)] = gearChId(c.id, "in", i);
      for(var j = 1; j <= clampChannels(g.outs); j++) epMap[gearChId(g.id, "out", j)] = gearChId(c.id, "out", j);
      return c;
    });
  } else {
    raw.ports = (raw.ports || []).filter(function(pt){ return pt.id && pt.id.indexOf(oldId + "-") === 0; }).map(function(pt){
      var c = {}; Object.keys(pt).forEach(function(k){ c[k] = pt[k]; });
      c.id = newId + pt.id.slice(oldId.length); c.groupId = mapGroup(pt.groupId);
      epMap[pt.id] = c.id;
      return c;
    });
  }
  raw.id = newId;
  raw.name = name;
  var copy = normalizeState({bays:[raw], groups: state.groups}).bays[0];
  copy._links = (srcLinks || []).filter(function(l){ return l && epMap[l.from] && epMap[l.to]; }).map(function(l){ return {from:epMap[l.from], to:epMap[l.to]}; });
  return copy;
}
function insertBay(bay, afterId){
  var carried = bay._links || [];
  delete bay._links;
  var at = -1;
  if(afterId){ state.bays.forEach(function(b, i){ if(b.id === afterId) at = i; }); }
  if(at === -1) state.bays.push(bay); else state.bays.splice(at + 1, 0, bay);
  carried.forEach(function(l){ linkRev++; if(!checkLink(l.from, l.to) && !incomingLink(l.to)) state.links.push({id:"lnk-" + uid(), from:l.from, to:l.to}); });
  ui.section = bay.type;
  ui.activeBay[bay.type] = bay.id;
  clearSelectionSilently();
  markDirty();
  renderAll();
}
function duplicateBay(bayId){
  var bay = getBay(bayId);
  if(!bay) return;
  historyBreak();
  var copy = copyBayData(bay, groupsUsedByBayRaw(bay), uniqueBayName(bay.type, bay.name + " copy"), true, bayInternalLinks(bay));
  insertBay(copy, bay.id);
  showToast('Duplicated “'+bay.name+'”.', "success");
}
function addBayFromTemplate(tplId){
  var t = loadTemplates().filter(function(x){ return x.id === tplId && x.kind === "bay"; })[0];
  if(!t){ showToast("That template is gone.", "error"); return; }
  historyBreak();
  var src = t.data.bay;
  var copy = copyBayData(src, t.data.groups, uniqueBayName(src.type, src.name || t.name), false, t.data.links);
  if(ui.viewMode === "compare" && copy.type !== "rack"){ ui.viewMode = "compact"; try{ localStorage.setItem(VIEWMODE_KEY, "compact"); }catch(e){ /* ignore */ } }
  insertBay(copy, null);
  showToast('Added “'+copy.name+'” from template.', "success");
}

/* ---------- projects ---------- */
var historyStash = {}; // project id -> {u, r}: undo/redo survives switching back and forth
function nextProjectName(){
  return uniqueProjectName("Project " + (projectIndex.projects.length + 1));
}
function uniqueProjectName(base){
  var names = projectIndex.projects.map(function(pr){ return String(pr.name).toLowerCase(); });
  if(names.indexOf(base.toLowerCase()) === -1) return base;
  var n = 2;
  while(names.indexOf((base + " (" + n + ")").toLowerCase()) !== -1) n++;
  return base + " (" + n + ")";
}
function addProjectFromState(st){
  var id = "prj-" + uid();
  if(!lsSet(projectKey(id), JSON.stringify(st))){ showToast("Couldn't create the project — device storage is full.", "error"); return null; }
  projectIndex.projects.push({id:id, name:st.name, updated:Date.now(), bays:st.bays.length});
  saveProjectIndex();
  return id;
}
function resetProjectUi(){
  ui.section = "xlr"; ui.activeBay = {}; ui.compareIds = []; ui.highlightGroup = null; cancelPickSilently();
  clearSelectionSilently();
  ui.search = {q:"", results:[], active:0};
  var si = document.getElementById("searchInput"); if(si) si.value = "";
  hideSearchResults();
}
function switchProject(id){
  if(!id || id === currentProjectId) return;
  var next = loadProjectState(id);
  if(!next){ showToast("Couldn't open that project.", "error"); return; }
  if(currentProjectId){
    saveLocalDraft();
    historyStash[currentProjectId] = {u:undoStack, r:redoStack};
  }
  currentProjectId = id;
  saveProjectIndex();
  state = next;
  resetHistory();
  var stash = historyStash[id];
  if(stash){ undoStack = stash.u; redoStack = stash.r; updateUndoButtons(); }
  resetProjectUi();
  setSaveStatus(false);
  renderAll();
}
function createProject(name, templateId){
  var st = null;
  if(templateId){
    var t = loadTemplates().filter(function(x){ return x.id === templateId && x.kind === "project"; })[0];
    if(t) st = normalizeState(JSON.parse(JSON.stringify(t.data)));
  }
  if(!st) st = createDefaultState();
  st.name = uniqueProjectName(name || nextProjectName());
  var id = addProjectFromState(st);
  if(!id) return;
  switchProject(id);
  showToast('Started “'+st.name+'”. Your other projects are in the project menu.', "success");
}
function renameProject(name){
  name = String(name || "").trim();
  if(!name || name === state.name) return;
  var others = projectIndex.projects.filter(function(pr){ return pr.id !== currentProjectId; }).map(function(pr){ return String(pr.name).toLowerCase(); });
  var final = name, n = 2;
  while(others.indexOf(final.toLowerCase()) !== -1){ final = name + " (" + n + ")"; n++; }
  historyBreak();
  state.name = final.slice(0, 80);
  markDirty();
  renderMenus();
}
function duplicateProject(){
  saveLocalDraft();
  var st = normalizeState(JSON.parse(JSON.stringify(state)));
  st.name = uniqueProjectName(state.name + " copy");
  var id = addProjectFromState(st);
  if(id){ switchProject(id); showToast('Duplicated into “'+st.name+'”.', "success"); }
}
function deleteCurrentProject(){
  var id = currentProjectId, name = state.name;
  lsRemove(projectKey(id));
  delete historyStash[id];
  projectIndex.projects = projectIndex.projects.filter(function(pr){ return pr.id !== id; });
  currentProjectId = null; // so the departing project is not written back
  var nextId;
  if(projectIndex.projects.length){
    nextId = projectIndex.projects.slice().sort(function(a, b){ return (b.updated||0) - (a.updated||0); })[0].id;
  } else {
    var fresh = createDefaultState(); fresh.name = "My project";
    nextId = addProjectFromState(fresh);
  }
  switchProject(nextId);
  showToast('Deleted “'+name+'”.');
}

function openSnakeModal(mode, bayId){
  var bay = mode === "resize" ? getBay(bayId) : null;
  ui.snakeModal = {
    mode: mode, bayId: bayId || null,
    sends: bay ? bay.sends : SNAKE_DEFAULT_SENDS,
    returns: bay ? bay.returns : SNAKE_DEFAULT_RETURNS
  };
  renderSnakeModal();

function closeSnakeModal(){
  ui.snakeModal = null;
  document.getElementById("modalHost").innerHTML = "";
}
function snakeSegHtml(id, label, options, active){
  return '<div class="field"><label>'+label+'</label><div class="segmented" id="'+id+'" role="group" aria-label="'+label+'">' +
    options.map(function(n){
      return '<button type="button" class="seg-btn'+(n===active?' is-active':'')+'" data-n="'+n+'">'+n+'</button>';
    }).join("") + '</div></div>';
}
function renderSnakeModal(){
  var host = document.getElementById("modalHost");
  var m = ui.snakeModal;
  if(!m){ host.innerHTML = ""; return; }
  var bay = m.mode === "resize" ? getBay(m.bayId) : null;
  if(m.mode === "resize" && !bay){ closeSnakeModal(); return; }
  var loss = bay ? snakeResizeLoss(bay, m.sends, m.returns) : 0;
  var isResize = m.mode === "resize";
  host.innerHTML =
    '<div class="modal-overlay" id="snakeOverlay">' +
      '<div class="modal" role="dialog" aria-modal="true" aria-label="'+(isResize?"Change channel counts":"Add snake")+'" style="width:min(460px,100%);">' +
        '<div class="modal-head"><h2>'+(isResize?"Change channel counts":"Add snake")+'</h2><button type="button" class="icon-btn" id="closeSnakeBtn" aria-label="Close">×</button></div>' +
        '<div class="modal-body stack">' +
          snakeSegHtml("snakeSendsSeg", "Sends (stage → console)", SNAKE_SENDS, m.sends) +
          snakeSegHtml("snakeReturnsSeg", "Returns (console → stage)", SNAKE_RETURNS, m.returns) +
          '<p class="insp-empty" id="snakeSummary" style="padding:0;">'+snakeSummaryText(m, bay, loss)+'</p>' +
          '<div class="btn-row"><button type="button" class="btn btn-sm '+(loss?'btn-danger':'btn-primary')+'" id="saveSnakeBtn">'+snakeSaveLabel(m, loss)+'</button></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.getElementById("closeSnakeBtn").addEventListener("click", closeSnakeModal);
  document.getElementById("snakeOverlay").addEventListener("click", function(e){ if(e.target.id === "snakeOverlay") closeSnakeModal(); });
  function wireSeg(id, key){
    document.getElementById(id).addEventListener("click", function(e){
      var btn = e.target.closest(".seg-btn"); if(!btn) return;
      m[key] = Number(btn.getAttribute("data-n"));
      renderSnakeModal();
      var again = document.querySelector('#'+id+' .seg-btn.is-active'); if(again) again.focus();
    });
  }
  wireSeg("snakeSendsSeg", "sends");
  wireSeg("snakeReturnsSeg", "returns");
  document.getElementById("saveSnakeBtn").addEventListener("click", function(){
    var mode = m.mode, id = m.bayId, sends = m.sends, returns = m.returns;
    closeSnakeModal();
    if(mode === "resize") resizeSnake(id, sends, returns);
    else addBay("snake", {sends:sends, returns:returns});
  });
  setTimeout(function(){ var b = document.getElementById("saveSnakeBtn"); if(b) b.focus(); }, 0);
}
function snakeSummaryText(m, bay, loss){
  var rows = snakeRowCount(m.sends, "send");
  var base = m.sends + ' sends in ' + rows + ' row' + (rows===1?'':'s') + ' of ' + snakeCols(m.sends, "send") + ' · ' + m.returns + ' returns in ' + snakeRowCount(m.returns, "return") + ' row' + (snakeRowCount(m.returns, "return")===1?'':'s') + '.';
  if(bay && loss){
    return base + ' <strong style="color:var(--danger)">'+loss+' labeled channel'+(loss===1?'':'s')+' past these counts will be removed.</strong> You can undo it with ⌘/Ctrl+Z.';
  }
  if(bay && (m.sends !== bay.sends || m.returns !== bay.returns)) return base + ' Existing labels are kept.';
  return base;
}
function snakeSaveLabel(m, loss){
  if(m.mode === "add") return "Create snake";
  return loss ? "Remove " + loss + " labeled channel" + (loss===1?"":"s") + " & save" : "Save counts";
}

/* ---------- gear library ---------- */
// Reusable gear (name, size, notes, photo) kept on this device and shared by every
// project. Entries carry no device group — groups belong to a project.
function loadGearLib(){
  try{
    var parsed = JSON.parse(lsGet(GEARLIB_KEY));
    if(parsed && Array.isArray(parsed.items)){
      return parsed.items.filter(function(it){ return it && it.id && typeof it.name === "string" && it.name.trim(); }).map(function(it){
        return {id:String(it.id), name:it.name.slice(0,60), notes:typeof it.notes === "string" ? it.notes : "",
          heightU:clampGearHeight(it.heightU), width:it.width === "half" ? "half" : "full",
          photoId:validPhotoId(it.photoId) ? it.photoId : null, photoX:clampPct(it.photoX), photoY:clampPct(it.photoY),
          ins:clampChannels(it.ins), outs:clampChannels(it.outs)};
      });
    }
  }catch(e){ /* ignore */ }
  return [];
}
function saveGearLib(items){
  if(!lsSet(GEARLIB_KEY, JSON.stringify({version:1, items:items}))){ showToast("Couldn't save the gear library — device storage is full.", "error"); return false; }
  return true;
}
function sortedGearLib(){
  return loadGearLib().sort(function(a, b){ return a.name.toLowerCase().localeCompare(b.name.toLowerCase()); });
}
function saveGearToLibrary(g){
  var name = String(g.name || "").trim();
  if(!name){ showToast("Give the piece a name first, then save it to the library.", "error"); return; }
  var items = loadGearLib();
  var existing = items.filter(function(it){ return it.name.toLowerCase() === name.toLowerCase(); })[0];
  var entry = existing || {id:"lib-" + uid()};
  entry.name = name; entry.notes = g.notes || ""; entry.heightU = g.heightU; entry.width = g.width;
  entry.photoId = g.photoId || null; entry.photoX = clampPct(g.photoX); entry.photoY = clampPct(g.photoY);
  entry.ins = clampChannels(g.ins); entry.outs = clampChannels(g.outs);
  if(!existing) items.push(entry);
  if(saveGearLib(items)) showToast(existing ? "Updated “" + name + "” in your gear library." : "Saved “" + name + "” to your gear library.", "success");
}
function addLibraryEntryToRack(entry, rackId, at){

/* ---------- export: canvas image ---------- */
function wrapText(ctx, text, maxWidth, maxLines){
  var words = String(text).split(/\s+/).filter(Boolean);
  if(words.length===0) return [];
  var lines = [], current = "";
  for(var i=0;i<words.length;i++){
    var test = current ? current + " " + words[i] : words[i];
    if(ctx.measureText(test).width > maxWidth && current){
      lines.push(current);
      current = words[i];
      if(lines.length === maxLines){ current=""; break; }
    } else {
      current = test;
    }
  }
  if(current) lines.push(current);
  if(lines.length > maxLines) lines = lines.slice(0, maxLines);
  var last = lines[lines.length-1];
  if(last){
    while(ctx.measureText(last+"…").width > maxWidth && last.length>1){ last = last.slice(0,-1); }
    if(words.join(" ").length > lines.join(" ").length) lines[lines.length-1] = last + "…";
  }
  return lines;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function canvasLayoutRows(bay){
  return bay.type === "xlr"
    ? [{tag:null, ports: bay.ports, sectionEnd:false}]
    : trsVisualRows(bay);
}
function drawRoutingGlyph(ctx, x, y, state, lineColor, faintColor){
  if(state === "thru"){
    ctx.fillStyle = faintColor;
    ctx.font = "600 15px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("×", x, y+1);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    return;
  }
  var halfH = 7;
  ctx.strokeStyle = lineColor; ctx.lineWidth = 2.5; ctx.lineCap = "round";
  ctx.setLineDash(state === "half-normal" ? [3,3] : []);
  ctx.beginPath(); ctx.moveTo(x, y-halfH); ctx.lineTo(x, y+halfH); ctx.stroke();
  ctx.setLineDash([]);
}
// Shared sizing constants for every canvas export (single-bay or master
// sheet) so the two stay visually consistent with each other.
var CANVAS_METRICS = {CELL:96, GAP:12, CHUNK:8, CHUNK_GAP:14, SECTION_GAP:16};
// Measures one bay's row/column layout without drawing anything, so both
// drawBayCanvas (one bay) and drawMasterSheetCanvas (many bays sharing one
// tall canvas) can size themselves from the same numbers.
function layoutBay(bay, m){
  if(bay.type === "snake") return layoutSnake(bay, m);
  var INNER_GAP = bay.type === "trs" ? 34 : m.GAP;
  var layoutRows = canvasLayoutRows(bay);
  var cols = layoutRows[0].ports.length;
  function chunkOffset(i){ return Math.floor(i / m.CHUNK) * m.CHUNK_GAP; }
  var gridW = (cols-1)*(m.CELL+m.GAP) + m.CELL + chunkOffset(cols-1);
  var rowYs = [], cursorY = 0;
  layoutRows.forEach(function(r, i){
    rowYs.push(cursorY);
    var isStripTop = bay.type === "trs" && (i % 2 === 0);
    cursorY += m.CELL + (isStripTop ? INNER_GAP : m.GAP) + (r.sectionEnd ? m.SECTION_GAP : 0);
  });
  var gridH = cursorY - m.GAP;
  return {layoutRows:layoutRows, cols:cols, gridW:gridW, gridH:gridH, rowYs:rowYs, chunkOffset:chunkOffset};
}
// Stage-box layout: sends in rows of 4 on the left, a divider, returns in rows
// of 4 on the right. Rows carry their own x offset (x0) and y so the shared
// cell drawing in drawBayContent can place them.
var SNAKE_CANVAS = {TAG_H:26, SEP:56};
function layoutSnake(bay, m){
  var sends = bay.ports.filter(function(p){ return p.row === "send"; });
  var rets = bay.ports.filter(function(p){ return p.row === "return"; });
  var sCols = snakeCols(sends.length, "send"), rCols = snakeCols(rets.length, "return");
  var sRows = snakeRowCount(sends.length, "send"), rRows = snakeRowCount(rets.length, "return");
  var sendW = sCols*(m.CELL+m.GAP) - m.GAP, retW = rCols*(m.CELL+m.GAP) - m.GAP;
  var retX = sendW + SNAKE_CANVAS.SEP;
  var layoutRows = [], rowYs = [], r;
  for(r=0;r<sRows;r++){ layoutRows.push({tag:null, ports:sends.slice(r*sCols, (r+1)*sCols), x0:0}); rowYs.push(SNAKE_CANVAS.TAG_H + r*(m.CELL+m.GAP)); }

// Draws one bay's ports + routing glyphs (no title, no legend, no panel

function drawBayContent(ctx, bay, layout, m, leftPad, topY, colors){
  function drawRow(portsInRow, yTop, rowLabel, x0){
    x0 = x0 || 0;
    if(rowLabel){
      ctx.fillStyle = colors.faintColor;
      ctx.font = "600 11px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
      ctx.textAlign = "right";
      ctx.fillText(rowLabel, leftPad-14, yTop + m.CELL/2 + 4);
      ctx.textAlign = "left";
    }
    portsInRow.forEach(function(p, i){
      var x = leftPad + x0 + i*(m.CELL+m.GAP) + layout.chunkOffset(i);
      var group = p.groupId ? getGroup(p.groupId) : null;
      ctx.fillStyle = colors.cellColor;
      roundRect(ctx,x,yTop,m.CELL,m.CELL,10); ctx.fill();
      ctx.lineWidth = group ? 4 : 1.5;
      ctx.strokeStyle = group ? group.color : colors.borderColor;
      roundRect(ctx,x+ctx.lineWidth/2,yTop+ctx.lineWidth/2,m.CELL-ctx.lineWidth,m.CELL-ctx.lineWidth,9); ctx.stroke();

      ctx.fillStyle = colors.faintColor;
      ctx.font = "500 12px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
      ctx.fillText((bay.type === "snake" && p.row === "return") ? "R"+p.index : String(p.index), x+10, yTop+20);

      ctx.font = "500 13px 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif";
      ctx.fillStyle = p.label ? colors.inkColor : colors.faintColor;
      ctx.textAlign = "center";
      var text = p.label || "—";
      var lines = p.label ? wrapText(ctx, text, m.CELL-16, 3) : ["—"];
      var lh = 16, startY = yTop + m.CELL/2 - ((lines.length-1)*lh)/2 + 5;
      lines.forEach(function(ln, li){ ctx.fillText(ln, x+m.CELL/2, startY+li*lh); });
      ctx.textAlign = "left";

      if(p.notes){
        ctx.fillStyle = colors.accentColor;
        ctx.beginPath(); ctx.arc(x+m.CELL-10, yTop+m.CELL-10, 3.5, 0, Math.PI*2); ctx.fill();

    ctx.font = "700 11px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
    ctx.fillStyle = colors.faintColor;
    ctx.fillText("SENDS · " + layout.sendCount, leftPad, topY + 12);

    ctx.fillText("RETURNS · " + layout.retCount, leftPad + layout.retX, topY + 12);

    ctx.strokeStyle = colors.borderColor; ctx.lineWidth = 2; ctx.setLineDash([6,5]);

      var yTopEdge = topY + layout.rowYs[topRowIdx] + m.CELL;
      var yBottomEdge = topY + layout.rowYs[bottomRowIdx];
      var yMid = (yTopEdge + yBottomEdge) / 2;
      strip.top.forEach(function(p, i){
        var col = getColumn(bay, strip.colStart + i + 1);
        var x = leftPad + i*(m.CELL+m.GAP) + layout.chunkOffset(i) + m.CELL/2;

function drawPanelChrome(ctx, canvasW, canvasH, panelColor){

  for(var y=0;y<canvasH;y+=3){ ctx.beginPath(); ctx.moveTo(0,y+0.5); ctx.lineTo(canvasW,y+0.5); ctx.stroke(); }

  [[16,16],[canvasW-16,16],[16,canvasH-16],[canvasW-16,canvasH-16]].forEach(function(pt){
    ctx.fillStyle = "#3a3e40"; ctx.beginPath(); ctx.arc(pt[0],pt[1],6,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#54595b"; ctx.lineWidth=1; ctx.stroke();

function drawLegend(ctx, groups, canvasW, MARGIN, startY, LEGEND_ROW_H, inkColor){

  ctx.font = "600 14px 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif";
  groups.forEach(function(g){
    var w = ctx.measureText(g.name).width + 34;
    if(lx + w > canvasW - MARGIN){ lx = MARGIN; ly += LEGEND_ROW_H; }
    ctx.fillStyle = g.color;
    roundRect(ctx, lx, ly-14, 16, 16, 4); ctx.fill();
    ctx.fillStyle = inkColor;
    ctx.fillText(g.name, lx+22, ly-1);

function measureLegendHeight(ctx0, groups, canvasW, MARGIN, LEGEND_TOP, LEGEND_ROW_H){

  var x = 0, line = 1;
  groups.forEach(function(g){
    var w = ctx0.measureText(g.name).width + 34;
    if(x + w > canvasW - MARGIN*2){ line++; x = 0; }
    x += w;
  });

function bayCanvasSubtitle(bay){

function drawBayCanvas(bay){

var canvasPhotos = null;
function preloadCanvasPhotos(bays){
  canvasPhotos = null;

  var ids = {};
  bays.forEach(function(b){ if(b.type === "rack") b.gear.forEach(function(g){ if(hasPhoto(g.photoId)) ids[g.photoId] = true; }); });
  var list = Object.keys(ids);

    return new Promise(function(resolve){

function drawCover(ctx, img, x, y, w, h, px, py){

  var k = Math.max(w / iw, h / ih), dw = iw * k, dh = ih * k;

function drawGearPiece(ctx, item, x, w, topPx, RU, colors, isOver){

  ctx.fillStyle = colors.cellColor;

    ctx.strokeStyle = group ? group.color : colors.borderColor;

    ctx.font = "600 14px 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif";

  ctx.font = "500 11px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
  ctx.textAlign = "right";

  ctx.fillStyle = item.gear.name ? colors.inkColor : colors.faintColor;

  if(item.gear.notes){
    ctx.font = "400 11px 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif";
    ctx.fillStyle = colors.faintColor;
    var noteLines = wrapText(ctx, item.gear.notes, w-20, 1);

function drawRackContent(ctx, rack, RU, leftPad, topY, colors, contentW){

  for(var i=0;i<=rack.heightU;i++){

  }
  ctx.font = "500 10px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
  ctx.fillStyle = colors.faintColor;
  ctx.textAlign = "right";
  for(var u=1;u<=totalRows;u++){
    ctx.fillText(String(u), leftPad-10, topY + (u-1)*RU + RU/2 + 4);

    ctx.setLineDash([]);
    ctx.font = "700 10px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
    ctx.fillStyle = "#E2694A";

    }, mime, 0.95);

}

function exportProjectJSON(){

  var text = JSON.stringify(any ? Object.assign({}, state, {photos:photos}) : state, null, 2);
  saveFile(slug(state.name || "patch-sheet-project") + ".json", text);
}
function csvField(v){
  var s = v==null ? "" : String(v);
  if(/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportLabelsCSV(){
  var rows = [CSV_COLUMNS];
  state.bays.forEach(function(b){
    if(b.type === "rack"){
      b.gear.forEach(function(g, i){
        var gg = g.groupId ? getGroup(g.groupId) : null;
        rows.push([b.id, b.name, b.type, "", i+1, g.id, g.name, g.notes, gg?gg.name:"", "", g.heightU, g.width]);
      });
      return;
    }
    b.ports.forEach(function(p){
      var g = p.groupId ? getGroup(p.groupId) : null;
      var routing = b.type==="trs" ? ((getColumn(b,p.index)||{}).state || "normal") : "";
      rows.push([b.id, b.name, b.type, p.row||"", p.index, p.id, p.label, p.notes, g?g.name:"", routing, "", ""]);
    });
  });
  var text = rows.map(function(r){ return r.map(csvField).join(","); }).join("\r\n");
  saveFile("patch-sheet-labels.csv", text);
}
function parseCSV(text){
  var rows = [], row = [], field = "", inQuotes = false;
  for(var i=0;i<text.length;i++){
    var c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ","){ row.push(field); field = ""; }
      else if(c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === "\r"){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return !(r.length===1 && r[0]==="") ; });
}

/* ---------- import ---------- */
function readFileText(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(String(reader.result)); };
    reader.onerror = function(){ reject(reader.error); };
    reader.readAsText(file);
  });
}
function handleImportJSON(file){
  readFileText(file).then(function(text){
    var parsed;
    try{ parsed = JSON.parse(text); } catch(e){ showToast("That file isn't valid JSON.", "error"); return; }
    if(!parsed || !Array.isArray(parsed.bays)){ showToast("That JSON doesn't look like a Patch Sheet project file.", "error"); return; }
    // An import never overwrites what's open: it arrives as its own project.
    var embedded = (parsed.photos && typeof parsed.photos === "object") ? parsed.photos : {};
    Object.keys(embedded).forEach(function(pid){ if(!photoCache[pid]) storePhoto(pid, embedded[pid]); });
    var imported = normalizeState(parsed);
    var fileName = String(file.name || "").replace(/\.json$/i, "").trim();
    imported.name = uniqueProjectName(String(parsed.name || "").trim() || fileName || "Imported project");
    var newId = addProjectFromState(imported);
    if(!newId) return;
    switchProject(newId);
    showToast("Imported as a new project: “" + imported.name + "”.", "success");
  }).catch(function(){ showToast("Couldn't read that file.", "error"); });
}
function handleImportCSV(file){
  readFileText(file).then(function(text){
    var rows = parseCSV(text);
    if(rows.length < 2){ showToast("That CSV has no data rows.", "error"); return; }
    var header = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    var col = {};
    header.forEach(function(h,i){ col[h]=i; });
    if(col.port_id === undefined || col.label === undefined){
      showToast("That CSV is missing a port_id or label column.", "error"); return;
    }
    var portIndex = {}, bayOfPort = {}, gearIndex = {};
    state.bays.forEach(function(b){
      if(b.type === "rack"){ b.gear.forEach(function(g){ gearIndex[g.id] = g; }); }
      else { b.ports.forEach(function(p){ portIndex[p.id] = p; bayOfPort[p.id] = b; }); }
    });
    var groupByName = {};
    state.groups.forEach(function(g){ groupByName[g.name.trim().toLowerCase()] = g; });
    var matched = 0, unmatched = 0;
    for(var i=1;i<rows.length;i++){
      var r = rows[i];
      if(!r.length) continue;
      var pid = (r[col.port_id]||"").trim();
      var p = portIndex[pid];
      var gItem = !p ? gearIndex[pid] : null;
      if(!p && !gItem){ unmatched++; continue; }
      matched++;
      if(gItem){
        gItem.name = col.label!==undefined ? (r[col.label]||"") : gItem.name;
        gItem.notes = col.notes!==undefined ? (r[col.notes]||"") : gItem.notes;
        if(col.gear_height_u !== undefined){
          var hv = Number(r[col.gear_height_u]);
          if(GEAR_HEIGHTS.indexOf(hv) !== -1) gItem.heightU = hv;
        }
        if(col.gear_width !== undefined){
          var wv = (r[col.gear_width]||"").trim().toLowerCase();
          if(wv==="full"||wv==="half") gItem.width = wv;
        }
        if(col.group !== undefined){
          var gname2 = (r[col.group]||"").trim();
          if(!gname2){ gItem.groupId = null; }
          else {
            var key2 = gname2.toLowerCase();
            var g2 = groupByName[key2];
            if(!g2){ g2 = addGroup(gname2, nextPaletteColor()); groupByName[key2] = g2; }
            gItem.groupId = g2.id;
          }
        }
        continue;
      }
      p.label = col.label!==undefined ? (r[col.label]||"") : p.label;
      p.notes = col.notes!==undefined ? (r[col.notes]||"") : p.notes;
      if(col.group !== undefined){
        var gname = (r[col.group]||"").trim();
        if(!gname){ p.groupId = null; }
        else {
          var key = gname.toLowerCase();
          var g = groupByName[key];
          if(!g){ g = addGroup(gname, nextPaletteColor()); groupByName[key] = g; }
          p.groupId = g.id;
        }
      }
      if(col.routing !== undefined){
        var bay = bayOfPort[pid];
        if(bay && bay.type === "trs"){
          var rv = (r[col.routing]||"").trim().toLowerCase();
          if(ROUTING_STATES.indexOf(rv) !== -1) setColumnState(bay, p.index, rv);
        }
      }
    }
    state.bays.forEach(function(b){ if(b.type === "rack") repairRack(b); });
    markDirty();
    renderAll();
    showToast("Imported " + matched + " label" + (matched===1?"":"s") + (unmatched ? " (" + unmatched + " unmatched)" : "") + ".", matched ? "success" : "error");
  }).catch(function(){ showToast("Couldn't read that file.", "error"); });
}

/* ---------- search ---------- */
// Looks through every bay in the open project: port labels and notes, rack
// gear names and notes, device-group names, and bay names. Every typed word
// must match (so "kick in" finds "Kick In" but not "Kick Out").
var SEARCH_MAX = 60;
function portPositionText(bay, p){
  if(bay.type === "snake") return (p.row === "return" ? "Return " : "Send ") + p.index;
  if(p.row) return (p.row === "top" ? "Top " : "Bottom ") + p.index;
  return "Port " + p.index;
}
function searchTerms(q){ return String(q || "").toLowerCase().split(/\s+/).filter(Boolean); }
function termsMatch(hay, terms){
  hay = hay.toLowerCase();
  return terms.every(function(t){ return hay.indexOf(t) !== -1; });
}
function runSearch(q){
  var terms = searchTerms(q), out = [];
  if(!terms.length) return out;
  state.bays.forEach(function(bay){
    if(out.length >= SEARCH_MAX) return;
    if(termsMatch(bay.name, terms)){
      out.push({kind:"bay", bayId:bay.id, type:bay.type, main:bay.name, sub:"Bay", tag:bay.type});
    }
    if(bay.type === "rack"){
      bay.gear.forEach(function(g){
        var grp = g.groupId ? getGroup(g.groupId) : null;
        var hay = [g.name, g.notes, grp ? grp.name : ""].join(" ");
        if(g.name || g.notes || grp){
          if(termsMatch(hay, terms)) out.push({kind:"gear", bayId:bay.id, type:"rack", itemId:g.id, main:g.name || "Untitled gear", sub:bay.name + " · " + g.heightU + "U gear" + (g.notes ? " · " + g.notes : "") + (grp ? " · " + grp.name : ""), tag:"rack"});
        }
      });
    } else {
      bay.ports.forEach(function(pt){
        var grp = pt.groupId ? getGroup(pt.groupId) : null;
        if(!pt.label && !pt.notes) return;
        var hay = [pt.label, pt.notes, grp ? grp.name : ""].join(" ");
        if(termsMatch(hay, terms)) out.push({kind:"port", bayId:bay.id, type:bay.type, itemId:pt.id, main:pt.label || "(no label)", sub:bay.name + " · " + portPositionText(bay, pt) + (pt.notes ? " · " + pt.notes : "") + (grp ? " · " + grp.name : ""), tag:bay.type});
      });
    }
  });
  return out.slice(0, SEARCH_MAX);
}
function highlightHtml(text, terms){
  text = String(text);
  var lower = text.toLowerCase(), marks = [];
  terms.forEach(function(t){
    var from = 0, at;
    while((at = lower.indexOf(t, from)) !== -1){ marks.push([at, at + t.length]); from = at + t.length; }
  });
  marks.sort(function(a, b){ return a[0] - b[0]; });
  var merged = [];
  marks.forEach(function(m){
    var last = merged[merged.length - 1];
    if(last && m[0] <= last[1]) last[1] = Math.max(last[1], m[1]); else merged.push([m[0], m[1]]);
  });
  var out = "", pos = 0;
  merged.forEach(function(m){
    out += escapeHtml(text.slice(pos, m[0])) + "<mark>" + escapeHtml(text.slice(m[0], m[1])) + "</mark>";
    pos = m[1];
  });
  return out + escapeHtml(text.slice(pos));
}
function hideSearchResults(){
  var el = document.getElementById("searchResults");
  if(el) el.hidden = true;
}
function renderSearchResults(){
  var host = document.getElementById("searchResults");
  var sr = ui.search, terms = searchTerms(sr.q);
  if(!terms.length){ host.hidden = true; host.innerHTML = ""; return; }
  host.hidden = false;
  if(!sr.results.length){ host.innerHTML = '<div class="search-none">No matches for “'+escapeHtml(sr.q.trim())+'”.</div>'; return; }
  host.innerHTML = sr.results.map(function(r, i){
    return '<button type="button" class="search-hit'+(i===sr.active?' is-active':'')+'" role="option" data-hit="'+i+'">' +
      '<span class="hit-main">'+highlightHtml(r.main, terms)+'</span>' +
      '<span class="hit-tag">'+escapeHtml(r.tag)+'</span>' +
      '<span class="hit-sub">'+highlightHtml(r.sub, terms)+'</span></button>';
  }).join("");
}
function jumpToResult(r){
  var bay = getBay(r.bayId);
  if(!bay) return;
  ui.section = bay.type;
  if(ui.viewMode === "compare"){
    if(bay.type !== "rack"){ ui.viewMode = "compact"; try{ localStorage.setItem(VIEWMODE_KEY, "compact"); }catch(e){ /* ignore */ } }
    else if(ui.compareIds.length && ui.compareIds.indexOf(bay.id) === -1){ ui.compareIds[0] = bay.id; }
  }
  ui.activeBay[bay.type] = bay.id;
  clearSelectionSilently();
  if(r.itemId){ ui.selection = [r.itemId]; ui.anchor = r.itemId; }
  hideSearchResults();
  renderAll();
  var sel = r.kind === "port" ? '.port[data-port="'+cssEscape(r.itemId)+'"]'
    : r.kind === "gear" ? '.gear-piece[data-gear="'+cssEscape(r.itemId)+'"]'
    : '.rack-panel[data-bay-id="'+cssEscape(bay.id)+'"]';
  var el = document.querySelector(sel);
  if(el){
    el.scrollIntoView({behavior:"smooth", block:"center"});
    el.classList.add("search-flash");
    setTimeout(function(){ el.classList.remove("search-flash"); }, 1500);
  }
}
function wireSearch(){
  var input = document.getElementById("searchInput");
  var host = document.getElementById("searchResults");
  function refresh(){
    ui.search.q = input.value;
    ui.search.results = runSearch(input.value);
    ui.search.active = 0;
    renderSearchResults();
  }
  input.addEventListener("input", refresh);
  input.addEventListener("focus", function(){ if(input.value.trim()) refresh(); });
  input.addEventListener("click", function(e){ e.stopPropagation(); });
  input.addEventListener("keydown", function(e){
    var sr = ui.search;
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      if(!sr.results.length) return;
      e.preventDefault();
      sr.active = (sr.active + (e.key === "ArrowDown" ? 1 : -1) + sr.results.length) % sr.results.length;
      renderSearchResults();
      var a = host.querySelector(".search-hit.is-active"); if(a && a.scrollIntoView) a.scrollIntoView({block:"nearest"});
    } else if(e.key === "Enter"){
      if(sr.results[sr.active]){ e.preventDefault(); jumpToResult(sr.results[sr.active]); }
    } else if(e.key === "Escape"){
      e.stopPropagation();
      if(!host.hidden){ hideSearchResults(); }
      else { input.value = ""; sr.q = ""; sr.results = []; input.blur(); }
    }
  });
  host.addEventListener("click", function(e){
    e.stopPropagation();
    var hit = e.target.closest(".search-hit"); if(!hit) return;
    var r = ui.search.results[Number(hit.getAttribute("data-hit"))];
    if(r) jumpToResult(r);
  });
  document.addEventListener("click", function(e){
    if(!e.target.closest(".search-wrap")) hideSearchResults();
  });
  document.addEventListener("keydown", function(e){
    if((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && String(e.key).toLowerCase() === "k"){
      if(ui.dialog || ui.snakeModal || ui.groupsModalOpen || ui.addRackModalOpen || ui.addGearModalOpen || ui.resizeRackModalOpen) return;
      e.preventDefault();
      input.focus(); input.select();
    }
  });
}

/* ---------- sharing: a read-only link that carries the whole project ---------- */
// The project is squeezed (empty ports left out, then deflate) into the link's
// own "#share=" part, so nothing is uploaded anywhere. Opening one shows a
// read-only copy that never touches your saved projects; "Save a copy" keeps it.
// Gear photos are left out — they'd make the link far too long.
function compactForShare(st){
  var c = JSON.parse(JSON.stringify(st));
  c.bays.forEach(function(b){
    if(b.ports) b.ports = b.ports.filter(function(p){ return p.label || p.notes || p.groupId; })
      .map(function(p){ return {id:p.id, label:p.label, notes:p.notes, groupId:p.groupId}; });
    if(b.columns) b.columns = b.columns.filter(function(col){ return col.state !== "normal"; });
    if(b.gear) b.gear.forEach(function(g){
      g.photoId = null; delete g.photoX; delete g.photoY;
      if(!g.ins) delete g.ins;
      if(!g.outs) delete g.outs;
      if(!g.chLabels || !Object.keys(g.chLabels).length) delete g.chLabels;
    });
  });
  if(!c.links || !c.links.length) delete c.links;
  return c;
}
function bytesToB64url(bytes){
  var s = "", CH = 0x8000;
  for(var i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64urlToBytes(str){
  str = String(str).replace(/-/g, "+").replace(/_/g, "/");
  while(str.length % 4) str += "=";
  var bin = atob(str), out = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function pipeBytes(bytes, transform, cap){
  var reader = new Blob([bytes]).stream().pipeThrough(transform).getReader(), chunks = [], total = 0;
  function pump(){
    return reader.read().then(function(r){
      if(r.done){
        var out = new Uint8Array(total), at = 0;
        chunks.forEach(function(ch){ out.set(ch, at); at += ch.length; });
        return out;
      }
      total += r.value.length;
      if(cap && total > cap){ reader.cancel(); throw new Error("too big"); }
      chunks.push(r.value);
      return pump();
    });
  }
  return pump();
}
var SHARE_MAX_BYTES = 8 * 1024 * 1024;
function shareEncode(obj){
  var raw = new TextEncoder().encode(JSON.stringify(obj));
  var plain = "r." + bytesToB64url(raw);
  if(typeof CompressionStream !== "function") return Promise.resolve(plain);
  return pipeBytes(raw, new CompressionStream("deflate-raw"), 0).then(function(z){
    var packed = "z." + bytesToB64url(z);
    return packed.length < plain.length ? packed : plain;
  }, function(){ return plain; });
}
function shareDecode(code){
  code = String(code || "").trim();
  var m = /^([zr])\.([A-Za-z0-9_-]+)$/.exec(code);
  if(!m) return Promise.reject(new Error("not a share code"));
  var bytes;
  try{ bytes = b64urlToBytes(m[2]); }catch(e){ return Promise.reject(new Error("not a share code")); }
  var step = m[1] === "z"
    ? (typeof DecompressionStream === "function" ? pipeBytes(bytes, new DecompressionStream("deflate-raw"), SHARE_MAX_BYTES) : Promise.reject(new Error("this browser can't open compressed links")))
    : Promise.resolve(bytes);
  return step.then(function(out){
    if(out.length > SHARE_MAX_BYTES) throw new Error("too big");
    var parsed = JSON.parse(new TextDecoder().decode(out));
    if(!parsed || !Array.isArray(parsed.bays)) throw new Error("not a project");
    return normalizeState(parsed);
  });
}
function shareCodeFromText(text){
  var s = String(text || "");
  var m = /share=([A-Za-z0-9._-]+)/.exec(s);
  return m ? m[1] : s.trim();
}
function copyText(text){
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;opacity:0;top:0;left:0;";
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
    ta.remove();
    return ok;
  }
  return new Promise(function(resolve){
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ resolve(true); }, function(){ resolve(fallback()); });
        return;
      }
    }catch(e){ /* fall through */ }
    resolve(fallback());
  });
}

}
function exitSharedView(){
  var back = roReturnId && projectIndex.projects.some(function(pr){ return pr.id === roReturnId; }) ? roReturnId : (projectIndex.projects[0] && projectIndex.projects[0].id);
  leaveSharedView();
  roReturnId = null;
  if(back) switchProject(back); else { state = createDefaultState(); resetHistory(); resetProjectUi(); renderAll(); }
}
function saveSharedCopy(){
  var st = normalizeState(JSON.parse(roSnap));
  st.name = uniqueProjectName(st.name);
  var id = addProjectFromState(st);
  if(!id) return;
  leaveSharedView();
  roReturnId = null;
  switchProject(id);
  showToast("Saved a copy as “" + st.name + "”. It’s yours to edit.", "success");
}
function renderSharedBar(){
  var bar = document.getElementById("sharedBar");
  if(!bar) return;
  bar.hidden = !ui.readOnly;
  if(!ui.readOnly) return;
  document.getElementById("sharedName").textContent = state.name;
}
// Anything that slips past the hidden controls and edits the shared project is rolled straight back.
function revertSharedEdit(){
  if(roSnap && JSON.stringify(state) !== roSnap){
    state = JSON.parse(roSnap); linkRev++;
    showToast("This is a shared, read-only view — use “Save a copy” to edit it.", "error");
    renderAll();
  }
}
function applyReadOnlyLocks(){
  if(!ui.readOnly) return;
  Array.prototype.forEach.call(document.querySelectorAll("#stage [draggable]"), function(el){ el.removeAttribute("draggable"); });
}
function lockInspector(){
  if(!ui.readOnly) return;
  var host = document.getElementById("inspectorBody");
  Array.prototype.forEach.call(host.querySelectorAll("input,select,textarea"), function(el){ if(!el.hasAttribute("data-flow-trace")) el.disabled = true; });
  Array.prototype.forEach.call(host.querySelectorAll("button"), function(b){
    if(b.hasAttribute("data-flow-jump") || b.id === "prevPortBtn" || b.id === "nextPortBtn") return;
    if(b.classList.contains("seg-btn")) b.disabled = true; else b.hidden = true;
  });
  Array.prototype.forEach.call(host.querySelectorAll(".field"), function(f){
    if(!f.querySelector("input:not([hidden]),select,textarea,.segmented,button:not([hidden]),.photo-thumb,.insp-id-row")) f.hidden = true;
  });
}

/* ---------- global wiring ---------- */
function renderAll(){
  renderSectionTabs();
  renderBayTabs();
  updateViewModeToggle();
  renderGrid();
  renderInspector();
  renderMenus();
  renderSharedBar();
  applyReadOnlyLocks();
}
function init(){
  if(CHANNEL === "beta"){
    document.documentElement.setAttribute("data-channel", "beta");
    document.getElementById("betaBadge").hidden = false;
  }
  initTheme();
  initViewMode();
  wireMenus();
  document.getElementById("manageGroupsBtn").addEventListener("click", openGroupsModal);
  document.getElementById("projectBtn").addEventListener("click", function(e){ e.stopPropagation(); toggleMenu("projectMenu"); });
  document.getElementById("bayMenuBtn").addEventListener("click", function(e){ e.stopPropagation(); toggleMenu("bayMenu"); });
  wireSearch();
  wirePhotoInput();
  document.getElementById("exportMenuBtn").addEventListener("click", function(e){ e.stopPropagation(); toggleMenu("exportMenu"); });
  document.getElementById("importMenuBtn").addEventListener("click", function(e){ e.stopPropagation(); toggleMenu("importMenu"); });
  document.addEventListener("click", function(){ closeAllMenus(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      var openMenu = ALL_MENU_IDS.filter(function(id){ return !document.getElementById(id).hidden; })[0];
      if(openMenu){ closeAllMenus(); return; }
      if(ui.pick && !ui.dialog){ endPick(); return; }
      if(ui.groupsModalOpen){ closeGroupsModal(); renderAll(); }
      else if(ui.addRackModalOpen){ closeAddRackModal(); }
      else if(ui.addGearModalOpen){ closeAddGearModal(); }
      else if(ui.resizeRackModalOpen){ closeResizeRackModal(); }
      else if(ui.snakeModal){ closeSnakeModal(); }
      else if(ui.dialog){ closeDialog(); }
      else if(ui.selection.length){ clearSelection(); }
    }
  });
  // Copy / paste of rack gear rides on the browser's own copy and paste
  // events so ordinary text copy/paste in the name and notes fields is never
  // hijacked: a copy only becomes a gear copy when no text is selected, and a
  // paste only becomes a gear paste when the clipboard holds copied gear (or
  // is empty and we're not typing in a field).
  function anyModalOpen(){ return ui.groupsModalOpen || ui.addRackModalOpen || ui.addGearModalOpen || ui.resizeRackModalOpen || !!ui.snakeModal || !!ui.dialog; }
  function isTextField(el){
    return !!el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT" || el.tagName === "SELECT" || el.isContentEditable);
  }
  document.addEventListener("copy", function(e){
    if(anyModalOpen() || ui.section !== "rack") return;
    var el = document.activeElement;
    if(isTextField(el) && typeof el.selectionStart === "number" && el.selectionStart !== el.selectionEnd) return;
    var pageSel = window.getSelection ? String(window.getSelection()) : "";
    if(pageSel && !isTextField(el)) return;
    var bay = getActiveBay();
    var list = selectedGear(bay);
    if(!list.length) return;
    copyGear(list, e);
  });
  document.addEventListener("paste", function(e){
    if(anyModalOpen() || ui.section !== "rack") return;
    var text = "";
    try{ text = e.clipboardData ? e.clipboardData.getData("text/plain") : ""; }catch(err){ /* ignore */ }
    var items = parseGearClip(text);
    if(!items){
      if(isTextField(document.activeElement)) return; // ordinary text paste
      if(text || !GEAR_CLIPBOARD.length) return;      // something else is on the clipboard
      items = GEAR_CLIPBOARD;
    }
    var bay = getActiveBay();
    if(!bay || bay.type !== "rack") return;
    e.preventDefault();
    pasteGearIntoRack(bay.id, items);
  });
  // Undo / redo. Inside a text field that's been typed in, ⌘Z keeps its
  // normal job of undoing that typing; everywhere else it steps the project
  // back (the name field's own typing is folded into one project step too).
  var typedEls = new WeakSet();
  document.addEventListener("input", function(e){ typedEls.add(e.target); });
  document.addEventListener("focusin", function(e){ typedEls.delete(e.target); });
  document.addEventListener("keydown", function(e){
    if(!(e.metaKey || e.ctrlKey) || e.altKey) return;
    var k = String(e.key).toLowerCase();
    var isUndo = k === "z" && !e.shiftKey;
    var isRedo = (k === "z" && e.shiftKey) || (k === "y" && e.ctrlKey && !e.metaKey);
    if(!isUndo && !isRedo) return;
    if(anyModalOpen()) return;
    var el = document.activeElement;
    if(isTextField(el) && el.tagName !== "SELECT" && typedEls.has(el)) return;
    e.preventDefault();
    if(isUndo) undo(); else redo();
  });
  document.getElementById("groupChips").addEventListener("click", function(e){
    var chip = e.target.closest(".group-chip"); if(!chip) return;
    setHighlightGroup(chip.getAttribute("data-group") || null);
  });
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("redoBtn").addEventListener("click", redo);
  resetHistory();
  document.getElementById("fileInputJson").addEventListener("change", function(e){
    var f = e.target.files[0]; e.target.value = "";
    if(f) handleImportJSON(f);
  });
  document.getElementById("fileInputCsv").addEventListener("change", function(e){
    var f = e.target.files[0]; e.target.value = "";
    if(f) handleImportCSV(f);
  });

  // Open the last project; first run of v4 moves any v3 draft in as Project 1.
  var migratedNote = null;
  var idx = loadProjectIndex();
  var opened = null;
  if(idx && idx.projects.length){
    projectIndex = idx;
    var order = [idx.current].concat(idx.projects.map(function(pr){ return pr.id; }));
    for(var oi = 0; oi < order.length && !opened; oi++){
      if(order[oi] && idx.projects.some(function(pr){ return pr.id === order[oi]; })){
        var st = loadProjectState(order[oi]);
        if(st){ opened = st; currentProjectId = order[oi]; }
      }
    }
  }
  if(!opened){
    var legacy = loadLegacyDraft();
    opened = legacy ? normalizeState(legacy) : createDefaultState();
    var hasLegacyContent = legacy && (legacy.groups && legacy.groups.length ||
      (legacy.bays||[]).some(function(b){ return (b.ports||[]).some(function(pt){ return pt.label || pt.notes; }); }) ||
      (legacy.bays||[]).length !== 2);
    if(legacy && !legacy.name) opened.name = "Project 1";
    projectIndex = {current:null, projects:[]};
    currentProjectId = addProjectFromState(opened);
    if(hasLegacyContent) migratedNote = "Your previous work is now saved as “" + opened.name + "”.";
  }
  state = opened;
  saveProjectIndex();
  resetHistory();
  try{ ui.exportPhotos = lsGet(PHOTOEXP_KEY) !== "0"; }catch(e){ ui.exportPhotos = true; }
  renderAll();
  setSaveStatus(false);
  if(migratedNote) showToast(migratedNote, "success");
  // Photos load from IndexedDB after first paint; show them as soon as they're in, then tidy up unused ones.
  loadAllPhotos().then(function(){ renderAll(); gcPhotos(); });
  document.getElementById("sharedCopyBtn").addEventListener("click", saveSharedCopy);
  document.getElementById("sharedCloseBtn").addEventListener("click", exitSharedView);
  window.addEventListener("hashchange", checkShareHash);
  checkShareHash();
}
document.addEventListener("DOMContentLoaded", init);
</script>
