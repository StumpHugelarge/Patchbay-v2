<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patch·Configurator v4.3 BETA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#E7EAE8; --surface:#FFFFFF; --surface-2:#F2F4F3;
    --metal:#C9CFCC; --metal-2:#BCC3BF; --metal-cell:#DBE0DD;
    --border:#C1C7C4; --border-strong:#9DA4A0;
    --ink:#17181A; --ink-soft:#525855; --ink-faint:#5C625F;
    --accent:#2C8567; --accent-ink:#FFFFFF; --accent-soft:#DCEFE8;
    --danger:#B8442D; --danger-soft:#F6E1DC; --danger-ink:#FFFFFF;
    --radius-sm:4px; --radius-md:8px; --radius-lg:12px;
    --font-display:"Big Shoulders Display","Arial Narrow",sans-serif;
    --font-body:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
    --font-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    --shadow-1:0 1px 2px rgba(20,24,22,.08),0 1px 1px rgba(20,24,22,.06);
    --shadow-2:0 12px 32px rgba(20,24,22,.18);
    --brush-line: rgba(20,24,22,.05);
    --grid-dot: rgba(20,24,22,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16181A; --surface:#1F2224; --surface-2:#262A2C;
      --metal:#2B2F31; --metal-2:#34383A; --metal-cell:#2F3335;
      --border:#3B4042; --border-strong:#4C5254;
      --ink:#ECEFED; --ink-soft:#AEB5B1; --ink-faint:#7E8582;
      --accent:#4FC79A; --accent-ink:#0D1512; --accent-soft:#1E3730;
      --danger:#E2694A; --danger-soft:#3A211B; --danger-ink:#1A0E0A;
      --shadow-1:0 1px 2px rgba(0,0,0,.4);
      --shadow-2:0 16px 36px rgba(0,0,0,.5);
      --brush-line: rgba(255,255,255,.04);
      --grid-dot: rgba(255,255,255,.055);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#16181A; --surface:#1F2224; --surface-2:#262A2C;
    --metal:#2B2F31; --metal-2:#34383A; --metal-cell:#2F3335;
    --border:#3B4042; --border-strong:#4C5254;
    --ink:#ECEFED; --ink-soft:#AEB5B1; --ink-faint:#7E8582;
    --accent:#4FC79A; --accent-ink:#0D1512; --accent-soft:#1E3730;
    --danger:#E2694A; --danger-soft:#3A211B; --danger-ink:#1A0E0A;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 16px 36px rgba(0,0,0,.5);
    --brush-line: rgba(255,255,255,.04);
    --grid-dot: rgba(255,255,255,.055);
    color-scheme: dark;
  }

  /* ---------- color schemes (override the base palette; the light / dark switch still applies on top) ---------- */
  /* Studio Amber */
  :root[data-scheme="amber"]{--bg:#EDE6DA;--surface:#FBF8F2;--surface-2:#F3EDE2;--metal:#D2C8B6;--metal-2:#C4B8A3;--metal-cell:#E0D7C6;--border:#CDC2AE;--border-strong:#A39682;--ink:#1F1A14;--ink-soft:#5A5044;--ink-faint:#62574A;--accent:#A85A14;--accent-ink:#FFFFFF;--accent-soft:#F4E1CB;--danger:#B8442D;--danger-soft:#F6E1DC;--danger-ink:#FFFFFF;}
  @media (prefers-color-scheme: dark){ :root[data-scheme="amber"]:not([data-theme="light"]){--bg:#1A1713;--surface:#231F1A;--surface-2:#2B261F;--metal:#302A22;--metal-2:#3A332A;--metal-cell:#342E26;--border:#453E33;--border-strong:#5A5144;--ink:#F0E9DC;--ink-soft:#BDB19F;--ink-faint:#9A9080;--accent:#E8A04C;--accent-ink:#1A1006;--accent-soft:#3D2D17;--danger:#E2694A;--danger-soft:#3A211B;--danger-ink:#1A0E0A;} }
  :root[data-scheme="amber"][data-theme="dark"]{--bg:#1A1713;--surface:#231F1A;--surface-2:#2B261F;--metal:#302A22;--metal-2:#3A332A;--metal-cell:#342E26;--border:#453E33;--border-strong:#5A5144;--ink:#F0E9DC;--ink-soft:#BDB19F;--ink-faint:#9A9080;--accent:#E8A04C;--accent-ink:#1A1006;--accent-soft:#3D2D17;--danger:#E2694A;--danger-soft:#3A211B;--danger-ink:#1A0E0A;}
  /* Console Blue */
  :root[data-scheme="blue"]{--bg:#E4E9F0;--surface:#FFFFFF;--surface-2:#EEF2F7;--metal:#C5CEDB;--metal-2:#B6C1D1;--metal-cell:#D6DDE8;--border:#BAC4D3;--border-strong:#93A0B3;--ink:#121722;--ink-soft:#4A5568;--ink-faint:#576173;--accent:#2F62C9;--accent-ink:#FFFFFF;--accent-soft:#DCE6FA;--danger:#B8442D;--danger-soft:#F6E1DC;--danger-ink:#FFFFFF;}
  @media (prefers-color-scheme: dark){ :root[data-scheme="blue"]:not([data-theme="light"]){--bg:#12161C;--surface:#1A2029;--surface-2:#212833;--metal:#262E3A;--metal-2:#2F3846;--metal-cell:#2A3340;--border:#36404F;--border-strong:#4A5668;--ink:#E8EDF5;--ink-soft:#A8B3C4;--ink-faint:#7C889B;--accent:#6AA2FF;--accent-ink:#07101F;--accent-soft:#1B2D4D;--danger:#E2694A;--danger-soft:#3A211B;--danger-ink:#1A0E0A;} }
  :root[data-scheme="blue"][data-theme="dark"]{--bg:#12161C;--surface:#1A2029;--surface-2:#212833;--metal:#262E3A;--metal-2:#2F3846;--metal-cell:#2A3340;--border:#36404F;--border-strong:#4A5668;--ink:#E8EDF5;--ink-soft:#A8B3C4;--ink-faint:#7C889B;--accent:#6AA2FF;--accent-ink:#07101F;--accent-soft:#1B2D4D;--danger:#E2694A;--danger-soft:#3A211B;--danger-ink:#1A0E0A;}
  /* Plum */
  :root[data-scheme="plum"]{--bg:#EAE6EC;--surface:#FFFFFF;--surface-2:#F3F0F4;--metal:#CFC8D3;--metal-2:#C1B9C7;--metal-cell:#DDD7E1;--border:#C6BEC9;--border-strong:#9E94A4;--ink:#1A141E;--ink-soft:#574E5C;--ink-faint:#5F5665;--accent:#8A3FA8;--accent-ink:#FFFFFF;--accent-soft:#EBDDF1;--danger:#B8442D;--danger-soft:#F6E1DC;--danger-ink:#FFFFFF;}
  @media (prefers-color-scheme: dark){ :root[data-scheme="plum"]:not([data-theme="light"]){--bg:#17131A;--surface:#201B24;--surface-2:#28222D;--metal:#2E2733;--metal-2:#382F3E;--metal-cell:#322B38;--border:#41384A;--border-strong:#54495E;--ink:#EEE8F2;--ink-soft:#B9AEC2;--ink-faint:#948A9E;--accent:#C58AE0;--accent-ink:#190F1F;--accent-soft:#3A2646;--danger:#E2694A;--danger-soft:#3A211B;--danger-ink:#1A0E0A;} }
  :root[data-scheme="plum"][data-theme="dark"]{--bg:#17131A;--surface:#201B24;--surface-2:#28222D;--metal:#2E2733;--metal-2:#382F3E;--metal-cell:#322B38;--border:#41384A;--border-strong:#54495E;--ink:#EEE8F2;--ink-soft:#B9AEC2;--ink-faint:#948A9E;--accent:#C58AE0;--accent-ink:#190F1F;--accent-soft:#3A2646;--danger:#E2694A;--danger-soft:#3A211B;--danger-ink:#1A0E0A;}
  /* High Contrast */
  :root[data-scheme="contrast"]{--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F0F0F0;--metal:#D0D0D0;--metal-2:#B8B8B8;--metal-cell:#E2E2E2;--border:#6B6B6B;--border-strong:#000000;--ink:#000000;--ink-soft:#2B2B2B;--ink-faint:#3A3A3A;--accent:#0B4FD6;--accent-ink:#FFFFFF;--accent-soft:#D9E6FF;--danger:#A82A12;--danger-soft:#FBE0DA;--danger-ink:#FFFFFF;}
  @media (prefers-color-scheme: dark){ :root[data-scheme="contrast"]:not([data-theme="light"]){--bg:#000000;--surface:#0D0D0D;--surface-2:#1A1A1A;--metal:#222222;--metal-2:#2C2C2C;--metal-cell:#262626;--border:#8A8A8A;--border-strong:#BDBDBD;--ink:#FFFFFF;--ink-soft:#E0E0E0;--ink-faint:#C8C8C8;--accent:#FFD400;--accent-ink:#000000;--accent-soft:#3D3400;--danger:#FF7A5C;--danger-soft:#3F1D14;--danger-ink:#1A0E0A;} }
  :root[data-scheme="contrast"][data-theme="dark"]{--bg:#000000;--surface:#0D0D0D;--surface-2:#1A1A1A;--metal:#222222;--metal-2:#2C2C2C;--metal-cell:#262626;--border:#8A8A8A;--border-strong:#BDBDBD;--ink:#FFFFFF;--ink-soft:#E0E0E0;--ink-faint:#C8C8C8;--accent:#FFD400;--accent-ink:#000000;--accent-soft:#3D3400;--danger:#FF7A5C;--danger-soft:#3F1D14;--danger-ink:#1A0E0A;}
  .scheme-opt{justify-content:flex-start;}
  .scheme-opt .scheme-dots{display:inline-flex; flex:none;}
  .scheme-opt .scheme-dots i{width:14px; height:14px; border-radius:50%; border:1px solid var(--border-strong); margin-left:-4px;}
  .scheme-opt .scheme-dots i:first-child{margin-left:0;}
  .scheme-opt .scheme-name{flex:1;}
  .scheme-opt .check{width:14px; text-align:center; color:var(--accent); font-weight:700;}
  .scheme-opt[aria-checked="true"]{background:var(--accent-soft);}
  #appearanceMenu{min-width:230px;}
  #appearanceMenu .segmented{margin:2px 4px 4px;}
  #appearanceMenu .seg-btn{flex:1;}

  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body);
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0; text-wrap:balance;}
  button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
  button{cursor:pointer;}
  input,textarea,select{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--ink); padding:7px 9px;}
  input[type="range"]{accent-color:var(--accent);}
  input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,[tabindex]:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  ::selection{background:var(--accent-soft);}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }

  .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-faint);}

  /* ---------- App shell ---------- */
  .app{min-height:100%; display:flex; flex-direction:column;}

  .topbar{
    display:flex; align-items:center; gap:24px; flex-wrap:wrap;
    padding:16px 24px; border-bottom:1px solid var(--border);
    background:var(--surface);
  }
  .brand{display:flex; flex-direction:column; gap:2px; margin-right:auto;}
  .brand-mark{
    font-family:var(--font-display); font-weight:800; font-size:26px; letter-spacing:.01em;
    text-transform:uppercase; line-height:1; color:var(--ink);
  }
  .brand-mark span{color:var(--accent);}
  .section-tabs{display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:var(--radius-md); border:1px solid var(--border);}
  .section-tab{
    appearance:none; border:none; background:transparent; color:var(--ink-soft);
    font-family:var(--font-mono); font-weight:600; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase;
    padding:9px 18px; border-radius:calc(var(--radius-md) - 2px); transition:background .15s,color .15s;
  }
  .section-tab[aria-selected="true"]{background:var(--accent); color:var(--accent-ink);}
  .section-tab:not([aria-selected="true"]):hover{background:var(--metal-cell); color:var(--ink);}
  .topbar-meta{display:flex; align-items:center; gap:14px;}
  .save-status{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); letter-spacing:.03em; display:flex; align-items:center; gap:6px;}
  .save-status .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);}
  .save-status.dirty .dot{background:var(--accent);}

  .beta-badge{display:inline-block; margin-left:8px; padding:1px 8px; border-radius:999px; background:#E0A33A; color:#1A1204; font-weight:700; font-size:10px; letter-spacing:.1em; vertical-align:1px;}
  :root[data-channel="beta"] .topbar{border-bottom:3px solid #E0A33A;}
  .topbar-left{display:flex; align-items:center; gap:20px; flex-wrap:wrap; margin-right:auto;}
  .topbar-left .brand{margin-right:0;}
  .project-btn{max-width:260px; display:inline-flex; align-items:center; gap:8px;}
  .project-btn .project-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;}
  .project-btn .project-caret{color:var(--ink-faint); font-size:11px;}
  .menu--left{left:0; right:auto; min-width:280px;}
  .menu-scroll{max-height:260px; overflow:auto;}
  .menu button .menu-sub{margin-left:auto; color:var(--ink-faint); font-size:11.5px; font-family:var(--font-mono); white-space:nowrap;}
  .menu button.is-current{font-weight:600; background:var(--accent-soft);}
  .menu button .menu-check{width:14px; color:var(--accent); flex:none;}
  .menu .menu-empty{padding:8px 10px; font-size:12.5px; color:var(--ink-faint);}
  .search-wrap{position:relative; width:230px;}
  .search-wrap input{width:100%; font-size:13px; padding:6px 10px;}
  .search-results{
    position:absolute; top:calc(100% + 6px); left:0; width:min(440px, 88vw); max-height:360px; overflow:auto;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    box-shadow:var(--shadow-2); padding:6px; z-index:45;
  }
  .search-hit{
    display:grid; grid-template-columns:1fr auto; gap:2px 10px; width:100%; text-align:left; padding:8px 10px;
    border-radius:var(--radius-sm); background:transparent; border:none; color:var(--ink); font-size:13px;
  }
  .search-hit:hover,.search-hit.is-active{background:var(--metal-cell);}
  .search-hit .hit-main{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .search-hit .hit-sub{grid-column:1; color:var(--ink-faint); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .search-hit .hit-tag{grid-row:1; grid-column:2; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; color:var(--ink-faint); text-transform:uppercase;}
  .search-hit mark{background:var(--accent-soft); color:var(--ink); border-radius:2px; padding:0 1px;}
  .search-none{padding:10px; font-size:12.5px; color:var(--ink-faint);}
  @keyframes searchFlash{0%,100%{box-shadow:0 0 0 0 transparent;} 25%,75%{box-shadow:0 0 0 5px var(--accent);}}
  .search-flash{animation:searchFlash 1.4s ease-in-out 1;}
  .tpl-row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .tpl-row input[type="text"]{flex:1;}
  .tpl-kind{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; color:var(--ink-faint); text-transform:uppercase; min-width:70px;}
  .workspace{display:flex; flex-direction:column;}
  .stage{
    min-width:0; display:flex; flex-direction:column; padding:20px 24px 28px;
    background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
    background-size: 22px 22px; background-position: -3px -3px;
  }
  .inspector{
    flex:none; border-top:1px solid var(--border); background:var(--surface);
    padding:18px 24px; position:sticky; bottom:0;
  }

  .stage-toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .bay-tabs{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .bay-tab{
    display:flex; align-items:center; gap:8px; padding:6px 6px 6px 14px; border-radius:999px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
    font-size:13px; font-weight:500;
  }
  .bay-tab[aria-selected="true"]{border-color:var(--accent); color:var(--ink); background:var(--accent-soft);}
  .bay-tab[draggable="true"]{cursor:grab;}
  .bay-tab.is-dragging{opacity:.4;}
  .bay-tab.drop-before{box-shadow:-3px 0 0 var(--accent);}
  .bay-tab.drop-after{box-shadow:3px 0 0 var(--accent);}
  .bay-tab .bay-tab-name{background:none;border:none;padding:2px 0;color:inherit;font:inherit;cursor:pointer;}
  .bay-tab .bay-tab-name:hover{text-decoration:underline;}
  .bay-tab-size{
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:.04em; color:var(--ink-faint);
    padding:1px 6px; border:1px solid var(--border); border-radius:999px; white-space:nowrap;
  }
  .bay-tab .icon-btn{width:22px;height:22px;}
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
    border-radius:50%; border:1px solid transparent; background:transparent; color:var(--ink-faint);
  }
  .icon-btn:hover{background:var(--metal-cell); color:var(--ink);}
  .icon-btn[disabled]{opacity:.35; cursor:default;}
  .icon-btn[disabled]:hover{background:transparent; color:var(--ink-faint);}
  .history-btns{display:flex; gap:2px;}
  .history-btns .icon-btn{font-size:16px;}
  #themeToggleBtn{font-size:14px;}

  .segmented{display:flex; gap:4px; background:var(--surface-2); padding:3px; border-radius:var(--radius-sm); border:1px solid var(--border);}
  .seg-btn{
    appearance:none; border:none; background:transparent; color:var(--ink-soft);
    font-family:var(--font-mono); font-weight:600; font-size:11px; letter-spacing:.03em; text-transform:uppercase;
    padding:7px 10px; border-radius:3px; transition:background .15s, color .15s; white-space:nowrap;
  }
  .seg-btn.is-active{background:var(--accent); color:var(--accent-ink);}
  .seg-btn:not(.is-active):hover{background:var(--metal-cell); color:var(--ink);}

  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--surface); color:var(--ink); font-weight:600; font-size:13px;
    transition:background .15s, border-color .15s;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--border-strong); background:var(--metal-cell);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.06); background:var(--accent);}
  .btn-danger{color:var(--danger); border-color:var(--danger);}
  .btn-danger:hover{background:var(--danger-soft);}
  .btn-ghost{border-color:transparent; background:transparent;}
  .btn-ghost:hover{background:var(--metal-cell);}
  .btn-sm{padding:6px 10px; font-size:12px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}

  .toolbar-spacer{flex:1;}
  .menu-wrap{position:relative;}
  .menu{
    position:absolute; top:calc(100% + 6px); right:0; min-width:190px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-2); padding:6px; z-index:40;
  }
  .menu button{
    display:flex; width:100%; text-align:left; padding:8px 10px; border-radius:var(--radius-sm);
    background:transparent; border:none; color:var(--ink); font-size:13px; gap:8px; align-items:center;
  }
  .menu button:hover{background:var(--metal-cell);}
  .menu-divider{height:1px; background:var(--border); margin:5px 2px;}
  .menu-label{
    font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);
    padding:6px 10px 2px;
  }
  #exportMenu{min-width:220px;}

  /* ---------- Rack panel ---------- */
  .panel-scroll{overflow-x:auto; overflow-y:hidden; padding-bottom:6px; flex:none;}
  .rack-panel{
    position:relative; background:var(--metal);
    background-image: repeating-linear-gradient(180deg, var(--brush-line) 0px, var(--brush-line) 1px, transparent 1px, transparent 3px);
    border:1px solid var(--border-strong); border-radius:var(--radius-lg);
    padding:20px 26px 22px; box-shadow:var(--shadow-1); min-width:max-content;
  }
  .rack-panel + .rack-panel{margin-top:28px;}
  .screw{
    position:absolute; width:11px; height:11px; border-radius:50%;
    background:radial-gradient(circle at 32% 30%, var(--surface-2), var(--metal-2) 65%, var(--border-strong) 100%);
    border:1px solid var(--border-strong);
  }
  .screw::after{content:""; position:absolute; left:2px; right:2px; top:50%; height:1px; background:var(--border-strong); transform:translateY(-50%) rotate(20deg);}
  .screw.tl{top:9px; left:9px;} .screw.tr{top:9px; right:9px;} .screw.bl{bottom:9px; left:9px;} .screw.br{bottom:9px; right:9px;}

  .panel-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin:0 4px 16px;}
  .panel-title{font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:.01em; text-transform:uppercase; color:var(--ink);}
  .panel-sub{font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint);}

  .trs-row{display:flex; align-items:center; gap:10px; margin:0 4px;}
  .trs-row + .trs-row{margin-top:10px;}
  .trs-row.trs-row--glyphs{margin-top:6px; margin-bottom:6px;}
  .trs-row--glyphs + .trs-row{margin-top:6px;}
  .trs-strip + .trs-strip{margin-top:24px;}
  .row-tag{
    flex:none; width:78px; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.04em;
    color:var(--ink-faint); text-align:right; white-space:nowrap;
  }
  .port-row.glyph-row{height:16px; align-items:center;}
  .glyph-cell{
    display:flex; align-items:center; justify-content:center; height:100%; padding:0;
    background:transparent; border:none; border-radius:3px; cursor:pointer;
  }
  .glyph-cell:hover{background:var(--metal-2);}
  .glyph-cell:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .bridge{display:inline-block; width:2px; height:14px; background:var(--ink-soft); border-radius:1px;}
  .bridge.half-normal{
    background:linear-gradient(to bottom, var(--ink-soft) 0 5px, transparent 5px 9px, var(--ink-soft) 9px 14px);
  }
  .bridge.thru{
    width:auto; height:auto; background:none;
    font-family:var(--font-mono); font-size:11px; line-height:1; color:var(--ink-faint);
  }
  .port-row{display:grid; gap:8px;}
  /* Chunk every 8 ports with a wider gap so a long row scans in groups,
     like the physical block layout of real patchbay hardware. Real spacer
     tracks (not margins) so every port cell keeps the same width. */
  .port-row.xlr-row{grid-template-columns:repeat(8, 78px) 6px repeat(8, 78px); margin:0 4px;}
  .port-row.trs-cols-24{grid-template-columns:repeat(8, 56px) 6px repeat(8, 56px) 6px repeat(8, 56px);}
  .port-row.trs-cols-16{grid-template-columns:repeat(8, 64px) 6px repeat(8, 64px);}
  .chunk-gap{width:6px;}
  /* snake / stage box: sends in rows of 4 on the left, returns in their own block on the right */
  .snake-face{display:flex; align-items:flex-start; gap:0; margin:0 4px;}
  .snake-block{display:flex; flex-direction:column; gap:8px;}
  .snake-block--return{margin-left:28px; padding-left:28px; border-left:2px dashed var(--border-strong);}
  .snake-tag{font-family:var(--font-mono); font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint);}
  .snake-block--return .snake-tag{color:var(--accent);}
  .port-row.snake-grid{gap:8px;}

  .port{
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; height:78px; padding:6px 4px; background:var(--metal-cell); color:var(--ink);
    border:1.5px solid var(--border-strong); border-radius:var(--radius-sm);
    transition:box-shadow .12s, transform .06s, background .12s;
  }
  .port:hover{background:var(--surface);}
  .port:active{transform:translateY(1px);}
  .port .idx{position:absolute; top:4px; left:5px; font-family:var(--font-mono); font-size:9.5px; color:var(--ink-faint);}
  .port .lbl{font-size:11.5px; font-weight:500; line-height:1.2; text-align:center; max-width:100%; overflow-wrap:anywhere; max-height:2.6em; overflow:hidden;}
  .port .lbl.placeholder{color:var(--ink-faint); font-style:italic; font-weight:400;}
  .port .note-dot{position:absolute; bottom:5px; right:6px; width:5px; height:5px; border-radius:50%; background:var(--accent);}
  .port.is-selected{box-shadow:0 0 0 3px var(--ink); background:var(--surface);}
  .port.is-selected.is-anchor{box-shadow:0 0 0 3px var(--ink), 0 0 0 5px var(--ink-soft);}

  /* ---------- Rack elevation (gear layout) ---------- */
  .rack-toolbar{display:flex; align-items:center; gap:12px; margin:0 4px 14px; flex-wrap:wrap;}
  .rack-free{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);}
  .rack-free--over{color:var(--danger); font-weight:600;}
  .rack-elevation-wrap{display:flex; gap:0; align-items:flex-start;}
  .rack-rail{flex:none; width:26px;}
  .rack-rail .ru-num{display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:9px; color:var(--ink-faint); box-sizing:border-box;}
  .rack-rail .ru-num.ru-num--over{color:var(--danger);}
  .rack-elevation{
    position:relative; width:640px; max-width:100%; flex:none;
    background-color:var(--metal-cell);
    background-image: repeating-linear-gradient(180deg, var(--border) 0, var(--border) 1px, transparent 1px, transparent var(--ru));
    border:1px solid var(--border-strong); border-radius:var(--radius-sm);
  }
  .rack-overflow-line{position:absolute; left:0; right:0; height:0; border-top:2px dashed var(--danger); pointer-events:none;}
  .rack-overflow-line span{
    position:absolute; right:6px; top:-18px; font-family:var(--font-mono); font-size:9px; letter-spacing:.05em;
    color:var(--danger); background:var(--surface); padding:1px 5px; border-radius:3px; white-space:nowrap;
  }
  .drop-ghost{position:absolute; border:2px dashed var(--accent); background:var(--accent-soft); opacity:.85; border-radius:3px; pointer-events:none; z-index:5;}
  .drop-ghost.is-push{border-color:#D98A00; background:rgba(217,138,0,.18);}
  .drop-indicator{position:absolute; left:4px; right:4px; height:3px; background:var(--accent); border-radius:2px; pointer-events:none; z-index:5;}
  .gear-piece{
    position:absolute; display:flex; flex-direction:column; justify-content:center; text-align:left;
    background:var(--surface); border:1.5px solid var(--border-strong); border-radius:var(--radius-sm);
    padding:6px 10px; overflow:hidden; appearance:none; cursor:grab; user-select:none; -webkit-user-select:none;
  }
  .gear-piece:active{cursor:grabbing;}
  .gear-piece.is-dragging{opacity:.35;}
  .gear-piece.is-overflow{box-shadow:0 0 0 2px var(--danger-soft);}
  .gear-piece .gear-warn{position:absolute; top:4px; left:6px; font-size:11px; color:var(--danger); line-height:1;}
  .gear-piece:hover{background:var(--metal-cell);}
  .gear-piece.is-selected{box-shadow:0 0 0 3px var(--ink);}
  .gear-piece .gear-name{
    font-size:12.5px; font-weight:600; line-height:1.25; overflow:hidden;
    display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical;
  }
  .gear-piece .gear-name.placeholder{color:var(--ink-faint); font-style:italic; font-weight:400;}
  .gear-piece .gear-notes{font-size:10.5px; color:var(--ink-faint); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .gear-piece .gear-u{position:absolute; top:4px; right:6px; font-family:var(--font-mono); font-size:9px; color:var(--ink-faint);}
  .gear-piece .note-dot{position:absolute; bottom:5px; right:6px; width:5px; height:5px; border-radius:50%; background:var(--accent);}

  /* gear with a photo: the photo is the face of the piece, the name sits on a small label */
  .gear-piece.has-photo{padding:0; background-size:cover; background-repeat:no-repeat; background-color:var(--metal-cell);}
  .gear-piece.has-photo .gear-name{
    position:absolute; left:6px; bottom:5px; max-width:calc(100% - 12px); display:block; overflow:hidden;
    white-space:nowrap; text-overflow:ellipsis; background:rgba(0,0,0,.66); color:#fff; padding:1px 7px;
    border-radius:3px; font-size:11.5px; line-height:1.35;
  }
  .gear-piece.has-photo .gear-name.placeholder{color:#d8dcd9;}
  .gear-piece.has-photo .gear-u{background:rgba(0,0,0,.62); color:#fff; padding:0 4px; border-radius:3px;}
  .gear-piece.has-photo .note-dot{box-shadow:0 0 0 2px rgba(0,0,0,.6);}
  .photo-thumb{width:64px; height:40px; border-radius:var(--radius-sm); border:1px solid var(--border-strong); background-color:var(--metal-cell); background-size:cover; background-position:center; flex:none;}
  .photo-thumb--empty{display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:10px; font-family:var(--font-mono); letter-spacing:.04em;}
  .photo-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .photo-pos{display:flex; align-items:center; gap:10px;}
  .photo-pos label{display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint);}
  .photo-pos input[type="range"]{width:90px; padding:0;}
  .photo-preview{width:100%; border:1px solid var(--border-strong); border-radius:var(--radius-sm); background-color:var(--metal-cell); background-size:cover; background-repeat:no-repeat; position:relative; overflow:hidden;}
  .lib-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .lib-card{display:flex; flex-direction:column; gap:6px; border:1px solid var(--border); border-radius:var(--radius-md); padding:8px; background:var(--surface-2);}
  .lib-card .lib-face{height:54px; border-radius:var(--radius-sm); border:1px solid var(--border-strong); background-color:var(--metal-cell); background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-family:var(--font-mono); font-size:11px;}
  .lib-card .lib-name{font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lib-card .lib-meta{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); letter-spacing:.04em;}
  .lib-card .btn-row{gap:4px; margin-top:auto;}
  .lib-card .btn{padding:4px 8px;}
  .lib-top{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .lib-top input[type="search"]{flex:1; min-width:160px;}
  /* ---------- Rack compare view (side-by-side, drag gear between racks) ---------- */
  .compare-wrap{display:flex; gap:24px; align-items:flex-start;}
  .compare-col{display:flex; flex-direction:column; gap:10px; min-width:0; flex:none;}
  .compare-add{flex:none; align-self:flex-start; padding-top:2px;}
  .compare-picker{display:flex; align-items:center; gap:8px;}
  .compare-picker label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint);}
  .compare-picker select{font-size:12px;}
  .compare-picker .icon-btn{width:22px; height:22px; margin-left:auto;}

  /* ---------- signal-flow links ---------- */
  .port .link-dot,.gear-piece .link-dot{position:absolute; top:5px; right:6px; width:7px; height:7px; border-radius:2px; background:var(--accent); transform:rotate(45deg);}
  .gear-piece.has-photo .link-dot{box-shadow:0 0 0 2px rgba(0,0,0,.6);}
  .port.is-traced,.gear-piece.is-traced{box-shadow:0 0 0 3px var(--accent); background:var(--accent-soft);}
  .gear-piece.is-traced.has-photo{background-color:transparent;}
  body.is-picking .port:not(.is-dim),body.is-picking .gear-piece:not(.is-dim){cursor:crosshair;}
  body.is-picking .port:not(.is-dim){box-shadow:0 0 0 2px var(--accent);}
  .pick-banner{
    position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:90; display:flex; align-items:center; gap:12px;
    padding:9px 12px 9px 16px; border-radius:999px; background:var(--accent); color:var(--accent-ink); font-size:13px; font-weight:600;
    box-shadow:var(--shadow-2); max-width:calc(100vw - 24px);
  }
  .pick-banner .btn{background:transparent; color:inherit; border-color:currentColor;}
  .flow-panel{margin-top:16px; padding-top:14px; border-top:1px dashed var(--border-strong);}
  .flow-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:10px;}
  .flow-head h3{font-family:var(--font-display); font-weight:700; font-size:15px; text-transform:uppercase; letter-spacing:.02em; margin:0;}
  .flow-trace{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft);}
  .chan-row{display:flex; gap:14px; flex-wrap:wrap;}
  .chan-row label{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); text-transform:none; letter-spacing:0; font-family:inherit;}
  .chan-row input[type="number"]{width:64px;}
  .flow-rows{display:flex; flex-direction:column; gap:10px;}
  .flow-row{display:grid; grid-template-columns:minmax(120px,170px) 1fr 1fr; gap:10px 18px; align-items:start; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-2);}
  .flow-row--solo{grid-template-columns:1fr 1fr;}
  .flow-title{font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--ink); display:flex; flex-direction:column; gap:6px;}
  .flow-title input{font-family:var(--font-body, inherit); font-size:12.5px; width:100%;}
  .flow-side{display:flex; flex-direction:column; gap:6px; min-width:0;}
  .flow-side .eyebrow{font-size:10px;}
  .flow-none{font-size:12.5px; color:var(--ink-faint);}
  .flow-chain{display:flex; flex-wrap:wrap; align-items:center; gap:4px;}
  .flow-arrow{color:var(--ink-faint); font-size:12px;}
  .flow-norm{font-size:11px; color:var(--ink-faint); font-style:italic;}
  .flow-chip{
    display:inline-flex; flex-wrap:wrap; align-items:baseline; gap:5px; padding:3px 9px; border-radius:var(--radius-sm); max-width:100%; text-align:left;
    border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); font-size:12px;
  }
  .flow-chip b{font-weight:600;}
  .flow-chip span{color:var(--ink-soft); font-size:11px;}
  .flow-chip:hover{border-color:var(--accent);}
  .flow-dest{display:flex; align-items:center; gap:4px;}
  .flow-src-label{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft);}
  .lp-top{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .lp-top input[type="search"]{flex:1; min-width:160px;}
  .lp-list{max-height:min(52vh,420px); overflow-y:auto; display:flex; flex-direction:column; gap:2px; border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px;}
  .lp-bay{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); padding:8px 6px 3px;}
  .lp-item{display:flex; align-items:baseline; gap:8px; width:100%; text-align:left; padding:6px 8px; border-radius:var(--radius-sm); border:0; background:transparent; color:var(--ink); font-size:13px;}
  .lp-item:hover,.lp-item:focus-visible{background:var(--accent-soft);}
  .lp-item b{font-weight:600;}
  .lp-item span{color:var(--ink-soft); font-size:12px;}
  .lp-item em{margin-left:auto; font-size:11px; color:var(--ink-faint); font-style:normal;}
  @media (max-width:760px){ .flow-row,.flow-row--solo{grid-template-columns:1fr;} }

  /* ---------- shared (read-only) view ---------- */
  .shared-bar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:9px 20px; background:var(--accent-soft); color:var(--ink); border-bottom:1px solid var(--accent); font-size:13px;}
  .shared-bar[hidden]{display:none;}
  #inspectorBody [hidden]{display:none !important;}
  .shared-bar .toolbar-spacer{flex:1;}
  body.is-readonly #addBayBtn, body.is-readonly #bayMenuBtn, body.is-readonly #manageGroupsBtn, body.is-readonly #importMenuBtn,
  body.is-readonly #projectBtn, body.is-readonly .history-btns, body.is-readonly .save-status,
  body.is-readonly .bay-tab .icon-btn, body.is-readonly .rack-toolbar .btn, body.is-readonly [data-act="resize-snake"]{display:none !important;}

  /* ---------- Inspector (horizontal bar below the panel) ---------- */
  .insp-empty{color:var(--ink-faint); font-size:13px; margin:0; padding:6px 0;}
  .insp-bar{display:flex; align-items:flex-end; gap:22px; flex-wrap:wrap;}
  .insp-id{min-width:100px;}
  .insp-id-row{display:flex; align-items:center; gap:6px;}
  .insp-id-row h2{font-family:var(--font-display); font-weight:700; font-size:19px; text-transform:uppercase; letter-spacing:.01em; white-space:nowrap;}
  .insp-nav{display:flex; gap:4px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field-grow{flex:1 1 200px;}
  .field label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint);}
  .field input[type="text"],.field textarea,.field select{width:100%;}
  .group-picker{display:flex; align-items:center; gap:8px;}
  .group-chips{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:-6px 0 14px;}
  .group-chips[hidden]{display:none;}
  .group-chip{
    display:inline-flex; align-items:center; gap:7px; padding:4px 11px 4px 8px; border-radius:999px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); font-size:12.5px; font-weight:500;
  }
  .group-chip:hover{border-color:var(--border-strong); color:var(--ink);}
  .group-chip.is-active{border-color:var(--ink); color:var(--ink); box-shadow:0 0 0 1px var(--ink);}
  .group-chip--clear{border-style:dashed; background:transparent;}
  .port.is-dim,.gear-piece.is-dim{opacity:.25;}
  .port.is-dim:hover,.gear-piece.is-dim:hover{opacity:.6;}
  .fill-row{display:flex; align-items:center; gap:6px;}
  .fill-row #fillBase{flex:1; min-width:140px;}
  .fill-row #fillStart{width:46px; text-align:center; flex:none;}
  .swatch{width:16px; height:16px; border-radius:4px; flex:none; border:1px solid rgba(0,0,0,.15);}
  .bulk-count{font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); margin:0;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap;}
  .stack{display:flex; flex-direction:column; gap:8px;}
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,12,11,.5); display:flex; align-items:center; justify-content:center;
    padding:24px; z-index:100;
  }
  .modal{
    background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-2);
    width:min(560px,100%); max-height:min(640px,90vh); display:flex; flex-direction:column; border:1px solid var(--border);
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border);}
  .modal-head h2{font-family:var(--font-display); font-weight:700; font-size:19px; text-transform:uppercase;}
  .modal-body{padding:18px 20px; overflow-y:auto;}
  .group-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
  .group-row:last-child{border-bottom:none;}
  .group-row input[type="text"]{flex:1; background:transparent; border:1px solid transparent; padding:5px 6px;}
  .group-row input[type="text"]:hover,.group-row input[type="text"]:focus{background:var(--surface-2); border-color:var(--border);}
  .group-usage{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); flex:none;}
  .palette{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0;}
  .palette button{width:24px; height:24px; border-radius:6px; border:2px solid transparent;}
  .palette button.is-active{border-color:var(--ink);}
  .new-group-form{margin-top:14px; padding-top:14px; border-top:1px solid var(--border);}

  /* ---------- Toast / banner ---------- */
  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:var(--bg);
    padding:10px 16px; border-radius:var(--radius-md); font-size:13px; box-shadow:var(--shadow-2); z-index:200;
    max-width:min(480px,86vw);
  }
  :root:not([data-theme="light"]) .toast{background:var(--surface-2); color:var(--ink); border:1px solid var(--border);}
  :root[data-theme="dark"] .toast{background:var(--surface-2); color:var(--ink); border:1px solid var(--border);}
  .toast.error{background:var(--danger); color:var(--danger-ink);}

  .banner{
    display:flex; align-items:center; gap:12px; background:var(--accent-soft); border:1px solid var(--accent);
    color:var(--ink); padding:10px 14px; border-radius:var(--radius-md); margin-bottom:16px; font-size:13px;
  }
  .banner .toolbar-spacer{flex:1;}

  .confirm-inline{display:flex; align-items:center; gap:6px;}
  .confirm-inline span{font-size:12px; color:var(--ink-soft);}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">
        <span class="eyebrow">Carter's Studio Tools <span class="beta-badge" id="betaBadge" hidden title="Beta build: saves to its own storage, separate from your stable projects">Beta</span></span>
        <span class="brand-mark">Patch<span>·</span>Configurator v4.3</span>
      </div>
      <div class="menu-wrap">
        <button class="btn btn-sm project-btn" id="projectBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Projects"><span class="project-name" id="projectName">Project</span><span class="project-caret">▾</span></button>
        <div class="menu menu--left" id="projectMenu" hidden role="menu"></div>
      </div>
    </div>
    <div class="section-tabs" id="sectionTabs" role="tablist" aria-label="Patchbay type"></div>
    <div class="topbar-meta">
      <span class="save-status" id="saveStatus"><span class="dot"></span><span id="saveStatusText">Saved on this device</span></span>
      <span class="history-btns">
        <button class="icon-btn" id="undoBtn" type="button" title="Undo (⌘/Ctrl+Z)" aria-label="Undo" disabled>↶</button>
        <button class="icon-btn" id="redoBtn" type="button" title="Redo (⌘/Ctrl+Shift+Z)" aria-label="Redo" disabled>↷</button>
      </span>

var TRS_SIZES = [48, 64];

function makePorts(bayId, type, size){
  var ports = [];

    for(var i=1;i<=16;i++){
      ports.push({id:bayId+"-x-"+i, row:null, index:i, label:"", notes:"", groupId:null});
    }
  } else {
    var perRow = normalizeTrsSize(size) / 2;
    ["top","bottom"].forEach(function(row){
      for(var i=1;i<=perRow;i++){
        ports.push({id:bayId+"-"+row+"-"+i, row:row, index:i, label:"", notes:"", groupId:null});

/* ---------- snake (stage box) data model ---------- */
var SNAKE_SENDS = [6,8,12,16,24,32,48];
var SNAKE_RETURNS = [2,4,6,8,10,12];
var SNAKE_DEFAULT_SENDS = 24, SNAKE_DEFAULT_RETURNS = 4;
function normalizeSnakeCount(n, allowed, fallback){
  n = Math.round(Number(n));
  return allowed.indexOf(n) !== -1 ? n : fallback;
}
function makeSnakePorts(bayId, sends, returns){
  var ports = [], i;
  for(i=1;i<=sends;i++){ ports.push({id:bayId+"-s-"+i, row:"send", index:i, label:"", notes:"", groupId:null}); }
  for(i=1;i<=returns;i++){ ports.push({id:bayId+"-r-"+i, row:"return", index:i, label:"", notes:"", groupId:null}); }
  return ports;
}
// A stage box is laid out in rows of 4 connectors (a 6-send box is one row of
// 6). Returns have the same rows-of-4 rule, with a shorter last row when the
// count isn't a multiple of 4 (6 returns = 4 + 2, 10 = 4 + 4 + 2).
function snakeCols(count, kind){ return Math.min(count, (kind === "send" && count === 6) ? 6 : 4); }
function snakeRowCount(count, kind){ return Math.ceil(count / snakeCols(count, kind)); }
// Labeled channels that would disappear if the box were resized to this.
function snakeResizeLoss(bay, sends, returns){
  return bay.ports.filter(function(p){
    var gone = (p.row === "send" && p.index > sends) || (p.row === "return" && p.index > returns);
    return gone && (p.label || p.notes || p.groupId);
  }).length;
}
var ROUTING_STATES = ["normal","half-normal","thru"];
var ROUTING_LABELS = {normal:"Normal", "half-normal":"Half-Normal", thru:"Thru"};
function makeColumns(size){
  var n = normalizeTrsSize(size) / 2;

}
function getColumn(bay, index){

}
function setColumnState(bay, index, state){

/* ---------- gear photos ---------- */
// Photos are the user's own uploads. Each one is downscaled to a modest JPEG and kept in
// IndexedDB (localStorage is far too small for pictures); pieces and library entries only
// carry a photo id. Everything is also held in memory (photoCache) so rendering stays
// synchronous, and a generated <style> gives each photo one CSS class instead of repeating
// the image data inside every piece.
var PHOTO_MAX_DIM = 1000, PHOTO_QUALITY = 0.85, PHOTO_MAX_FILE = 30 * 1024 * 1024;
var photoCache = {};          // id -> {dataUrl}
var photoDbOk = true;         // false once IndexedDB proves unavailable (private mode, blocked, …)
var photoDbPromise = null;
function clampPct(v){
  v = Number(v);
  if(!isFinite(v)) return 50;
  return Math.max(0, Math.min(100, Math.round(v)));
}
function validPhotoDataUrl(u){ return typeof u === "string" && u.length < 9000000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(u); }
function validPhotoId(id){ return typeof id === "string" && /^ph-[A-Za-z0-9_-]{4,40}$/.test(id); }
function openPhotoDb(){
  if(photoDbPromise) return photoDbPromise;
  photoDbPromise = new Promise(function(resolve){
    if(typeof indexedDB === "undefined"){ photoDbOk = false; resolve(null); return; }
    var req;
    try{ req = indexedDB.open(NS + "-photos", 1); }catch(e){ photoDbOk = false; resolve(null); return; }
    req.onupgradeneeded = function(){ req.result.createObjectStore("photos", {keyPath:"id"}); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = req.onblocked = function(){ photoDbOk = false; resolve(null); };
  });
  return photoDbPromise;
}
function idbRun(mode, fn){
  return openPhotoDb().then(function(db){
    if(!db) return null;
    return new Promise(function(resolve){
      try{
        var tx = db.transaction("photos", mode), store = tx.objectStore("photos");
        var result = fn(store);
        tx.oncomplete = function(){ resolve(result && result.result !== undefined ? result.result : true); };
        tx.onerror = tx.onabort = function(){ photoDbOk = false; resolve(null); };
      }catch(e){ photoDbOk = false; resolve(null); }
    });
  });
}
function rebuildPhotoStyles(){
  var el = document.getElementById("photoStyles");
  if(!el){ el = document.createElement("style"); el.id = "photoStyles"; document.head.appendChild(el); }
  el.textContent = Object.keys(photoCache).map(function(id){
    return '.gear-piece.has-photo.gph-'+id+',.photo-bg.gph-'+id+'{background-image:url("'+photoCache[id].dataUrl+'");}';
  }).join("\n");
}
function loadAllPhotos(){
  return idbRun("readonly", function(store){ return store.getAll(); }).then(function(rows){
    if(Array.isArray(rows)) rows.forEach(function(r){ if(r && validPhotoId(r.id) && validPhotoDataUrl(r.dataUrl)) photoCache[r.id] = {dataUrl:r.dataUrl}; });
    rebuildPhotoStyles();
  });
}
function storePhoto(id, dataUrl){
  if(!validPhotoId(id) || !validPhotoDataUrl(dataUrl)) return Promise.resolve();
  photoCache[id] = {dataUrl:dataUrl};
  rebuildPhotoStyles();
  return idbRun("readwrite", function(store){ store.put({id:id, dataUrl:dataUrl, created:Date.now()}); }).then(function(ok){
    if(!ok) showToast("Photos can't be saved on this device here (browser storage unavailable) — it will show until you close the page.", "error");
  });
}
function deletePhotoFromStore(id){
  delete photoCache[id];
  return idbRun("readwrite", function(store){ store.delete(id); });
}
function hasPhoto(id){ return !!(id && photoCache[id]); }
// Reads an uploaded image, scales its longest side down to PHOTO_MAX_DIM and re-encodes it
// as JPEG, so a 12 MB phone photo becomes roughly 100 KB.
function processImageFile(file){
  return new Promise(function(resolve, reject){
    if(!file || !/^image\//.test(file.type || "")){ reject(new Error("That file isn't an image.")); return; }
    if(file.size > PHOTO_MAX_FILE){ reject(new Error("That image is too large (30 MB max).")); return; }
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error("Couldn't read that image.")); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error("Couldn't open that image.")); };
      img.onload = function(){
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if(!w || !h){ reject(new Error("Couldn't open that image.")); return; }
        var k = Math.min(1, PHOTO_MAX_DIM / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
        var c = document.createElement("canvas"); c.width = cw; c.height = ch;
        var cx = c.getContext("2d");
        cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, cw, ch);
        cx.drawImage(img, 0, 0, cw, ch);
        resolve(c.toDataURL("image/jpeg", PHOTO_QUALITY));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function addPhotoFromFile(file){
  return processImageFile(file).then(function(dataUrl){
    var id = "ph-" + uid();
    return storePhoto(id, dataUrl).then(function(){ return id; });
  });
}
// One shared hidden file input serves every "add photo" button.
var photoPickCb = null;

// Photos still referenced by any saved project, template or library entry; anything else
// (replaced or removed photos, abandoned uploads) is deleted once per page load.
function collectReferencedPhotoIds(){
  var used = {};
  function scan(text){
    if(!text) return;
    var re = /"photoId":"(ph-[A-Za-z0-9_-]+)"/g, m;
    while((m = re.exec(text))) used[m[1]] = true;
  }
  try{
    for(var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if(k && (k.indexOf(PROJECT_PREFIX) === 0 || k === TEMPLATES_KEY || k === GEARLIB_KEY)) scan(localStorage.getItem(k));
    }
  }catch(e){ /* ignore */ }
  return used;
}
function gcPhotos(){
  var used = collectReferencedPhotoIds();
  Object.keys(photoCache).forEach(function(id){ if(!used[id]) deletePhotoFromStore(id); });
  rebuildPhotoStyles();
}

var GEAR_HEIGHTS = [1,2,3,4];

}

function makeGear(name, notes, heightU, width){

    json: "application/json", csv: "text/csv", txt: "text/plain"

    var blob = (data instanceof Blob) ? data : new Blob([data], {type: mimeForFilename(filename)});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);

  }
}

      return true;
    }).catch(function(err){
      var code = err && err.code;

        var fallback = filename.replace(/\.csv$/i, ".txt");

          showToast("CSV isn't enabled in this view — saved " + fallback + " instead. Rename the extension to .csv to open it in a spreadsheet.", "info");
          return true;
        }).catch(function(){
          showToast("Couldn't save the file.", "error");
          return false;
        });

      showToast("Couldn't save the file" + (err && err.message ? ": " + err.message : "."), "error");

/* ---------- signal-flow links ---------- */
// A link is one directed cable, {id, from, to}. An endpoint is any bay port

}

  if(!Array.isArray(state.links)) return;
  var before = state.links.length;
  state.links = state.links.filter(function(l){ return l.id !== linkId; });
  if(state.links.length !== before) markDirty();

// Drops links whose ends are gone (a deleted bay or piece, a snake or gear
// channel count that shrank), that run the wrong way, double up on an input,
// or close a loop. Returns how many were dropped.
function pruneLinks(){
  if(!Array.isArray(state.links) || !state.links.length) return 0;
  var idx = endpointIndex(), total = state.links.length, kept = [], inUse = {}, ids = {};
  state.links.forEach(function(l){
    if(!l || typeof l.from !== "string" || typeof l.to !== "string") return;
    var a = idx[l.from], b = idx[l.to];
    if(!a || !b || l.from === l.to || !canSendFrom(a) || !canReceiveAt(b) || inUse[l.to]) return;
    state.links = kept; // judge each link against only those already accepted
    var loops = wouldCycle(l.from, l.to);
    if(loops) return;
    var id = (typeof l.id === "string" && l.id && !ids[l.id]) ? l.id : "lnk-" + uid();
    ids[id] = true; inUse[l.to] = true;
    kept.push({id:id, from:l.from, to:l.to});

}
function linkedCount(id){

}
// Links with both ends inside one bay (used when a bay is duplicated or saved as a template).
function bayEndpointIds(bay){
  var ids = {};
  if(bay.type === "rack"){
    (bay.gear || []).forEach(function(g){
      for(var i = 1; i <= (g.ins || 0); i++) ids[gearChId(g.id, "in", i)] = true;
      for(var j = 1; j <= (g.outs || 0); j++) ids[gearChId(g.id, "out", j)] = true;

    (bay.ports || []).forEach(function(p){ ids[p.id] = true; });

}
function bayInternalLinks(bay){
  var ids = bayEndpointIds(bay);

}
// The nearest labelled hop upstream of an endpoint — what "Use this label" offers.
function sourceInfo(id){
  var hops = traceUp(id);
  if(!hops.length) return null;
  var idx = endpointIndex(), labeled = null;
  for(var i = 0; i < hops.length; i++){
    var ep = idx[hops[i].id];
    if(ep && epLabel(ep)){ labeled = ep; break; }

  if(mods.shift && ui.anchor && order.indexOf(ui.anchor) !== -1){
    var a = order.indexOf(ui.anchor);

// Drag a bay tab left/right to reorder it (within its own section). The
// order of state.bays drives tab order, the Full view, and the Master Sheet.
// Alt+←/→ on a focused tab does the same from the keyboard.
var TABDRAG = null; // bay id while a tab is being dragged
function clearTabDropMarks(host){
  Array.prototype.forEach.call(host.querySelectorAll(".bay-tab"), function(t){ t.classList.remove("drop-before","drop-after","is-dragging"); });
}
function reorderBay(dragId, targetId, after){
  if(dragId === targetId) return false;
  var from = state.bays.findIndex(function(b){ return b.id === dragId; });
  if(from === -1) return false;
  var moved = state.bays.splice(from, 1)[0];
  var to = state.bays.findIndex(function(b){ return b.id === targetId; });
  if(to === -1){ state.bays.splice(from, 0, moved); return false; }
  state.bays.splice(after ? to + 1 : to, 0, moved);
  var changed = state.bays.findIndex(function(b){ return b.id === dragId; }) !== from;
  if(!changed) return false;
  markDirty();
  renderAll();
  return true;
}
function wireBayTabReorder(host){
  Array.prototype.forEach.call(host.querySelectorAll(".bay-tab"), function(tab){
    var id = tab.getAttribute("data-bay");
    tab.addEventListener("dragstart", function(e){
      if(!tab.draggable){ e.preventDefault(); return; }
      TABDRAG = id;
      tab.classList.add("is-dragging");
      if(e.dataTransfer){
        e.dataTransfer.effectAllowed = "move";
        try{ e.dataTransfer.setData("text/plain", id); }catch(err){ /* ignore */ }
      }
    });
    tab.addEventListener("dragend", function(){ TABDRAG = null; clearTabDropMarks(host); });
    tab.addEventListener("dragover", function(e){
      if(!TABDRAG || TABDRAG === id) return;
      e.preventDefault();
      if(e.dataTransfer) e.dataTransfer.dropEffect = "move";
      var r = tab.getBoundingClientRect();
      var after = e.clientX > r.left + r.width / 2;
      Array.prototype.forEach.call(host.querySelectorAll(".bay-tab"), function(t){
        t.classList.toggle("drop-before", t === tab && !after);
        t.classList.toggle("drop-after", t === tab && after);
      });
    });
    tab.addEventListener("dragleave", function(e){
      if(e.target === tab) tab.classList.remove("drop-before","drop-after");
    });
    tab.addEventListener("drop", function(e){
      if(!TABDRAG) return;
      e.preventDefault();
      var r = tab.getBoundingClientRect();
      var after = e.clientX > r.left + r.width / 2;
      var dragId = TABDRAG;
      TABDRAG = null;
      clearTabDropMarks(host);
      reorderBay(dragId, id, after);
    });
    var nameBtn = tab.querySelector('[data-act="select"]');
    if(nameBtn) nameBtn.addEventListener("keydown", function(e){
      if(!e.altKey || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
      var list = baysOfType(ui.section);
      var i = list.findIndex(function(b){ return b.id === id; });
      var other = list[i + (e.key === "ArrowLeft" ? -1 : 1)];
      if(!other) return;
      e.preventDefault();
      if(reorderBay(id, other.id, e.key === "ArrowRight")){
        var again = document.querySelector('#bayTabs .bay-tab[data-bay="'+cssEscape(id)+'"] [data-act="select"]');
        if(again) again.focus();
      }
    });
  });
}

function wireInlineConfirm(btn, onConfirm, label){
  btn.addEventListener("click", function(){
    if(btn.dataset.confirming === "1"){ return; }
    btn.dataset.confirming = "1";
    var wrap = document.createElement("span");
    wrap.className = "confirm-inline";
    wrap.innerHTML = '<span>'+escapeHtml(label)+'</span>' +
      '<button type="button" class="btn btn-sm btn-danger" data-c="yes">Delete</button>' +
      '<button type="button" class="btn btn-sm btn-ghost" data-c="no">Cancel</button>';
    btn.replaceWith(wrap);
    wrap.querySelector('[data-c="yes"]').addEventListener("click", onConfirm);
    wrap.querySelector('[data-c="no"]').addEventListener("click", function(){ renderAll(); });
  });

// A TRS bay's logical TOP/BOTTOM rows are grouped into "strips" — each strip

// two jacks are always vertically adjacent (with a routing-state indicator

// ganged 16-wide strips (1–16, 17–32), matching how the hardware is actually
// wired and keeping cells from shrinking to fit 32 in a single row.
function trsStrips(bay){

  var bottom = bay.ports.filter(function(p){return p.row==="bottom";});
  if(bay.size === 64){
    return [
      {topTag:"TOP 1–16", bottomTag:"BOTTOM 1–16", top: top.slice(0,16), bottom: bottom.slice(0,16), colStart:0},
      {topTag:"TOP 17–32", bottomTag:"BOTTOM 17–32", top: top.slice(16,32), bottom: bottom.slice(16,32), colStart:16}
    ];

}

    rail += '<div class="ru-num'+(i>bay.heightU?" ru-num--over":"")+'" style="height:'+RACK_RU_PX+'px">'+i+'</div>';
  }
  var gearHtml = layout.items.map(function(item){ return gearCellHtml(item, set, bay.heightU); }).join("");
  var overflowLine = overflowU > 0
    ? '<div class="rack-overflow-line" style="top:'+(bay.heightU*RACK_RU_PX)+'px"><span>RACK ENDS HERE</span></div>'
    : "";
  html += '<div class="rack-elevation-wrap">' +
    '<div class="rack-rail">'+rail+'</div>' +
    '<div class="rack-elevation" style="height:'+(totalRows*RACK_RU_PX)+'px; --ru:'+RACK_RU_PX+'px;">'+gearHtml+overflowLine+'</div>' +
    '</div>';

}
// In Full view, several bays render at once — a click in any of them makes
// that bay "active" (and drops any stale selection from whichever bay was
// active before) so the Inspector and bay tabs stay pointed at the bay you
// actually clicked in.
function ensureBayActive(bay){
  if(ui.activeBay[bay.type] !== bay.id){
    ui.activeBay[bay.type] = bay.id;
    ui.selection = []; ui.anchor = null;
    renderBayTabs();
  }
}
// Click = select one piece; Shift-click = range from the anchor (in rack
// order); ⌘/Ctrl-click = add or remove a single piece.
function selectGear(bay, gearId, mods){
  mods = mods || {};
  var order = bay.gear.map(function(g){ return g.id; });
  var idx = order.indexOf(gearId);
  if(idx === -1) return;
  if(mods.shift && ui.anchor && order.indexOf(ui.anchor) !== -1){
    var a = order.indexOf(ui.anchor);
    ui.selection = order.slice(Math.min(a, idx), Math.max(a, idx) + 1);
  } else if(mods.ctrl){
    var pos = ui.selection.indexOf(gearId);
    if(pos === -1){ ui.selection.push(gearId); } else { ui.selection.splice(pos, 1); }
    ui.anchor = gearId;
  } else {
    ui.selection = [gearId];
    ui.anchor = gearId;
  }
  renderGrid();
  renderInspector();
}
function selectedGear(bay){
  if(!bay || bay.type !== "rack") return [];
  var set = {}; ui.selection.forEach(function(id){ set[id]=true; });
  return bay.gear.filter(function(g){ return set[g.id]; });
}

// Compare view: the active rack side by side with a second, pickable rack —
// the only place two different racks' elevations are guaranteed to be on
// screen together, so it's where cross-rack dragging actually makes sense.
// Compare view: up to COMPARE_MAX racks side by side. Each column is pinned
// to a rack of its own (ui.compareIds), independent of which rack is "active"
// — clicking or dropping into a column only changes what the Inspector shows,
// never which racks are on screen or where.
var COMPARE_MAX = 4;
function compareColumns(){
  var racks = baysOfType("rack"), ids = [], seen = {};
  (ui.compareIds || []).forEach(function(id){
    var b = getBay(id);
    if(b && b.type === "rack" && !seen[id]){ seen[id] = true; ids.push(id); }
  });
  if(!ids.length){
    ensureActiveBay("rack");
    var a = ui.activeBay.rack;
    if(a && getBay(a)){ ids.push(a); seen[a] = true; }
  }
  var want = Math.min(2, racks.length);
  racks.forEach(function(r){
    if(ids.length < want && !seen[r.id]){ seen[r.id] = true; ids.push(r.id); }
  });
  ui.compareIds = ids;
  return ids.map(function(id){ return getBay(id); });
}
function renderGridCompare(host){
  var racks = baysOfType("rack");

    host.innerHTML = emptySectionHtml();
    return;

    host.innerHTML =
      '<div class="compare-wrap">' +
        '<div class="rack-panel" data-bay-id="'+cols[0].id+'">' + bayPanelInnerHtml(cols[0]) + '</div>' +
        '<p class="insp-empty" style="margin-top:4px;">Add a second rack to drag gear between racks.</p>' +
      '</div>';
    wireBayPanelEvents(host.querySelector(".rack-panel"), cols[0]);
    wireGearDragAndDrop(host);
    return;
  }
  var unused = racks.filter(function(r){ return ui.compareIds.indexOf(r.id) === -1; });
  host.innerHTML = '<div class="compare-wrap">' + cols.map(function(bay, i){
    var opts = racks.filter(function(r){ return r.id === bay.id || ui.compareIds.indexOf(r.id) === -1; }).map(function(r){
      return '<option value="'+r.id+'"'+(r.id===bay.id?" selected":"")+'>'+escapeHtml(r.name)+'</option>';
    }).join("");
    return '<div class="compare-col">' +
      '<div class="compare-picker"><label for="compareSel'+i+'">'+(i===0?"Viewing":"Comparing with")+'</label>' +
        '<select id="compareSel'+i+'" data-col="'+i+'">'+opts+'</select>' +
        (cols.length > 2 ? '<button type="button" class="icon-btn" data-col-remove="'+i+'" title="Remove this column" aria-label="Remove this column">×</button>' : '') +
      '</div>' +
      '<div class="rack-panel" data-bay-id="'+bay.id+'">' + bayPanelInnerHtml(bay) + '</div>' +
    '</div>';
  }).join("") +
  (cols.length < COMPARE_MAX && unused.length ? '<div class="compare-add"><button type="button" class="btn btn-sm btn-ghost" id="compareAddBtn">+ Add rack</button></div>' : '') +
  '</div>';
  var panels = host.querySelectorAll(".compare-wrap .rack-panel");
  cols.forEach(function(bay, i){ wireBayPanelEvents(panels[i], bay); });
  // If the rack the Inspector is pointed at leaves the screen, point it at
  // whatever took its place instead of leaving it editing something hidden.
  function retarget(oldId, newId){
    if(ui.activeBay.rack === oldId){ ui.activeBay.rack = newId; clearSelectionSilently(); }
  }
  Array.prototype.forEach.call(host.querySelectorAll(".compare-picker select"), function(sel){
    sel.addEventListener("change", function(){
      var i = Number(sel.getAttribute("data-col")), oldId = ui.compareIds[i];
      ui.compareIds[i] = sel.value;
      retarget(oldId, sel.value);
      renderAll();
    });
  });
  Array.prototype.forEach.call(host.querySelectorAll("[data-col-remove]"), function(btn){
    btn.addEventListener("click", function(){
      var i = Number(btn.getAttribute("data-col-remove")), oldId = ui.compareIds[i];
      ui.compareIds.splice(i, 1);
      retarget(oldId, ui.compareIds[0]);
      renderAll();
    });
  });
  var addBtn = document.getElementById("compareAddBtn");
  if(addBtn) addBtn.addEventListener("click", function(){
    if(unused.length){ ui.compareIds.push(unused[0].id); renderGrid(); }
  });

/* ---------- drag and drop: reorder gear within or between racks ---------- */
var DRAG = null; // {fromRackId, gearIds, anchorId, grabOffsetU} while gear is being dragged
function clearDropIndicator(){
  Array.prototype.forEach.call(document.querySelectorAll(".drop-ghost"), function(n){ n.remove(); });
}
// One dashed "ghost" box per piece being dragged, snapped to the row it would
// land on; amber when dropping there would push other pieces down.
function showDropGhosts(elevation, placements, pushed){
  clearDropIndicator();
  placements.forEach(function(pl){
    var el = document.createElement("div");
    el.className = "drop-ghost" + (pushed ? " is-push" : "");
    el.style.top = (pl.topU * RACK_RU_PX + 2) + "px";
    el.style.height = (pl.gear.heightU * RACK_RU_PX - 4) + "px";
    if(pl.side === "left"){ el.style.left = "2px"; el.style.width = "calc(50% - 3px)"; }
    else if(pl.side === "right"){ el.style.right = "2px"; el.style.width = "calc(50% - 3px)"; }
    else { el.style.left = "2px"; el.style.right = "2px"; }
    elevation.appendChild(el);
  });
}
// Where the dragged piece(s) would land for the pointer position in `e`:
// the grabbed piece's top edge follows the pointer (snapped to a U), the rest
// of a multi-selection keeps its spacing, everything is kept inside the rack
// rows currently shown, and a lone half-width piece takes the side the
// pointer is on (or pairs with a matching lone half-width piece).
function dragPlacements(rack, elevation, e){
  if(!DRAG) return null;
  var fromRack = getBay(DRAG.fromRackId);
  if(!fromRack) return null;
  var ids = {}; DRAG.gearIds.forEach(function(id){ ids[id] = true; });
  var src = layoutRackGear(fromRack).items.filter(function(it){ return ids[it.gear.id]; });
  if(!src.length) return null;
  var anchor = src.filter(function(it){ return it.gear.id === DRAG.anchorId; })[0] || src[0];
  var rect = elevation.getBoundingClientRect();
  var rel = src.map(function(it){ return {gear:it.gear, d:it.topU - anchor.topU, side:it.side}; });
  var minRel = Math.min.apply(null, rel.map(function(r){ return r.d; }));
  var maxRel = Math.max.apply(null, rel.map(function(r){ return r.d + r.gear.heightU; }));
  var lay = layoutRackGear(rack);
  var totalRows = Math.max(rack.heightU, lay.usedU);
  var pointerRow = Math.floor((e.clientY - rect.top) / RACK_RU_PX);
  var top = pointerRow - (DRAG.grabOffsetU || 0);
  top = Math.min(top, totalRows - maxRel);
  top = Math.max(top, -minRel);
  var placements = rel.map(function(r){ return {gear:r.gear, topU:top + r.d, side:r.side}; });
  if(placements.length === 1 && placements[0].gear.width === "half"){
    var pl = placements[0];
    pl.side = (e.clientX - rect.left) < rect.width / 2 ? "left" : "right";
    var others = lay.items.filter(function(it){ return !ids[it.gear.id]; });
    var snap = snapHalfPair(others, pl.topU, pl.gear.heightU);
    if(snap){ pl.topU = snap.topU; pl.side = snap.side; }
  }
  return placements;
}
// Wires native HTML5 drag-and-drop for every gear piece / rack elevation
// currently rendered under scopeEl. Works across however many rack panels
// are in scopeEl at once — one rack in Compact view, every rack in Full
// view, or the two side-by-side panels in Compare view — so a drag can
// land in a different rack's elevation whenever more than one is visible.
function wireGearDragAndDrop(scopeEl){
  Array.prototype.forEach.call(scopeEl.querySelectorAll(".gear-piece"), function(el){
    el.addEventListener("dragstart", function(e){
      var panel = el.closest(".rack-panel");
      if(!panel) return;
      var fromRackId = panel.getAttribute("data-bay-id");
      var gid = el.getAttribute("data-gear");
      // Grabbing a piece that's part of a multi-selection drags the whole
      // selection together; grabbing anything else drags just that piece.
      var ids = [gid];
      var fromBay = getBay(fromRackId);
      if(fromBay && fromRackId === ui.activeBay.rack){
        var selIds = selectedGear(fromBay).map(function(g){ return g.id; });
        if(selIds.length > 1 && selIds.indexOf(gid) !== -1) ids = selIds;
      }
      var r = el.getBoundingClientRect();
      var grab = Math.floor((e.clientY - r.top) / RACK_RU_PX);
      var item = fromBay ? layoutRackGear(fromBay).items.filter(function(it){ return it.gear.id === gid; })[0] : null;
      var hU = item ? item.gear.heightU : 1;
      DRAG = {fromRackId: fromRackId, gearIds: ids, anchorId: gid, grabOffsetU: Math.max(0, Math.min(hU - 1, isFinite(grab) ? grab : 0))};
      ids.forEach(function(id){
        var node = panel.querySelector('.gear-piece[data-gear="'+cssEscape(id)+'"]');
        if(node) node.classList.add("is-dragging");
      });
      if(e.dataTransfer){
        e.dataTransfer.effectAllowed = "move";
        try{ e.dataTransfer.setData("text/plain", ids.join(",")); }catch(err){ /* ignore */ }
      }
    });
    el.addEventListener("dragend", function(){
      Array.prototype.forEach.call(document.querySelectorAll(".gear-piece.is-dragging"), function(n){ n.classList.remove("is-dragging"); });
      clearDropIndicator();
      DRAG = null;
    });
  });
  Array.prototype.forEach.call(scopeEl.querySelectorAll(".rack-elevation"), function(elevation){
    elevation.addEventListener("dragover", function(e){
      if(!DRAG) return;
      var panel = elevation.closest(".rack-panel");
      if(!panel) return;
      var rack = getBay(panel.getAttribute("data-bay-id"));
      if(!rack) return;
      var placements = dragPlacements(rack, elevation, e);
      if(!placements) return;
      e.preventDefault();
      if(e.dataTransfer) e.dataTransfer.dropEffect = "move";
      showDropGhosts(elevation, placements, planPlacement(rack, placements).pushed > 0);
    });
    elevation.addEventListener("dragleave", function(e){
      if(e.target === elevation) clearDropIndicator();
    });
    elevation.addEventListener("drop", function(e){
      if(!DRAG) return;
      var panel = elevation.closest(".rack-panel");
      if(!panel){ DRAG = null; return; }
      var rack = getBay(panel.getAttribute("data-bay-id"));
      if(!rack){ DRAG = null; return; }
      e.preventDefault();
      var placements = dragPlacements(rack, elevation, e);
      var d = DRAG;
      clearDropIndicator();
      DRAG = null;
      if(placements) moveGearsToSlot(d.fromRackId, d.gearIds, rack.id, placements);
    });
  });
}

    (hasPhoto(g.photoId)

          '<label>Left–right <input type="range" id="gearPhotoX" min="0" max="100" value="'+clampPct(g.photoX)+'" aria-label="Photo horizontal position" /></label>' +

    g.side = g.width === "half" ? "left" : "full";
    // going full-width may collide with a neighbour — push it down
    applyPlan(bay, planPlacement(bay, [{gear:g, topU:gLayout.items.filter(function(it){ return it.gear === g; })[0].topU, side:g.side}]));
    markDirty(); renderGrid(); renderInspector();
