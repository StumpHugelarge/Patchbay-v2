<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patch·Configurator v3.6</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#E7EAE8; --surface:#FFFFFF; --surface-2:#F2F4F3;
    --metal:#C9CFCC; --metal-2:#BCC3BF; --metal-cell:#DBE0DD;
    --border:#C1C7C4; --border-strong:#9DA4A0;
    --ink:#17181A; --ink-soft:#525855; --ink-faint:#5C625F;
    --accent:#2C8567; --accent-ink:#FFFFFF; --accent-soft:#DCEFE8;
    --danger:#B8442D; --danger-soft:#F6E1DC; --danger-ink:#FFFFFF;
    --radius-sm:4px; --radius-md:8px; --radius-lg:12px;
    --font-display:"Big Shoulders Display","Arial Narrow",sans-serif;
    --font-body:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
    --font-mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    --shadow-1:0 1px 2px rgba(20,24,22,.08),0 1px 1px rgba(20,24,22,.06);
    --shadow-2:0 12px 32px rgba(20,24,22,.18);
    --brush-line: rgba(20,24,22,.05);
    --grid-dot: rgba(20,24,22,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16181A; --surface:#1F2224; --surface-2:#262A2C;
      --metal:#2B2F31; --metal-2:#34383A; --metal-cell:#2F3335;
      --border:#3B4042; --border-strong:#4C5254;
      --ink:#ECEFED; --ink-soft:#AEB5B1; --ink-faint:#7E8582;
      --accent:#4FC79A; --accent-ink:#0D1512; --accent-soft:#1E3730;
      --danger:#E2694A; --danger-soft:#3A211B; --danger-ink:#1A0E0A;
      --shadow-1:0 1px 2px rgba(0,0,0,.4);
      --shadow-2:0 16px 36px rgba(0,0,0,.5);
      --brush-line: rgba(255,255,255,.04);
      --grid-dot: rgba(255,255,255,.055);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#16181A; --surface:#1F2224; --surface-2:#262A2C;
    --metal:#2B2F31; --metal-2:#34383A; --metal-cell:#2F3335;
    --border:#3B4042; --border-strong:#4C5254;
    --ink:#ECEFED; --ink-soft:#AEB5B1; --ink-faint:#7E8582;
    --accent:#4FC79A; --accent-ink:#0D1512; --accent-soft:#1E3730;
    --danger:#E2694A; --danger-soft:#3A211B; --danger-ink:#1A0E0A;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 16px 36px rgba(0,0,0,.5);
    --brush-line: rgba(255,255,255,.04);
    --grid-dot: rgba(255,255,255,.055);
    color-scheme: dark;
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body);
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0; text-wrap:balance;}
  button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
  button{cursor:pointer;}
  input,textarea,select{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--ink); padding:7px 9px;}
  input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,[tabindex]:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  ::selection{background:var(--accent-soft);}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }

  .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-faint);}

  /* ---------- App shell ---------- */
  .app{min-height:100%; display:flex; flex-direction:column;}

  .topbar{
    display:flex; align-items:center; gap:24px; flex-wrap:wrap;
    padding:16px 24px; border-bottom:1px solid var(--border);
    background:var(--surface);
  }
  .brand{display:flex; flex-direction:column; gap:2px; margin-right:auto;}
  .brand-mark{
    font-family:var(--font-display); font-weight:800; font-size:26px; letter-spacing:.01em;
    text-transform:uppercase; line-height:1; color:var(--ink);
  }
  .brand-mark span{color:var(--accent);}
  .section-tabs{display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:var(--radius-md); border:1px solid var(--border);}
  .section-tab{
    appearance:none; border:none; background:transparent; color:var(--ink-soft);
    font-family:var(--font-mono); font-weight:600; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase;
    padding:9px 18px; border-radius:calc(var(--radius-md) - 2px); transition:background .15s,color .15s;
  }
  .section-tab[aria-selected="true"]{background:var(--accent); color:var(--accent-ink);}
  .section-tab:not([aria-selected="true"]):hover{background:var(--metal-cell); color:var(--ink);}
  .topbar-meta{display:flex; align-items:center; gap:14px;}
  .save-status{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); letter-spacing:.03em; display:flex; align-items:center; gap:6px;}
  .save-status .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);}
  .save-status.dirty .dot{background:var(--accent);}

  .workspace{display:flex; flex-direction:column;}
  .stage{
    min-width:0; display:flex; flex-direction:column; padding:20px 24px 28px;
    background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
    background-size: 22px 22px; background-position: -3px -3px;
  }
  .inspector{
    flex:none; border-top:1px solid var(--border); background:var(--surface);
    padding:18px 24px; position:sticky; bottom:0;
  }

  .stage-toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .bay-tabs{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .bay-tab{
    display:flex; align-items:center; gap:8px; padding:6px 6px 6px 14px; border-radius:999px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
    font-size:13px; font-weight:500;
  }
  .bay-tab[aria-selected="true"]{border-color:var(--accent); color:var(--ink); background:var(--accent-soft);}
  .bay-tab[draggable="true"]{cursor:grab;}
  .bay-tab.is-dragging{opacity:.4;}
  .bay-tab.drop-before{box-shadow:-3px 0 0 var(--accent);}
  .bay-tab.drop-after{box-shadow:3px 0 0 var(--accent);}
  .bay-tab .bay-tab-name{background:none;border:none;padding:2px 0;color:inherit;font:inherit;cursor:pointer;}
  .bay-tab .bay-tab-name:hover{text-decoration:underline;}
  .bay-tab-size{
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:.04em; color:var(--ink-faint);
    padding:1px 6px; border:1px solid var(--border); border-radius:999px; white-space:nowrap;
  }
  .bay-tab .icon-btn{width:22px;height:22px;}
  .icon-btn{
    display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
    border-radius:50%; border:1px solid transparent; background:transparent; color:var(--ink-faint);
  }
  .icon-btn:hover{background:var(--metal-cell); color:var(--ink);}
  .icon-btn[disabled]{opacity:.35; cursor:default;}
  .icon-btn[disabled]:hover{background:transparent; color:var(--ink-faint);}
  .history-btns{display:flex; gap:2px;}
  .history-btns .icon-btn{font-size:16px;}
  #themeToggleBtn{font-size:14px;}

  .segmented{display:flex; gap:4px; background:var(--surface-2); padding:3px; border-radius:var(--radius-sm); border:1px solid var(--border);}
  .seg-btn{
    appearance:none; border:none; background:transparent; color:var(--ink-soft);
    font-family:var(--font-mono); font-weight:600; font-size:11px; letter-spacing:.03em; text-transform:uppercase;
    padding:7px 10px; border-radius:3px; transition:background .15s, color .15s; white-space:nowrap;
  }
  .seg-btn.is-active{background:var(--accent); color:var(--accent-ink);}
  .seg-btn:not(.is-active):hover{background:var(--metal-cell); color:var(--ink);}

  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--surface); color:var(--ink); font-weight:600; font-size:13px;
    transition:background .15s, border-color .15s;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--border-strong); background:var(--metal-cell);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.06); background:var(--accent);}
  .btn-danger{color:var(--danger); border-color:var(--danger);}
  .btn-danger:hover{background:var(--danger-soft);}
  .btn-ghost{border-color:transparent; background:transparent;}
  .btn-ghost:hover{background:var(--metal-cell);}
  .btn-sm{padding:6px 10px; font-size:12px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}

  .toolbar-spacer{flex:1;}
  .menu-wrap{position:relative;}
  .menu{
    position:absolute; top:calc(100% + 6px); right:0; min-width:190px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-2); padding:6px; z-index:40;
  }
  .menu button{
    display:flex; width:100%; text-align:left; padding:8px 10px; border-radius:var(--radius-sm);
    background:transparent; border:none; color:var(--ink); font-size:13px; gap:8px; align-items:center;
  }
  .menu button:hover{background:var(--metal-cell);}
  .menu-divider{height:1px; background:var(--border); margin:5px 2px;}
  .menu-label{
    font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);
    padding:6px 10px 2px;
  }
  #exportMenu{min-width:220px;}

  /* ---------- Rack panel ---------- */
  .panel-scroll{overflow-x:auto; overflow-y:hidden; padding-bottom:6px; flex:none;}
  .rack-panel{
    position:relative; background:var(--metal);
    background-image: repeating-linear-gradient(180deg, var(--brush-line) 0px, var(--brush-line) 1px, transparent 1px, transparent 3px);
    border:1px solid var(--border-strong); border-radius:var(--radius-lg);
    padding:20px 26px 22px; box-shadow:var(--shadow-1); min-width:max-content;
  }
  .rack-panel + .rack-panel{margin-top:28px;}
  .screw{
    position:absolute; width:11px; height:11px; border-radius:50%;
    background:radial-gradient(circle at 32% 30%, var(--surface-2), var(--metal-2) 65%, var(--border-strong) 100%);
    border:1px solid var(--border-strong);
  }
  .screw::after{content:""; position:absolute; left:2px; right:2px; top:50%; height:1px; background:var(--border-strong); transform:translateY(-50%) rotate(20deg);}
  .screw.tl{top:9px; left:9px;} .screw.tr{top:9px; right:9px;} .screw.bl{bottom:9px; left:9px;} .screw.br{bottom:9px; right:9px;}

  .panel-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin:0 4px 16px;}
  .panel-title{font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:.01em; text-transform:uppercase; color:var(--ink);}
  .panel-sub{font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint);}

  .trs-row{display:flex; align-items:center; gap:10px; margin:0 4px;}
  .trs-row + .trs-row{margin-top:10px;}
  .trs-row.trs-row--glyphs{margin-top:6px; margin-bottom:6px;}
  .trs-row--glyphs + .trs-row{margin-top:6px;}
  .trs-strip + .trs-strip{margin-top:24px;}
  .row-tag{
    flex:none; width:78px; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.04em;
    color:var(--ink-faint); text-align:right; white-space:nowrap;
  }
  .port-row.glyph-row{height:16px; align-items:center;}
  .glyph-cell{
    display:flex; align-items:center; justify-content:center; height:100%; padding:0;
    background:transparent; border:none; border-radius:3px; cursor:pointer;
  }
  .glyph-cell:hover{background:var(--metal-2);}
  .glyph-cell:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .bridge{display:inline-block; width:2px; height:14px; background:var(--ink-soft); border-radius:1px;}
  .bridge.half-normal{
    background:linear-gradient(to bottom, var(--ink-soft) 0 5px, transparent 5px 9px, var(--ink-soft) 9px 14px);
  }
  .bridge.thru{
    width:auto; height:auto; background:none;
    font-family:var(--font-mono); font-size:11px; line-height:1; color:var(--ink-faint);
  }
  .port-row{display:grid; gap:8px;}
  /* Chunk every 8 ports with a wider gap so a long row scans in groups,
     like the physical block layout of real patchbay hardware. Real spacer
     tracks (not margins) so every port cell keeps the same width. */
  .port-row.xlr-row{grid-template-columns:repeat(8, 78px) 6px repeat(8, 78px); margin:0 4px;}
  .port-row.trs-cols-24{grid-template-columns:repeat(8, 56px) 6px repeat(8, 56px) 6px repeat(8, 56px);}
  .port-row.trs-cols-16{grid-template-columns:repeat(8, 64px) 6px repeat(8, 64px);}
  .chunk-gap{width:6px;}

  .port{
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; height:78px; padding:6px 4px; background:var(--metal-cell); color:var(--ink);
    border:1.5px solid var(--border-strong); border-radius:var(--radius-sm);
    transition:box-shadow .12s, transform .06s, background .12s;
  }
  .port:hover{background:var(--surface);}
  .port:active{transform:translateY(1px);}
  .port .idx{position:absolute; top:4px; left:5px; font-family:var(--font-mono); font-size:9.5px; color:var(--ink-faint);}
  .port .lbl{font-size:11.5px; font-weight:500; line-height:1.2; text-align:center; max-width:100%; overflow-wrap:anywhere; max-height:2.6em; overflow:hidden;}
  .port .lbl.placeholder{color:var(--ink-faint); font-style:italic; font-weight:400;}
  .port .note-dot{position:absolute; bottom:5px; right:6px; width:5px; height:5px; border-radius:50%; background:var(--accent);}
  .port.is-selected{box-shadow:0 0 0 3px var(--ink); background:var(--surface);}
  .port.is-selected.is-anchor{box-shadow:0 0 0 3px var(--ink), 0 0 0 5px var(--ink-soft);}

  /* ---------- Rack elevation (gear layout) ---------- */
  .rack-toolbar{display:flex; align-items:center; gap:12px; margin:0 4px 14px; flex-wrap:wrap;}
  .rack-free{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);}
  .rack-free--over{color:var(--danger); font-weight:600;}
  .rack-elevation-wrap{display:flex; gap:0; align-items:flex-start;}
  .rack-rail{flex:none; width:26px;}
  .rack-rail .ru-num{display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:9px; color:var(--ink-faint); box-sizing:border-box;}
  .rack-rail .ru-num.ru-num--over{color:var(--danger);}
  .rack-elevation{
    position:relative; width:640px; max-width:100%; flex:none;
    background-color:var(--metal-cell);
    background-image: repeating-linear-gradient(180deg, var(--border) 0, var(--border) 1px, transparent 1px, transparent var(--ru));
    border:1px solid var(--border-strong); border-radius:var(--radius-sm);
  }
  .rack-overflow-line{position:absolute; left:0; right:0; height:0; border-top:2px dashed var(--danger); pointer-events:none;}
  .rack-overflow-line span{
    position:absolute; right:6px; top:-18px; font-family:var(--font-mono); font-size:9px; letter-spacing:.05em;
    color:var(--danger); background:var(--surface); padding:1px 5px; border-radius:3px; white-space:nowrap;
  }
  .drop-ghost{position:absolute; border:2px dashed var(--accent); background:var(--accent-soft); opacity:.85; border-radius:3px; pointer-events:none; z-index:5;}
  .drop-ghost.is-push{border-color:#D98A00; background:rgba(217,138,0,.18);}
  .drop-indicator{position:absolute; left:4px; right:4px; height:3px; background:var(--accent); border-radius:2px; pointer-events:none; z-index:5;}
  .gear-piece{
    position:absolute; display:flex; flex-direction:column; justify-content:center; text-align:left;
    background:var(--surface); border:1.5px solid var(--border-strong); border-radius:var(--radius-sm);
    padding:6px 10px; overflow:hidden; appearance:none; cursor:grab; user-select:none; -webkit-user-select:none;
  }
  .gear-piece:active{cursor:grabbing;}
  .gear-piece.is-dragging{opacity:.35;}
  .gear-piece.is-overflow{box-shadow:0 0 0 2px var(--danger-soft);}
  .gear-piece .gear-warn{position:absolute; top:4px; left:6px; font-size:11px; color:var(--danger); line-height:1;}
  .gear-piece:hover{background:var(--metal-cell);}
  .gear-piece.is-selected{box-shadow:0 0 0 3px var(--ink);}
  .gear-piece .gear-name{
    font-size:12.5px; font-weight:600; line-height:1.25; overflow:hidden;
    display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical;
  }
  .gear-piece .gear-name.placeholder{color:var(--ink-faint); font-style:italic; font-weight:400;}
  .gear-piece .gear-notes{font-size:10.5px; color:var(--ink-faint); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .gear-piece .gear-u{position:absolute; top:4px; right:6px; font-family:var(--font-mono); font-size:9px; color:var(--ink-faint);}
  .gear-piece .note-dot{position:absolute; bottom:5px; right:6px; width:5px; height:5px; border-radius:50%; background:var(--accent);}

  /* ---------- Rack compare view (side-by-side, drag gear between racks) ---------- */
  .compare-wrap{display:flex; gap:24px; align-items:flex-start;}
  .compare-right{display:flex; flex-direction:column; gap:10px; min-width:0;}
  .compare-picker{display:flex; align-items:center; gap:8px;}
  .compare-picker label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint);}
  .compare-picker select{font-size:12px;}

  /* ---------- Inspector (horizontal bar below the panel) ---------- */
  .insp-empty{color:var(--ink-faint); font-size:13px; margin:0; padding:6px 0;}
  .insp-bar{display:flex; align-items:flex-end; gap:22px; flex-wrap:wrap;}
  .insp-id{min-width:100px;}
  .insp-id-row{display:flex; align-items:center; gap:6px;}
  .insp-id-row h2{font-family:var(--font-display); font-weight:700; font-size:19px; text-transform:uppercase; letter-spacing:.01em; white-space:nowrap;}
  .insp-nav{display:flex; gap:4px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field-grow{flex:1 1 200px;}
  .field label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint);}
  .field input[type="text"],.field textarea,.field select{width:100%;}
  .group-picker{display:flex; align-items:center; gap:8px;}
  .group-chips{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:-6px 0 14px;}
  .group-chips[hidden]{display:none;}
  .group-chip{
    display:inline-flex; align-items:center; gap:7px; padding:4px 11px 4px 8px; border-radius:999px;
    border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); font-size:12.5px; font-weight:500;
  }
  .group-chip:hover{border-color:var(--border-strong); color:var(--ink);}
  .group-chip.is-active{border-color:var(--ink); color:var(--ink); box-shadow:0 0 0 1px var(--ink);}
  .group-chip--clear{border-style:dashed; background:transparent;}
  .port.is-dim,.gear-piece.is-dim{opacity:.25;}
  .port.is-dim:hover,.gear-piece.is-dim:hover{opacity:.6;}
  .fill-row{display:flex; align-items:center; gap:6px;}
  .fill-row #fillBase{flex:1; min-width:140px;}
  .fill-row #fillStart{width:46px; text-align:center; flex:none;}
  .swatch{width:16px; height:16px; border-radius:4px; flex:none; border:1px solid rgba(0,0,0,.15);}
  .bulk-count{font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); margin:0;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap;}
  .stack{display:flex; flex-direction:column; gap:8px;}
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,12,11,.5); display:flex; align-items:center; justify-content:center;
    padding:24px; z-index:100;
  }
  .modal{
    background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-2);
    width:min(560px,100%); max-height:min(640px,90vh); display:flex; flex-direction:column; border:1px solid var(--border);
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border);}
  .modal-head h2{font-family:var(--font-display); font-weight:700; font-size:19px; text-transform:uppercase;}
  .modal-body{padding:18px 20px; overflow-y:auto;}
  .group-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
  .group-row:last-child{border-bottom:none;}

<script>
"use strict";
/* =========================================================================
   PATCH SHEET — XLR & TRS patchbay labeling
   Single-file artifact. No build step, no external JS.
   ========================================================================= */

/* ---------- constants ---------- */
var GROUP_PALETTE = [
  {name:"Crimson", hex:"#D64550"},
  {name:"Amber",   hex:"#DE8A3C"},
  {name:"Gold",    hex:"#D2B23A"},
  {name:"Teal",    hex:"#2FA6A0"},
  {name:"Sky",     hex:"#3E8FD0"},
  {name:"Indigo",  hex:"#5B6FD6"},
  {name:"Violet",  hex:"#8C5FD6"},
  {name:"Orchid",  hex:"#C15FC0"},
  {name:"Rose",    hex:"#D6608F"},
  {name:"Rust",    hex:"#A9673A"},
  {name:"Navy",    hex:"#2E4C8C"},
  {name:"Copper",  hex:"#C77B4B"}
];
var LOCAL_KEY = "patchsheet.draft.v1";
var THEME_KEY = "patchsheet.theme.v1";
var VIEWMODE_KEY = "patchsheet.viewmode.v1";

/* ---------- theme toggle ---------- */
function getEffectiveTheme(){
  var explicit = document.documentElement.getAttribute("data-theme");
  if(explicit === "light" || explicit === "dark") return explicit;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function updateThemeBtn(){
  var btn = document.getElementById("themeToggleBtn");
  if(!btn) return;
  var eff = getEffectiveTheme();
  btn.textContent = eff === "dark" ? "☾" : "☀";
  var next = eff === "dark" ? "light" : "dark";
  btn.title = "Switch to " + next + " mode";
  btn.setAttribute("aria-label", "Switch to " + next + " mode");
}
function applyTheme(explicit){
  if(explicit === "light" || explicit === "dark"){
    document.documentElement.setAttribute("data-theme", explicit);
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
  updateThemeBtn();
}
function initTheme(){
  var stored = null;
  try{ stored = localStorage.getItem(THEME_KEY); }catch(e){ /* ignore */ }
  applyTheme(stored === "light" || stored === "dark" ? stored : null);
  var btn = document.getElementById("themeToggleBtn");
  if(btn){
    btn.addEventListener("click", function(){
      var next = getEffectiveTheme() === "dark" ? "light" : "dark";
      applyTheme(next);
      try{ localStorage.setItem(THEME_KEY, next); }catch(e){ /* ignore */ }
    });
  }
}

/* ---------- view mode (compact / full / compare) ---------- */
function updateViewModeToggle(){
  var host = document.getElementById("viewModeToggle");
  if(!host) return;
  var compareBtn = host.querySelector('[data-mode="compare"]');
  if(compareBtn) compareBtn.hidden = (ui.section !== "rack");
  Array.prototype.forEach.call(host.querySelectorAll(".seg-btn"), function(btn){
    btn.classList.toggle("is-active", btn.getAttribute("data-mode") === ui.viewMode);
  });
}
function setViewMode(mode){
  if(mode !== "compact" && mode !== "full" && mode !== "compare") return;
  ui.viewMode = mode;
  try{ localStorage.setItem(VIEWMODE_KEY, mode); }catch(e){ /* ignore */ }
  updateViewModeToggle();
  renderGrid();
}
function initViewMode(){
  var stored = null;
  try{ stored = localStorage.getItem(VIEWMODE_KEY); }catch(e){ /* ignore */ }
  ui.viewMode = (stored === "full") ? "full" : "compact";
  updateViewModeToggle();
  var host = document.getElementById("viewModeToggle");
  if(host){
    host.addEventListener("click", function(e){
      var btn = e.target.closest(".seg-btn"); if(!btn) return;
      setViewMode(btn.getAttribute("data-mode"));
    });
  }
}
var CSV_COLUMNS = ["bay_id","bay_name","bay_type","row","index","port_id","label","notes","group","routing","gear_height_u","gear_width"];

/* ---------- tiny utils ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function debounce(fn, wait){
  var t = null;
  return function(){
    var args = arguments, ctx = this;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(ctx, args); }, wait);
  };
}
function slug(s){
  return String(s || "bay").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "bay";
}
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function escapeAttr(s){ return escapeHtml(s); }

/* ---------- data model ---------- */
var TRS_SIZES = [48, 64];
function normalizeTrsSize(size){ return size === 64 ? 64 : 48; }
function makePorts(bayId, type, size){
  var ports = [];
  if(type === "xlr"){
    for(var i=1;i<=16;i++){
      ports.push({id:bayId+"-x-"+i, row:null, index:i, label:"", notes:"", groupId:null});
    }
  } else {
    var perRow = normalizeTrsSize(size) / 2;
    ["top","bottom"].forEach(function(row){
      for(var i=1;i<=perRow;i++){
        ports.push({id:bayId+"-"+row+"-"+i, row:row, index:i, label:"", notes:"", groupId:null});
      }
    });
  }
  return ports;
}
var ROUTING_STATES = ["normal","half-normal","thru"];
var ROUTING_LABELS = {normal:"Normal", "half-normal":"Half-Normal", thru:"Thru"};
function makeColumns(size){
  var n = normalizeTrsSize(size) / 2;
  var out = [];
  for(var i=1;i<=n;i++){ out.push({index:i, state:"normal"}); }
  return out;
}
function getColumn(bay, index){
  if(!bay || !bay.columns) return null;
  for(var i=0;i<bay.columns.length;i++){ if(bay.columns[i].index === index) return bay.columns[i]; }
  return null;
}
function setColumnState(bay, index, state){
  var col = getColumn(bay, index);
  if(col && ROUTING_STATES.indexOf(state) !== -1) col.state = state;
}
/* ---------- rack (gear) data model ---------- */
var GEAR_HEIGHTS = [1,2,3,4];
function clampRackHeight(h){
  h = Math.round(Number(h));
  if(!isFinite(h) || h < 1) h = 1;
  if(h > 24) h = 24;
  return h;
}
function clampGearHeight(h){
  h = Math.round(Number(h));
  return GEAR_HEIGHTS.indexOf(h) !== -1 ? h : 1;
}
function makeGear(name, notes, heightU, width){
  var w = width === "half" ? "half" : "full";
  return {
    id: "gear-"+uid(),
    name: String(name||"").slice(0,60),
    notes: String(notes||""),
    heightU: clampGearHeight(heightU),
    width: w,
    groupId: null,
    topU: 0,                          // row the piece starts on (0 = top of the rack)
    side: w === "half" ? "left" : "full"
  };
}
function indexOfGear(rack, gearId){
  for(var i=0;i<rack.gear.length;i++){ if(rack.gear[i].id===gearId) return i; }
  return -1;
}

/* ---------- rack layout: every piece stores its own position ---------- */
// Each piece keeps its own topU (row, 0 = top of the rack) and — for half-width
// pieces — which side it sits on, so blank rows can be left anywhere. Two
// pieces conflict when their row bands overlap, with one exception that keeps
// the old half-width behaviour: two half-width pieces of the same height that
// start on the same row and sit on opposite sides share that row.
var RACK_MAX_ROW = 200; // sanity cap on stored positions
function gearSide(g){ return g.width === "half" ? (g.side === "right" ? "right" : "left") : "full"; }
function sideRank(g){ return gearSide(g) === "right" ? 1 : 0; }
function byPos(a, b){ return (a.topU - b.topU) || (sideRank(a) - sideRank(b)); }
function gearsConflict(a, b){
  if(a.topU >= b.topU + b.heightU || b.topU >= a.topU + a.heightU) return false;
  if(a.width === "half" && b.width === "half" && a.topU === b.topU && a.heightU === b.heightU && gearSide(a) !== gearSide(b)) return false;
  return true;
}
function itemBox(it){ return {topU:it.topU, heightU:it.gear.heightU, width:it.gear.width, side:it.side}; }
function sortGearByPosition(rack){ rack.gear.sort(byPos); }
// The pre-3.6 stacking rule: pieces stack from the top in array order, with
// matching half-width pieces pairing up. Used to place gear from older files
// (which stored no positions) exactly where it used to appear.
function legacyStack(list){
  var cursor = 0, openRow = null, out = [];
  list.forEach(function(g){
    if(g.width === "half"){
      if(openRow && openRow.heightU === g.heightU){
        out.push({topU:openRow.topU, side:"right"});
        cursor = openRow.topU + openRow.heightU;
        openRow = null;
      } else {
        if(openRow){ cursor = openRow.topU + openRow.heightU; openRow = null; }
        out.push({topU:cursor, side:"left"});
        openRow = {heightU:g.heightU, topU:cursor};
      }
    } else {
      if(openRow){ cursor = openRow.topU + openRow.heightU; openRow = null; }
      out.push({topU:cursor, side:"full"});
      cursor += g.heightU;
    }
  });
  return out;
}
function hasStoredPos(g){ return typeof g.topU === "number" && isFinite(g.topU) && g.topU >= 0; }
// Items come back in rack.gear order, so items[i] always matches rack.gear[i].
function layoutRackGear(rack){
  var list = rack.gear || [], legacy = null, items = [], used = 0;
  list.forEach(function(g, i){
    var top, side;
    if(hasStoredPos(g)){ top = g.topU; side = gearSide(g); }
    else { if(!legacy) legacy = legacyStack(list); top = legacy[i].topU; side = legacy[i].side; }
    items.push({gear:g, topU:top, side:side});
    used = Math.max(used, top + g.heightU);
  });
  return {items:items, usedU:used};
}
function occupiedRows(rack){
  var occ = {};
  layoutRackGear(rack).items.forEach(function(it){
    for(var r = it.topU; r < it.topU + it.gear.heightU; r++) occ[r] = true;
  });
  return occ;
}
// Total empty rows inside the rack's height (gaps included).
function rackFreeU(rack){
  var occ = occupiedRows(rack), free = 0;
  for(var r = 0; r < rack.heightU; r++){ if(!occ[r]) free++; }
  return free;
}
// Empty rows that sit above the lowest piece — the ones "Close gaps" removes.
function rackGapRows(rack){
  var layout = layoutRackGear(rack), occ = occupiedRows(rack), n = 0;
  for(var r = 0; r < layout.usedU; r++){ if(!occ[r]) n++; }
  return n;
}
// Push-down placement. `fixed` pieces are already at their final spot; every
// piece in `others` that collides with something already settled slides down
// until it clears it (cascading). Pieces that don't collide never move, so a
// gap below a drop simply absorbs the push.
function pushClear(fixed, others){
  var settled = fixed.slice();
  others.slice().sort(byPos).forEach(function(o){
    var moved = true, guard = 0;
    while(moved && guard++ < 1000){
      moved = false;
      for(var i = 0; i < settled.length; i++){
        if(gearsConflict(o, settled[i])){ o.topU = settled[i].topU + settled[i].heightU; moved = true; }
      }
    }
    settled.push(o);
  });
}
// Works out where everything ends up if the `moved` pieces ({gear, topU, side})
// are dropped into `rack` — without touching any real data, so it can drive the
// live drop preview as well as the real move.
function planPlacement(rack, moved){
  var skip = {};
  moved.forEach(function(m){ skip[m.gear.id] = true; });
  var fixed = moved.map(function(m){
    return {id:m.gear.id, topU:m.topU, heightU:m.gear.heightU, width:m.gear.width, side:m.side};
  });
  var others = layoutRackGear(rack).items.filter(function(it){ return !skip[it.gear.id]; }).map(function(it){
    return {id:it.gear.id, topU:it.topU, heightU:it.gear.heightU, width:it.gear.width, side:it.side, orig:it.topU};
  });
  pushClear(fixed, others);
  var pos = {}, pushed = 0;
  fixed.forEach(function(f){ pos[f.id] = {topU:f.topU, side:f.side}; });
  others.forEach(function(o){ pos[o.id] = {topU:o.topU, side:o.side}; if(o.topU !== o.orig) pushed++; });
  return {pos:pos, pushed:pushed};
}
function applyPlan(rack, plan){
  rack.gear.forEach(function(g){
    var p = plan.pos[g.id]; if(!p) return;
    g.topU = Math.max(0, Math.min(RACK_MAX_ROW, Math.round(p.topU)));
    g.side = g.width === "half" ? (p.side === "right" ? "right" : "left") : "full";
  });
  sortGearByPosition(rack);
}
// A half-width piece dropped on or beside a lone half-width piece of the same
// height pairs with it (on the open side) instead of pushing it away.
function snapHalfPair(items, topU, h){
  var best = null;
  items.forEach(function(it){
    if(it.gear.width !== "half" || it.gear.heightU !== h) return;
    var d = Math.abs(it.topU - topU);
    if(d >= h) return;
    var opp = it.side === "left" ? "right" : "left";
    var taken = items.some(function(o){
      return o !== it && o.gear.width === "half" && o.gear.heightU === h && o.topU === it.topU && o.side === opp;
    });
    if(taken) return;
    if(!best || d < best.d) best = {d:d, topU:it.topU, side:opp};
  });
  return best ? {topU:best.topU, side:best.side} : null;
}
// Where a new piece lands by default: pairing into a lone half-width piece at
// the bottom of the stack, else just under the lowest piece, else (if that
// would run off the rack) the first gap big enough. With allowOverflow it
// falls back to the bottom of the stack even when that overflows.
function findAppendSlot(rack, h, w, allowOverflow){
  var items = layoutRackGear(rack).items, half = (w === "half");
  var sideOf = half ? "left" : "full";
  if(half && items.length){
    var low = items[0];
    items.forEach(function(it){ if(it.topU >= low.topU) low = it; });
    if(low.gear.width === "half" && low.gear.heightU === h){
      var snap = snapHalfPair(items, low.topU, h);
      if(snap && snap.topU === low.topU) return snap;
    }
  }
  var bottom = 0;
  items.forEach(function(it){ bottom = Math.max(bottom, it.topU + it.gear.heightU); });
  if(bottom + h <= rack.heightU) return {topU:bottom, side:sideOf};
  for(var t = 0; t + h <= rack.heightU; t++){
    var sides = half ? ["left","right"] : ["full"];
    for(var k = 0; k < sides.length; k++){
      var cand = {topU:t, heightU:h, width:w, side:sides[k]};
      var clash = items.some(function(it){ return gearsConflict(cand, itemBox(it)); });
      if(!clash) return {topU:t, side:sides[k]};
    }
  }
  return allowOverflow ? {topU:bottom, side:sideOf} : null;
}
// Normalises a rack's gear list: fills in positions for older files, fixes
// sides to match widths, and resolves any overlaps by pushing pieces down.
function repairRack(rack){
  var list = rack.gear, legacy = null;
  list.forEach(function(g, i){
    g.width = g.width === "half" ? "half" : "full";
    if(hasStoredPos(g)){ g.topU = Math.min(RACK_MAX_ROW, Math.round(g.topU)); }
    else { if(!legacy) legacy = legacyStack(list); g.topU = legacy[i].topU; g.side = legacy[i].side; }
    g.side = gearSide(g);
  });
  pushClear([], list);
  sortGearByPosition(rack);
}
function addGearToRack(rackId, name, notes, heightU, width, at){
  var rack = getBay(rackId);
  if(!rack || rack.type !== "rack") return null;
  var h = clampGearHeight(heightU);
  var w = width === "half" ? "half" : "full";
  var slot;
  if(at){
    var top = Math.max(0, Math.round(at.topU));
    var side = w === "half" ? (at.side === "right" ? "right" : "left") : "full";
    if(w === "half"){
      var snap = snapHalfPair(layoutRackGear(rack).items, top, h);
      if(snap){ top = snap.topU; side = snap.side; }
    }
    if(top + h > rack.heightU){
      showToast("Doesn't fit there — only " + Math.max(0, rack.heightU - top) + "U left below that spot.", "error");
      return null;
    }
    slot = {topU:top, side:side};
  } else {
    slot = findAppendSlot(rack, h, w, false);
    if(!slot){
      showToast("Doesn't fit — no open " + h + "U space (" + rackFreeU(rack) + "U free in total).", "error");
      return null;
    }
  }
  var g = makeGear(name, notes, h, w);
  g.topU = slot.topU; g.side = slot.side;
  var plan = planPlacement(rack, [{gear:g, topU:slot.topU, side:slot.side}]);
  rack.gear.push(g);
  applyPlan(rack, plan);
  markDirty();
  return g;
}
function deleteGear(rackId, gearId){
  var rack = getBay(rackId);
  if(!rack) return;
  rack.gear = rack.gear.filter(function(g){ return g.id !== gearId; });
  if(ui.selection.indexOf(gearId) !== -1) clearSelectionSilently();
  markDirty();
  renderAll();
}
function deleteGears(rackId, gearIds){
  var rack = getBay(rackId);
  if(!rack) return;
  var set = {}; gearIds.forEach(function(id){ set[id] = true; });
  rack.gear = rack.gear.filter(function(g){ return !set[g.id]; });
  clearSelectionSilently();
  markDirty();
  renderAll();
}
// ▲ / ▼ in the Inspector: move one piece a single U. A free U is simply
// stepped into; if the next row is taken by one neighbouring piece, the two
// trade places (so you can still reorder with the arrows). In the trickier
// half-width pairing cases it falls back to pushing whatever is in the way.
function bandsOverlap(a, b){ return a.topU < b.topU + b.heightU && b.topU < a.topU + a.heightU; }
function nudgeGear(rackId, gearId, dir){
  var rack = getBay(rackId);
  if(!rack) return;
  var items = layoutRackGear(rack).items;
  var item = items.filter(function(it){ return it.gear.id === gearId; })[0];
  if(!item) return;
  var newTop = item.topU + dir;
  if(newTop < 0) return;
  var me = itemBox(item);
  var tryBox = {topU:newTop, heightU:me.heightU, width:me.width, side:me.side};
  var others = items.filter(function(it){ return it !== item; });
  var blockers = others.filter(function(it){ return gearsConflict(tryBox, itemBox(it)); });
  var swapped = false;
  if(blockers.length === 1){
    var B = blockers[0], bBox = itemBox(B);
    var meMates = others.filter(function(it){ return bandsOverlap(me, itemBox(it)); });
    var bMates = others.filter(function(it){ return it !== B && bandsOverlap(bBox, itemBox(it)); });
    if(!meMates.length && !bMates.length){
      if(dir > 0){ B.gear.topU = item.topU; item.gear.topU = item.topU + B.gear.heightU; }
      else { item.gear.topU = B.topU; B.gear.topU = B.topU + item.gear.heightU; }
      sortGearByPosition(rack);
      swapped = true;
    }
  }
  if(!swapped) applyPlan(rack, planPlacement(rack, [{gear:item.gear, topU:newTop, side:item.side}]));
  markDirty();
  renderGrid(); renderInspector();
}
// Slides everything up to remove the blank rows between pieces (pieces keep
// their order, and half-width pairs stay paired).
function closeGaps(rackId){
  var rack = getBay(rackId);
  if(!rack || rack.type !== "rack") return;
  var gaps = rackGapRows(rack);
  if(!gaps){ showToast("No gaps to close."); return; }
  var items = layoutRackGear(rack).items.slice().sort(byPos);
  var cursor = 0, last = null;
  items.forEach(function(it){
    var g = it.gear, top;
    if(last && g.width === "half" && last.gear.width === "half" && last.origTop === it.topU && last.gear.heightU === g.heightU && last.side !== it.side){
      top = last.newTop;
    } else {
      top = cursor;
      cursor = top + g.heightU;
    }
    last = {gear:g, side:it.side, origTop:it.topU, newTop:top};
    g.topU = top;
  });
  sortGearByPosition(rack);
  markDirty();
  renderAll();
  showToast("Closed " + gaps + "U of gaps.", "success");
}
function resizeRack(rackId, newHeight){
  var rack = getBay(rackId);

  rack.heightU = clampRackHeight(newHeight);
  markDirty();
  renderAll();
}
// Moves one or more gear pieces to a new spot, within their own rack or into
// a different one. `placements` gives each moved piece's destination
// ({gear, topU, side}); anything in the way is pushed down. Non-destructive:
// a move that pushes pieces past the end of the rack just gets the usual red
// overflow flag. The hole left behind in the source rack stays a gap.
function moveGearsToSlot(fromRackId, gearIds, toRackId, placements){
  var fromRack = getBay(fromRackId), toRack = getBay(toRackId);
  if(!fromRack || !toRack || fromRack.type !== "rack" || toRack.type !== "rack") return;
  var set = {}; gearIds.forEach(function(id){ set[id] = true; });
  var moved = fromRack.gear.filter(function(g){ return set[g.id]; });
  if(!moved.length || !placements.length) return;
  var before = Math.max(0, layoutRackGear(toRack).usedU - toRack.heightU);
  if(fromRack !== toRack){
    fromRack.gear = fromRack.gear.filter(function(g){ return !set[g.id]; });
    toRack.gear = toRack.gear.concat(moved);
  }
  applyPlan(toRack, planPlacement(toRack, placements));
  ui.selection = moved.map(function(g){ return g.id; });
  ui.anchor = moved[moved.length-1].id;
  ui.activeBay.rack = toRack.id;
  markDirty();
  renderAll();
  var after = Math.max(0, layoutRackGear(toRack).usedU - toRack.heightU);
  if(after > before) showToast("Pushed past the end of the rack — " + after + "U over, flagged in red.", "error");
}

/* ---------- gear clipboard (copy / paste / duplicate) ---------- */
var GEAR_CLIP_PREFIX = "patchsheet-gear:";
var GEAR_CLIPBOARD = []; // in-app fallback, in case the system clipboard is unavailable
function gearToClip(g){
  return {name:g.name, notes:g.notes, heightU:g.heightU, width:g.width, groupId:g.groupId || null};
}
function parseGearClip(text){
  if(typeof text !== "string" || text.indexOf(GEAR_CLIP_PREFIX) !== 0) return null;
  try{
    var data = JSON.parse(text.slice(GEAR_CLIP_PREFIX.length));
    if(!data || !Array.isArray(data.gear) || !data.gear.length) return null;
    return data.gear.filter(function(g){ return g && typeof g === "object"; });
  }catch(e){ return null; }
}
function copyGear(list, clipEvent){
  if(!list.length) return;
  GEAR_CLIPBOARD = list.map(gearToClip);
  var text = GEAR_CLIP_PREFIX + JSON.stringify({v:1, gear:GEAR_CLIPBOARD});
  if(clipEvent && clipEvent.clipboardData){
    clipEvent.clipboardData.setData("text/plain", text);
    clipEvent.preventDefault();
  } else {
    try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(function(){ /* ignore */ }); }catch(e){ /* ignore */ }
  }
  showToast("Copied " + list.length + " piece" + (list.length===1?"":"s") + " of gear.");
  renderGrid(); // so the rack toolbars pick up the Paste button
}
// Appends fresh copies (new ids) of the given gear to the bottom of a rack's
// stack (or into a gap if the stack's end is full) and selects them. Never blocked by fit — anything that doesn't fit just gets
// the same overflow flag as a resize or a drag.
function pasteGearIntoRack(rackId, items){
  var rack = getBay(rackId);
  if(!rack || rack.type !== "rack" || !items.length) return [];
  var created = items.map(function(src){
    var g = makeGear(src.name, src.notes, src.heightU, src.width);
    g.groupId = (src.groupId && getGroup(src.groupId)) ? src.groupId : null;
    return g;
  });
  created.forEach(function(g){
    var slot = findAppendSlot(rack, g.heightU, g.width, true);
    g.topU = slot.topU; g.side = slot.side;
    rack.gear.push(g); // pushed one at a time so the next piece sees this one
  });
  sortGearByPosition(rack);
  ui.activeBay.rack = rack.id;
  ui.selection = created.map(function(g){ return g.id; });
  ui.anchor = created[created.length-1].id;
  markDirty();
  renderAll();
  var over = Math.max(0, layoutRackGear(rack).usedU - rack.heightU);
  showToast("Pasted " + created.length + " piece" + (created.length===1?"":"s") + (over ? " — " + over + "U over this rack's height, flagged in red." : "."), over ? "error" : undefined);
  return created;
}
function duplicateGear(rackId, list){
  return pasteGearIntoRack(rackId, list.map(gearToClip));
}
function makeBay(type, name, size){
  var id = type + "-" + uid();
  var baySize = type === "trs" ? normalizeTrsSize(size) : null;
  var bay = {id:id, type:type, name:name, size: baySize};
  if(type === "rack"){
    bay.heightU = clampRackHeight(size);
    bay.gear = [];
  } else {
    bay.ports = makePorts(id, type, baySize);
    if(type === "trs") bay.columns = makeColumns(baySize);
  }
  return bay;
}
function createDefaultState(){
  return {
    version: 1,
    bays: [ makeBay("xlr","XLR Bay 1"), makeBay("trs","TRS 48pt Bay 1", 48) ],
    groups: []
  };
}
function normalizeState(raw){
  var base = createDefaultState();
  if(!raw || typeof raw !== "object" || !Array.isArray(raw.bays)) return base;
  var groups = Array.isArray(raw.groups) ? raw.groups.filter(function(g){return g && g.id && g.name;}).map(function(g){
    return {id:String(g.id), name:String(g.name), color:String(g.color||"#888888")};
  }) : [];
  var groupIds = {}; groups.forEach(function(g){ groupIds[g.id] = true; });
  var bays = raw.bays.filter(function(b){ return b && (b.type==="xlr"||b.type==="trs"||b.type==="rack"); }).map(function(b){
    if(b.type === "rack"){
      var gearList = Array.isArray(b.gear) ? b.gear.map(function(g){
        return {
          id: (g && g.id) ? String(g.id) : ("gear-"+uid()),
          name: (g && typeof g.name === "string") ? g.name.slice(0,60) : "",
          notes: (g && typeof g.notes === "string") ? g.notes : "",
          heightU: clampGearHeight(g && g.heightU),
          width: (g && g.width === "half") ? "half" : "full",
          groupId: (g && g.groupId && groupIds[g.groupId]) ? g.groupId : null,
          topU: (g && typeof g.topU === "number") ? g.topU : null,   // older files have no positions
          side: (g && g.side === "right") ? "right" : "left"
        };
      }) : [];
      var rackOut = {id: b.id || ("rack-"+uid()), type:"rack", name: String(b.name || "Rack"), size:null, heightU: clampRackHeight(b.heightU), gear: gearList};
      repairRack(rackOut);
      return rackOut;
    }
    var size = b.type === "trs" ? normalizeTrsSize(b.size) : null;
    var expected = makePorts(b.id || (b.type+"-"+uid()), b.type, size);
    var byId = {};
    (Array.isArray(b.ports)?b.ports:[]).forEach(function(p){ if(p && p.id) byId[p.id] = p; });
    var ports = expected.map(function(ep){
      var p = byId[ep.id];
      if(!p) return ep;
      return {
        id: ep.id, row: ep.row, index: ep.index,
        label: typeof p.label === "string" ? p.label : "",
        notes: typeof p.notes === "string" ? p.notes : "",
        groupId: (p.groupId && groupIds[p.groupId]) ? p.groupId : null
      };
    });
    var out = {id: b.id || (b.type+"-"+uid()), type:b.type, name: String(b.name || (b.type.toUpperCase()+" Bay")), size: size, ports: ports};
    if(b.type === "trs"){
      var expectedCols = makeColumns(size);
      var colByIndex = {};
      (Array.isArray(b.columns) ? b.columns : []).forEach(function(c){
        if(c && typeof c.index === "number") colByIndex[c.index] = c;
      });
      out.columns = expectedCols.map(function(ec){
        var c = colByIndex[ec.index];
        var state = (c && ROUTING_STATES.indexOf(c.state) !== -1) ? c.state : "normal";
        return {index: ec.index, state: state};
      });
    }
    return out;
  });
  if(bays.length === 0) return base;
  return {version:1, bays:bays, groups:groups};
}

/* ---------- persistence (local draft, best-effort) ---------- */
function saveLocalDraft(){
  try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); }catch(e){ /* ignore */ }
}
var scheduleLocalSave = debounce(function(){
  saveLocalDraft();
  setSaveStatus(false);
}, 500);
function markDirty(){
  recordHistory();

}

/* ---------- undo / redo ---------- */
// Every edit already funnels through markDirty(), so history is a stack of
// whole-project JSON snapshots taken there. Edits that land within a short
// window of each other (typing a name, nudging a few ports) merge into one
// undo step, so ⌘Z steps back by "something you did", not by keystroke.
var HISTORY_MAX = 100, HISTORY_BURST_MS = 600;
var undoStack = [], redoStack = [], historyCurrent = null, historyLastChange = 0, historyApplying = false;
function snapshotState(){ return JSON.stringify(state); }
function updateUndoButtons(){
  var u = document.getElementById("undoBtn"), r = document.getElementById("redoBtn");
  if(u) u.disabled = !undoStack.length;
  if(r) r.disabled = !redoStack.length;
}
function resetHistory(){
  undoStack = []; redoStack = [];
  historyCurrent = snapshotState();
  historyLastChange = 0;
  updateUndoButtons();
}
function historyBreak(){ historyLastChange = 0; }
function recordHistory(){
  if(historyApplying) return;
  var snap = snapshotState();
  if(historyCurrent === null){ historyCurrent = snap; return; }
  if(snap === historyCurrent) return;
  var now = Date.now();
  if(now - historyLastChange > HISTORY_BURST_MS){
    undoStack.push(historyCurrent);
    if(undoStack.length > HISTORY_MAX) undoStack.shift();
  }
  historyLastChange = now;
  historyCurrent = snap;
  redoStack = [];
  updateUndoButtons();
}
function applySnapshot(snap){
  historyApplying = true;
  state = JSON.parse(snap);
  historyCurrent = snap;
  historyLastChange = 0;
  clearSelectionSilently();
  historyApplying = false;
  setSaveStatus(true);
  scheduleLocalSave();
  renderAll();
  updateUndoButtons();
}
function undo(){
  if(!undoStack.length){ showToast("Nothing to undo."); return; }
  redoStack.push(historyCurrent);
  applySnapshot(undoStack.pop());
  showToast("Undid last change.");
}
function redo(){
  if(!redoStack.length){ showToast("Nothing to redo."); return; }
  undoStack.push(historyCurrent);
  applySnapshot(redoStack.pop());
  showToast("Redid change.");
}
function setSaveStatus(dirty){
  var el = document.getElementById("saveStatus");
  var txt = document.getElementById("saveStatusText");
  if(!el) return;
  el.classList.toggle("dirty", dirty);
  txt.textContent = dirty ? "Saving to this device…" : "Saved on this device";
}
function loadLocalDraft(){
  try{
    var raw = localStorage.getItem(LOCAL_KEY);
    if(!raw) return null;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.bays)) return null;
    return parsed;
  }catch(e){ return null; }
}

/* ---------- downloads capability (safe wrapper) ---------- */
var _downloadsPromise = null;
function getDownloads(){
  if(!_downloadsPromise){
    _downloadsPromise = (window.claude && typeof window.claude.use === "function")
      ? window.claude.use("downloads").catch(function(){ return null; })
      : Promise.resolve(null);
  }
  return _downloadsPromise;
}
function mimeForFilename(filename){
  var ext = String(filename).split(".").pop().toLowerCase();
  return {
    png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg",
    json: "application/json", csv: "text/csv", txt: "text/plain"
  }[ext] || "application/octet-stream";
}
function classicDownload(filename, data){
  // Fallback for contexts with no downloads capability (e.g. this file hosted
  // outside claude.ai, such as on GitHub Pages, or opened directly as a file).
  try{
    var blob = (data instanceof Blob) ? data : new Blob([data], {type: mimeForFilename(filename)});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    showToast("Saved " + filename, "success");
    return true;
  } catch(e){
    showToast("Couldn't save the file.", "error");
    return false;
  }
}
function saveFile(filename, data){
  return getDownloads().then(function(dl){
    if(!dl){ return classicDownload(filename, data); }
    return dl.save({filename: filename, data: data}).then(function(){
      showToast("Saved " + filename, "success");
      return true;
    }).catch(function(err){
      var code = err && err.code;
      if(code === "declined") return false;
      if(code === "extension_not_enabled" && /\.csv$/i.test(filename)){
        var fallback = filename.replace(/\.csv$/i, ".txt");
        return dl.save({filename: fallback, data: data}).then(function(){
          showToast("CSV isn't enabled in this view — saved " + fallback + " instead. Rename the extension to .csv to open it in a spreadsheet.", "info");
          return true;
        }).catch(function(){
          showToast("Couldn't save the file.", "error");
          return false;
        });
      }
      showToast("Couldn't save the file" + (err && err.message ? ": " + err.message : "."), "error");
      return false;
    });
  });
}

  clearTimeout(toastTimer);

/* ---------- bay helpers ---------- */
function baysOfType(type){ return state.bays.filter(function(b){ return b.type === type; }); }
function getBay(id){ return state.bays.filter(function(b){ return b.id === id; })[0] || null; }
function ensureActiveBay(type){
  var list = baysOfType(type);
  var cur = ui.activeBay[type];
  if(cur && list.some(function(b){return b.id===cur;})) return cur;
  ui.activeBay[type] = list.length ? list[0].id : null;
  return ui.activeBay[type];
}
function getActiveBay(){
  var id = ensureActiveBay(ui.section);
  return id ? getBay(id) : null;
}
function nextBayName(type, size){
  var label = type === "xlr" ? "XLR Bay " : type === "trs" ? ("TRS " + normalizeTrsSize(size) + "pt Bay ") : "Rack ";
  var sameKind = type === "xlr" ? baysOfType("xlr")
    : type === "trs" ? baysOfType("trs").filter(function(b){ return normalizeTrsSize(b.size) === normalizeTrsSize(size); })
    : baysOfType("rack");
  var n = sameKind.length + 1;
  var name = label + n;
  while(state.bays.some(function(b){return b.name===name;})){ n++; name = label + n; }
  return name;
}
function addBay(type, size){
  var baySize = type === "trs" ? normalizeTrsSize(size) : type === "rack" ? clampRackHeight(size) : null;
  var bay = makeBay(type, nextBayName(type, baySize), baySize);

  clearSelection();
  markDirty();
  renderAll();
}
function renameBay(bayId, name){

  if(!bay) return;
  bay.name = name.trim() || bay.name;
  markDirty();
  renderAll();
}
function deleteBay(bayId){
  var bay = getBay(bayId);

  var type = bay.type;
  state.bays = state.bays.filter(function(b){ return b.id !== bayId; });

}

/* ---------- group helpers ---------- */
function getGroup(id){ return state.groups.filter(function(g){return g.id===id;})[0] || null; }
function nextPaletteColor(){

function groupsUsedInBay(bay){

function groupsUsedAcrossBays(bays){

/* ---------- selection ---------- */
function clearSelection(){ ui.selection = []; ui.anchor = null; renderInspector(); }
function selectPort(bay, portId, mods){
  var order = bay.ports.map(function(p){return p.id;});
  var idx = order.indexOf(portId);
  if(idx === -1) return;
  if(mods.shift && ui.anchor && order.indexOf(ui.anchor) !== -1){
    var a = order.indexOf(ui.anchor);
    var lo = Math.min(a, idx), hi = Math.max(a, idx);
    ui.selection = order.slice(lo, hi+1);
  } else if(mods.ctrl){
    var pos = ui.selection.indexOf(portId);
    if(pos === -1){ ui.selection.push(portId); } else { ui.selection.splice(pos,1); }
    ui.anchor = portId;
  } else {
    ui.selection = [portId];
    ui.anchor = portId;
  }
  renderGrid();
  renderInspector();
}
function selectedPorts(bay){
  if(!bay) return [];
  var set = {}; ui.selection.forEach(function(id){ set[id]=true; });
  return bay.ports.filter(function(p){ return set[p.id]; });
}
function selectColumn(bay, colIndex){
  var ids = bay.ports.filter(function(p){
    return (p.row === "top" || p.row === "bottom") && p.index === colIndex;
  }).map(function(p){ return p.id; });
  if(!ids.length) return;
  ui.selection = ids;
  ui.anchor = ids[0];
  renderGrid();
  renderInspector();
}

      '<button type="button" class="icon-btn" data-act="rename" data-bay="'+b.id+'" title="Rename bay" aria-label="Rename '+escapeAttr(b.name)+'">✎</button>'+
      '<button type="button" class="icon-btn" data-act="delete" data-bay="'+b.id+'" title="Delete bay" aria-label="Delete '+escapeAttr(b.name)+'">×</button>'+
      '</div>';
  }).join("");
  Array.prototype.forEach.call(host.querySelectorAll('[data-act="select"]'), function(btn){
    btn.addEventListener("click", function(){
      var bayId = btn.getAttribute("data-bay");
      ui.activeBay[ui.section] = bayId;
      clearSelectionSilently();
      renderAll();
      var panel = document.getElementById("bayPanel-"+bayId);
      if(panel) panel.scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-act="rename"]'), function(btn){
    btn.addEventListener("click", function(){

      var bay = getBay(id);

      wrap.innerHTML = '<input type="text" value="'+escapeAttr(bay.name)+'" style="width:120px" />';
      var input = wrap.querySelector("input");
      input.focus(); input.select();
      function commit(){ renameBay(id, input.value); }
      input.addEventListener("keydown", function(e){
        if(e.key==="Enter"){ e.preventDefault(); commit(); }
        else if(e.key==="Escape"){ renderAll(); }
      });
      input.addEventListener("blur", commit);
    });
  });
  Array.prototype.forEach.call(host.querySelectorAll('[data-act="delete"]'), function(btn){
    wireInlineConfirm(btn, function(){ deleteBay(btn.getAttribute("data-bay")); }, "Delete bay?");

// Drag a bay tab left/right to reorder it (within its own section). The
// order of state.bays drives tab order, the Full view, and the Master Sheet.
// Alt+←/→ on a focused tab does the same from the keyboard.
var TABDRAG = null; // bay id while a tab is being dragged
function clearTabDropMarks(host){
  Array.prototype.forEach.call(host.querySelectorAll(".bay-tab"), function(t){ t.classList.remove("drop-before","drop-after","is-dragging"); });
}
function reorderBay(dragId, targetId, after){
  if(dragId === targetId) return false;
  var from = state.bays.findIndex(function(b){ return b.id === dragId; });
  if(from === -1) return false;
  var moved = state.bays.splice(from, 1)[0];
  var to = state.bays.findIndex(function(b){ return b.id === targetId; });
  if(to === -1){ state.bays.splice(from, 0, moved); return false; }
  state.bays.splice(after ? to + 1 : to, 0, moved);
  var changed = state.bays.findIndex(function(b){ return b.id === dragId; }) !== from;
  if(!changed) return false;
  markDirty();
  renderAll();
  return true;
}
function wireBayTabReorder(host){
  Array.prototype.forEach.call(host.querySelectorAll(".bay-tab"), function(tab){
    var id = tab.getAttribute("data-bay");
    tab.addEventListener("dragstart", function(e){
      if(!tab.draggable){ e.preventDefault(); return; }
      TABDRAG = id;
      tab.classList.add("is-dragging");
      if(e.dataTransfer){
        e.dataTransfer.effectAllowed = "move";
        try{ e.dataTransfer.setData("text/plain", id); }catch(err){ /* ignore */ }
      }
    });
    tab.addEventListener("dragend", function(){ TABDRAG = null; clearTabDropMarks(host); });
    tab.addEventListener("dragover", function(e){
      if(!TABDRAG || TABDRAG === id) return;
      e.preventDefault();
      if(e.dataTransfer) e.dataTransfer.dropEffect = "move";
      var r = tab.getBoundingClientRect();
      var after = e.clientX > r.left + r.width / 2;
      Array.prototype.forEach.call(host.querySelectorAll(".bay-tab"), function(t){
        t.classList.toggle("drop-before", t === tab && !after);
        t.classList.toggle("drop-after", t === tab && after);
      });
    });
    tab.addEventListener("dragleave", function(e){
      if(e.target === tab) tab.classList.remove("drop-before","drop-after");
    });
    tab.addEventListener("drop", function(e){
      if(!TABDRAG) return;
      e.preventDefault();
      var r = tab.getBoundingClientRect();
      var after = e.clientX > r.left + r.width / 2;
      var dragId = TABDRAG;
      TABDRAG = null;
      clearTabDropMarks(host);
      reorderBay(dragId, id, after);
    });
    var nameBtn = tab.querySelector('[data-act="select"]');
    if(nameBtn) nameBtn.addEventListener("keydown", function(e){
      if(!e.altKey || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
      var list = baysOfType(ui.section);
      var i = list.findIndex(function(b){ return b.id === id; });
      var other = list[i + (e.key === "ArrowLeft" ? -1 : 1)];
      if(!other) return;
      e.preventDefault();
      if(reorderBay(id, other.id, e.key === "ArrowRight")){
        var again = document.querySelector('#bayTabs .bay-tab[data-bay="'+cssEscape(id)+'"] [data-act="select"]');
        if(again) again.focus();
      }
    });
  });
}

function wireInlineConfirm(btn, onConfirm, label){
  btn.addEventListener("click", function(){
    if(btn.dataset.confirming === "1"){ return; }
    btn.dataset.confirming = "1";
    var wrap = document.createElement("span");
    wrap.className = "confirm-inline";
    wrap.innerHTML = '<span>'+escapeHtml(label)+'</span>' +
      '<button type="button" class="btn btn-sm btn-danger" data-c="yes">Delete</button>' +
      '<button type="button" class="btn btn-sm btn-ghost" data-c="no">Cancel</button>';
    btn.replaceWith(wrap);
    wrap.querySelector('[data-c="yes"]').addEventListener("click", onConfirm);
    wrap.querySelector('[data-c="no"]').addEventListener("click", function(){ renderAll(); });
  });
}

/* ---------- rendering: rack panel ---------- */
function portCellHtml(bay, p, selectedSet){
  var group = p.groupId ? getGroup(p.groupId) : null;
  var cls = "port";
  if(selectedSet[p.id]) cls += " is-selected";
  if(ui.anchor === p.id) cls += " is-anchor";
  if(ui.highlightGroup && p.groupId !== ui.highlightGroup) cls += " is-dim";
  var style = 'border-color:' + (group ? group.color : "var(--border-strong)") + ';' +
              (group ? 'border-width:3px;' : '');
  var label = p.label ? '<span class="lbl">'+escapeHtml(p.label)+'</span>' : '<span class="lbl placeholder">—</span>';
  var note = p.notes ? '<span class="note-dot" aria-hidden="true"></span>' : '';
  var title = (p.label || "Unlabeled") + (group ? " · " + group.name : "") + (p.notes ? " · " + p.notes : "");
  return '<button type="button" class="'+cls+'" style="'+style+'" data-port="'+p.id+'" title="'+escapeAttr(title)+'">' +
    '<span class="idx">'+ (p.row ? p.row.slice(0,1).toUpperCase()+p.index : p.index) +'</span>' +
    label + note + '</button>';
}
// A TRS bay's logical TOP/BOTTOM rows are grouped into "strips" — each strip
// is one top row directly stacked over its matching bottom row, so a column's
// two jacks are always vertically adjacent (with a routing-state indicator
// in between). A 48pt bay is one 24-wide strip; a 64pt bay is built from two
// ganged 16-wide strips (1–16, 17–32), matching how the hardware is actually
// wired and keeping cells from shrinking to fit 32 in a single row.
function trsStrips(bay){
  var top = bay.ports.filter(function(p){return p.row==="top";});
  var bottom = bay.ports.filter(function(p){return p.row==="bottom";});
  if(bay.size === 64){
    return [
      {topTag:"TOP 1–16", bottomTag:"BOTTOM 1–16", top: top.slice(0,16), bottom: bottom.slice(0,16), colStart:0},
      {topTag:"TOP 17–32", bottomTag:"BOTTOM 17–32", top: top.slice(16,32), bottom: bottom.slice(16,32), colStart:16}
    ];
  }
  return [{topTag:"TOP", bottomTag:"BOTTOM", top: top, bottom: bottom, colStart:0}];
}
// Flattened top/bottom row list in the same strip order, for the canvas
// export layout math (which lays out rows independent of the glyph strip).
function trsVisualRows(bay){
  var strips = trsStrips(bay);
  var rows = [];
  strips.forEach(function(s, i){
    rows.push({tag:s.topTag, ports:s.top, sectionEnd:false});
    rows.push({tag:s.bottomTag, ports:s.bottom, sectionEnd: i < strips.length-1});
  });
  return rows;
}
function chunkedCellsHtml(count, cellFn){
  var CHUNK = 8, out = "";
  for(var i=0;i<count;i++){
    out += cellFn(i);
    if((i+1) % CHUNK === 0 && (i+1) !== count){
      out += '<span class="chunk-gap" aria-hidden="true"></span>';
    }
  }
  return out;
}
function portCellsHtml(bay, ports, set){
  return chunkedCellsHtml(ports.length, function(i){ return portCellHtml(bay, ports[i], set); });
}
function routingGlyphHtml(state){
  if(state === "half-normal") return '<span class="bridge half-normal" aria-hidden="true"></span>';
  if(state === "thru") return '<span class="bridge thru" aria-hidden="true">×</span>';
  return '<span class="bridge normal" aria-hidden="true"></span>';
}
function glyphCellHtml(bay, colIndex){
  var col = getColumn(bay, colIndex);
  var state = col ? col.state : "normal";
  var label = ROUTING_LABELS[state] || "Normal";
  return '<button type="button" class="glyph-cell" data-col="'+colIndex+'" ' +
    'title="Column '+colIndex+' — '+label+'" aria-label="Column '+colIndex+' routing: '+label+'">' +
    routingGlyphHtml(state) + '</button>';
}
function glyphCellsHtml(bay, strip){
  return chunkedCellsHtml(strip.top.length, function(i){ return glyphCellHtml(bay, strip.colStart + i + 1); });
}
function bayPanelInnerHtml(bay){
  if(bay.type === "rack") return rackPanelInnerHtml(bay);
  var set = {}; ui.selection.forEach(function(id){ set[id]=true; });
  var html = '<span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span>';
  var subtitle = bay.type==="xlr" ? "16 × XLR-F Passthrough" : (bay.size + "-Point TRS Bantam");
  html += '<div class="panel-head"><span class="panel-title">'+escapeHtml(bay.name)+'</span>' +
    '<span class="panel-sub">'+subtitle+'</span></div>';
  if(bay.type === "xlr"){
    html += '<div class="port-row xlr-row">' + portCellsHtml(bay,bay.ports,set) + '</div>';
  } else {
    trsStrips(bay).forEach(function(strip){
      var colClass = "trs-cols-" + strip.top.length;
      html += '<div class="trs-strip">';
      html += '<div class="trs-row"><span class="row-tag">'+strip.topTag+'</span>' +
        '<div class="port-row '+colClass+'">'+portCellsHtml(bay,strip.top,set)+'</div></div>';
      html += '<div class="trs-row trs-row--glyphs"><span class="row-tag"></span>' +
        '<div class="port-row '+colClass+' glyph-row">'+glyphCellsHtml(bay,strip)+'</div></div>';
      html += '<div class="trs-row"><span class="row-tag">'+strip.bottomTag+'</span>' +
        '<div class="port-row '+colClass+'">'+portCellsHtml(bay,strip.bottom,set)+'</div></div>';
      html += '</div>';
    });

  return html;
}
/* ---------- rendering: rack elevation ---------- */
var RACK_RU_PX = 40; // on-screen pixel height of one rack unit — must match the
                      // --ru custom property set inline on .rack-elevation below.
function gearCellHtml(item, selectedSet, rackHeightU){
  var g = item.gear;
  var group = g.groupId ? getGroup(g.groupId) : null;
  var isOver = (item.topU + g.heightU) > rackHeightU;
  var cls = "gear-piece";
  if(selectedSet[g.id]) cls += " is-selected";
  if(isOver) cls += " is-overflow";
  if(ui.highlightGroup && g.groupId !== ui.highlightGroup) cls += " is-dim";
  var top = item.topU * RACK_RU_PX;
  var height = g.heightU * RACK_RU_PX;
  var styleParts = ["top:"+(top+2)+"px", "height:"+(height-4)+"px"];
  if(isOver){
    styleParts.push("border-color:var(--danger)", "border-style:dashed");
  } else {
    styleParts.push("border-color:" + (group ? group.color : "var(--border-strong)"));
    if(group) styleParts.push("border-width:3px");
  }
  if(item.side === "left"){ styleParts.push("left:2px", "width:calc(50% - 3px)"); }
  else if(item.side === "right"){ styleParts.push("right:2px", "width:calc(50% - 3px)"); }
  else { styleParts.push("left:2px", "right:2px"); }
  var nameHtml = g.name ? '<span class="gear-name">'+escapeHtml(g.name)+'</span>' : '<span class="gear-name placeholder">Unnamed</span>';
  var note = g.notes ? '<span class="note-dot" aria-hidden="true"></span>' : '';
  var warnBadge = isOver ? '<span class="gear-warn" aria-hidden="true">⚠</span>' : '';
  var title = (g.name || "Unnamed") + " · " + g.heightU + "U" + (g.width==="half"?" half-width":"") + (group ? " · " + group.name : "") + (g.notes ? " · " + g.notes : "") + (isOver ? " · Doesn't fit — rack is only "+rackHeightU+"U" : "");
  return '<button type="button" draggable="true" class="'+cls+'" style="'+styleParts.join(";")+'" data-gear="'+g.id+'" title="'+escapeAttr(title)+'">' +
    '<span class="gear-u">'+g.heightU+'U</span>' + warnBadge + nameHtml + note + '</button>';
}
function rackPanelInnerHtml(bay){
  var set = {}; ui.selection.forEach(function(id){ set[id]=true; });
  var layout = layoutRackGear(bay);
  var overflowU = Math.max(0, layout.usedU - bay.heightU);
  var totalRows = Math.max(bay.heightU, layout.usedU);
  var html = '<span class="screw tl"></span><span class="screw tr"></span><span class="screw bl"></span><span class="screw br"></span>';
  html += '<div class="panel-head"><span class="panel-title">'+escapeHtml(bay.name)+'</span>' +
    '<span class="panel-sub">'+bay.heightU+'U Rack Frame</span></div>';
  var freeHtml = overflowU > 0
    ? '<span class="rack-free rack-free--over">⚠ '+overflowU+'U over — doesn’t fit</span>'
    : '<span class="rack-free">'+rackFreeU(bay)+'U free</span>';
  html += '<div class="rack-toolbar">' +
    '<button type="button" class="btn btn-sm" data-act="add-gear">+ Add gear</button>' +
    '<button type="button" class="btn btn-sm btn-ghost" data-act="resize-rack">Resize</button>' +
    (rackGapRows(bay) ? '<button type="button" class="btn btn-sm btn-ghost" data-act="close-gaps" title="Slide pieces up to remove the blank rows between them">Close gaps</button>' : '') +
    (GEAR_CLIPBOARD.length ? '<button type="button" class="btn btn-sm btn-ghost" data-act="paste-gear" title="Paste copied gear at the end of this rack">Paste '+GEAR_CLIPBOARD.length+'</button>' : '') +
    freeHtml +
    '</div>';
  var rail = "";
  for(var i=1;i<=totalRows;i++){
    rail += '<div class="ru-num'+(i>bay.heightU?" ru-num--over":"")+'" style="height:'+RACK_RU_PX+'px">'+i+'</div>';
  }
  var gearHtml = layout.items.map(function(item){ return gearCellHtml(item, set, bay.heightU); }).join("");
  var overflowLine = overflowU > 0
    ? '<div class="rack-overflow-line" style="top:'+(bay.heightU*RACK_RU_PX)+'px"><span>RACK ENDS HERE</span></div>'
    : "";
  html += '<div class="rack-elevation-wrap">' +
    '<div class="rack-rail">'+rail+'</div>' +
    '<div class="rack-elevation" style="height:'+(totalRows*RACK_RU_PX)+'px; --ru:'+RACK_RU_PX+'px;">'+gearHtml+overflowLine+'</div>' +
    '</div>';
  return html;
}
// In Full view, several bays render at once — a click in any of them makes
// that bay "active" (and drops any stale selection from whichever bay was
// active before) so the Inspector and bay tabs stay pointed at the bay you
// actually clicked in.
function ensureBayActive(bay){
  if(ui.activeBay[bay.type] !== bay.id){
    ui.activeBay[bay.type] = bay.id;
    ui.selection = []; ui.anchor = null;
    renderBayTabs();
  }
}
// Click = select one piece; Shift-click = range from the anchor (in rack
// order); ⌘/Ctrl-click = add or remove a single piece.
function selectGear(bay, gearId, mods){
  mods = mods || {};
  var order = bay.gear.map(function(g){ return g.id; });
  var idx = order.indexOf(gearId);
  if(idx === -1) return;
  if(mods.shift && ui.anchor && order.indexOf(ui.anchor) !== -1){
    var a = order.indexOf(ui.anchor);
    ui.selection = order.slice(Math.min(a, idx), Math.max(a, idx) + 1);
  } else if(mods.ctrl){
    var pos = ui.selection.indexOf(gearId);
    if(pos === -1){ ui.selection.push(gearId); } else { ui.selection.splice(pos, 1); }
    ui.anchor = gearId;
  } else {
    ui.selection = [gearId];
    ui.anchor = gearId;
  }
  renderGrid();
  renderInspector();
}
function selectedGear(bay){
  if(!bay || bay.type !== "rack") return [];
  var set = {}; ui.selection.forEach(function(id){ set[id]=true; });
  return bay.gear.filter(function(g){ return set[g.id]; });
}
function wireBayPanelEvents(container, bay){
  if(bay.type === "rack"){
    Array.prototype.forEach.call(container.querySelectorAll(".gear-piece"), function(btn){
      btn.addEventListener("click", function(e){
        ensureBayActive(bay);
        selectGear(bay, btn.getAttribute("data-gear"), {shift:e.shiftKey, ctrl:e.ctrlKey||e.metaKey});
      });
    });
    var pasteBtn = container.querySelector('[data-act="paste-gear"]');
    if(pasteBtn){
      pasteBtn.addEventListener("click", function(){
        ensureBayActive(bay);
        pasteGearIntoRack(bay.id, GEAR_CLIPBOARD);
      });
    }
    var addBtn = container.querySelector('[data-act="add-gear"]');
    if(addBtn){
      addBtn.addEventListener("click", function(){
        ensureBayActive(bay);
        openAddGearModal(bay.id);
      });
    }
    var gapsBtn = container.querySelector('[data-act="close-gaps"]');
    if(gapsBtn){
      gapsBtn.addEventListener("click", function(){
        ensureBayActive(bay);
        closeGaps(bay.id);
      });
    }
    var resizeBtn = container.querySelector('[data-act="resize-rack"]');
    if(resizeBtn){
      resizeBtn.addEventListener("click", function(){
        ensureBayActive(bay);
        openResizeRackModal(bay.id);
      });
    }
    // Double-click an empty spot in the elevation to add gear right there
    // (the "+ Add gear" button still adds at the bottom of the stack) —
    // ignored when the double-click lands on an existing piece (that's
    // handled by the click-to-select above).
    var elevation = container.querySelector(".rack-elevation");
    if(elevation){
      elevation.addEventListener("dblclick", function(e){
        if(e.target.closest(".gear-piece")) return;
        ensureBayActive(bay);
        var rect = elevation.getBoundingClientRect();
        var row = Math.max(0, Math.floor((e.clientY - rect.top) / RACK_RU_PX));
        var side = (e.clientX - rect.left) < rect.width / 2 ? "left" : "right";
        openAddGearModal(bay.id, {topU: row, side: side});
      });
    }
    return;
  }
  Array.prototype.forEach.call(container.querySelectorAll(".port"), function(btn){
    btn.addEventListener("click", function(e){
      ensureBayActive(bay);
      selectPort(bay, btn.getAttribute("data-port"), {shift:e.shiftKey, ctrl:e.ctrlKey||e.metaKey});
    });
  });
  Array.prototype.forEach.call(container.querySelectorAll(".glyph-cell"), function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      ensureBayActive(bay);
      selectColumn(bay, Number(btn.getAttribute("data-col")));
    });
  });
}
function renderGrid(){
  renderGroupChips();

  if(ui.viewMode === "compare" && ui.section === "rack"){ renderGridCompare(host); }
  else if(ui.viewMode === "full"){ renderGridFull(host); }

}
function emptySectionHtml(){

}
function renderGridCompact(host){

function renderGridFull(host){

// Compare view: the active rack side by side with a second, pickable rack —
// the only place two different racks' elevations are guaranteed to be on
// screen together, so it's where cross-rack dragging actually makes sense.
function renderGridCompare(host){
  var racks = baysOfType("rack");
  if(!racks.length){
    host.innerHTML = emptySectionHtml();

  ensureActiveBay("rack");
  var leftBay = getBay(ui.activeBay.rack);

    host.innerHTML = emptySectionHtml();

    host.innerHTML =
      '<div class="compare-wrap">' +
        '<div class="rack-panel" data-bay-id="'+leftBay.id+'">' + bayPanelInnerHtml(leftBay) + '</div>' +
        '<p class="insp-empty" style="margin-top:4px;">Add a second rack to drag gear between racks.</p>' +
      '</div>';
