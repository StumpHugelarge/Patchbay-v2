  if(!ui.compareRackId || !others.some(function(r){ return r.id === ui.compareRackId; })){
    ui.compareRackId = others[0].id;
  }
  var rightBay = getBay(ui.compareRackId);
  var pickerHtml = '<div class="compare-picker"><label for="compareRackSelect">Comparing with</label>' +
    '<select id="compareRackSelect">' + others.map(function(r){
      return '<option value="'+r.id+'"'+(r.id===ui.compareRackId?" selected":"")+'>'+escapeHtml(r.name)+'</option>';
    }).join("") + '</select></div>';
  host.innerHTML =
    '<div class="compare-wrap">' +
      '<div class="rack-panel" data-bay-id="'+leftBay.id+'">' + bayPanelInnerHtml(leftBay) + '</div>' +
      '<div class="compare-right">' + pickerHtml +
        '<div class="rack-panel" data-bay-id="'+rightBay.id+'">' + bayPanelInnerHtml(rightBay) + '</div>' +
      '</div>' +
    '</div>';
  var panels = host.querySelectorAll(".rack-panel");
  wireBayPanelEvents(panels[0], leftBay);
  wireBayPanelEvents(panels[1], rightBay);
  document.getElementById("compareRackSelect").addEventListener("change", function(e){
    ui.compareRackId = e.target.value;
    renderGrid();
  });
  wireGearDragAndDrop(host);
}

/* ---------- drag and drop: reorder gear within or between racks ---------- */
var DRAG = null; // {fromRackId, gearIds, anchorId, grabOffsetU} while gear is being dragged
function clearDropIndicator(){
  Array.prototype.forEach.call(document.querySelectorAll(".drop-ghost"), function(n){ n.remove(); });
}
// One dashed "ghost" box per piece being dragged, snapped to the row it would
// land on; amber when dropping there would push other pieces down.
function showDropGhosts(elevation, placements, pushed){
  clearDropIndicator();
  placements.forEach(function(pl){
    var el = document.createElement("div");
    el.className = "drop-ghost" + (pushed ? " is-push" : "");
    el.style.top = (pl.topU * RACK_RU_PX + 2) + "px";
    el.style.height = (pl.gear.heightU * RACK_RU_PX - 4) + "px";
    if(pl.side === "left"){ el.style.left = "2px"; el.style.width = "calc(50% - 3px)"; }
    else if(pl.side === "right"){ el.style.right = "2px"; el.style.width = "calc(50% - 3px)"; }
    else { el.style.left = "2px"; el.style.right = "2px"; }
    elevation.appendChild(el);
  });
}
// Where the dragged piece(s) would land for the pointer position in `e`:
// the grabbed piece's top edge follows the pointer (snapped to a U), the rest
// of a multi-selection keeps its spacing, everything is kept inside the rack
// rows currently shown, and a lone half-width piece takes the side the
// pointer is on (or pairs with a matching lone half-width piece).
function dragPlacements(rack, elevation, e){
  if(!DRAG) return null;
  var fromRack = getBay(DRAG.fromRackId);
  if(!fromRack) return null;
  var ids = {}; DRAG.gearIds.forEach(function(id){ ids[id] = true; });
  var src = layoutRackGear(fromRack).items.filter(function(it){ return ids[it.gear.id]; });
  if(!src.length) return null;
  var anchor = src.filter(function(it){ return it.gear.id === DRAG.anchorId; })[0] || src[0];
  var rect = elevation.getBoundingClientRect();
  var rel = src.map(function(it){ return {gear:it.gear, d:it.topU - anchor.topU, side:it.side}; });
  var minRel = Math.min.apply(null, rel.map(function(r){ return r.d; }));
  var maxRel = Math.max.apply(null, rel.map(function(r){ return r.d + r.gear.heightU; }));
  var lay = layoutRackGear(rack);
  var totalRows = Math.max(rack.heightU, lay.usedU);
  var pointerRow = Math.floor((e.clientY - rect.top) / RACK_RU_PX);
  var top = pointerRow - (DRAG.grabOffsetU || 0);
  top = Math.min(top, totalRows - maxRel);
  top = Math.max(top, -minRel);
  var placements = rel.map(function(r){ return {gear:r.gear, topU:top + r.d, side:r.side}; });
  if(placements.length === 1 && placements[0].gear.width === "half"){
    var pl = placements[0];
    pl.side = (e.clientX - rect.left) < rect.width / 2 ? "left" : "right";
    var others = lay.items.filter(function(it){ return !ids[it.gear.id]; });
    var snap = snapHalfPair(others, pl.topU, pl.gear.heightU);
    if(snap){ pl.topU = snap.topU; pl.side = snap.side; }
  }
  return placements;
}
// Wires native HTML5 drag-and-drop for every gear piece / rack elevation
// currently rendered under scopeEl. Works across however many rack panels
// are in scopeEl at once — one rack in Compact view, every rack in Full
// view, or the two side-by-side panels in Compare view — so a drag can
// land in a different rack's elevation whenever more than one is visible.
function wireGearDragAndDrop(scopeEl){
  Array.prototype.forEach.call(scopeEl.querySelectorAll(".gear-piece"), function(el){
    el.addEventListener("dragstart", function(e){
      var panel = el.closest(".rack-panel");
      if(!panel) return;
      var fromRackId = panel.getAttribute("data-bay-id");
      var gid = el.getAttribute("data-gear");
      // Grabbing a piece that's part of a multi-selection drags the whole
      // selection together; grabbing anything else drags just that piece.
      var ids = [gid];
      var fromBay = getBay(fromRackId);
      if(fromBay && fromRackId === ui.activeBay.rack){
        var selIds = selectedGear(fromBay).map(function(g){ return g.id; });
        if(selIds.length > 1 && selIds.indexOf(gid) !== -1) ids = selIds;
      }
      var r = el.getBoundingClientRect();
      var grab = Math.floor((e.clientY - r.top) / RACK_RU_PX);
      var item = fromBay ? layoutRackGear(fromBay).items.filter(function(it){ return it.gear.id === gid; })[0] : null;
      var hU = item ? item.gear.heightU : 1;
      DRAG = {fromRackId: fromRackId, gearIds: ids, anchorId: gid, grabOffsetU: Math.max(0, Math.min(hU - 1, isFinite(grab) ? grab : 0))};
      ids.forEach(function(id){
        var node = panel.querySelector('.gear-piece[data-gear="'+cssEscape(id)+'"]');
        if(node) node.classList.add("is-dragging");
      });
      if(e.dataTransfer){
        e.dataTransfer.effectAllowed = "move";
        try{ e.dataTransfer.setData("text/plain", ids.join(",")); }catch(err){ /* ignore */ }
      }
    });
    el.addEventListener("dragend", function(){
      Array.prototype.forEach.call(document.querySelectorAll(".gear-piece.is-dragging"), function(n){ n.classList.remove("is-dragging"); });
      clearDropIndicator();
      DRAG = null;
    });
  });
  Array.prototype.forEach.call(scopeEl.querySelectorAll(".rack-elevation"), function(elevation){
    elevation.addEventListener("dragover", function(e){
      if(!DRAG) return;
      var panel = elevation.closest(".rack-panel");
      if(!panel) return;
      var rack = getBay(panel.getAttribute("data-bay-id"));
      if(!rack) return;
      var placements = dragPlacements(rack, elevation, e);
      if(!placements) return;
      e.preventDefault();
      if(e.dataTransfer) e.dataTransfer.dropEffect = "move";
      showDropGhosts(elevation, placements, planPlacement(rack, placements).pushed > 0);
    });
    elevation.addEventListener("dragleave", function(e){
      if(e.target === elevation) clearDropIndicator();
    });
    elevation.addEventListener("drop", function(e){
      if(!DRAG) return;
      var panel = elevation.closest(".rack-panel");
      if(!panel){ DRAG = null; return; }
      var rack = getBay(panel.getAttribute("data-bay-id"));
      if(!rack){ DRAG = null; return; }
      e.preventDefault();
      var placements = dragPlacements(rack, elevation, e);
      var d = DRAG;
      clearDropIndicator();
      DRAG = null;
      if(placements) moveGearsToSlot(d.fromRackId, d.gearIds, rack.id, placements);
    });
  });
}

/* ---------- device-group spotlight chips ---------- */
// A slim row of the groups actually used in the current section. Clicking a
// chip dims every port / gear piece that isn't in that group; click it again
// (or another chip) to clear / switch.
function renderGroupChips(){
  var host = document.getElementById("groupChips");
  if(!host) return;
  var used = groupsUsedAcrossBays(baysOfType(ui.section));
  if(ui.highlightGroup && !used.some(function(g){ return g.id === ui.highlightGroup; })) ui.highlightGroup = null;
  if(!used.length){ host.hidden = true; host.innerHTML = ""; return; }
  host.hidden = false;
  host.innerHTML = '<span class="eyebrow">Spotlight group</span>' + used.map(function(g){
    var on = ui.highlightGroup === g.id;
    return '<button type="button" class="group-chip'+(on?" is-active":"")+'" data-group="'+g.id+'" aria-pressed="'+on+'">' +
      '<span class="swatch" style="background:'+g.color+'"></span>'+escapeHtml(g.name)+'</button>';
  }).join("") + (ui.highlightGroup ? '<button type="button" class="group-chip group-chip--clear" data-group="">Show all</button>' : '');
}
function setHighlightGroup(id){
  ui.highlightGroup = (id && ui.highlightGroup !== id) ? id : null;
  renderGrid();
}

/* ---------- rendering: inspector ---------- */
function groupOptionsHtml(selectedId){
  var opts = '<option value="">— No group —</option>';
  opts += state.groups.map(function(g){
    return '<option value="'+g.id+'"'+(g.id===selectedId?" selected":"")+'>'+escapeHtml(g.name)+'</option>';
  }).join("");
  return opts;
}
function routingSegHtml(activeState){
  return '<div class="segmented" id="routingSeg" role="group" aria-label="Column routing">' +
    ROUTING_STATES.map(function(s){
      return '<button type="button" class="seg-btn'+(activeState===s?' is-active':'')+'" data-state="'+s+'">'+ROUTING_LABELS[s]+'</button>';
    }).join("") +
    '</div>';
}
function gearWidthSegHtml(active, id){
  return '<div class="segmented" id="'+id+'" role="group" aria-label="Gear width">' +
    ["full","half"].map(function(w){
      return '<button type="button" class="seg-btn'+(active===w?' is-active':'')+'" data-width="'+w+'">'+(w==="full"?"Full width":"Half width")+'</button>';
    }).join("") + '</div>';
}
function gearHeightSegHtml(active, id){
  return '<div class="segmented" id="'+id+'" role="group" aria-label="Gear height">' +
    GEAR_HEIGHTS.map(function(h){
      return '<button type="button" class="seg-btn'+(active===h?' is-active':'')+'" data-height="'+h+'">'+h+'U</button>';
    }).join("") + '</div>';
}
function renderGearInGrid(g){
  var el = document.querySelector('.gear-piece[data-gear="'+cssEscape(g.id)+'"]');
  if(!el) return;
  var group = g.groupId ? getGroup(g.groupId) : null;
  el.style.borderColor = group ? group.color : "var(--border-strong)";
  el.style.borderWidth = group ? "3px" : "";
  el.classList.toggle("is-dim", !!ui.highlightGroup && g.groupId !== ui.highlightGroup);
  var nameEl = el.querySelector(".gear-name");
  if(nameEl){
    if(g.name){ nameEl.className = "gear-name"; nameEl.textContent = g.name; }
    else { nameEl.className = "gear-name placeholder"; nameEl.textContent = "Unnamed"; }
  }
  var existingDot = el.querySelector(".note-dot");
  if(g.notes && !existingDot){ var d=document.createElement("span"); d.className="note-dot"; el.appendChild(d); }
  if(!g.notes && existingDot){ existingDot.remove(); }
  el.title = (g.name || "Unnamed") + " · " + g.heightU + "U" + (g.width==="half"?" half-width":"") + (group ? " · " + group.name : "") + (g.notes ? " · " + g.notes : "");
}
function renderGearInspector(host, bay){

      list.forEach(function(x){ x.groupId = gid; });
      markDirty(); renderGrid(); renderInspector();
    });
    document.getElementById("bulkGearClearGroupBtn").addEventListener("click", function(){
      list.forEach(function(x){ x.groupId = null; });
      markDirty(); renderGrid(); renderInspector();
    });
    document.getElementById("bulkGearCopyBtn").addEventListener("click", function(){ copyGear(list); });
    document.getElementById("bulkGearDuplicateBtn").addEventListener("click", function(){ duplicateGear(bay.id, list); });
    document.getElementById("bulkGearDeselectBtn").addEventListener("click", clearSelection);
    wireInlineConfirm(document.getElementById("bulkGearDeleteBtn"), function(){

    return;
  }
  var g = list[0];
  var gLayout = layoutRackGear(bay);
  var gItem = gLayout.items.filter(function(it){ return it.gear === g; })[0] || {topU:0};
  var canUp = gItem.topU > 0;

  host.innerHTML =
    '<div class="insp-bar">' +
    '<div class="field insp-id"><label>Gear</label><div class="insp-id-row"><h2>'+g.heightU+'U</h2>' +
      '<div class="insp-nav">' +
        '<button class="icon-btn" id="gearUpBtn" '+(canUp?"":"disabled")+' title="Move up one U" aria-label="Move up one U">▲</button>' +
        '<button class="icon-btn" id="gearDownBtn" '+(canDown?"":"disabled")+' title="Move down one U" aria-label="Move down one U">▼</button>' +
      '</div></div></div>' +
    '<div class="field field-grow"><label for="gearNameInput">Name</label><input type="text" id="gearNameInput" value="'+escapeAttr(g.name)+'" placeholder="e.g. SSL Bus Compressor" maxlength="60" /></div>' +
    '<div class="field field-grow"><label for="gearNotesInput">Notes</label><input type="text" id="gearNotesInput" value="'+escapeAttr(g.notes)+'" placeholder="Optional — model, cable run, anything worth remembering" /></div>' +
    '<div class="field"><label for="gearGroupSelect">Device group</label>' +
      '<div class="group-picker"><select id="gearGroupSelect">'+groupOptionsHtml(g.groupId)+'</select></div></div>' +
    '<div class="field"><label>Width</label>'+gearWidthSegHtml(g.width, "gearWidthSeg")+'</div>' +
    '<div class="field"><label>Actions</label><div class="btn-row">' +
      '<button class="btn btn-sm btn-ghost" id="gearCopyBtn" type="button">Copy</button>' +
      '<button class="btn btn-sm btn-ghost" id="gearDuplicateBtn" type="button">Duplicate</button>' +
      '<button class="btn btn-sm btn-danger" id="deleteGearBtn" type="button">Delete</button>' +
    '</div></div>' +
    '</div>';
  document.getElementById("gearCopyBtn").addEventListener("click", function(){ copyGear([g]); });
  document.getElementById("gearDuplicateBtn").addEventListener("click", function(){ duplicateGear(bay.id, [g]); });
  var nameInput = document.getElementById("gearNameInput");
  nameInput.addEventListener("input", function(){ g.name = nameInput.value; renderGearInGrid(g); markDirty(); });
  var notesInput = document.getElementById("gearNotesInput");

    // going full-width may collide with a neighbour — push it down
    applyPlan(bay, planPlacement(bay, [{gear:g, topU:gLayout.items.filter(function(it){ return it.gear === g; })[0].topU, side:g.side}]));
    markDirty(); renderGrid(); renderInspector();
  });
  document.getElementById("gearUpBtn").addEventListener("click", function(){ nudgeGear(bay.id, g.id, -1); });
  document.getElementById("gearDownBtn").addEventListener("click", function(){ nudgeGear(bay.id, g.id, 1); });

function renderInspector(){
  var host = document.getElementById("inspectorBody");
  var bay = getActiveBay();
  if(bay && bay.type === "rack"){ renderGearInspector(host, bay); return; }
  if(!bay && ui.section === "rack"){
    host.innerHTML = '<div class="insp-bar"><p class="insp-empty">Add a rack to get started.</p></div>';
    return;
  }
  var ports = selectedPorts(bay);
  if(!bay || ports.length === 0){
    host.innerHTML = '<div class="insp-bar"><p class="insp-empty">Select a port to edit it. Shift-click for a range, ⌘/Ctrl-click to add ports individually.</p></div>';
    return;
  }
  if(ports.length === 1){
    var p = ports[0];
    var order = bay.ports.map(function(x){return x.id;});
    var idx = order.indexOf(p.id);
    var posLabel = p.row ? (p.row.toUpperCase()+" "+p.index) : ("PORT "+p.index);
    host.innerHTML =
      '<div class="insp-bar">' +
      '<div class="field insp-id"><label>Port</label><div class="insp-id-row"><h2>'+escapeHtml(posLabel)+'</h2>' +
        '<div class="insp-nav">' +
          '<button class="icon-btn" id="prevPortBtn" '+(idx<=0?"disabled":"")+' title="Previous port" aria-label="Previous port">‹</button>' +
          '<button class="icon-btn" id="nextPortBtn" '+(idx>=order.length-1?"disabled":"")+' title="Next port" aria-label="Next port">›</button>' +
        '</div></div></div>' +
      '<div class="field field-grow"><label for="labelInput">Label</label><input type="text" id="labelInput" value="'+escapeAttr(p.label)+'" placeholder="e.g. Kick In" maxlength="60" /></div>' +
      '<div class="field field-grow"><label for="notesInput">Notes</label><input type="text" id="notesInput" value="'+escapeAttr(p.notes)+'" placeholder="Optional — cable run, gain, anything worth remembering" /></div>' +
      '<div class="field"><label for="groupSelect">Device group</label>' +
        '<div class="group-picker"><select id="groupSelect">'+groupOptionsHtml(p.groupId)+'</select></div></div>' +
      (bay.type==="trs" ? '<div class="field"><label>Routing</label>'+routingSegHtml((getColumn(bay,p.index)||{}).state||"normal")+'</div>' : '') +
      '</div>';
    var labelInput = document.getElementById("labelInput");
    labelInput.addEventListener("input", function(){ p.label = labelInput.value; renderPortInGrid(p); markDirty(); });
    labelInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); advanceSelection(bay, 1); }
    });
    var notesInput = document.getElementById("notesInput");
    notesInput.addEventListener("input", function(){ p.notes = notesInput.value; renderPortInGrid(p); markDirty(); });
    document.getElementById("groupSelect").addEventListener("change", function(e){
      p.groupId = e.target.value || null; renderPortInGrid(p); markDirty();
    });
    var routingSeg = document.getElementById("routingSeg");
    if(routingSeg){
      routingSeg.addEventListener("click", function(e){
        var btn = e.target.closest(".seg-btn"); if(!btn) return;
        var newState = btn.getAttribute("data-state");
        setColumnState(bay, p.index, newState);
        renderGlyphInGrid(bay, p.index);
        Array.prototype.forEach.call(routingSeg.querySelectorAll(".seg-btn"), function(b){
          b.classList.toggle("is-active", b.getAttribute("data-state")===newState);
        });
        markDirty();
      });
    }
    var prevBtn = document.getElementById("prevPortBtn");
    var nextBtn = document.getElementById("nextPortBtn");
    if(prevBtn) prevBtn.addEventListener("click", function(){ advanceSelection(bay, -1); });
    if(nextBtn) nextBtn.addEventListener("click", function(){ advanceSelection(bay, 1); });
    setTimeout(function(){ labelInput.focus(); labelInput.setSelectionRange(labelInput.value.length, labelInput.value.length); }, 0);
  } else {
    var bulkColState = null;
    if(bay.type === "trs"){
      var seenStates = {};
      ports.forEach(function(pp){ var c=getColumn(bay,pp.index); if(c) seenStates[c.state]=true; });
      var stateKeys = Object.keys(seenStates);
      bulkColState = stateKeys.length===1 ? stateKeys[0] : null;
    }
    host.innerHTML =
      '<div class="insp-bar">' +
      '<div class="field insp-id"><label>Selection</label><div class="insp-id-row"><h2>'+ports.length+' ports</h2></div></div>' +
      '<div class="field field-grow"><label for="bulkGroupSelect">Assign device group</label>' +
        '<select id="bulkGroupSelect">'+groupOptionsHtml(null)+'</select></div>' +
      '<div class="field field-grow"><label for="fillBase">Fill labels with numbering</label>' +
        '<div class="fill-row">' +
          '<input type="text" id="fillBase" placeholder="e.g. Overhead  (or Tom # for Tom 1, Tom 2…)" maxlength="50" title="Numbers are added in port order. Put # where the number should go; otherwise it\'s added after the text." />' +
          '<input type="text" inputmode="numeric" id="fillStart" value="1" aria-label="Start numbering at" title="Start numbering at" />' +
          '<button class="btn btn-sm" id="fillBtn" type="button">Fill</button>' +
        '</div></div>' +
      (bay.type==="trs" ? '<div class="field"><label>Routing</label>'+routingSegHtml(bulkColState)+'</div>' : '') +
      '<div class="field"><label>Actions</label><div class="btn-row">' +
        '<button class="btn btn-sm" id="bulkApplyBtn" type="button">Apply group</button>' +
        '<button class="btn btn-sm btn-ghost" id="bulkClearGroupBtn" type="button">Clear group</button>' +
        '<button class="btn btn-sm btn-ghost" id="bulkClearLabelsBtn" type="button">Clear labels</button>' +
        '<button class="btn btn-sm btn-ghost" id="bulkDeselectBtn" type="button">Deselect</button>' +
      '</div></div>' +
      '</div>';
    document.getElementById("bulkApplyBtn").addEventListener("click", function(){
      var gid = document.getElementById("bulkGroupSelect").value || null;
      ports.forEach(function(pp){ pp.groupId = gid; });
      markDirty(); renderGrid(); renderInspector();
    });
    document.getElementById("bulkClearGroupBtn").addEventListener("click", function(){
      ports.forEach(function(pp){ pp.groupId = null; });
      markDirty(); renderGrid(); renderInspector();
    });
    document.getElementById("bulkClearLabelsBtn").addEventListener("click", function(){
      ports.forEach(function(pp){ pp.label=""; pp.notes=""; });
      markDirty(); renderGrid(); renderInspector();
    });
    function fillLabels(){
      var baseInput = document.getElementById("fillBase");
      var base = baseInput.value.trim();
      if(!base){ baseInput.focus(); return; }
      var startVal = parseInt(document.getElementById("fillStart").value, 10);
      var start = isFinite(startVal) ? startVal : 1;
      ports.forEach(function(pp, i){ pp.label = numberedLabel(base, start + i).slice(0, 60); });
      markDirty(); renderGrid(); renderInspector();
    }
    document.getElementById("fillBtn").addEventListener("click", fillLabels);
    document.getElementById("fillBase").addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); fillLabels(); }
    });
    document.getElementById("bulkDeselectBtn").addEventListener("click", clearSelection);
    var bulkRoutingSeg = document.getElementById("routingSeg");
    if(bulkRoutingSeg){
      bulkRoutingSeg.addEventListener("click", function(e){
        var btn = e.target.closest(".seg-btn"); if(!btn) return;
        var newState = btn.getAttribute("data-state");
        var seenCols = {};
        ports.forEach(function(pp){
          if(!seenCols[pp.index]){ seenCols[pp.index]=true; setColumnState(bay, pp.index, newState); }
        });
        markDirty(); renderGrid(); renderInspector();
      });
    }
  }
}
// "Tom #" + 3 -> "Tom 3"; "Overhead" + 2 -> "Overhead 2".
function numberedLabel(base, n){
  return base.indexOf("#") !== -1 ? base.replace(/#/g, String(n)) : (base + " " + n);
}
function advanceSelection(bay, dir){
  var order = bay.ports.map(function(p){return p.id;});
  var cur = ui.anchor || ui.selection[0];
  var idx = order.indexOf(cur);
  var next = Math.max(0, Math.min(order.length-1, idx+dir));
  selectPort(bay, order[next], {shift:false, ctrl:false});
}

/* ---------- export: canvas image ---------- */
function wrapText(ctx, text, maxWidth, maxLines){
  var words = String(text).split(/\s+/).filter(Boolean);
  if(words.length===0) return [];
  var lines = [], current = "";
  for(var i=0;i<words.length;i++){
    var test = current ? current + " " + words[i] : words[i];
    if(ctx.measureText(test).width > maxWidth && current){
      lines.push(current);
      current = words[i];
      if(lines.length === maxLines){ current=""; break; }
    } else {
      current = test;
    }
  }
  if(current) lines.push(current);
  if(lines.length > maxLines) lines = lines.slice(0, maxLines);
  var last = lines[lines.length-1];
  if(last){
    while(ctx.measureText(last+"…").width > maxWidth && last.length>1){ last = last.slice(0,-1); }
    if(words.join(" ").length > lines.join(" ").length) lines[lines.length-1] = last + "…";
  }
  return lines;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function canvasLayoutRows(bay){
  return bay.type === "xlr"
    ? [{tag:null, ports: bay.ports, sectionEnd:false}]
    : trsVisualRows(bay);
}
function drawRoutingGlyph(ctx, x, y, state, lineColor, faintColor){
  if(state === "thru"){
    ctx.fillStyle = faintColor;
    ctx.font = "600 15px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("×", x, y+1);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    return;
  }
  var halfH = 7;
  ctx.strokeStyle = lineColor; ctx.lineWidth = 2.5; ctx.lineCap = "round";
  ctx.setLineDash(state === "half-normal" ? [3,3] : []);
  ctx.beginPath(); ctx.moveTo(x, y-halfH); ctx.lineTo(x, y+halfH); ctx.stroke();
  ctx.setLineDash([]);
}
// Shared sizing constants for every canvas export (single-bay or master
// sheet) so the two stay visually consistent with each other.
var CANVAS_METRICS = {CELL:96, GAP:12, CHUNK:8, CHUNK_GAP:14, SECTION_GAP:16};
// Measures one bay's row/column layout without drawing anything, so both
// drawBayCanvas (one bay) and drawMasterSheetCanvas (many bays sharing one
// tall canvas) can size themselves from the same numbers.
function layoutBay(bay, m){
  var INNER_GAP = bay.type === "trs" ? 34 : m.GAP;
  var layoutRows = canvasLayoutRows(bay);
  var cols = layoutRows[0].ports.length;
  function chunkOffset(i){ return Math.floor(i / m.CHUNK) * m.CHUNK_GAP; }
  var gridW = (cols-1)*(m.CELL+m.GAP) + m.CELL + chunkOffset(cols-1);
  var rowYs = [], cursorY = 0;
  layoutRows.forEach(function(r, i){
    rowYs.push(cursorY);
    var isStripTop = bay.type === "trs" && (i % 2 === 0);
    cursorY += m.CELL + (isStripTop ? INNER_GAP : m.GAP) + (r.sectionEnd ? m.SECTION_GAP : 0);
  });
  var gridH = cursorY - m.GAP;
  return {layoutRows:layoutRows, cols:cols, gridW:gridW, gridH:gridH, rowYs:rowYs, chunkOffset:chunkOffset};
}
// Draws one bay's ports + routing glyphs (no title, no legend, no panel
// chrome) starting at topY — the piece that's identical whether it's the
// only bay on the canvas or one of several stacked on a master sheet.
function drawBayContent(ctx, bay, layout, m, leftPad, topY, colors){
  function drawRow(portsInRow, yTop, rowLabel){
    if(rowLabel){
      ctx.fillStyle = colors.faintColor;
      ctx.font = "600 11px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
      ctx.textAlign = "right";
      ctx.fillText(rowLabel, leftPad-14, yTop + m.CELL/2 + 4);
      ctx.textAlign = "left";
    }
    portsInRow.forEach(function(p, i){
      var x = leftPad + i*(m.CELL+m.GAP) + layout.chunkOffset(i);
      var group = p.groupId ? getGroup(p.groupId) : null;
      ctx.fillStyle = colors.cellColor;
      roundRect(ctx,x,yTop,m.CELL,m.CELL,10); ctx.fill();
      ctx.lineWidth = group ? 4 : 1.5;
      ctx.strokeStyle = group ? group.color : colors.borderColor;
      roundRect(ctx,x+ctx.lineWidth/2,yTop+ctx.lineWidth/2,m.CELL-ctx.lineWidth,m.CELL-ctx.lineWidth,9); ctx.stroke();

      ctx.fillStyle = colors.faintColor;
      ctx.font = "500 12px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
      ctx.fillText(String(p.index), x+10, yTop+20);

      ctx.font = "500 13px 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif";
      ctx.fillStyle = p.label ? colors.inkColor : colors.faintColor;
      ctx.textAlign = "center";
      var text = p.label || "—";
      var lines = p.label ? wrapText(ctx, text, m.CELL-16, 3) : ["—"];
      var lh = 16, startY = yTop + m.CELL/2 - ((lines.length-1)*lh)/2 + 5;
      lines.forEach(function(ln, li){ ctx.fillText(ln, x+m.CELL/2, startY+li*lh); });
      ctx.textAlign = "left";

      if(p.notes){
        ctx.fillStyle = colors.accentColor;
        ctx.beginPath(); ctx.arc(x+m.CELL-10, yTop+m.CELL-10, 3.5, 0, Math.PI*2); ctx.fill();
      }
    });
  }

  layout.layoutRows.forEach(function(r, i){
    drawRow(r.ports, topY + layout.rowYs[i], r.tag);
  });

  if(bay.type === "trs"){
    trsStrips(bay).forEach(function(strip, si){
      var topRowIdx = si*2, bottomRowIdx = si*2+1;
      var yTopEdge = topY + layout.rowYs[topRowIdx] + m.CELL;
      var yBottomEdge = topY + layout.rowYs[bottomRowIdx];
      var yMid = (yTopEdge + yBottomEdge) / 2;
      strip.top.forEach(function(p, i){
        var col = getColumn(bay, strip.colStart + i + 1);
        var x = leftPad + i*(m.CELL+m.GAP) + layout.chunkOffset(i) + m.CELL/2;
        drawRoutingGlyph(ctx, x, yMid, col ? col.state : "normal", colors.faintColor, colors.faintColor);
      });
    });
  }
}
function drawPanelChrome(ctx, canvasW, canvasH, panelColor){
  ctx.fillStyle = panelColor;
  roundRect(ctx,0,0,canvasW,canvasH,18); ctx.fill();

  ctx.strokeStyle = "rgba(255,255,255,0.035)"; ctx.lineWidth=1;
  for(var y=0;y<canvasH;y+=3){ ctx.beginPath(); ctx.moveTo(0,y+0.5); ctx.lineTo(canvasW,y+0.5); ctx.stroke(); }

  [[16,16],[canvasW-16,16],[16,canvasH-16],[canvasW-16,canvasH-16]].forEach(function(pt){
    ctx.fillStyle = "#3a3e40"; ctx.beginPath(); ctx.arc(pt[0],pt[1],6,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#54595b"; ctx.lineWidth=1; ctx.stroke();
    ctx.strokeStyle="#54595b"; ctx.beginPath(); ctx.moveTo(pt[0]-4,pt[1]-1); ctx.lineTo(pt[0]+4,pt[1]+2); ctx.stroke();
  });
}
function drawLegend(ctx, groups, canvasW, MARGIN, startY, LEGEND_ROW_H, inkColor){
  var lx = MARGIN, ly = startY;
  ctx.font = "600 14px 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif";
  groups.forEach(function(g){
    var w = ctx.measureText(g.name).width + 34;
    if(lx + w > canvasW - MARGIN){ lx = MARGIN; ly += LEGEND_ROW_H; }
    ctx.fillStyle = g.color;
    roundRect(ctx, lx, ly-14, 16, 16, 4); ctx.fill();
    ctx.fillStyle = inkColor;
    ctx.fillText(g.name, lx+22, ly-1);
    lx += w;
  });
}
function measureLegendHeight(ctx0, groups, canvasW, MARGIN, LEGEND_TOP, LEGEND_ROW_H){
  if(!groups.length) return 0;
  ctx0.font = "600 14px 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif";
  var x = 0, line = 1;
  groups.forEach(function(g){
    var w = ctx0.measureText(g.name).width + 34;
    if(x + w > canvasW - MARGIN*2){ line++; x = 0; }
    x += w;
  });
  return LEGEND_TOP + line*LEGEND_ROW_H + 6;
}
function drawBayCanvas(bay){
  var m = CANVAS_METRICS;

  var legendH = measureLegendHeight(probe.getContext("2d"), used, canvasW, MARGIN, LEGEND_TOP, LEGEND_ROW_H);

  var canvas = document.createElement("canvas");

      inkColor:"#ECEFED", faintColor:"#9BA2A0", accentColor:"#4FC79A"};

  drawPanelChrome(ctx, canvasW, canvasH, colors.panelColor);

  ctx.fillStyle = colors.accentColor;

  ctx.textAlign="right";
  ctx.fillText("EXPORTED " + dateStr.toUpperCase(), canvasW-MARGIN, 74);
  ctx.textAlign="left";

  drawBayContent(ctx, bay, layout, m, leftPad, TITLE_H, colors);

  if(used.length){
    drawLegend(ctx, used, canvasW, MARGIN, TITLE_H + layout.gridH + LEGEND_TOP, LEGEND_ROW_H, colors.inkColor);
  }

  return canvas;

// ---------- export: rack canvas (shares drawPanelChrome/wrapText/roundRect
// with the port-based bay export above, but lays out gear pieces instead
// of a port grid) ----------
function drawGearPiece(ctx, item, x, w, topPx, RU, colors, isOver){
  var y = topPx + 3;
  var h = item.gear.heightU*RU - 6;
  var group = item.gear.groupId ? getGroup(item.gear.groupId) : null;
  ctx.fillStyle = colors.cellColor;
  roundRect(ctx, x, y, w, h, 8); ctx.fill();
  if(isOver){
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#E2694A";
    ctx.setLineDash([5,3]);
    roundRect(ctx, x+1, y+1, w-2, h-2, 7); ctx.stroke();
    ctx.setLineDash([]);
  } else {
    ctx.lineWidth = group ? 4 : 1.5;
    ctx.strokeStyle = group ? group.color : colors.borderColor;
    roundRect(ctx, x+ctx.lineWidth/2, y+ctx.lineWidth/2, w-ctx.lineWidth, h-ctx.lineWidth, 7); ctx.stroke();
  }

  ctx.fillStyle = colors.faintColor;
  ctx.font = "500 11px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
  ctx.textAlign = "right";
  ctx.fillText((isOver ? "⚠ " : "")+item.gear.heightU+"U", x+w-10, y+16);
  ctx.textAlign = "left";

  ctx.font = "600 14px 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif";
  ctx.fillStyle = item.gear.name ? colors.inkColor : colors.faintColor;
  var nameLines = wrapText(ctx, item.gear.name || "Unnamed", w-20, 2);
  var ny = y + h/2 - ((nameLines.length-1)*17)/2 + (item.gear.notes ? -6 : 0);
  nameLines.forEach(function(ln, li){ ctx.fillText(ln, x+10, ny+li*17); });

  if(item.gear.notes){
    ctx.font = "400 11px 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif";
    ctx.fillStyle = colors.faintColor;
    var noteLines = wrapText(ctx, item.gear.notes, w-20, 1);
    if(noteLines[0]) ctx.fillText(noteLines[0], x+10, y+h-10);
  }
}
function drawRackContent(ctx, rack, RU, leftPad, topY, colors, contentW){
  var layout = layoutRackGear(rack);
  var totalRows = Math.max(rack.heightU, layout.usedU);
  ctx.strokeStyle = colors.borderColor; ctx.lineWidth = 1;
  for(var i=0;i<=rack.heightU;i++){
    var y = topY + i*RU + 0.5;
    ctx.beginPath(); ctx.moveTo(leftPad, y); ctx.lineTo(leftPad+contentW, y); ctx.stroke();
  }
  ctx.font = "500 10px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
  ctx.fillStyle = colors.faintColor;
  ctx.textAlign = "right";
  for(var u=1;u<=totalRows;u++){
    ctx.fillText(String(u), leftPad-10, topY + (u-1)*RU + RU/2 + 4);
  }
  ctx.textAlign = "left";
  if(totalRows > rack.heightU){
    var boundaryY = topY + rack.heightU*RU;
    ctx.save();
    ctx.strokeStyle = "#E2694A";
    ctx.setLineDash([6,4]);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(leftPad, boundaryY); ctx.lineTo(leftPad+contentW, boundaryY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = "700 10px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
    ctx.fillStyle = "#E2694A";
    ctx.textAlign = "right";
    ctx.fillText("RACK ENDS HERE", leftPad+contentW, boundaryY-6);
    ctx.textAlign = "left";
    ctx.restore();
  }
  layout.items.forEach(function(item){
    var topPx = topY + item.topU*RU;
    var x, w;
    if(item.side === "left"){ x = leftPad+2; w = contentW/2 - 4; }
    else if(item.side === "right"){ x = leftPad + contentW/2 + 2; w = contentW/2 - 4; }
    else { x = leftPad+2; w = contentW - 4; }
    var isOver = (item.topU + item.gear.heightU) > rack.heightU;
    drawGearPiece(ctx, item, x, w, topPx, RU, colors, isOver);
  });
}
var RACK_CANVAS = {RU:52, ROWLABEL_W:34, CONTENT_W:640};
function drawRackCanvas(rack){

// A single tall image stacking every bay in the session (grouped XLR-first,
// then TRS, in tab order within each section) — one combined reference
// sheet instead of exporting each bay separately.
function drawMasterSheetCanvas(bays){
  var m = CANVAS_METRICS;
  var MARGIN=44, ROWLABEL_W=64, BAY_TITLE_H=64, SECTION_HEADER_H=50, BAY_GAP=48,
      LEGEND_ROW_H=30, LEGEND_TOP=26, DOC_TITLE_H=110;

  var items = bays.map(function(bay){
    if(bay.type === "rack"){
      var rackLeftPad = MARGIN + RACK_CANVAS.ROWLABEL_W;
      var rackTotalRows = Math.max(bay.heightU, layoutRackGear(bay).usedU);
      return {bay:bay, isRack:true, leftPad:rackLeftPad, gridH: rackTotalRows*RACK_CANVAS.RU, width: rackLeftPad + RACK_CANVAS.CONTENT_W + MARGIN};
    }
    var layout = layoutBay(bay, m);
    var leftPad = MARGIN + (bay.type==="trs" ? ROWLABEL_W : 0);
    return {bay:bay, isRack:false, layout:layout, leftPad:leftPad, gridH:layout.gridH, width: leftPad + layout.gridW + MARGIN};
  });
  var canvasW = items.reduce(function(w, it){ return Math.max(w, it.width); }, 640);

  var cursorY = DOC_TITLE_H, lastType = null, sectionHeaders = [];
  items.forEach(function(it){
    if(it.bay.type !== lastType){
      sectionHeaders.push({type: it.bay.type, y: cursorY});
      cursorY += SECTION_HEADER_H;
      lastType = it.bay.type;
    }
    it.titleY = cursorY;
    cursorY += BAY_TITLE_H;
    it.gridTopY = cursorY;
    cursorY += it.gridH;
    cursorY += BAY_GAP;
  });
  cursorY -= BAY_GAP;

  var used = groupsUsedAcrossBays(bays);
  var probe = document.createElement("canvas");
  var legendH = measureLegendHeight(probe.getContext("2d"), used, canvasW, MARGIN, LEGEND_TOP, LEGEND_ROW_H);
  var canvasH = cursorY + legendH + MARGIN;

  var canvas = document.createElement("canvas");
  canvas.width = canvasW; canvas.height = canvasH;
  var ctx = canvas.getContext("2d");

  var colors = {panelColor:"#24272A", cellColor:"#2E3134", borderColor:"#454A4D",
      inkColor:"#ECEFED", faintColor:"#9BA2A0", accentColor:"#4FC79A"};

  drawPanelChrome(ctx, canvasW, canvasH, colors.panelColor);

  ctx.fillStyle = colors.accentColor;
  ctx.font = "800 38px 'Big Shoulders Display', 'Arial Narrow', sans-serif";
  ctx.textBaseline = "alphabetic";
  ctx.fillText("PATCH SHEET — MASTER", MARGIN, 54);
  ctx.fillStyle = colors.faintColor;
  ctx.font = "500 12px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
  ctx.fillText(bays.length + " BAY" + (bays.length===1?"":"S") + " IN THIS SESSION", MARGIN, 78);
  var dateStr = new Date().toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
  ctx.textAlign="right";
  ctx.fillText("EXPORTED " + dateStr.toUpperCase(), canvasW-MARGIN, 78);
  ctx.textAlign="left";
  ctx.strokeStyle = colors.borderColor; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(MARGIN, 94); ctx.lineTo(canvasW-MARGIN, 94); ctx.stroke();

  sectionHeaders.forEach(function(sh){
    ctx.fillStyle = colors.faintColor;
    ctx.font = "700 13px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
    var label = sh.type === "xlr" ? "XLR — 16PT PASSTHROUGH" : (sh.type === "trs" ? "TRS PATCHBAYS" : "RACK LAYOUTS");
    ctx.fillText(label, MARGIN, sh.y + 18);
  });

  items.forEach(function(it){
    var bay = it.bay;
    ctx.fillStyle = colors.inkColor;
    ctx.font = "700 22px 'Big Shoulders Display', 'Arial Narrow', sans-serif";
    ctx.fillText(bay.name.toUpperCase(), MARGIN, it.titleY + 18);
    ctx.fillStyle = colors.faintColor;
    ctx.font = "500 11px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
    var subtitle = bay.type==="xlr" ? "16 × XLR-F PASSTHROUGH" : (bay.type==="trs" ? (bay.size + "-POINT TRS BANTAM") : (bay.heightU + "U RACK FRAME"));
    ctx.fillText(subtitle, MARGIN, it.titleY + 36);
    if(it.isRack){
      drawRackContent(ctx, bay, RACK_CANVAS.RU, it.leftPad, it.gridTopY, colors, RACK_CANVAS.CONTENT_W);
    } else {
      drawBayContent(ctx, bay, it.layout, m, it.leftPad, it.gridTopY, colors);
    }
  });

  if(used.length){
    drawLegend(ctx, used, canvasW, MARGIN, cursorY + LEGEND_TOP, LEGEND_ROW_H, colors.inkColor);
  }

  return canvas;
}
function exportImage(bay, format){

/* ---------- export: JSON / CSV ---------- */
function exportProjectJSON(){
  var text = JSON.stringify(state, null, 2);
  saveFile("patch-sheet-project.json", text);
}
function csvField(v){
  var s = v==null ? "" : String(v);
  if(/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportLabelsCSV(){
  var rows = [CSV_COLUMNS];
  state.bays.forEach(function(b){
    if(b.type === "rack"){
      b.gear.forEach(function(g, i){
        var gg = g.groupId ? getGroup(g.groupId) : null;
        rows.push([b.id, b.name, b.type, "", i+1, g.id, g.name, g.notes, gg?gg.name:"", "", g.heightU, g.width]);
      });
      return;
    }
    b.ports.forEach(function(p){
      var g = p.groupId ? getGroup(p.groupId) : null;
      var routing = b.type==="trs" ? ((getColumn(b,p.index)||{}).state || "normal") : "";
      rows.push([b.id, b.name, b.type, p.row||"", p.index, p.id, p.label, p.notes, g?g.name:"", routing, "", ""]);
    });
  });
  var text = rows.map(function(r){ return r.map(csvField).join(","); }).join("\r\n");
  saveFile("patch-sheet-labels.csv", text);
}
function parseCSV(text){
  var rows = [], row = [], field = "", inQuotes = false;
  for(var i=0;i<text.length;i++){
    var c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ","){ row.push(field); field = ""; }
      else if(c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === "\r"){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return !(r.length===1 && r[0]==="") ; });
}

/* ---------- import ---------- */
function readFileText(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(String(reader.result)); };
    reader.onerror = function(){ reject(reader.error); };
    reader.readAsText(file);
  });
}
function handleImportJSON(file){
  readFileText(file).then(function(text){
    var parsed;
    try{ parsed = JSON.parse(text); } catch(e){ showToast("That file isn't valid JSON.", "error"); return; }
    if(!parsed || !Array.isArray(parsed.bays)){ showToast("That JSON doesn't look like a Patch Sheet project file.", "error"); return; }
    historyBreak(); // an import is its own undo step
    state = normalizeState(parsed);
    ui.activeBay = {}; clearSelectionSilently();
    markDirty();
    renderAll();
    showToast("Project imported.", "success");
  }).catch(function(){ showToast("Couldn't read that file.", "error"); });
}
function handleImportCSV(file){
  readFileText(file).then(function(text){
    var rows = parseCSV(text);
    if(rows.length < 2){ showToast("That CSV has no data rows.", "error"); return; }
    var header = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    var col = {};
    header.forEach(function(h,i){ col[h]=i; });
    if(col.port_id === undefined || col.label === undefined){
      showToast("That CSV is missing a port_id or label column.", "error"); return;
    }
    var portIndex = {}, bayOfPort = {}, gearIndex = {};
    state.bays.forEach(function(b){
      if(b.type === "rack"){ b.gear.forEach(function(g){ gearIndex[g.id] = g; }); }
      else { b.ports.forEach(function(p){ portIndex[p.id] = p; bayOfPort[p.id] = b; }); }
    });
    var groupByName = {};
    state.groups.forEach(function(g){ groupByName[g.name.trim().toLowerCase()] = g; });
    var matched = 0, unmatched = 0;
    for(var i=1;i<rows.length;i++){
      var r = rows[i];
      if(!r.length) continue;
      var pid = (r[col.port_id]||"").trim();
      var p = portIndex[pid];
      var gItem = !p ? gearIndex[pid] : null;
      if(!p && !gItem){ unmatched++; continue; }
      matched++;
      if(gItem){
        gItem.name = col.label!==undefined ? (r[col.label]||"") : gItem.name;
        gItem.notes = col.notes!==undefined ? (r[col.notes]||"") : gItem.notes;
        if(col.gear_height_u !== undefined){
          var hv = Number(r[col.gear_height_u]);
          if(GEAR_HEIGHTS.indexOf(hv) !== -1) gItem.heightU = hv;
        }
        if(col.gear_width !== undefined){
          var wv = (r[col.gear_width]||"").trim().toLowerCase();
          if(wv==="full"||wv==="half") gItem.width = wv;
        }
        if(col.group !== undefined){
          var gname2 = (r[col.group]||"").trim();
          if(!gname2){ gItem.groupId = null; }
          else {
            var key2 = gname2.toLowerCase();
            var g2 = groupByName[key2];
            if(!g2){ g2 = addGroup(gname2, nextPaletteColor()); groupByName[key2] = g2; }
            gItem.groupId = g2.id;
          }
        }
        continue;
      }
      p.label = col.label!==undefined ? (r[col.label]||"") : p.label;
      p.notes = col.notes!==undefined ? (r[col.notes]||"") : p.notes;
      if(col.group !== undefined){
        var gname = (r[col.group]||"").trim();
        if(!gname){ p.groupId = null; }
        else {
          var key = gname.toLowerCase();
          var g = groupByName[key];
          if(!g){ g = addGroup(gname, nextPaletteColor()); groupByName[key] = g; }
          p.groupId = g.id;
        }
      }
      if(col.routing !== undefined){
        var bay = bayOfPort[pid];
        if(bay && bay.type === "trs"){
          var rv = (r[col.routing]||"").trim().toLowerCase();
          if(ROUTING_STATES.indexOf(rv) !== -1) setColumnState(bay, p.index, rv);
        }
      }
    }
    state.bays.forEach(function(b){ if(b.type === "rack") repairRack(b); });
    markDirty();
    renderAll();
    showToast("Imported " + matched + " label" + (matched===1?"":"s") + (unmatched ? " (" + unmatched + " unmatched)" : "") + ".", matched ? "success" : "error");
  }).catch(function(){ showToast("Couldn't read that file.", "error"); });
}

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(ui.groupsModalOpen){ closeGroupsModal(); renderAll(); }
      else if(ui.addRackModalOpen){ closeAddRackModal(); }
      else if(ui.addGearModalOpen){ closeAddGearModal(); }
      else if(ui.resizeRackModalOpen){ closeResizeRackModal(); }
      else if(ui.selection.length){ clearSelection(); }
    }
  });
  // Copy / paste of rack gear rides on the browser's own copy and paste
  // events so ordinary text copy/paste in the name and notes fields is never
  // hijacked: a copy only becomes a gear copy when no text is selected, and a
  // paste only becomes a gear paste when the clipboard holds copied gear (or
  // is empty and we're not typing in a field).
  function anyModalOpen(){ return ui.groupsModalOpen || ui.addRackModalOpen || ui.addGearModalOpen || ui.resizeRackModalOpen; }
  function isTextField(el){
    return !!el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT" || el.tagName === "SELECT" || el.isContentEditable);
  }
  document.addEventListener("copy", function(e){
    if(anyModalOpen() || ui.section !== "rack") return;
    var el = document.activeElement;
    if(isTextField(el) && typeof el.selectionStart === "number" && el.selectionStart !== el.selectionEnd) return;
    var pageSel = window.getSelection ? String(window.getSelection()) : "";
    if(pageSel && !isTextField(el)) return;
    var bay = getActiveBay();
    var list = selectedGear(bay);
    if(!list.length) return;
    copyGear(list, e);
  });
  document.addEventListener("paste", function(e){
    if(anyModalOpen() || ui.section !== "rack") return;
    var text = "";
    try{ text = e.clipboardData ? e.clipboardData.getData("text/plain") : ""; }catch(err){ /* ignore */ }
    var items = parseGearClip(text);
    if(!items){
      if(isTextField(document.activeElement)) return; // ordinary text paste
      if(text || !GEAR_CLIPBOARD.length) return;      // something else is on the clipboard
      items = GEAR_CLIPBOARD;
    }
    var bay = getActiveBay();
    if(!bay || bay.type !== "rack") return;
    e.preventDefault();
    pasteGearIntoRack(bay.id, items);
  });
  // Undo / redo. Inside a text field that's been typed in, ⌘Z keeps its
  // normal job of undoing that typing; everywhere else it steps the project
  // back (the name field's own typing is folded into one project step too).
  var typedEls = new WeakSet();
  document.addEventListener("input", function(e){ typedEls.add(e.target); });
  document.addEventListener("focusin", function(e){ typedEls.delete(e.target); });
  document.addEventListener("keydown", function(e){
    if(!(e.metaKey || e.ctrlKey) || e.altKey) return;
    var k = String(e.key).toLowerCase();
    var isUndo = k === "z" && !e.shiftKey;
    var isRedo = (k === "z" && e.shiftKey) || (k === "y" && e.ctrlKey && !e.metaKey);
    if(!isUndo && !isRedo) return;
    if(anyModalOpen()) return;
    var el = document.activeElement;
    if(isTextField(el) && el.tagName !== "SELECT" && typedEls.has(el)) return;
    e.preventDefault();
    if(isUndo) undo(); else redo();
  });
  document.getElementById("groupChips").addEventListener("click", function(e){
    var chip = e.target.closest(".group-chip"); if(!chip) return;
    setHighlightGroup(chip.getAttribute("data-group") || null);
  });
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("redoBtn").addEventListener("click", redo);
  resetHistory();
  document.getElementById("fileInputJson").addEventListener("change", function(e){
    var f = e.target.files[0]; e.target.value = "";
    if(f) handleImportJSON(f);
  });
  document.getElementById("fileInputCsv").addEventListener("change", function(e){
    var f = e.target.files[0]; e.target.value = "";
    if(f) handleImportCSV(f);
  });

  var draft = loadLocalDraft();
  // Only offer restore if the draft has actual content beyond the untouched default.
  var hasContent = draft && (draft.groups && draft.groups.length ||
    (draft.bays||[]).some(function(b){ return (b.ports||[]).some(function(p){ return p.label || p.notes; }); }) ||
    (draft.bays||[]).length !== 2);
  renderAll();
  if(hasContent) renderRestoreBanner(draft);
  setSaveStatus(false);
}
document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
