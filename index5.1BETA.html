/* ---------- drag and drop: reorder gear within or between racks ---------- */
var DRAG = null; // {fromRackId, gearIds, anchorId, grabOffsetU} while gear is being dragged
function clearDropIndicator(){
  Array.prototype.forEach.call(document.querySelectorAll(".drop-ghost"), function(n){ n.remove(); });
}
// One dashed "ghost" box per piece being dragged, snapped to the row it would
// land on; amber when dropping there would push other pieces down.
function showDropGhosts(elevation, placements, pushed, bay){
  clearDropIndicator();
  placements.forEach(function(pl){
    var el = document.createElement("div");
    el.className = "drop-ghost" + (pushed ? " is-push" : "");
    if(bay && bay.type === "chassis"){
      el.style.left = (pl.topU * SLOT_PX) + "px"; el.style.width = (pl.gear.heightU * SLOT_PX) + "px";
      el.style.top = "0"; el.style.bottom = "0";
      elevation.appendChild(el);
      return;
    }
    el.style.top = (pl.topU * RACK_RU_PX) + "px";
    el.style.height = (pl.gear.heightU * RACK_RU_PX) + "px";
    if(pl.side === "left"){ el.style.left = "0"; el.style.width = "50%"; }
    else if(pl.side === "right"){ el.style.right = "0"; el.style.width = "50%"; }
    else { el.style.left = "0"; el.style.right = "0"; }
    elevation.appendChild(el);
  });
}
// Where the dragged piece(s) would land for the pointer position in `e`:
// the grabbed piece's top edge follows the pointer (snapped to a U), the rest
// of a multi-selection keeps its spacing, everything is kept inside the rack
// rows currently shown, and a lone half-width piece takes the side the
// pointer is on (or pairs with a matching lone half-width piece).
function dragPlacements(rack, elevation, e){
  if(!DRAG) return null;
  var fromRack = getBay(DRAG.fromRackId);
  if(!fromRack || fromRack.type !== rack.type) return null; // a module can't go into a rack, or a rack unit into a chassis
  var chassis = rack.type === "chassis";
  var px = unitPx(rack);
  var ids = {}; DRAG.gearIds.forEach(function(id){ ids[id] = true; });
  var src = layoutRackGear(fromRack).items.filter(function(it){ return ids[it.gear.id]; });
  if(!src.length) return null;
  var anchor = src.filter(function(it){ return it.gear.id === DRAG.anchorId; })[0] || src[0];
  var rect = elevation.getBoundingClientRect();
  var rel = src.map(function(it){ return {gear:it.gear, d:it.topU - anchor.topU, side:it.side}; });
  var minRel = Math.min.apply(null, rel.map(function(r){ return r.d; }));
  var maxRel = Math.max.apply(null, rel.map(function(r){ return r.d + r.gear.heightU; }));
  var lay = layoutRackGear(rack);
  var totalRows = Math.max(rack.heightU, lay.usedU);
  var pointerRow = Math.floor(((chassis ? e.clientX - rect.left : e.clientY - rect.top)) / px);
  var top = pointerRow - (DRAG.grabOffsetU || 0);
  top = Math.min(top, totalRows - maxRel);
  top = Math.max(top, -minRel);
  var placements = rel.map(function(r){ return {gear:r.gear, topU:top + r.d, side:r.side}; });
  if(!chassis && placements.length === 1 && placements[0].gear.width === "half"){
    var pl = placements[0];
    pl.side = (e.clientX - rect.left) < rect.width / 2 ? "left" : "right";
    var others = lay.items.filter(function(it){ return !ids[it.gear.id]; });
    var snap = snapHalfPair(others, pl.topU, pl.gear.heightU);
    if(snap){ pl.topU = snap.topU; pl.side = snap.side; }
  }
  return placements;
}
// Wires native HTML5 drag-and-drop for every gear piece / rack elevation
// currently rendered under scopeEl. Works across however many rack panels
// are in scopeEl at once — one rack in Compact view, every rack in Full
// view, or the two side-by-side panels in Compare view — so a drag can
// land in a different rack's elevation whenever more than one is visible.
function wireGearDragAndDrop(scopeEl){
  Array.prototype.forEach.call(scopeEl.querySelectorAll(".gear-piece"), function(el){
    el.addEventListener("dragstart", function(e){
      var panel = el.closest(".rack-panel");
      if(!panel) return;
      var fromRackId = panel.getAttribute("data-bay-id");
      var gid = el.getAttribute("data-gear");
      // Grabbing a piece that's part of a multi-selection drags the whole
      // selection together; grabbing anything else drags just that piece.
      var ids = [gid];
      var fromBay = getBay(fromRackId);
      if(fromBay && fromRackId === ui.activeBay[fromBay.type]){
        var selIds = selectedGear(fromBay).map(function(g){ return g.id; });
        if(selIds.length > 1 && selIds.indexOf(gid) !== -1) ids = selIds;
      }
      var r = el.getBoundingClientRect();
      var grab = Math.floor(((fromBay && fromBay.type === "chassis") ? (e.clientX - r.left) : (e.clientY - r.top)) / unitPx(fromBay));
      var item = fromBay ? layoutRackGear(fromBay).items.filter(function(it){ return it.gear.id === gid; })[0] : null;
      var hU = item ? item.gear.heightU : 1;
      DRAG = {fromRackId: fromRackId, gearIds: ids, anchorId: gid, grabOffsetU: Math.max(0, Math.min(hU - 1, isFinite(grab) ? grab : 0))};
      ids.forEach(function(id){
        var node = panel.querySelector('.gear-piece[data-gear="'+cssEscape(id)+'"]');
        if(node) node.classList.add("is-dragging");
      });
      if(e.dataTransfer){
        e.dataTransfer.effectAllowed = "move";
        try{ e.dataTransfer.setData("text/plain", ids.join(",")); }catch(err){ /* ignore */ }
      }
    });
    el.addEventListener("dragend", function(){
      Array.prototype.forEach.call(document.querySelectorAll(".gear-piece.is-dragging"), function(n){ n.classList.remove("is-dragging"); });
      clearDropIndicator();
      DRAG = null;
    });
  });
  Array.prototype.forEach.call(scopeEl.querySelectorAll(".rack-elevation, .chassis-elevation"), function(elevation){
    elevation.addEventListener("dragover", function(e){
      if(!DRAG) return;
      var panel = elevation.closest(".rack-panel");
      if(!panel) return;
      var rack = getBay(panel.getAttribute("data-bay-id"));
      if(!rack) return;
      var placements = dragPlacements(rack, elevation, e);
      if(!placements) return;
      e.preventDefault();
      if(e.dataTransfer) e.dataTransfer.dropEffect = "move";
      showDropGhosts(elevation, placements, planPlacement(rack, placements).pushed > 0, rack);
    });
    elevation.addEventListener("dragleave", function(e){
      if(e.target === elevation) clearDropIndicator();
    });
    elevation.addEventListener("drop", function(e){
      if(!DRAG) return;
      var panel = elevation.closest(".rack-panel");
      if(!panel){ DRAG = null; return; }
      var rack = getBay(panel.getAttribute("data-bay-id"));
      if(!rack){ DRAG = null; return; }
      e.preventDefault();
      var placements = dragPlacements(rack, elevation, e);
      var d = DRAG;
      clearDropIndicator();
      DRAG = null;
      if(placements) moveGearsToSlot(d.fromRackId, d.gearIds, rack.id, placements);
    });
  });
}

/* ---------- signal-flow links: Inspector panel, picker, pick-on-screen ---------- */
function findGear(gearId){
  for(var i = 0; i < state.bays.length; i++){
    var b = state.bays[i];
    if(!isGearBay(b)) continue;
    for(var j = 0; j < b.gear.length; j++){ if(b.gear[j].id === gearId) return {bay:b, gear:b.gear[j]}; }
  }
  return null;
}
function slotJackEndpoints(bay){
  var out = [];
  for(var n = 1; n <= (bay.slots || 0); n++){ out.push(getEndpoint(slotJackId(bay.id, n, "in"))); out.push(getEndpoint(slotJackId(bay.id, n, "out"))); }
  return out.filter(Boolean);
}
function gearChannelEndpoints(g){
  var out = [];
  for(var i = 1; i <= (g.ins || 0); i++) out.push(getEndpoint(gearChId(g.id, "in", i)));
  for(var j = 1; j <= (g.outs || 0); j++) out.push(getEndpoint(gearChId(g.id, "out", j)));
  return out.filter(Boolean);
}
function setEpLabel(ep, text){
  text = String(text || "").slice(0, 60);
  if(ep.kind === "port"){ ep.port.label = text; return; }
  if(ep.kind === "slot"){
    if(!ep.bay.jackLabels) ep.bay.jackLabels = {};
    var jk = chKey(ep.dir, ep.slot);
    if(text) ep.bay.jackLabels[jk] = text; else delete ep.bay.jackLabels[jk];
    return;
  }
  if(!ep.gear.chLabels) ep.gear.chLabels = {};
  var k = chKey(ep.dir, ep.n);
  if(text) ep.gear.chLabels[k] = text; else delete ep.gear.chLabels[k];
}
function jumpToEndpoint(id){
  var ep = getEndpoint(id);
  if(!ep) return;
  jumpToResult(ep.kind === "gear"
    ? {kind:"gear", bayId:ep.bay.id, itemId:ep.gear.id}
    : ep.kind === "slot"
    ? {kind:"slot", bayId:ep.bay.id, itemId:ep.id}
    : {kind:"port", bayId:ep.bay.id, itemId:ep.port.id});
}

/* what to light up on screen for the current selection */
var _hlCache = {key:"", val:{ports:{}, gear:{}}}, _linkedCache = {key:"", val:{}};
function selectedEndpointIds(){
  if(ui.selection.length !== 1) return [];
  var id = ui.selection[0];
  if(getEndpoint(id)) return [id];
  var hit = findGear(id);
  return hit ? gearChannelEndpoints(hit.gear).map(function(e){ return e.id; }) : [];
}
function traceHighlight(){
  var key = linkRev + "|" + (ui.showTrace ? 1 : 0) + "|" + ui.selection.join(",") + "|" + linkList().length;
  if(_hlCache.key === key && _hlCache.state === state) return _hlCache.val;
  var val = {ports:{}, gear:{}};
  if(ui.showTrace && linkList().length){
    selectedEndpointIds().forEach(function(id){
      var all = {};
      traceUp(id).forEach(function(h){ all[h.id] = true; });
      var down = traceDownSet(id);
      Object.keys(down).forEach(function(k){ all[k] = true; });
      Object.keys(all).forEach(function(k){
        var gc = parseGearCh(k);
        if(gc) val.gear[gc.gearId] = true; else val.ports[k] = true;
      });
    });
  }
  _hlCache = {key:key, state:state, val:val};
  return val;
}
// Every endpoint (and every piece of gear) that has at least one link on it.
function linkedMap(){
  var key = linkRev + "|" + linkList().length;
  if(_linkedCache.key === key && _linkedCache.state === state) return _linkedCache.val;
  var m = {};
  linkList().forEach(function(l){
    [l.from, l.to].forEach(function(id){
      var gc = parseGearCh(id);
      m[gc ? gc.gearId : id] = true;
    });
  });
  _linkedCache = {key:key, state:state, val:m};
  return m;
}

/* pick on screen */
function epChipHtml(id){
  var ep = getEndpoint(id);
  if(!ep) return "";
  var lbl = epLabel(ep);
  return '<button type="button" class="flow-chip" data-flow-jump="'+escapeAttr(id)+'" title="Go to '+escapeAttr(epWhere(ep))+'">' +
    (lbl ? '<b>'+escapeHtml(lbl)+'</b>' : '') + '<span>'+escapeHtml(epWhere(ep))+'</span></button>';
}
function pickEligible(candidateId){
  if(!ui.pick) return false;
  return !(ui.pick.role === "to" ? checkLink(ui.pick.epId, candidateId) : checkLink(candidateId, ui.pick.epId));
}
function pickGearEligible(g){
  return gearChannelEndpoints(g).some(function(e){ return pickEligible(e.id); });
}
function renderPickBanner(){
  var el = document.getElementById("pickBanner");
  if(!ui.pick){ if(el) el.remove(); document.body.classList.remove("is-picking"); return; }
  var ep = getEndpoint(ui.pick.epId);
  var who = ep ? (epLabel(ep) || epWhere(ep)) : "this connection";
  if(!el){
    el = document.createElement("div");
    el.id = "pickBanner"; el.className = "pick-banner"; el.setAttribute("role", "status");
    document.body.appendChild(el);
  }
  el.innerHTML = '<span>' + (ui.pick.role === "to" ? 'Click where “'+escapeHtml(who)+'” goes' : 'Click where “'+escapeHtml(who)+'” comes from') +
    ' — switch tabs or bays if you need to</span><button type="button" class="btn btn-sm" id="pickCancelBtn">Cancel (Esc)</button>';
  document.getElementById("pickCancelBtn").addEventListener("click", endPick);
  document.body.classList.add("is-picking");
}
function startPick(epId, role){
  if(!getEndpoint(epId)) return;
  ui.pick = {epId:epId, role:role};
  renderPickBanner();
  renderGrid();
}
function endPick(){
  if(!ui.pick) return;
  ui.pick = null;
  renderPickBanner();
  renderGrid();
}
function cancelPickSilently(){ ui.pick = null; renderPickBanner(); }
// Makes the link, then takes you back to the endpoint you started from.
function connectEndpoints(anchorId, role, targetId, opts){
  var fromId = role === "to" ? anchorId : targetId, toId = role === "to" ? targetId : anchorId;
  historyBreak();
  var r = addLink(fromId, toId);
  if(!r.ok){ showToast(r.reason, "error"); return false; }
  if(opts && opts.clock){ // made from the Clock tab: the cable carries clock, and the piece receiving it follows
    var cl = incomingLink(toId);
    if(cl){ cl.clk = true; markDirty(); }
    var rcv = getEndpoint(toId);
    if(rcv && rcv.kind === "gear" && rcv.bay.type === "rack" && !rcv.gear.clock) rcv.gear.clock = "follower";
  }
  var a = getEndpoint(fromId), b = getEndpoint(toId);
  showToast(r.same ? "Already connected." : "Connected " + epWhere(a) + " → " + epWhere(b) + (r.replaced ? " (replaced its previous source)." : "."), "success");
  return true;
}
function completePick(targetId){
  if(!ui.pick) return;
  var anchor = ui.pick.epId, role = ui.pick.role;
  if(!connectEndpoints(anchor, role, targetId)) return; // stay in pick mode so you can try another
  ui.pick = null;
  renderPickBanner();
  jumpToEndpoint(anchor);
}
function handlePickPort(portId){ completePick(portId); }
function handlePickGear(bay, gearId){
  var g = null;
  bay.gear.forEach(function(x){ if(x.id === gearId) g = x; });
  if(!g) return;
  var want = ui.pick.role === "to" ? "input" : "output";
  var eligible = gearChannelEndpoints(g).filter(function(e){ return pickEligible(e.id); });
  if(!eligible.length){
    showToast((g.name || "That piece") + " has no free " + want + " channels — set its channel counts in the Inspector first.", "error");
    return;
  }
  if(eligible.length === 1){ completePick(eligible[0].id); return; }
  openLinkPicker({epId:ui.pick.epId, role:ui.pick.role, onlyGearId:g.id});
}

/* the "Connect to…" list */
function openLinkPicker(opts){
  var anchor = getEndpoint(opts.epId);
  if(!anchor) return;
  var role = opts.role;
  var who = epLabel(anchor) || epWhere(anchor);
  openDialog({
    title: opts.clock ? "Where does “" + (anchor.kind === "gear" ? (anchor.gear.name || "this piece") : who) + "” get its clock?" : (role === "to" ? "Send “" + who + "” to…" : "Where does “" + who + "” come from?"),
    width: 600,
    bodyHtml:
      '<div class="lp-top"><input type="search" id="lpFilter" placeholder="Filter by label, bay or position…" autocomplete="off" aria-label="Filter connections" />' +
      ((opts.onlyGearId || opts.clock) ? '' : '<button type="button" class="btn btn-sm btn-primary" id="lpScreenBtn" title="Close this list and click the port or gear on screen">Pick on screen</button>') + '</div>' +
      '<p class="insp-empty" style="padding:0;" id="lpHint"></p><div class="lp-list" id="lpList"></div>',
    buttons: [{label:"Cancel", cls:"btn-ghost", onClick:function(){ if(ui.pick && opts.onlyGearId){ /* keep picking */ } }}],
    focus: "#lpFilter",
    onOpen: function(root){
      var list = root.querySelector("#lpList"), hint = root.querySelector("#lpHint"), filter = root.querySelector("#lpFilter");
      function paint(){
        var terms = searchTerms(filter.value), html = "", shown = 0, capped = false;
        state.bays.forEach(function(bay){
          if(capped) return;
          var rows = "";
          var eps = bay.type === "chassis"
            ? (opts.onlyGearId ? [] : slotJackEndpoints(bay))
            : bay.type === "rack"
            ? bay.gear.filter(function(g){ return !opts.onlyGearId || g.id === opts.onlyGearId; }).reduce(function(acc, g){ return acc.concat(gearChannelEndpoints(g)); }, [])
            : (opts.onlyGearId ? [] : bay.ports.map(function(p){ return getEndpoint(p.id); }));
          eps.forEach(function(ep){
            if(capped || !ep) return;
            if(opts.clock){ // clock comes from a clock output, directly or through the patchbay
              if(ep.kind === "gear"){
                if(anchor.kind === "gear" && ep.gear.id === anchor.gear.id) return;
                if(chKind(ep) !== "clock") return;
              } else if(!clockOriginIsClockOut(ep.id)) return;
            }
            if(role === "to" ? !canReceiveAt(ep) : !canSendFrom(ep)) return;
            if(role === "to" ? checkLink(anchor.id, ep.id) : checkLink(ep.id, anchor.id)) return;
            var lbl = epLabel(ep);
            if(terms.length && !termsMatch(epDisplay(ep), terms)) return;
            if(shown >= 300){ capped = true; return; }
            shown++;
            var note = role === "to" && incomingLink(ep.id) ? "replaces its source" : (role === "to" && !incomingLink(ep.id) && normalledFrom(ep) ? "normalled" : "");
            rows += '<button type="button" class="lp-item" data-lp="'+escapeAttr(ep.id)+'">' + (lbl ? '<b>'+escapeHtml(lbl)+'</b>' : '') +
              '<span>'+escapeHtml(epPosition(ep))+'</span>' + (note ? '<em>'+note+'</em>' : '') + '</button>';
          });
          if(rows) html += '<div class="lp-bay">'+escapeHtml(bay.name)+'</div>' + rows;
        });
        list.innerHTML = html || (opts.clock && !terms.length
          ? '<p class="insp-empty">No clock outputs yet. On the piece that makes the clock, tick “Clock” on one of its outputs (or use “+ Clock out”) — patchbay ports fed by it will then show up here too.</p>'
          : '<p class="insp-empty">Nothing matches' + (opts.onlyGearId ? ' — that piece has no free channels.' : '.') + '</p>');
        hint.textContent = capped ? "Showing the first 300 — type to narrow the list." :
          (role === "to" ? "Pick where the signal goes. An input can only have one source, so choosing one that’s already fed will replace it."
                         : "Pick where the signal comes from.");
      }
      filter.addEventListener("input", paint);
      list.addEventListener("click", function(e){
        var item = e.target.closest("[data-lp]"); if(!item) return;
        var targetId = item.getAttribute("data-lp");
        if(ui.pick){ closeDialog(); completePick(targetId); return; }
        if(connectEndpoints(opts.epId, role, targetId, {clock:opts.clock})){ closeDialog(); renderGrid(); renderInspector(); }
      });
      var screenBtn = root.querySelector("#lpScreenBtn");
      if(screenBtn) screenBtn.addEventListener("click", function(){ closeDialog(); startPick(opts.epId, role); });
      paint();
    }
  });
}

/* the Inspector's signal-flow panel */
function flowBriefText(ep){
  if(canReceiveAt(ep)){
    var info = sourceInfo(ep.id);
    if(!info || !info.hops.length) return incomingLink(ep.id) ? "connected" : "not connected";
    var o = getEndpoint(info.hops[info.hops.length - 1].id);
    return "← " + (o ? (epLabel(o) || epPosition(o)) : "?");
  }
  var n = outgoingLinks(ep.id).filter(function(l){ return getEndpoint(l.to); }).length;
  return n ? "→ " + n + (n === 1 ? " destination" : " destinations") : "no destinations";
}
// withLabelInput = a channel row (gear / slot jack): one slim line, details open on demand.
// Port rows (withLabelInput false) show their details straight away.
function flowRowHtml(ep, withLabelInput, open){
  var id = ep.id, compact = !!withLabelInput;
  var html = '<div class="flow-row' + (compact ? ' flow-row--gear' + (open ? ' is-open' : '') : ' flow-row--solo') + '" data-ep="'+escapeAttr(id)+'">';
  if(compact){
    var chName = ep.kind === "slot" ? (ep.dir === "in" ? "IN" : "OUT") + " · slot " + ep.slot : (ep.dir === "in" ? "In " + ep.n : "Out " + ep.n);
    html += '<div class="flow-sum">' +
      '<button type="button" class="flow-toggle" data-flow-toggle="'+escapeAttr(id)+'" aria-expanded="'+(open ? "true" : "false")+'" title="Show or hide this channel’s connections"><span class="flow-caret" aria-hidden="true">▸</span>' + escapeHtml(chName) + '</button>' +
      '<input type="text" data-ch-label="'+escapeAttr(id)+'" value="'+escapeAttr(epTypedLabel(ep))+'" placeholder="Name this channel" maxlength="60" aria-label="Channel label" />' +
      (ep.kind === "gear" ? '<label class="flow-ckind" title="Mark this channel as a clock jack (word clock, ADAT sync…) so it shows on the Clock tab"><input type="checkbox" data-ch-clock="'+escapeAttr(id)+'"' + (chKind(ep) === "clock" ? ' checked' : '') + ' /> Clock</label>' : '') +
      '<span class="flow-brief">' + escapeHtml(flowBriefText(ep)) + '</span>' +
      '</div><div class="flow-detail">';
  }
  if(canReceiveAt(ep)){
    var inc = incomingLink(id), info = sourceInfo(id), norm = (!inc) ? normalledFrom(ep) : null;
    html += '<div class="flow-side"><span class="eyebrow">Comes from</span>';
    if(info){
      var chain = info.hops.slice().reverse();
      html += '<div class="flow-chain">' + chain.map(function(h, i){
        return epChipHtml(h.id) + '<span class="flow-arrow" aria-hidden="true">→</span>';
      }).join("") + '<span class="flow-norm">this</span></div>';
      if(!inc && norm) html += '<span class="flow-norm">Normalled from the jack above (column is ' + escapeHtml(ROUTING_LABELS[(getColumn(ep.bay, ep.port.index) || {}).state] || "Normal") + ').</span>';
      var lab = info.labeled, labText = lab ? epLabel(lab) : "";
      if(lab && labText !== epTypedLabel(ep)){
        html += '<div class="flow-src-label"><span>from <b>'+escapeHtml(labText)+'</b> · '+escapeHtml(epWhere(lab))+'</span>' +
          '<button type="button" class="btn btn-sm" data-flow-use-label="'+escapeAttr(id)+'" title="'+(epTypedLabel(ep) ? 'Replaces the label you typed' : 'Copy that name onto this one')+'">' + (epTypedLabel(ep) ? 'Replace label' : 'Use this label') + '</button></div>';
      }
    } else {
      html += '<span class="flow-none">Not connected.</span>';
    }
    if(inc) html += '<label class="flow-clk" title="Marks this cable as carrying clock, so the Clock tab follows it"><input type="checkbox" data-flow-clk="'+escapeAttr(inc.id)+'"' + (inc.clk ? ' checked' : '') + ' /> This cable carries clock</label>';
    if(inc) html += '<label class="flow-ct">Cable <select data-flow-ct="'+escapeAttr(inc.id)+'" aria-label="Cable type">' + cableTypeOptions(inc.ct) + '</select></label>';
    html += '<div class="btn-row">' +
      '<button type="button" class="btn btn-sm" data-flow-pick="from">' + (inc ? 'Change source…' : 'Set source…') + '</button>' +
      (inc ? '<button type="button" class="btn btn-sm btn-ghost" data-flow-unlink="'+escapeAttr(inc.id)+'">Remove link</button>' : '') +
      '</div></div>';
  } else if(!compact){
    html += '<div class="flow-side"><span class="eyebrow">Comes from</span><span class="flow-none">An output — signal starts here.</span></div>';
  }
  if(canSendFrom(ep)){
    var outs = outgoingLinks(id).filter(function(l){ return getEndpoint(l.to); }), nt = normalledTo(ep);
    html += '<div class="flow-side"><span class="eyebrow">Goes to</span>';
    if(!outs.length && !nt) html += '<span class="flow-none">Nowhere yet.</span>';
    outs.forEach(function(l){
      html += '<div class="flow-dest">' + epChipHtml(l.to) +
        '<button type="button" class="icon-btn" data-flow-unlink="'+escapeAttr(l.id)+'" title="Remove this link" aria-label="Remove link">×</button></div>';
    });
    if(nt) html += '<div class="flow-dest">' + epChipHtml(nt.id) + '<span class="flow-norm">normalled</span></div>';
    html += '<div class="btn-row"><button type="button" class="btn btn-sm" data-flow-pick="to">+ Add destination…</button></div></div>';
  } else if(!compact){
    html += '<div class="flow-side"><span class="eyebrow">Goes to</span><span class="flow-none">An input — signal ends here.</span></div>';
  }
  return html + (compact ? '</div>' : '') + '</div>';
}
function flowRowOpen(ep, total){
  var v = ui.flowOpen[ep.id];
  return v === undefined ? total <= 4 : !!v;
}
function flowTraceToggleHtml(){
  return '<label class="flow-trace"><input type="checkbox" data-flow-trace' + (ui.showTrace ? ' checked' : '') + ' /> Highlight the path on screen</label>';
}
function flowPanelHtml(kind, id){
  if(kind === "port"){
    var ep = getEndpoint(id);
    if(!ep) return "";
    return '<div class="flow-panel" data-fp-kind="port" data-fp-id="'+escapeAttr(id)+'"><div class="flow-head"><h3>Signal flow</h3>' + flowTraceToggleHtml() + '</div>' +
      '<div class="flow-rows">' + flowRowHtml(ep, false) + '</div></div>';
  }
  if(kind === "slot"){
    var pj = parseSlotJack(id), epIn = pj && getEndpoint(slotJackId(pj.bayId, pj.slot, "in")), epOut = pj && getEndpoint(slotJackId(pj.bayId, pj.slot, "out"));
    if(!epIn || !epOut) return "";
    return '<div class="flow-panel" data-fp-kind="slot" data-fp-id="'+escapeAttr(id)+'"><div class="flow-head"><h3>Signal flow</h3>' + flowTraceToggleHtml() + '</div>' +
      '<div class="flow-rows">' + flowRowHtml(epIn, true, flowRowOpen(epIn, 2)) + flowRowHtml(epOut, true, flowRowOpen(epOut, 2)) + '</div></div>';
  }
  var hit = findGear(id);
  if(!hit) return "";
  var g = hit.gear, chans = gearChannelEndpoints(g);
  return '<div class="flow-panel" data-fp-kind="gear" data-fp-id="'+escapeAttr(id)+'"><div class="flow-head"><h3>Channels &amp; signal flow</h3>' +
    '<div class="chan-row"><label>Inputs <input type="number" id="gearInsInput" min="0" max="'+MAX_GEAR_CH+'" value="'+(g.ins || 0)+'" /></label>' +
    '<label>Outputs <input type="number" id="gearOutsInput" min="0" max="'+MAX_GEAR_CH+'" value="'+(g.outs || 0)+'" /></label>' +
    '<button type="button" class="btn btn-sm" data-add-clock="in" title="Adds an input marked as clock — for word clock, ADAT sync…">+ Clock in</button>' +
    '<button type="button" class="btn btn-sm" data-add-clock="out" title="Adds an output marked as clock">+ Clock out</button>' +
    '<button type="button" class="btn btn-sm" data-bulk-ct title="Set the cable type on all of this piece’s cables at once">Cable type…</button></div>' +
    (chans.length ? flowTraceToggleHtml() : '') +
    (chans.length > 4 ? '<span class="flow-allbtns"><button type="button" class="btn btn-sm btn-ghost" data-flow-all="open">Expand all</button><button type="button" class="btn btn-sm btn-ghost" data-flow-all="close">Collapse all</button></span>' : '') + '</div>' +
    (chans.length ? '<div class="flow-rows">' + chans.map(function(ep){ return flowRowHtml(ep, true, flowRowOpen(ep, chans.length)); }).join("") + '</div>'
      : '<p class="insp-empty" style="padding:0;">Say how many inputs and outputs this piece has, and each one becomes a point you can connect — from a patchbay port, a snake channel, or another piece of gear.</p>') +
    '</div>';
}
function refreshFlowPanel(){
  var panel = document.querySelector("#inspectorBody .flow-panel");
  if(!panel) return;
  var html = flowPanelHtml(panel.getAttribute("data-fp-kind"), panel.getAttribute("data-fp-id"));
  var tmp = document.createElement("div");
  tmp.innerHTML = html;
  var fresh = tmp.firstChild;
  if(fresh){ panel.replaceWith(fresh); wireFlowPanel(); }
}
function wireFlowPanel(){
  var panel = document.querySelector("#inspectorBody .flow-panel");
  if(!panel) return;
  panel.addEventListener("click", function(e){
    var jump = e.target.closest("[data-flow-jump]");
    if(jump){ jumpToEndpoint(jump.getAttribute("data-flow-jump")); return; }
    var tog = e.target.closest("[data-flow-toggle]");
    if(tog){
      var trow = tog.closest(".flow-row"), nowOpen = !trow.classList.contains("is-open");
      trow.classList.toggle("is-open", nowOpen);
      tog.setAttribute("aria-expanded", nowOpen ? "true" : "false");
      ui.flowOpen[trow.getAttribute("data-ep")] = nowOpen;
      return;
    }
    var allBtn = e.target.closest("[data-flow-all]");
    if(allBtn){
      var openAll = allBtn.getAttribute("data-flow-all") === "open";
      Array.prototype.forEach.call(panel.querySelectorAll(".flow-row--gear"), function(r){
        r.classList.toggle("is-open", openAll);
        var tb = r.querySelector("[data-flow-toggle]"); if(tb) tb.setAttribute("aria-expanded", openAll ? "true" : "false");
        ui.flowOpen[r.getAttribute("data-ep")] = openAll;
      });
      return;
    }
    var bulkCt = e.target.closest("[data-bulk-ct]");
    if(bulkCt){ var bhit = findGear(panel.getAttribute("data-fp-id")); if(bhit) openGearCableTypeDialog(bhit.gear); return; }
    var addClk = e.target.closest("[data-add-clock]");
    if(addClk){
      var ghit = findGear(panel.getAttribute("data-fp-id"));
      if(ghit) addClockChannel(ghit.gear, addClk.getAttribute("data-add-clock"));
      return;
    }
    var un = e.target.closest("[data-flow-unlink]");
    if(un){ historyBreak(); removeLink(un.getAttribute("data-flow-unlink")); renderGrid(); refreshFlowPanel(); return; }
    var pick = e.target.closest("[data-flow-pick]");
    if(pick){
      var row = pick.closest(".flow-row");
      openLinkPicker({epId:row.getAttribute("data-ep"), role:pick.getAttribute("data-flow-pick")});
      return;
    }
    var use = e.target.closest("[data-flow-use-label]");
    if(use){
      var ep = getEndpoint(use.getAttribute("data-flow-use-label")), info = ep && sourceInfo(ep.id);
      if(!ep || !info || !info.labeled) return;
      historyBreak();
      setEpLabel(ep, epLabel(info.labeled));
      markDirty();
      renderGrid(); renderInspector();
    }
  });
  panel.addEventListener("input", function(e){
    var inp = e.target.closest("[data-ch-label]");
    if(!inp) return;
    var ep = getEndpoint(inp.getAttribute("data-ch-label"));
    if(!ep) return;
    setEpLabel(ep, inp.value);
    markDirty();
  });
  panel.addEventListener("change", function(e){
    if(e.target.matches("[data-flow-trace]")){ ui.showTrace = e.target.checked; renderGrid(); return; }
    if(e.target.matches("[data-ch-clock]")){
      var cep = getEndpoint(e.target.getAttribute("data-ch-clock"));
      if(!cep) return;
      historyBreak();
      setChKind(cep, e.target.checked ? "clock" : "audio");
      markDirty(); renderGrid();
      return;
    }
    if(e.target.matches("[data-flow-ct]")){
      historyBreak();
      setLinksCableType([e.target.getAttribute("data-flow-ct")], e.target.value);
      return;
    }
    if(e.target.matches("[data-flow-clk]")){
      var cLink = linkList().filter(function(l){ return l.id === e.target.getAttribute("data-flow-clk"); })[0];
      if(!cLink) return;
      historyBreak();
      if(e.target.checked) cLink.clk = true; else delete cLink.clk;
      markDirty();
      return;
    }
    var kind = panel.getAttribute("data-fp-kind");
    if(kind === "gear" && (e.target.id === "gearInsInput" || e.target.id === "gearOutsInput")){
      var hit = findGear(panel.getAttribute("data-fp-id"));
      if(!hit) return;
      historyBreak();
      var g = hit.gear;
      g.ins = clampChannels(document.getElementById("gearInsInput").value);
      g.outs = clampChannels(document.getElementById("gearOutsInput").value);
      g.chLabels = cleanChLabels(g.chLabels, g.ins, g.outs);
      g.chKinds = cleanChKinds(g.chKinds, g.ins, g.outs);
      markDirty(); renderGrid(); renderInspector();
    }
  });
}
// Fills only the empty labels on the selected ports from whatever feeds them.
function fillLabelsFromSources(ports){
  var n = 0;
  ports.forEach(function(p){
    if(p.label) return;
    var info = sourceInfo(p.id);
    if(info && info.labeled){ p.label = epLabel(info.labeled).slice(0, 60); n++; }
  });
  if(n){ historyBreak(); markDirty(); renderGrid(); renderInspector(); }
  showToast(n ? "Filled " + n + " empty label" + (n === 1 ? "" : "s") + " from their sources." : "No empty labels had a labelled source to copy.", n ? "success" : undefined);
}
// A plain-text list of every signal path, one row per end point.
function exportSignalFlowCSV(){
  var rows = [["from_label","from_bay","from_position","to_label","to_bay","to_position","via","carries_clock","cable_type"]];
  var idx = endpointIndex();
  function add(a, b, via, clk, ctName){ rows.push([epLabel(a), a.bay.name, epPosition(a), epLabel(b), b.bay.name, epPosition(b), via, clk ? "yes" : "", ctName || ""]); }
  linkList().forEach(function(l){ var a = idx[l.from], b = idx[l.to]; if(a && b) add(a, b, "cable", l.clk === true, cableTypeName(l)); });
  Object.keys(idx).forEach(function(id){
    var ep = idx[id], nt = normalledTo(ep);
    if(nt) add(ep, nt, "normalled");
  });
  if(rows.length === 1){ showToast("No links yet — connect some ports first.", "error"); return; }
  saveFile("patch-sheet-signal-flow.csv", rows.map(function(r){ return r.map(csvField).join(","); }).join("\r\n"));
}

// Redrawing the Inspector rebuilds its HTML, which would drop the cursor. Remember which field had it
// (and where in the text) and put it back, so the number arrows and Tab keep working.
function inspectorFocusKey(){
  var host = document.getElementById("inspectorBody"), a = document.activeElement;
  if(!host || !a || a === host || !host.contains(a)) return null;
  var sel = null;
  if(a.id) sel = "#" + a.id;
  else {
    for(var i = 0; i < a.attributes.length; i++){
      var at = a.attributes[i];
      if(at.name.indexOf("data-") === 0 && at.value !== ""){ sel = "[" + at.name + '="' + at.value.replace(/["\\]/g, "\\$&") + '"]'; break; }
    }
  }
  if(!sel) return null;
  var pos = null;
  try{ pos = {s:a.selectionStart, e:a.selectionEnd}; }catch(err){ /* number inputs have no selection */ }
  return {sel:sel, pos:pos};
}
function restoreInspectorFocus(k){
  if(!k) return;
  var el = null;
  try{ el = document.getElementById("inspectorBody").querySelector(k.sel); }catch(err){ return; }
  if(!el || el.disabled) return;
  el.focus();
  if(k.pos && k.pos.s !== null){ try{ el.setSelectionRange(k.pos.s, k.pos.e); }catch(err){ /* ignore */ } }
}
function renderInspector(){
  var k = inspectorFocusKey();
  renderInspectorBase(); lockInspector();
  restoreInspectorFocus(k);
}
function renderInspectorBase(){
  ui.prevInspGear = ui.inspGear; ui.inspGear = null;
  var host = document.getElementById("inspectorBody");
  var bay = getActiveBay();
  if(ui.section === "flow"){ renderFlowInspector(host); return; }
  if(ui.section === "clock"){
    host.innerHTML = '<div class="insp-bar"><p class="insp-empty">The Clock tab follows clock cables. Mark a piece’s clock jacks with “+ Clock in” / “+ Clock out” (or tick “Clock” on a channel) in its Inspector, then use “Set clock source…” here. Cables from a clock output into a clock input are picked up automatically.</p></div>';
    return;
  }
  if(isGearBay(bay)){ renderGearInspector(host, bay); return; }
  if(!bay && isGearSection(ui.section)){
    host.innerHTML = '<div class="insp-bar"><p class="insp-empty">' + (ui.section === "chassis" ? 'Add a 500 series chassis to get started.' : 'Add a rack to get started.') + '</p></div>';
    return;
  }
  var ports = selectedPorts(bay);
  if(!bay || ports.length === 0){
    host.innerHTML = '<div class="insp-bar"><p class="insp-empty">Select a port to edit it. Shift-click for a range, ⌘/Ctrl-click to add ports individually.</p></div>';
    return;
  }
  if(ports.length === 1){
    var p = ports[0];
    var order = bay.ports.map(function(x){return x.id;});
    var idx = order.indexOf(p.id);
    var posLabel = p.row ? (p.row.toUpperCase()+" "+p.index) : ("PORT "+p.index);
    host.innerHTML =
      '<div class="insp-bar">' +
      '<div class="field insp-id"><label>Port</label><div class="insp-id-row"><h2>'+escapeHtml(posLabel)+'</h2>' +
        '<div class="insp-nav">' +
          '<button class="icon-btn" id="prevPortBtn" '+(idx<=0?"disabled":"")+' title="Previous port" aria-label="Previous port">‹</button>' +
          '<button class="icon-btn" id="nextPortBtn" '+(idx>=order.length-1?"disabled":"")+' title="Next port" aria-label="Next port">›</button>' +
        '</div></div></div>' +
      '<div class="field field-grow"><label for="labelInput">Label</label><input type="text" id="labelInput" value="'+escapeAttr(p.label)+'" placeholder="e.g. Kick In" maxlength="60" /></div>' +
      '<div class="field field-grow"><label for="notesInput">Notes</label><input type="text" id="notesInput" value="'+escapeAttr(p.notes)+'" placeholder="Optional — cable run, gain, anything worth remembering" /></div>' +
      '<div class="field"><label for="groupSelect">Device group</label>' +
        '<div class="group-picker"><select id="groupSelect">'+groupOptionsHtml(p.groupId)+'</select></div></div>' +
      (bay.type==="trs" ? '<div class="field"><label>Routing</label>'+routingSegHtml((getColumn(bay,p.index)||{}).state||"normal")+'</div>' : '') +
      '</div>' + flowPanelHtml("port", p.id);
    wireFlowPanel();
    var labelInput = document.getElementById("labelInput");
    labelInput.addEventListener("input", function(){ p.label = labelInput.value; renderPortInGrid(p); markDirty(); });
    labelInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); advanceSelection(bay, 1); }
    });
    var notesInput = document.getElementById("notesInput");
    notesInput.addEventListener("input", function(){ p.notes = notesInput.value; renderPortInGrid(p); markDirty(); });
    document.getElementById("groupSelect").addEventListener("change", function(e){
      p.groupId = e.target.value || null; renderPortInGrid(p); markDirty();
    });
    var routingSeg = document.getElementById("routingSeg");
    if(routingSeg){
      routingSeg.addEventListener("click", function(e){
        var btn = e.target.closest(".seg-btn"); if(!btn) return;
        var newState = btn.getAttribute("data-state");
        setColumnState(bay, p.index, newState);
        renderGlyphInGrid(bay, p.index);
        Array.prototype.forEach.call(routingSeg.querySelectorAll(".seg-btn"), function(b){
          b.classList.toggle("is-active", b.getAttribute("data-state")===newState);
        });
        markDirty();
        refreshFlowPanel();
        if(linkList().length) renderGrid(); // the normalled path may have changed
      });
    }
    var prevBtn = document.getElementById("prevPortBtn");
    var nextBtn = document.getElementById("nextPortBtn");
    if(prevBtn) prevBtn.addEventListener("click", function(){ advanceSelection(bay, -1); });
    if(nextBtn) nextBtn.addEventListener("click", function(){ advanceSelection(bay, 1); });
    setTimeout(function(){ labelInput.focus(); labelInput.setSelectionRange(labelInput.value.length, labelInput.value.length); }, 0);
  } else {
    var bulkColState = null;
    if(bay.type === "trs"){
      var seenStates = {};
      ports.forEach(function(pp){ var c=getColumn(bay,pp.index); if(c) seenStates[c.state]=true; });
      var stateKeys = Object.keys(seenStates);
      bulkColState = stateKeys.length===1 ? stateKeys[0] : null;
    }
    host.innerHTML =
      '<div class="insp-bar">' +
      '<div class="field insp-id"><label>Selection</label><div class="insp-id-row"><h2>'+ports.length+' ports</h2></div></div>' +
      '<div class="field field-grow"><label for="bulkGroupSelect">Assign device group</label>' +
        '<select id="bulkGroupSelect">'+groupOptionsHtml(null)+'</select></div>' +
      '<div class="field field-grow"><label for="fillBase">Fill labels with numbering</label>' +
        '<div class="fill-row">' +
          '<input type="text" id="fillBase" placeholder="e.g. Overhead  (or Tom # for Tom 1, Tom 2…)" maxlength="50" title="Numbers are added in port order. Put # where the number should go; otherwise it\'s added after the text." />' +
          '<input type="text" inputmode="numeric" id="fillStart" value="1" aria-label="Start numbering at" title="Start numbering at" />' +
          '<button class="btn btn-sm" id="fillBtn" type="button">Fill</button>' +
        '</div></div>' +
      (bay.type==="trs" ? '<div class="field"><label>Routing</label>'+routingSegHtml(bulkColState)+'</div>' : '') +
      '<div class="field"><label>Actions</label><div class="btn-row">' +
        '<button class="btn btn-sm" id="bulkApplyBtn" type="button">Apply group</button>' +
        '<button class="btn btn-sm btn-ghost" id="bulkClearGroupBtn" type="button">Clear group</button>' +
        '<button class="btn btn-sm btn-ghost" id="bulkClearLabelsBtn" type="button">Clear labels</button>' +
        (linkList().length ? '<button class="btn btn-sm btn-ghost" id="bulkFromSourcesBtn" type="button" title="Copies a source\'s name onto each selected port that has no label yet — labels you typed are left alone">Fill empty labels from sources</button>' : '') +
        '<button class="btn btn-sm btn-ghost" id="bulkDeselectBtn" type="button">Deselect</button>' +
      '</div></div>' +
      '</div>';
    document.getElementById("bulkApplyBtn").addEventListener("click", function(){
      var gid = document.getElementById("bulkGroupSelect").value || null;
      ports.forEach(function(pp){ pp.groupId = gid; });
      markDirty(); renderGrid(); renderInspector();
    });
    document.getElementById("bulkClearGroupBtn").addEventListener("click", function(){
      ports.forEach(function(pp){ pp.groupId = null; });
      markDirty(); renderGrid(); renderInspector();
    });
    var fromSrcBtn = document.getElementById("bulkFromSourcesBtn");
    if(fromSrcBtn) fromSrcBtn.addEventListener("click", function(){ fillLabelsFromSources(ports); });
    document.getElementById("bulkClearLabelsBtn").addEventListener("click", function(){
      ports.forEach(function(pp){ pp.label=""; pp.notes=""; });
      markDirty(); renderGrid(); renderInspector();
    });
    function fillLabels(){
      var baseInput = document.getElementById("fillBase");
      var base = baseInput.value.trim();
      if(!base){ baseInput.focus(); return; }
      var startVal = parseInt(document.getElementById("fillStart").value, 10);
      var start = isFinite(startVal) ? startVal : 1;
      ports.forEach(function(pp, i){ pp.label = numberedLabel(base, start + i).slice(0, 60); });
      markDirty(); renderGrid(); renderInspector();
    }
    document.getElementById("fillBtn").addEventListener("click", fillLabels);
    document.getElementById("fillBase").addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); fillLabels(); }
    });
    document.getElementById("bulkDeselectBtn").addEventListener("click", clearSelection);
    var bulkRoutingSeg = document.getElementById("routingSeg");
    if(bulkRoutingSeg){
      bulkRoutingSeg.addEventListener("click", function(e){
        var btn = e.target.closest(".seg-btn"); if(!btn) return;
        var newState = btn.getAttribute("data-state");
        var seenCols = {};
        ports.forEach(function(pp){
          if(!seenCols[pp.index]){ seenCols[pp.index]=true; setColumnState(bay, pp.index, newState); }
        });
        markDirty(); renderGrid(); renderInspector();
      });
    }
  }
}
// "Tom #" + 3 -> "Tom 3"; "Overhead" + 2 -> "Overhead 2".
function numberedLabel(base, n){
  return base.indexOf("#") !== -1 ? base.replace(/#/g, String(n)) : (base + " " + n);
}
function advanceSelection(bay, dir){
  var order = bay.ports.map(function(p){return p.id;});
  var cur = ui.anchor || ui.selection[0];
  var idx = order.indexOf(cur);

function groupsUsedByBayRaw(bay){

/* ---------- copying a bay (duplicate / from template) ---------- */
// Builds a fresh copy of a bay under a new id. Port ids embed the bay id and
// gear ids are their own, so both are reissued. Device groups are carried by
// name: a group that already exists in this project is reused, a missing one
// is created, so a template never silently drops its color coding.
function uniqueBayName(type, base){
  var names = baysOfType(type).map(function(b){ return b.name.toLowerCase(); });
  if(names.indexOf(base.toLowerCase()) === -1) return base;
  var n = 2;
  while(names.indexOf((base + " (" + n + ")").toLowerCase()) !== -1) n++;
  return base + " (" + n + ")";
}
function copyBayData(bayRaw, srcGroups, name, sameProject, srcLinks){
  var raw = JSON.parse(JSON.stringify(bayRaw));
  var oldId = raw.id, newId = raw.type + "-" + uid();
  var map = {}, epMap = {}; // epMap: old endpoint id -> new endpoint id, so links inside the bay survive the copy
  (srcGroups || []).forEach(function(g){
    var target = sameProject ? getGroup(g.id) : null;
    if(!target) target = state.groups.filter(function(x){ return x.name.toLowerCase() === String(g.name).toLowerCase(); })[0];
    if(!target){ target = {id:"grp-"+uid(), name:String(g.name), color:String(g.color || "#888888")}; state.groups.push(target); }
    map[g.id] = target.id;
  });
  function mapGroup(id){ return (id && map[id]) ? map[id] : null; }
  if(raw.type === "chassis"){
    for(var sn = 1; sn <= clampSlots(raw.slots || raw.heightU); sn++){
      epMap[slotJackId(oldId, sn, "in")] = slotJackId(newId, sn, "in");
      epMap[slotJackId(oldId, sn, "out")] = slotJackId(newId, sn, "out");
    }
  }
  if(raw.type === "rack" || raw.type === "chassis"){
    raw.gear = (raw.gear || []).map(function(g){
      var c = {}; Object.keys(g).forEach(function(k){ c[k] = g[k]; });
      c.id = "gear-" + uid(); c.groupId = mapGroup(g.groupId);
      for(var i = 1; i <= clampChannels(g.ins); i++) epMap[gearChId(g.id, "in", i)] = gearChId(c.id, "in", i);
      for(var j = 1; j <= clampChannels(g.outs); j++) epMap[gearChId(g.id, "out", j)] = gearChId(c.id, "out", j);
      return c;
    });
  } else {
    raw.ports = (raw.ports || []).filter(function(pt){ return pt.id && pt.id.indexOf(oldId + "-") === 0; }).map(function(pt){
      var c = {}; Object.keys(pt).forEach(function(k){ c[k] = pt[k]; });
      c.id = newId + pt.id.slice(oldId.length); c.groupId = mapGroup(pt.groupId);
      epMap[pt.id] = c.id;
      return c;
    });
  }
  raw.id = newId;
  raw.name = name;
  var copy = normalizeState({bays:[raw], groups: state.groups}).bays[0];
  copy._links = (srcLinks || []).filter(function(l){ return l && epMap[l.from] && epMap[l.to]; }).map(function(l){ var o = {from:epMap[l.from], to:epMap[l.to]}; if(l.clk === true) o.clk = true; if(l.ct) o.ct = l.ct; return o; });
  return copy;
}
function insertBay(bay, afterId){
  var carried = bay._links || [];
  delete bay._links;
  var at = -1;
  if(afterId){ state.bays.forEach(function(b, i){ if(b.id === afterId) at = i; }); }
  if(at === -1) state.bays.push(bay); else state.bays.splice(at + 1, 0, bay);
  carried.forEach(function(l){ linkRev++; if(!checkLink(l.from, l.to) && !incomingLink(l.to)){ var nl = {id:"lnk-" + uid(), from:l.from, to:l.to}; if(l.clk === true) nl.clk = true; if(l.ct && cableTypeExists(l.ct)) nl.ct = l.ct; state.links.push(nl); } });
  ui.section = bay.type;
  ui.activeBay[bay.type] = bay.id;
  clearSelectionSilently();
  markDirty();
  renderAll();
}
function duplicateBay(bayId){
  var bay = getBay(bayId);
  if(!bay) return;
  historyBreak();
  var copy = copyBayData(bay, groupsUsedByBayRaw(bay), uniqueBayName(bay.type, bay.name + " copy"), true, bayInternalLinks(bay));
  insertBay(copy, bay.id);
  showToast('Duplicated “'+bay.name+'”.', "success");
}
function addBayFromTemplate(tplId){
  var t = loadTemplates().filter(function(x){ return x.id === tplId && x.kind === "bay"; })[0];
  if(!t){ showToast("That template is gone.", "error"); return; }
  historyBreak();
  var src = t.data.bay;
  var copy = copyBayData(src, t.data.groups, uniqueBayName(src.type, src.name || t.name), false, t.data.links);
  if(ui.viewMode === "compare" && !isGearBay(copy)){ ui.viewMode = "compact"; try{ localStorage.setItem(VIEWMODE_KEY, "compact"); }catch(e){ /* ignore */ } }
  insertBay(copy, null);
  showToast('Added “'+copy.name+'” from template.', "success");
}

function addProjectFromState(st){
  var id = "prj-" + uid();
  if(!lsSet(projectKey(id), JSON.stringify(st))){ showToast("Couldn't create the project — device storage is full.", "error"); return null; }
  projectIndex.projects.push({id:id, name:st.name, updated:Date.now(), bays:st.bays.length});
  saveProjectIndex();
  return id;
}
function resetProjectUi(){
  ui.section = "xlr"; ui.activeBay = {}; ui.compareIds = {}; ui.highlightGroup = null; cancelPickSilently();
  clearSelectionSilently();
  ui.search = {q:"", results:[], active:0};
  var si = document.getElementById("searchInput"); if(si) si.value = "";
  hideSearchResults();
}
function switchProject(id){
  if(!id || id === currentProjectId) return;
  var next = loadProjectState(id);
  if(!next){ showToast("Couldn't open that project.", "error"); return; }
  if(currentProjectId){
    saveLocalDraft();
    historyStash[currentProjectId] = {u:undoStack, r:redoStack};
  }
  currentProjectId = id;
  saveProjectIndex();
  state = next;
  resetHistory();
  var stash = historyStash[id];
  if(stash){ undoStack = stash.u; redoStack = stash.r; updateUndoButtons(); }
  resetProjectUi();
  setSaveStatus(false);
  renderAll();
}
function createProject(name, templateId){
  var st = null;
  if(templateId){
    var t = loadTemplates().filter(function(x){ return x.id === templateId && x.kind === "project"; })[0];
    if(t) st = normalizeState(JSON.parse(JSON.stringify(t.data)));
  }
  if(!st) st = createDefaultState();
  st.name = uniqueProjectName(name || nextProjectName());
  var id = addProjectFromState(st);
  if(!id) return;
  switchProject(id);
  showToast('Started “'+st.name+'”. Your other projects are in the project menu.', "success");
}
function renameProject(name){
  name = String(name || "").trim();
  if(!name || name === state.name) return;
  var others = projectIndex.projects.filter(function(pr){ return pr.id !== currentProjectId; }).map(function(pr){ return String(pr.name).toLowerCase(); });
  var final = name, n = 2;
  while(others.indexOf(final.toLowerCase()) !== -1){ final = name + " (" + n + ")"; n++; }
  historyBreak();
  state.name = final.slice(0, 80);
  markDirty();
  renderMenus();
}
function duplicateProject(){
  saveLocalDraft();
  var st = normalizeState(JSON.parse(JSON.stringify(state)));
  st.name = uniqueProjectName(state.name + " copy");
  var id = addProjectFromState(st);
  if(id){ switchProject(id); showToast('Duplicated into “'+st.name+'”.', "success"); }
}
function deleteCurrentProject(){
  var id = currentProjectId, name = state.name;
  lsRemove(projectKey(id));
  delete historyStash[id];
  projectIndex.projects = projectIndex.projects.filter(function(pr){ return pr.id !== id; });
  currentProjectId = null; // so the departing project is not written back
  var nextId;
  if(projectIndex.projects.length){
    nextId = projectIndex.projects.slice().sort(function(a, b){ return (b.updated||0) - (a.updated||0); })[0].id;
  } else {
    var fresh = createDefaultState(); fresh.name = "My project";
    nextId = addProjectFromState(fresh);
  }
  switchProject(nextId);
  showToast('Deleted “'+name+'”.');
}

/* ---------- add snake / change snake counts modal ---------- */
function openSnakeModal(mode, bayId){
  var bay = mode === "resize" ? getBay(bayId) : null;
  ui.snakeModal = {
    mode: mode, bayId: bayId || null,
    sends: bay ? bay.sends : SNAKE_DEFAULT_SENDS,
    returns: bay ? bay.returns : SNAKE_DEFAULT_RETURNS
  };
  renderSnakeModal();
}
function closeSnakeModal(){
  ui.snakeModal = null;
  document.getElementById("modalHost").innerHTML = "";
}
function snakeSegHtml(id, label, options, active){
  return '<div class="field"><label>'+label+'</label><div class="segmented" id="'+id+'" role="group" aria-label="'+label+'">' +
    options.map(function(n){
      return '<button type="button" class="seg-btn'+(n===active?' is-active':'')+'" data-n="'+n+'">'+n+'</button>';
    }).join("") + '</div></div>';
}
function renderSnakeModal(){
  var host = document.getElementById("modalHost");
  var m = ui.snakeModal;
  if(!m){ host.innerHTML = ""; return; }
  var bay = m.mode === "resize" ? getBay(m.bayId) : null;
  if(m.mode === "resize" && !bay){ closeSnakeModal(); return; }
  var loss = bay ? snakeResizeLoss(bay, m.sends, m.returns) : 0;
  var isResize = m.mode === "resize";
  host.innerHTML =
    '<div class="modal-overlay" id="snakeOverlay">' +
      '<div class="modal" role="dialog" aria-modal="true" aria-label="'+(isResize?"Change channel counts":"Add snake")+'" style="width:min(460px,100%);">' +
        '<div class="modal-head"><h2>'+(isResize?"Change channel counts":"Add snake")+'</h2><button type="button" class="icon-btn" id="closeSnakeBtn" aria-label="Close">×</button></div>' +
        '<div class="modal-body stack">' +
          snakeSegHtml("snakeSendsSeg", "Sends (stage → console)", SNAKE_SENDS, m.sends) +
          snakeSegHtml("snakeReturnsSeg", "Returns (console → stage)", SNAKE_RETURNS, m.returns) +
          '<p class="insp-empty" id="snakeSummary" style="padding:0;">'+snakeSummaryText(m, bay, loss)+'</p>' +
          '<div class="btn-row"><button type="button" class="btn btn-sm '+(loss?'btn-danger':'btn-primary')+'" id="saveSnakeBtn">'+snakeSaveLabel(m, loss)+'</button></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.getElementById("closeSnakeBtn").addEventListener("click", closeSnakeModal);
  document.getElementById("snakeOverlay").addEventListener("click", function(e){ if(e.target.id === "snakeOverlay") closeSnakeModal(); });
  function wireSeg(id, key){
    document.getElementById(id).addEventListener("click", function(e){
      var btn = e.target.closest(".seg-btn"); if(!btn) return;
      m[key] = Number(btn.getAttribute("data-n"));
      renderSnakeModal();
      var again = document.querySelector('#'+id+' .seg-btn.is-active'); if(again) again.focus();
    });
  }
  wireSeg("snakeSendsSeg", "sends");
  wireSeg("snakeReturnsSeg", "returns");
  document.getElementById("saveSnakeBtn").addEventListener("click", function(){
    var mode = m.mode, id = m.bayId, sends = m.sends, returns = m.returns;
    closeSnakeModal();
    if(mode === "resize") resizeSnake(id, sends, returns);
    else addBay("snake", {sends:sends, returns:returns});
  });
  setTimeout(function(){ var b = document.getElementById("saveSnakeBtn"); if(b) b.focus(); }, 0);
}
function snakeSummaryText(m, bay, loss){
  var rows = snakeRowCount(m.sends, "send");
  var base = m.sends + ' sends in ' + rows + ' row' + (rows===1?'':'s') + ' of ' + snakeCols(m.sends, "send") + ' · ' + m.returns + ' returns in ' + snakeRowCount(m.returns, "return") + ' row' + (snakeRowCount(m.returns, "return")===1?'':'s') + '.';
  if(bay && loss){
    return base + ' <strong style="color:var(--danger)">'+loss+' labeled channel'+(loss===1?'':'s')+' past these counts will be removed.</strong> You can undo it with ⌘/Ctrl+Z.';
  }
  if(bay && (m.sends !== bay.sends || m.returns !== bay.returns)) return base + ' Existing labels are kept.';
  return base;
}
function snakeSaveLabel(m, loss){
  if(m.mode === "add") return "Create snake";
  return loss ? "Remove " + loss + " labeled channel" + (loss===1?"":"s") + " & save" : "Save counts";
}

// Names already used on any rack (most recent size wins), offered as suggestions
// in the Add Gear modal so repeat gear is two keystrokes.
function knownGearNames(type){
  var map = {}, order = [];
  baysOfType(type || "rack").forEach(function(r){
    (r.gear || []).forEach(function(g){
      var key = String(g.name || "").trim().toLowerCase();
      if(!key) return;
      if(!map[key]){ order.push(key); }
      map[key] = { name: String(g.name).trim(), heightU: g.heightU, width: g.width, ins: g.ins || 0, outs: g.outs || 0 };
    });
  });
  return order.sort().map(function(k){ return map[k]; });
}
function renderAddGearModal(){
  var host = document.getElementById("modalHost");
  if(!ui.addGearModalOpen){ host.innerHTML=""; return; }
  var rack = getBay(ui.addGearRackId);
  if(!rack){ closeAddGearModal(); return; }
  var chosenHeight = 1, chosenWidth = "full";
  var chassis = rack.type === "chassis";
  var at = ui.addGearAt;
  var known = knownGearNames(rack.type);
  var sizeTouched = false;
  var datalistHtml = '<datalist id="gearNameList">' + known.map(function(k){ return '<option value="'+escapeHtml(k.name)+'"></option>'; }).join("") + '</datalist>';
  host.innerHTML =
    '<div class="modal-overlay" id="addGearOverlay">' +
      '<div class="modal" role="dialog" aria-modal="true" aria-label="'+(chassis ? 'Add module' : 'Add gear')+'" style="width:min(420px,100%);">' +
        '<div class="modal-head"><h2>'+(chassis ? 'Add module' : 'Add gear')+'</h2><button type="button" class="icon-btn" id="closeAddGearBtn" aria-label="Close">×</button></div>' +
        '<div class="modal-body stack">' +
          '<div class="field field-grow"><label for="gearNameInput2">Name</label>' +
            '<input type="text" id="gearNameInput2" placeholder="'+(chassis ? 'e.g. API 512c mic pre' : 'e.g. SSL Bus Compressor')+'" maxlength="60" list="gearNameList" autocomplete="off" />'+datalistHtml+'</div>' +
          (chassis
            ? '<div class="field"><label>Width</label>'+gearHeightSegHtml(chosenHeight, "addGearHeightSeg", true)+'</div>'
            : '<div class="field"><label>Height</label>'+gearHeightSegHtml(chosenHeight, "addGearHeightSeg")+'</div>' +
              '<div class="field"><label>Width</label>'+gearWidthSegHtml(chosenWidth, "addGearWidthSeg")+'</div>' +
              '<div class="field"><label>Channels <span style="text-transform:none;letter-spacing:0;">(optional — for signal-flow links)</span></label><div class="chan-row">' +
                '<label>Inputs <input type="number" id="addGearIns" min="0" max="'+MAX_GEAR_CH+'" value="0" /></label>' +
                '<label>Outputs <input type="number" id="addGearOuts" min="0" max="'+MAX_GEAR_CH+'" value="0" /></label></div></div>') +
          '<p class="insp-empty" style="padding:0;">'+(at ? (chassis ? 'Placing it in slot '+(at.topU+1)+' where you double-clicked · ' : 'Placing it at U'+(at.topU+1)+' where you double-clicked · ') : '')+unitText(rack, rackFreeU(rack))+' free in this '+(chassis ? 'chassis' : 'rack')+'</p>' +
          '<div class="btn-row"><button type="button" class="btn btn-primary btn-sm" id="createGearBtn">'+(chassis ? 'Add to chassis' : 'Add to rack')+'</button>' +
            '<button type="button" class="btn btn-sm btn-ghost" id="gearFromLibraryBtn">Choose from library…</button></div>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.getElementById("gearFromLibraryBtn").addEventListener("click", function(){
    var rid = rack.id, where = at;
    closeAddGearModal();
    openGearLibrary({rackId: rid, at: where});
  });
  document.getElementById("closeAddGearBtn").addEventListener("click", closeAddGearModal);
  document.getElementById("addGearOverlay").addEventListener("click", function(e){ if(e.target.id==="addGearOverlay") closeAddGearModal(); });
  var heightSeg = document.getElementById("addGearHeightSeg");
  var widthSeg = document.getElementById("addGearWidthSeg") || document.createElement("div");
  function paintHeight(){ Array.prototype.forEach.call(heightSeg.querySelectorAll(".seg-btn"), function(b){ b.classList.toggle("is-active", Number(b.getAttribute("data-height"))===chosenHeight); }); }
  function paintWidth(){ Array.prototype.forEach.call(widthSeg.querySelectorAll(".seg-btn"), function(b){ b.classList.toggle("is-active", b.getAttribute("data-width")===chosenWidth); }); }
  heightSeg.addEventListener("click", function(e){
    var btn = e.target.closest(".seg-btn"); if(!btn) return;
    chosenHeight = Number(btn.getAttribute("data-height")); sizeTouched = true; paintHeight();
  });
  widthSeg.addEventListener("click", function(e){
    var btn = e.target.closest(".seg-btn"); if(!btn) return;
    chosenWidth = btn.getAttribute("data-width"); sizeTouched = true; paintWidth();
  });
  var nameInput = document.getElementById("gearNameInput2");
  // Typing / picking a name you've used before pre-fills its height and width
  // (until you set the size by hand).
  nameInput.addEventListener("input", function(){
    if(sizeTouched) return;
    var key = nameInput.value.trim().toLowerCase();
    var hit = known.filter(function(k){ return k.name.toLowerCase() === key; })[0];

// Reusable gear (name, size, notes, photo) kept on this device and shared by every
// project. Entries carry no device group — groups belong to a project.
function loadGearLib(){
  try{
    var parsed = JSON.parse(lsGet(GEARLIB_KEY));
    if(parsed && Array.isArray(parsed.items)){
      return parsed.items.filter(function(it){ return it && it.id && typeof it.name === "string" && it.name.trim(); }).map(function(it){
        var mod = it.kind === "module"; // "module" = a 500 series module; anything else is rack gear
        return {id:String(it.id), kind:mod ? "module" : "rack", name:it.name.slice(0,60), notes:typeof it.notes === "string" ? it.notes : "",
          heightU:mod ? clampModuleSpan(it.heightU) : clampGearHeight(it.heightU), width:(!mod && it.width === "half") ? "half" : "full",
          photoId:validPhotoId(it.photoId) ? it.photoId : null, photoX:clampPct(it.photoX), photoY:clampPct(it.photoY), photoFit:it.photoFit === "whole" ? "whole" : "fill",
          ins:mod ? 0 : clampChannels(it.ins), outs:mod ? 0 : clampChannels(it.outs)};
      });
    }
  }catch(e){ /* ignore */ }
  return [];
}
function saveGearLib(items){

  return true;
}
function sortedGearLib(){

}
// Returns {entry, created} on success (created = it was a new entry, not an update), or null.

function saveGearToLibrary(g, opts){
  opts = opts || {};
  var name = String(g.name || "").trim();
  var home = findGear(g.id), kind = home && home.bay.type === "chassis" ? "module" : "rack";
  if(!name){ showToast("Give the " + (kind === "module" ? "module" : "piece") + " a name first, then save it to the library.", "error"); return null; }
  var items = loadGearLib();
  var existing = items.filter(function(it){ return it.kind === kind && it.name.toLowerCase() === name.toLowerCase(); })[0];
  var entry = existing || {id:"lib-" + uid()};
  entry.kind = kind;
  entry.name = name; entry.notes = g.notes || ""; entry.heightU = g.heightU; entry.width = kind === "module" ? "full" : g.width;
  entry.photoId = g.photoId || null; entry.photoX = clampPct(g.photoX); entry.photoY = clampPct(g.photoY);
  entry.photoFit = g.photoFit === "whole" ? "whole" : "fill";
  entry.ins = kind === "module" ? 0 : clampChannels(g.ins); entry.outs = kind === "module" ? 0 : clampChannels(g.outs);
  if(!existing) items.push(entry);
  if(!saveGearLib(items)) return null;

  return {entry:entry, created:!existing};
}

/* ---------- export: canvas image ---------- */
function wrapText(ctx, text, maxWidth, maxLines){
  var words = String(text).split(/\s+/).filter(Boolean);
  if(words.length===0) return [];
  var lines = [], current = "";
  for(var i=0;i<words.length;i++){
    var test = current ? current + " " + words[i] : words[i];
    if(ctx.measureText(test).width > maxWidth && current){
      lines.push(current);
      current = words[i];
      if(lines.length === maxLines){ current=""; break; }
    } else {
      current = test;
    }
  }
  if(current) lines.push(current);
  if(lines.length > maxLines) lines = lines.slice(0, maxLines);
  var last = lines[lines.length-1];
  if(last){
    while(ctx.measureText(last+"…").width > maxWidth && last.length>1){ last = last.slice(0,-1); }
    if(words.join(" ").length > lines.join(" ").length) lines[lines.length-1] = last + "…";
  }
  return lines;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function canvasLayoutRows(bay){
  return bay.type === "xlr"
    ? [{tag:null, ports: bay.ports, sectionEnd:false}]

}
function drawRoutingGlyph(ctx, x, y, state, lineColor, faintColor){
  if(state === "thru"){
    ctx.fillStyle = faintColor;
    ctx.font = "600 15px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("×", x, y+1);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    return;
  }
  var halfH = 7;
  ctx.strokeStyle = lineColor; ctx.lineWidth = 2.5; ctx.lineCap = "round";
  ctx.setLineDash(state === "half-normal" ? [3,3] : []);
  ctx.beginPath(); ctx.moveTo(x, y-halfH); ctx.lineTo(x, y+halfH); ctx.stroke();
  ctx.setLineDash([]);
}
// Shared sizing constants for every canvas export (single-bay or master
// sheet) so the two stay visually consistent with each other.
var CANVAS_METRICS = {CELL:96, GAP:12, CHUNK:8, CHUNK_GAP:14, SECTION_GAP:16};
// Measures one bay's row/column layout without drawing anything, so both
// drawBayCanvas (one bay) and drawMasterSheetCanvas (many bays sharing one
// tall canvas) can size themselves from the same numbers.
function layoutBay(bay, m){
  if(bay.type === "snake") return layoutSnake(bay, m);
  var INNER_GAP = bay.type === "trs" ? 34 : m.GAP;
  var layoutRows = canvasLayoutRows(bay);
  var cols = layoutRows[0].ports.length;
  function chunkOffset(i){ return Math.floor(i / m.CHUNK) * m.CHUNK_GAP; }
  var gridW = (cols-1)*(m.CELL+m.GAP) + m.CELL + chunkOffset(cols-1);
  var rowYs = [], cursorY = 0;
  layoutRows.forEach(function(r, i){
    rowYs.push(cursorY);
    var isStripTop = bay.type === "trs" && (i % 2 === 0);
    cursorY += m.CELL + (isStripTop ? INNER_GAP : m.GAP) + (r.sectionEnd ? m.SECTION_GAP : 0);
  });
  var gridH = cursorY - m.GAP;
  return {layoutRows:layoutRows, cols:cols, gridW:gridW, gridH:gridH, rowYs:rowYs, chunkOffset:chunkOffset};
}
// Stage-box layout: sends in rows of 4 on the left, a divider, returns in rows
// of 4 on the right. Rows carry their own x offset (x0) and y so the shared
// cell drawing in drawBayContent can place them.
var SNAKE_CANVAS = {TAG_H:26, SEP:56};

      ctx.fillStyle = colors.faintColor;
      ctx.font = "600 11px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
      ctx.textAlign = "right";
      ctx.fillText(rowLabel, leftPad-14, yTop + m.CELL/2 + 4);
      ctx.textAlign = "left";
    }
    portsInRow.forEach(function(p, i){
      var x = leftPad + x0 + i*(m.CELL+m.GAP) + layout.chunkOffset(i);
      var group = p.groupId ? getGroup(p.groupId) : null;
      ctx.fillStyle = colors.cellColor;
      roundRect(ctx,x,yTop,m.CELL,m.CELL,10); ctx.fill();
      ctx.lineWidth = group ? 4 : 1.5;
      ctx.strokeStyle = group ? group.color : colors.borderColor;
      roundRect(ctx,x+ctx.lineWidth/2,yTop+ctx.lineWidth/2,m.CELL-ctx.lineWidth,m.CELL-ctx.lineWidth,9); ctx.stroke();

      ctx.fillStyle = colors.faintColor;
      ctx.font = "500 12px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
      ctx.fillText((bay.type === "snake" && p.row === "return") ? "R"+p.index : String(p.index), x+10, yTop+20);

      ctx.font = "500 13px 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif";
      ctx.fillStyle = p.label ? colors.inkColor : colors.faintColor;
      ctx.textAlign = "center";
      var text = p.label || "—";
      var lines = p.label ? wrapText(ctx, text, m.CELL-16, 3) : ["—"];
      var lh = 16, startY = yTop + m.CELL/2 - ((lines.length-1)*lh)/2 + 5;
      lines.forEach(function(ln, li){ ctx.fillText(ln, x+m.CELL/2, startY+li*lh); });
      ctx.textAlign = "left";

      if(p.notes){
        ctx.fillStyle = colors.accentColor;

      var yBottomEdge = topY + layout.rowYs[bottomRowIdx];
      var yMid = (yTopEdge + yBottomEdge) / 2;
      strip.top.forEach(function(p, i){

function drawPanelChrome(ctx, canvasW, canvasH, panelColor){

        h += '<div class="field"><label>Format</label>' + seg("format", [["png", "PNG"], ["jpg", "JPG"]], P.format) + '</div>';

        else if(P.output === "zip") info = bays.length + " pictures, delivered together in one .zip file.";
        else {

          info = "Picture size: " + pl.outW.toLocaleString() + " × " + pl.outH.toLocaleString() + " px" + (pl.scale < 1 ? " — scaled down to " + Math.round(pl.scale * 100) + "% to fit the image-size limit." : ".");
        }
        h += '<p class="insp-empty" id="expInfo" style="padding:0;">' + escapeHtml(info) + '</p>';
        // keep the keyboard focus where it was across the redraw
        var a = document.activeElement, key = null;
        if(a && host.contains(a)){
          if(a.name === "expScope") key = 'input[name="expScope"][value="' + a.value + '"]';
          else if(a.hasAttribute("data-exp-bay")) key = '[data-exp-bay="' + a.getAttribute("data-exp-bay") + '"]';
          else if(a.hasAttribute("data-exp")) key = '[data-exp="' + a.getAttribute("data-exp") + '"][data-val="' + a.getAttribute("data-val") + '"]';
          else if(a.hasAttribute("data-exp-photos")) key = "[data-exp-photos]";
        }
        host.innerHTML = h;
        if(key){ var el = host.querySelector(key); if(el) el.focus(); }
      }
      host.addEventListener("change", function(e){
        var t = e.target;
        if(t.name === "expScope"){ scope = t.value; render(); }
        else if(t.hasAttribute("data-exp-bay")){ if(t.checked) delete off[t.getAttribute("data-exp-bay")]; else off[t.getAttribute("data-exp-bay")] = true; render(); }
        else if(t.hasAttribute("data-exp-photos")){ ui.exportPhotos = t.checked; lsSet(PHOTOEXP_KEY, t.checked ? "1" : "0"); }
      });
      host.addEventListener("click", function(e){
        var sb = e.target.closest("[data-exp]");
        if(sb){ P[sb.getAttribute("data-exp")] = sb.getAttribute("data-val"); lsSet(EXPORTPREFS_KEY, JSON.stringify(P)); render(); return; }
        var all = e.target.closest("[data-exp-all]");
        if(all){
