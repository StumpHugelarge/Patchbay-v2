          list.forEach(function(b){ if(all.getAttribute("data-exp-all") === "1") delete off[b.id]; else off[b.id] = true; });
          render();
        }
      });
      render();
    },
    focus: 'input[type="radio"]:checked'
  });
}

/* ---------- export: JSON / CSV ---------- */
function exportProjectJSON(){
  // Photos used by this project's gear travel inside the file (already downscaled), so it opens complete anywhere.
  var photos = {}, any = false;
  state.bays.forEach(function(b){ if(isGearBay(b)) b.gear.forEach(function(g){ if(hasPhoto(g.photoId)){ photos[g.photoId] = photoCache[g.photoId].dataUrl; any = true; } }); });
  var text = JSON.stringify(any ? Object.assign({}, state, {photos:photos}) : state, null, 2);
  saveFile(slug(state.name || "patch-sheet-project") + ".json", text);
}
function csvField(v){
  var s = v==null ? "" : String(v);
  if(/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportLabelsCSV(){
  var rows = [CSV_COLUMNS];
  state.bays.forEach(function(b){
    if(isGearBay(b)){
      b.gear.forEach(function(g, i){
        var gg = g.groupId ? getGroup(g.groupId) : null;
        rows.push([b.id, b.name, b.type, "", i+1, g.id, g.name, g.notes, gg?gg.name:"", "", g.heightU, g.width]);
      });
      if(b.type === "chassis"){
        // a chassis also lists its backplane jacks (only those with a name), so jack labels round-trip
        for(var sn = 1; sn <= b.slots; sn++){
          ["in", "out"].forEach(function(dir){
            var jl = (b.jackLabels || {})[chKey(dir, sn)];
            if(jl) rows.push([b.id, b.name, b.type, dir, sn, slotJackId(b.id, sn, dir), jl, "", "", "", "", ""]);
          });
        }
      }
      return;
    }
    b.ports.forEach(function(p){
      var g = p.groupId ? getGroup(p.groupId) : null;
      var routing = b.type==="trs" ? ((getColumn(b,p.index)||{}).state || "normal") : "";
      rows.push([b.id, b.name, b.type, p.row||"", p.index, p.id, p.label, p.notes, g?g.name:"", routing, "", ""]);
    });
  });
  var text = rows.map(function(r){ return r.map(csvField).join(","); }).join("\r\n");
  saveFile("patch-sheet-labels.csv", text);
}
function parseCSV(text){
  var rows = [], row = [], field = "", inQuotes = false;
  for(var i=0;i<text.length;i++){
    var c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ","){ row.push(field); field = ""; }
      else if(c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === "\r"){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return !(r.length===1 && r[0]==="") ; });
}

/* ---------- import ---------- */
function readFileText(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(String(reader.result)); };
    reader.onerror = function(){ reject(reader.error); };
    reader.readAsText(file);
  });
}
function handleImportJSON(file){
  readFileText(file).then(function(text){
    var parsed;
    try{ parsed = JSON.parse(text); } catch(e){ showToast("That file isn't valid JSON.", "error"); return; }
    if(!parsed || !Array.isArray(parsed.bays)){ showToast("That JSON doesn't look like a Patch Sheet project file.", "error"); return; }
    // An import never overwrites what's open: it arrives as its own project.
    var embedded = (parsed.photos && typeof parsed.photos === "object") ? parsed.photos : {};
    Object.keys(embedded).forEach(function(pid){ if(!photoCache[pid]) storePhoto(pid, embedded[pid]); });
    var imported = normalizeState(parsed);
    var fileName = String(file.name || "").replace(/\.json$/i, "").trim();
    imported.name = uniqueProjectName(String(parsed.name || "").trim() || fileName || "Imported project");
    var newId = addProjectFromState(imported);
    if(!newId) return;
    switchProject(newId);
    showToast("Imported as a new project: “" + imported.name + "”.", "success");
  }).catch(function(){ showToast("Couldn't read that file.", "error"); });
}
function handleImportCSV(file){
  readFileText(file).then(function(text){
    var rows = parseCSV(text);
    if(rows.length < 2){ showToast("That CSV has no data rows.", "error"); return; }
    var header = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    var col = {};
    header.forEach(function(h,i){ col[h]=i; });
    if(col.port_id === undefined || col.label === undefined){
      showToast("That CSV is missing a port_id or label column.", "error"); return;
    }
    var portIndex = {}, bayOfPort = {}, gearIndex = {}, bayOfGear = {}, jackIndex = {};
    state.bays.forEach(function(b){
      if(isGearBay(b)){
        b.gear.forEach(function(g){ gearIndex[g.id] = g; bayOfGear[g.id] = b; });
        if(b.type === "chassis"){ for(var sn = 1; sn <= b.slots; sn++){ jackIndex[slotJackId(b.id, sn, "in")] = {bay:b, dir:"in", slot:sn}; jackIndex[slotJackId(b.id, sn, "out")] = {bay:b, dir:"out", slot:sn}; } }
      }
      else { b.ports.forEach(function(p){ portIndex[p.id] = p; bayOfPort[p.id] = b; }); }
    });
    var groupByName = {};
    state.groups.forEach(function(g){ groupByName[g.name.trim().toLowerCase()] = g; });
    var matched = 0, unmatched = 0;
    for(var i=1;i<rows.length;i++){
      var r = rows[i];
      if(!r.length) continue;
      var pid = (r[col.port_id]||"").trim();
      var p = portIndex[pid];
      var gItem = !p ? gearIndex[pid] : null;
      var jItem = (!p && !gItem) ? jackIndex[pid] : null;
      if(!p && !gItem && !jItem){ unmatched++; continue; }
      matched++;
      if(jItem){
        if(!jItem.bay.jackLabels) jItem.bay.jackLabels = {};
        var jtext = String(r[col.label] || "").slice(0, 60), jk = chKey(jItem.dir, jItem.slot);
        if(jtext) jItem.bay.jackLabels[jk] = jtext; else delete jItem.bay.jackLabels[jk];
        continue;
      }
      if(gItem){
        gItem.name = col.label!==undefined ? (r[col.label]||"") : gItem.name;
        gItem.notes = col.notes!==undefined ? (r[col.notes]||"") : gItem.notes;
        if(col.gear_height_u !== undefined){
          var hv = Number(r[col.gear_height_u]);
          if((bayOfGear[pid].type === "chassis" ? MODULE_SPANS : GEAR_HEIGHTS).indexOf(hv) !== -1) gItem.heightU = hv;
        }
        if(col.gear_width !== undefined){
          var wv = (r[col.gear_width]||"").trim().toLowerCase();
          if(wv==="full"||(wv==="half" && bayOfGear[pid].type !== "chassis")) gItem.width = wv;
        }
        if(col.group !== undefined){
          var gname2 = (r[col.group]||"").trim();
          if(!gname2){ gItem.groupId = null; }
          else {
            var key2 = gname2.toLowerCase();
            var g2 = groupByName[key2];
            if(!g2){ g2 = addGroup(gname2, nextPaletteColor()); groupByName[key2] = g2; }
            gItem.groupId = g2.id;
          }
        }
        continue;
      }
      p.label = col.label!==undefined ? (r[col.label]||"") : p.label;
      p.notes = col.notes!==undefined ? (r[col.notes]||"") : p.notes;
      if(col.group !== undefined){
        var gname = (r[col.group]||"").trim();
        if(!gname){ p.groupId = null; }
        else {
          var key = gname.toLowerCase();
          var g = groupByName[key];
          if(!g){ g = addGroup(gname, nextPaletteColor()); groupByName[key] = g; }
          p.groupId = g.id;
        }
      }
      if(col.routing !== undefined){
        var bay = bayOfPort[pid];
        if(bay && bay.type === "trs"){
          var rv = (r[col.routing]||"").trim().toLowerCase();
          if(ROUTING_STATES.indexOf(rv) !== -1) setColumnState(bay, p.index, rv);
        }
      }
    }
    state.bays.forEach(function(b){ if(isGearBay(b)) repairRack(b); });
    markDirty();
    renderAll();
    showToast("Imported " + matched + " label" + (matched===1?"":"s") + (unmatched ? " (" + unmatched + " unmatched)" : "") + ".", matched ? "success" : "error");
  }).catch(function(){ showToast("Couldn't read that file.", "error"); });
}

/* ---------- search ---------- */
// Looks through every bay in the open project: port labels and notes, rack
// gear names and notes, device-group names, and bay names. Every typed word
// must match (so "kick in" finds "Kick In" but not "Kick Out").
var SEARCH_MAX = 60;
function portPositionText(bay, p){
  if(bay.type === "snake") return (p.row === "return" ? "Return " : "Send ") + p.index;
  if(p.row) return (p.row === "top" ? "Top " : "Bottom ") + p.index;
  return "Port " + p.index;
}
function searchTerms(q){ return String(q || "").toLowerCase().split(/\s+/).filter(Boolean); }
function termsMatch(hay, terms){
  hay = hay.toLowerCase();
  return terms.every(function(t){ return hay.indexOf(t) !== -1; });
}
function runSearch(q){
  var terms = searchTerms(q), out = [];
  if(!terms.length) return out;
  state.bays.forEach(function(bay){
    if(out.length >= SEARCH_MAX) return;
    if(termsMatch(bay.name, terms)){
      out.push({kind:"bay", bayId:bay.id, type:bay.type, main:bay.name, sub:"Bay", tag:bay.type});
    }
    if(isGearBay(bay)){
      var isCh = bay.type === "chassis";
      bay.gear.forEach(function(g){
        var grp = g.groupId ? getGroup(g.groupId) : null;
        var hay = [g.name, g.notes, grp ? grp.name : ""].join(" ");
        if(g.name || g.notes || grp){
          if(termsMatch(hay, terms)) out.push({kind:"gear", bayId:bay.id, type:bay.type, itemId:g.id, main:g.name || (isCh ? "Untitled module" : "Untitled gear"), sub:bay.name + " · " + (isCh ? unitText(bay, g.heightU) + " module" : g.heightU + "U gear") + (g.notes ? " · " + g.notes : "") + (grp ? " · " + grp.name : ""), tag:isCh ? "500" : "rack"});
        }
      });
      if(isCh){
        Object.keys(bay.jackLabels || {}).forEach(function(k){
          var m = /^(in|out)(\d+)$/.exec(k);
          if(!m || !bay.jackLabels[k]) return;
          var jid = slotJackId(bay.id, Number(m[2]), m[1]);
          if(termsMatch(bay.jackLabels[k], terms)) out.push({kind:"slot", bayId:bay.id, type:"chassis", itemId:jid, main:bay.jackLabels[k], sub:bay.name + " · Slot " + m[2] + " " + (m[1] === "in" ? "In" : "Out") + " jack", tag:"500"});
        });
      }
    } else {
      bay.ports.forEach(function(pt){
        var grp = pt.groupId ? getGroup(pt.groupId) : null;
        if(!pt.label && !pt.notes) return;
        var hay = [pt.label, pt.notes, grp ? grp.name : ""].join(" ");
        if(termsMatch(hay, terms)) out.push({kind:"port", bayId:bay.id, type:bay.type, itemId:pt.id, main:pt.label || "(no label)", sub:bay.name + " · " + portPositionText(bay, pt) + (pt.notes ? " · " + pt.notes : "") + (grp ? " · " + grp.name : ""), tag:bay.type});
      });
    }
  });
  return out.slice(0, SEARCH_MAX);
}
function highlightHtml(text, terms){
  text = String(text);
  var lower = text.toLowerCase(), marks = [];
  terms.forEach(function(t){
    var from = 0, at;
    while((at = lower.indexOf(t, from)) !== -1){ marks.push([at, at + t.length]); from = at + t.length; }
  });
  marks.sort(function(a, b){ return a[0] - b[0]; });
  var merged = [];
  marks.forEach(function(m){
    var last = merged[merged.length - 1];
    if(last && m[0] <= last[1]) last[1] = Math.max(last[1], m[1]); else merged.push([m[0], m[1]]);
  });
  var out = "", pos = 0;
  merged.forEach(function(m){
    out += escapeHtml(text.slice(pos, m[0])) + "<mark>" + escapeHtml(text.slice(m[0], m[1])) + "</mark>";
    pos = m[1];
  });
  return out + escapeHtml(text.slice(pos));
}
function hideSearchResults(){
  var el = document.getElementById("searchResults");
  if(el) el.hidden = true;
}
function renderSearchResults(){
  var host = document.getElementById("searchResults");
  var sr = ui.search, terms = searchTerms(sr.q);
  if(!terms.length){ host.hidden = true; host.innerHTML = ""; return; }
  host.hidden = false;
  if(!sr.results.length){ host.innerHTML = '<div class="search-none">No matches for “'+escapeHtml(sr.q.trim())+'”.</div>'; return; }
  host.innerHTML = sr.results.map(function(r, i){
    return '<button type="button" class="search-hit'+(i===sr.active?' is-active':'')+'" role="option" data-hit="'+i+'">' +
      '<span class="hit-main">'+highlightHtml(r.main, terms)+'</span>' +
      '<span class="hit-tag">'+escapeHtml(r.tag)+'</span>' +
      '<span class="hit-sub">'+highlightHtml(r.sub, terms)+'</span></button>';
  }).join("");
}
function jumpToResult(r){
  var bay = getBay(r.bayId);
  if(!bay) return;
  ui.section = bay.type;
  if(ui.viewMode === "compare"){
    if(!isGearBay(bay)){ ui.viewMode = "compact"; try{ localStorage.setItem(VIEWMODE_KEY, "compact"); }catch(e){ /* ignore */ } }
    else if(cmpList(bay.type).length && cmpList(bay.type).indexOf(bay.id) === -1){ cmpList(bay.type)[0] = bay.id; }
  }
  ui.activeBay[bay.type] = bay.id;
  clearSelectionSilently();
  if(r.itemId){ ui.selection = [r.itemId]; ui.anchor = r.itemId; }
  hideSearchResults();
  renderAll();
  var sel = r.kind === "port" ? '.port[data-port="'+cssEscape(r.itemId)+'"]'
    : r.kind === "gear" ? '.gear-piece[data-gear="'+cssEscape(r.itemId)+'"]'
    : r.kind === "slot" ? '.slot-jack[data-jack="'+cssEscape(r.itemId)+'"]'
    : '.rack-panel[data-bay-id="'+cssEscape(bay.id)+'"]';
  var el = document.querySelector(sel);
  if(el){
    el.scrollIntoView({behavior:"smooth", block:"center"});
    el.classList.add("search-flash");
    setTimeout(function(){ el.classList.remove("search-flash"); }, 1500);
  }
}
function wireSearch(){
  var input = document.getElementById("searchInput");
  var host = document.getElementById("searchResults");
  function refresh(){
    ui.search.q = input.value;
    ui.search.results = runSearch(input.value);
    ui.search.active = 0;
    renderSearchResults();
  }
  input.addEventListener("input", refresh);
  input.addEventListener("focus", function(){ if(input.value.trim()) refresh(); });
  input.addEventListener("click", function(e){ e.stopPropagation(); });
  input.addEventListener("keydown", function(e){
    var sr = ui.search;
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      if(!sr.results.length) return;
      e.preventDefault();
      sr.active = (sr.active + (e.key === "ArrowDown" ? 1 : -1) + sr.results.length) % sr.results.length;
      renderSearchResults();
      var a = host.querySelector(".search-hit.is-active"); if(a && a.scrollIntoView) a.scrollIntoView({block:"nearest"});
    } else if(e.key === "Enter"){
      if(sr.results[sr.active]){ e.preventDefault(); jumpToResult(sr.results[sr.active]); }
    } else if(e.key === "Escape"){
      e.stopPropagation();
      if(!host.hidden){ hideSearchResults(); }
      else { input.value = ""; sr.q = ""; sr.results = []; input.blur(); }
    }
  });
  host.addEventListener("click", function(e){
    e.stopPropagation();
    var hit = e.target.closest(".search-hit"); if(!hit) return;
    var r = ui.search.results[Number(hit.getAttribute("data-hit"))];
    if(r) jumpToResult(r);
  });
  document.addEventListener("click", function(e){
    if(!e.target.closest(".search-wrap")) hideSearchResults();
  });
  document.addEventListener("keydown", function(e){
    if((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && String(e.key).toLowerCase() === "k"){
      if(ui.dialog || ui.snakeModal || ui.groupsModalOpen || ui.addRackModalOpen || ui.addGearModalOpen || ui.resizeRackModalOpen) return;
      e.preventDefault();
      input.focus(); input.select();
    }
  });
}

/* ---------- sharing: a read-only link that carries the whole project ---------- */
// The project is squeezed (empty ports left out, then deflate) into the link's
// own "#share=" part, so nothing is uploaded anywhere. Opening one shows a
// read-only copy that never touches your saved projects; "Save a copy" keeps it.
// Gear photos are left out — they'd make the link far too long.
function compactForShare(st){
  var c = JSON.parse(JSON.stringify(st));
  c.bays.forEach(function(b){
    if(b.ports) b.ports = b.ports.filter(function(p){ return p.label || p.notes || p.groupId; })
      .map(function(p){ return {id:p.id, label:p.label, notes:p.notes, groupId:p.groupId}; });
    if(b.columns) b.columns = b.columns.filter(function(col){ return col.state !== "normal"; });
    if(b.jackLabels && !Object.keys(b.jackLabels).length) delete b.jackLabels;
    if(b.gear) b.gear.forEach(function(g){
      g.photoId = null; delete g.photoX; delete g.photoY; delete g.photoFit;
      if(!g.ins) delete g.ins;
      if(!g.outs) delete g.outs;
      if(!g.clock) delete g.clock;
      if(!g.chLabels || !Object.keys(g.chLabels).length) delete g.chLabels;
      if(!g.chKinds || !Object.keys(g.chKinds).length) delete g.chKinds;
    });
  });
  if(!c.links || !c.links.length) delete c.links;
  return c;
}
function bytesToB64url(bytes){
  var s = "", CH = 0x8000;
  for(var i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64urlToBytes(str){
  str = String(str).replace(/-/g, "+").replace(/_/g, "/");
  while(str.length % 4) str += "=";
  var bin = atob(str), out = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function pipeBytes(bytes, transform, cap){
  var reader = new Blob([bytes]).stream().pipeThrough(transform).getReader(), chunks = [], total = 0;
  function pump(){
    return reader.read().then(function(r){
      if(r.done){
        var out = new Uint8Array(total), at = 0;
        chunks.forEach(function(ch){ out.set(ch, at); at += ch.length; });
        return out;
      }
      total += r.value.length;
      if(cap && total > cap){ reader.cancel(); throw new Error("too big"); }
      chunks.push(r.value);
      return pump();
    });
  }
  return pump();
}
var SHARE_MAX_BYTES = 8 * 1024 * 1024;
function shareEncode(obj){
  var raw = new TextEncoder().encode(JSON.stringify(obj));
  var plain = "r." + bytesToB64url(raw);
  if(typeof CompressionStream !== "function") return Promise.resolve(plain);
  return pipeBytes(raw, new CompressionStream("deflate-raw"), 0).then(function(z){
    var packed = "z." + bytesToB64url(z);
    return packed.length < plain.length ? packed : plain;
  }, function(){ return plain; });
}
function shareDecode(code){
  code = String(code || "").trim();
  var m = /^([zr])\.([A-Za-z0-9_-]+)$/.exec(code);
  if(!m) return Promise.reject(new Error("not a share code"));
  var bytes;
  try{ bytes = b64urlToBytes(m[2]); }catch(e){ return Promise.reject(new Error("not a share code")); }
  var step = m[1] === "z"
    ? (typeof DecompressionStream === "function" ? pipeBytes(bytes, new DecompressionStream("deflate-raw"), SHARE_MAX_BYTES) : Promise.reject(new Error("this browser can't open compressed links")))

/* ---------- clock map ---------- */
// The Clock tab reuses the signal-flow links: a cable marked "carries clock"
// (link.clk) is a clock cable, and tracing upstream from a device input through
// the patchbay to a device output tells us who clocks whom. Rack gear only.
function clockRoleSegHtml(active, id){
  return '<div class="segmented" id="'+id+'" role="group" aria-label="Clock role">' +
    [["","Auto","Not set — the piece shows on the Clock tab only if a clock cable touches it"],["master","Master","This piece generates the clock"],["follower","Follower","This piece follows a clock from another piece"]].map(function(o){
      return '<button type="button" class="seg-btn'+((active||"")===o[0]?' is-active':'')+'" data-clock="'+o[0]+'" title="'+o[2]+'">'+o[1]+'</button>';
    }).join("") + '</div>';
}
function setClockRole(g, role){
  if(ui.readOnly || !g) return;
  var hit = findGear(g.id);
  if(!hit || hit.bay.type !== "rack") return;
  role = (role === "master" || role === "follower") ? role : "";
  if((g.clock || "") === role) return;
  historyBreak();
  g.clock = role;
  markDirty();
  renderGrid(); renderInspector();
}
// Where a signal on this endpoint ultimately starts: the endpoint id, and whether any cable on the way carries clock.
function clockTraceOf(id){
  var hops = traceUp(id), prev = id, flagged = false, linkIds = [];
  hops.forEach(function(h){
    if(h.via === "link"){
      var l = incomingLink(prev);
      if(l && l.clk === true){ flagged = true; linkIds.push(l.id); }
    }
    prev = h.id;
  });
  return {origin: hops.length ? hops[hops.length - 1].id : id, hops: hops, flagged: flagged, linkIds: linkIds};
}
// True when a signal on this endpoint starts at a gear output marked as clock.
function clockOriginIsClockOut(id){
  var ep = getEndpoint(clockTraceOf(id).origin);
  return !!(ep && ep.kind === "gear" && ep.dir === "out" && chKind(ep) === "clock");
}
// Adds a clock-typed channel ("Clock In" / "Clock Out") to a piece and returns its endpoint id.
function addClockChannel(g, dir){
  if(ui.readOnly || !g) return null;
  var hit = findGear(g.id);
  if(!hit || hit.bay.type !== "rack") return null;
  var key = dir === "out" ? "outs" : "ins";
  if((g[key] || 0) >= MAX_GEAR_CH){ showToast("“" + gearDisplayName(g) + "” already has the maximum of " + MAX_GEAR_CH + " " + (dir === "out" ? "outputs" : "inputs") + ".", "error"); return null; }
  historyBreak();
  g[key] = (g[key] || 0) + 1;
  var n = g[key], k = chKey(dir, n);
  if(!g.chKinds) g.chKinds = {};
  g.chKinds[k] = "clock";
  if(!g.chLabels) g.chLabels = {};
  if(!g.chLabels[k]) g.chLabels[k] = dir === "out" ? "Clock Out" : "Clock In";
  var id = gearChId(g.id, dir, n);
  ui.flowOpen[id] = true;
  linkRev++; markDirty();
  renderGrid(); renderInspector();
  return id;
}
function clockChanName(ep){
  var typed = epTypedLabel(ep);
  return typed || ((ep.dir === "in" ? "In " : "Out ") + ep.n);
}
function gearDisplayName(g){ return g.name || "Unnamed gear"; }
function clockModel(){
  var rackGear = {}, order = [];
  state.bays.forEach(function(bay){
    if(bay.type !== "rack") return;
    (bay.gear || []).forEach(function(g){ rackGear[g.id] = {gear:g, bay:bay}; order.push(g.id); });
  });
  var edges = [], dangling = [], mismatches = [];
  order.forEach(function(gid){
    var d = rackGear[gid];
    for(var i = 1; i <= (d.gear.ins || 0); i++){
      var inId = gearChId(gid, "in", i);
      var t = clockTraceOf(inId), originEp = getEndpoint(t.origin), inEp = getEndpoint(inId);
      var originGearOut = !!(originEp && originEp.kind === "gear" && originEp.dir === "out" && rackGear[originEp.gear.id]);
      var inClk = chKind(inEp) === "clock", outClk = originGearOut && chKind(originEp) === "clock";
      // a clock input fed by an audio output, or a clock output feeding an audio input
      if(originGearOut && inClk !== outClk && (t.flagged || inClk || outClk)) mismatches.push({from:originEp.gear.id, to:gid, fromEp:originEp, toEp:inEp, outClk:outClk});
      if(!(t.flagged || (inClk && outClk))) continue;
      if(originGearOut){
        var mids = [];
        t.hops.slice(0, -1).forEach(function(h){ var e = getEndpoint(h.id); if(e && mids.indexOf(e.bay.name) === -1) mids.push(e.bay.name); });
        edges.push({from:originEp.gear.id, to:gid, fromEp:t.origin, toEp:inId, fromChan:clockChanName(originEp), toChan:clockChanName(inEp), via:mids, linkIds:t.linkIds});
      } else {
        dangling.push({to:gid, toEp:inId, toChan:clockChanName(inEp)});
      }
    }
  });
  // who is on the map
  var onMap = {};
  edges.forEach(function(e){ onMap[e.from] = true; onMap[e.to] = true; });
  dangling.forEach(function(e){ onMap[e.to] = true; });
  mismatches.forEach(function(x){ onMap[x.from] = true; onMap[x.to] = true; });
  order.forEach(function(gid){ if(rackGear[gid].gear.clock) onMap[gid] = true; });
  var devices = [], byId = {};
  order.forEach(function(gid){
    if(!onMap[gid]) return;
    var d = rackGear[gid];
    var dev = {id:gid, gear:d.gear, bay:d.bay, role:d.gear.clock || "", sources:[], dests:[], inEdges:[], outEdges:[], dangling:[], cyclic:false, group:-1, warnCount:0, status:""};
    devices.push(dev); byId[gid] = dev;
  });
  edges.forEach(function(e){
    var a = byId[e.from], b = byId[e.to];
    if(a.dests.indexOf(e.to) === -1) a.dests.push(e.to);
    if(b.sources.indexOf(e.from) === -1) b.sources.push(e.from);
    a.outEdges.push(e); b.inEdges.push(e);
  });
  dangling.forEach(function(e){ byId[e.to].dangling.push(e); });
  // loops: a device that can reach itself
  function reachable(startId){
    var seen = {}, stack = byId[startId].dests.slice();
    while(stack.length){
      var c = stack.pop();
      if(seen[c]) continue;
      seen[c] = true;
      byId[c].dests.forEach(function(n){ if(!seen[n]) stack.push(n); });
    }
    return seen;
  }
  var reach = {};
  devices.forEach(function(d){ reach[d.id] = reachable(d.id); d.cyclic = !!reach[d.id][d.id]; });
  // connected groups
  var parent = {};
  function find(x){ while(parent[x] !== x){ parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
  devices.forEach(function(d){ parent[d.id] = d.id; });
  edges.forEach(function(e){ var ra = find(e.from), rb = find(e.to); if(ra !== rb) parent[ra] = rb; });

  devices.forEach(function(d){
    var r = find(d.id);
    if(groupIdx[r] == null){ groupIdx[r] = groups.length; groups.push([]); }

  // warnings
  var warnings = [];
  function warn(sev, kind, ids, text){ warnings.push({sev:sev, kind:kind, ids:ids, text:text}); ids.forEach(function(id){ if(sev !== "info" && byId[id]) byId[id].warnCount++; }); }

    if(!d.cyclic || doneCyc[d.id]) return;
    var cluster = devices.filter(function(o){ return o.cyclic && (o.id === d.id || (reach[d.id][o.id] && reach[o.id][d.id])); }).map(function(o){ return o.id; });
    cluster.forEach(function(id){ doneCyc[id] = true; });
    if(cluster.length === 1) warn("error", "loop", cluster, "Clock loop: “" + nm(cluster[0]) + "” is clocked from itself.");
    else warn("error", "loop", cluster, "Clock loop between " + cluster.map(function(id){ return "“" + nm(id) + "”"; }).join(", ") + " — each is clocked from another in the ring, so nothing is the master.");
  });
  mismatches.forEach(function(x){
    var a = "“" + nm(x.from) + "” " + clockChanName(x.fromEp), b = "“" + nm(x.to) + "” " + clockChanName(x.toEp);
    warn("warn", "mismatch", x.from === x.to ? [x.to] : [x.to, x.from], x.outClk
      ? a + " is a clock output, but it feeds " + b + ", which isn’t marked as a clock input."
      : b + " is a clock input, but it is fed by " + a + ", which isn’t a clock output.");
  });
  devices.forEach(function(d){
    var n = nm(d.id);
    if(d.sources.length > 1) warn("error", "multi", [d.id], "“" + n + "” follows more than one clock source (" + d.sources.map(function(id){ return "“" + nm(id) + "”"; }).join(", ") + "). A device can only follow one.");
    if(d.role === "master" && d.sources.length) warn("warn", "master-src", [d.id], "“" + n + "” is set as master but also receives clock from " + d.sources.map(function(id){ return "“" + nm(id) + "”"; }).join(", ") + ".");
    if(d.role !== "master" && d.sources.length === 0 && !d.cyclic){
      if(d.dangling.length) warn("warn", "nosource", [d.id], "“" + n + "” has a clock cable on " + d.dangling[0].toChan + ", but it doesn’t trace back to another device’s output.");
      else if(d.dests.length) warn("warn", "nosource", [d.id], "“" + n + "” sends clock to others but has no clock source — set it as master, or give it one.");
      else if(d.role === "follower") warn("warn", "nosource", [d.id], "“" + n + "” follows a clock, but no clock source is connected.");
    }
    if(d.role === "master" && !d.dests.length && !d.sources.length) warn("info", "master-idle", [d.id], "“" + n + "” is the master but feeds nothing yet.");
  });
  groups.forEach(function(ids){
    var masters = ids.filter(function(id){ return byId[id].role === "master"; });
    if(masters.length > 1) warn("error", "two-masters", masters, "Two masters in one clock chain: " + masters.map(function(id){ return "“" + nm(id) + "”"; }).join(" and ") + ".");
  });
  devices.forEach(function(d){
    d.status = d.warnCount ? "warn" : (d.role === "master" && !d.sources.length ? "master" : (d.sources.length ? "follows" : (d.role === "follower" ? "warn" : "idle")));
  });
  // tree: roots are devices nobody feeds (masters first); loops and what hangs off them go to "orphans"
  function byName(a, b){ return nm(a).toLowerCase() < nm(b).toLowerCase() ? -1 : (nm(a).toLowerCase() > nm(b).toLowerCase() ? 1 : 0); }

  roots.sort(function(a, b){
    var ma = byId[a].role === "master" ? 0 : 1, mb = byId[b].role === "master" ? 0 : 1;

  var visited = {};
  function build(id, inEdges, stack){
    var node = {id:id, dev:byId[id], edges:inEdges, children:[], repeat:false};

  }

  return {devices:devices, byId:byId, edges:edges, dangling:dangling, groups:groups, warnings:warnings, tree:tree, orphans:orphans};
}

function clockStatusBadge(d){
  if(d.status === "master") return '<span class="clk-badge clk-badge--master">Master</span>';
  if(d.status === "follows") return '<span class="clk-badge clk-badge--ok">✓ Follows</span>';
  if(d.status === "warn") return '<span class="clk-badge clk-badge--warn">⚠ Check</span>';

}
function clockEdgeText(edges){

function renderClockTab(host){

function clockTabClick(e){
  var t = e.target;
  var jump = t.closest("[data-clk-jump]");
  if(jump){
    var hit = findGear(jump.getAttribute("data-clk-jump"));
    if(hit) jumpToResult({kind:"gear", bayId:hit.bay.id, itemId:hit.gear.id});
    return;
  }
  if(ui.readOnly) return;
  var seg = t.closest("[data-clk-role] .seg-btn");
  if(seg){
    var rhit = findGear(seg.closest("[data-clk-role]").getAttribute("data-clk-role"));
    if(rhit) setClockRole(rhit.gear, seg.getAttribute("data-clock"));
    return;
  }
  var src = t.closest("[data-clk-src]");
  if(src){ var shit = findGear(src.getAttribute("data-clk-src")); if(shit) clockSetSource(shit.gear); return; }
  var rem = t.closest("[data-clk-remove]");
  if(rem){ var qhit = findGear(rem.getAttribute("data-clk-remove")); if(qhit) setClockRole(qhit.gear, ""); return; }
  var unl = t.closest("[data-clk-unlink]");
  if(unl){
    var inIds = unl.getAttribute("data-clk-unlink").split("+").filter(Boolean);
    historyBreak();
    inIds.forEach(function(inId){ var l = incomingLink(inId); if(l) removeLink(l.id); });
    renderGrid(); renderInspector();
    return;
  }
  if(t.closest("[data-clk-add]")){ clockAddDevice(); return; }
}
function clockSetSource(g){

      buttons: [{label:"Cancel", cls:"btn-ghost"}, {label:"Add Clock In", cls:"btn-primary", primary:true, onClick:function(){

    }).join("") + '</div>',

function clockAddDevice(){

  });

      '<p class="insp-empty" style="padding:0;">A piece with clock outputs and no clock input is added as the master; one with a clock input is added as a follower. Otherwise the first device on the map is the master and the rest follow. You can change it any time.</p>',
    buttons: [{label:"Cancel", cls:"btn-ghost"}, {label:"Add", cls:"btn-primary", primary:true, onClick:function(root){
      var hit = findGear(root.querySelector("#clkAddSel").value);
      if(!hit) return;
      var cIn = 0, cOut = 0, gg = hit.gear;
      for(var ci = 1; ci <= (gg.ins || 0); ci++) if(chKind(getEndpoint(gearChId(gg.id, "in", ci))) === "clock") cIn++;
      for(var co = 1; co <= (gg.outs || 0); co++) if(chKind(getEndpoint(gearChId(gg.id, "out", co))) === "clock") cOut++;

function drawClockCanvas(m){
  var MARGIN = 44, TITLE_H = 104, CARD_H = 62, GAP = 12, INDENT = 44;
  var colors = {panelColor:"#24272A", cellColor:"#2E3134", borderColor:"#454A4D", inkColor:"#ECEFED", faintColor:"#9BA2A0", accentColor:"#4FC79A", warnColor:"#E2694A", infoColor:"#E8A04C"};
  // flatten tree to rows
  var rows = [];
  function walk(node, depth, parentIdx){
    var idx = rows.length;
    rows.push({node:node, depth:depth, parent:parentIdx});
    node.children.forEach(function(c){ walk(c, depth + 1, idx); });
  }
  m.tree.forEach(function(n){ walk(n, 0, -1); });
  var orphanStart = rows.length;
  m.orphans.forEach(function(id){ rows.push({node:{id:id, dev:m.byId[id], edges:m.byId[id].inEdges.slice(0, 1), children:[], repeat:false}, depth:0, parent:-1}); });
  var maxDepth = rows.reduce(function(a, r){ return Math.max(a, r.depth); }, 0);
  var canvasW = Math.max(900, MARGIN * 2 + 520 + maxDepth * INDENT);
  var probe = document.createElement("canvas").getContext("2d");
  probe.font = "500 14px 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif";
  var warnLines = [];
  m.warnings.forEach(function(w){ warnLines.push({w:w, lines:wrapText(probe, w.text, canvasW - MARGIN * 2 - 34, 3)}); });
  var ORPHAN_HEAD = m.orphans.length ? 44 : 0;
  var treeH = rows.length * (CARD_H + GAP) + ORPHAN_HEAD;
  var warnH = 56 + (warnLines.length ? warnLines.reduce(function(a, x){ return a + x.lines.length * 20 + 10; }, 0) : 28);
  var canvasH = TITLE_H + treeH + warnH + MARGIN;
  var canvas = document.createElement("canvas");
  canvas.width = canvasW; canvas.height = canvasH;
  var ctx = canvas.getContext("2d");
  drawPanelChrome(ctx, canvasW, canvasH, colors.panelColor);
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = colors.accentColor;
  ctx.font = "800 34px 'Big Shoulders Display', 'Arial Narrow', sans-serif";
  ctx.fillText("CLOCK MAP", MARGIN, 52);
  ctx.fillStyle = colors.faintColor;
  ctx.font = "500 12px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
  ctx.fillText(((state.name || "Patch sheet") + "").toUpperCase() + "   ·   " + m.devices.length + " DEVICES   ·   " + m.edges.length + " CLOCK LINKS", MARGIN, 74);
  var dateStr = new Date().toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
  ctx.textAlign = "right"; ctx.fillText("EXPORTED " + dateStr.toUpperCase(), canvasW - MARGIN, 74); ctx.textAlign = "left";
  var y0 = TITLE_H, rowY = [];
  rows.forEach(function(r, i){
    var extra = (i === orphanStart && m.orphans.length) ? ORPHAN_HEAD : 0;
    rowY.push(y0 + extra + (i * (CARD_H + GAP)) + (i >= orphanStart ? 0 : 0));
    if(extra){ /* heading drawn below */ }
  });
  // recompute y with the orphan heading offset applied to every row after it
  rows.forEach(function(r, i){ rowY[i] = y0 + i * (CARD_H + GAP) + (i >= orphanStart && m.orphans.length ? ORPHAN_HEAD : 0); });
  // connectors first
  ctx.strokeStyle = "#5b6163"; ctx.lineWidth = 2;
  rows.forEach(function(r, i){
    if(r.parent < 0) return;
    var px = MARGIN + r.parent * 0 + rows[r.parent].depth * INDENT + 20, cx = MARGIN + r.depth * INDENT;
    ctx.beginPath(); ctx.moveTo(px, rowY[r.parent] + CARD_H); ctx.lineTo(px, rowY[i] + CARD_H / 2); ctx.lineTo(cx, rowY[i] + CARD_H / 2); ctx.stroke();
  });
  if(m.orphans.length){
    ctx.fillStyle = colors.infoColor;
    ctx.font = "700 14px 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif";
    ctx.fillText("NOT ON A CHAIN FROM A MASTER", MARGIN, rowY[orphanStart] - 16);
  }
  rows.forEach(function(r, i){
    var d = r.node.dev, x = MARGIN + r.depth * INDENT, w = canvasW - MARGIN - x, y = rowY[i];
    var warn = d.status === "warn";
    ctx.fillStyle = colors.cellColor; roundRect(ctx, x, y, w, CARD_H, 10); ctx.fill();
    ctx.strokeStyle = warn ? colors.warnColor : colors.borderColor; ctx.lineWidth = warn ? 2 : 1; roundRect(ctx, x + 0.5, y + 0.5, w - 1, CARD_H - 1, 10); ctx.stroke();
    ctx.fillStyle = colors.inkColor;
    ctx.font = "700 19px 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif";
    var nameLines = wrapText(ctx, gearDisplayName(d.gear), w - 190, 1);
    ctx.fillText(nameLines[0] || "", x + 16, y + 26);
    ctx.fillStyle = colors.faintColor;
    ctx.font = "500 12px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
    var sub = d.bay.name.toUpperCase();
    if(r.node.repeat) sub += "   ·   SEE ABOVE";
    else if(r.node.edges && r.node.edges.length){
      var e = r.node.edges[0];
      sub += "   ·   " + (e.fromChan + " → " + e.toChan).toUpperCase() + (e.via.length ? "  VIA " + e.via.join(" + ").toUpperCase() : "");
    }
    var subLines = wrapText(ctx, sub, w - 32, 1);
    ctx.fillText(subLines[0] || "", x + 16, y + 48);
    var tag = d.status === "master" ? "MASTER" : d.status === "follows" ? "FOLLOWS" : d.status === "warn" ? "CHECK" : "ON MAP";
    var tagColor = d.status === "warn" ? colors.warnColor : d.status === "idle" ? colors.faintColor : colors.accentColor;
    ctx.font = "700 12px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
    var tw = ctx.measureText(tag).width + 20;
    ctx.fillStyle = tagColor; roundRect(ctx, x + w - tw - 14, y + 12, tw, 24, 12); ctx.fill();
    ctx.fillStyle = "#0D1512"; ctx.textAlign = "center"; ctx.fillText(tag, x + w - 14 - tw / 2, y + 28); ctx.textAlign = "left";
  });
  // warnings
  var wy = TITLE_H + treeH + 30;
  ctx.fillStyle = colors.faintColor;
  ctx.font = "700 13px 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace";
  ctx.fillText("CHECKS", MARGIN, wy);
  wy += 26;
  ctx.font = "500 14px 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif";
  if(!warnLines.length){ ctx.fillStyle = colors.accentColor; ctx.fillText("✓ No clock problems found — every device traces back to one master.", MARGIN, wy); }
  warnLines.forEach(function(x){
    ctx.fillStyle = x.w.sev === "info" ? colors.infoColor : colors.warnColor;
    ctx.fillText(x.w.sev === "info" ? "ℹ" : "⚠", MARGIN, wy);
    ctx.fillStyle = colors.inkColor;
    x.lines.forEach(function(line, li){ ctx.fillText(line, MARGIN + 26, wy + li * 20); });
    wy += x.lines.length * 20 + 10;
  });
  return canvas;
}

// A project-level list of physical cable types (name + colour). Each link can
// carry one in link.ct; links with no type draw neutral grey.
var UNTYPED_COLOR = "#8A918F";
function cableTypeById(id){
  if(!id) return null;
  var l = state.cableTypes || [];
  for(var i = 0; i < l.length; i++){ if(l[i].id === id) return l[i]; }
  return null;
}
function cableTypeExists(id){ return !!cableTypeById(id); }
function cableColor(l){ var t = cableTypeById(l && l.ct); return t ? t.color : UNTYPED_COLOR; }
function cableTypeName(l){ var t = cableTypeById(l && l.ct); return t ? t.name : ""; }
function cableTypeOptions(sel){
  return '<option value="">Untyped</option>' + (state.cableTypes || []).map(function(t){
    return '<option value="'+escapeAttr(t.id)+'"'+(t.id === sel ? ' selected' : '')+'>'+escapeHtml(t.name)+'</option>';
  }).join("");
}
// Patchbay to patchbay is a patch cord; otherwise a new cable starts with the type you used last.
function defaultCableTypeFor(fromId, toId){
  var a = getEndpoint(fromId), b = getEndpoint(toId);
  if(a && b && a.kind === "port" && b.kind === "port" && a.bay.type === "trs" && b.bay.type === "trs" && cableTypeExists("ct-trsm-trsm")) return "ct-trsm-trsm";
  if(ui.lastCableType && cableTypeExists(ui.lastCableType)) return ui.lastCableType;
  return "";
}
function setLinksCableType(linkIds, typeId){
  if(ui.readOnly) return 0;
  var set = {}, n = 0;
  linkIds.forEach(function(id){ set[id] = true; });
  linkList().forEach(function(l){
    if(!set[l.id]) return;
    if(typeId) l.ct = typeId; else delete l.ct;
    n++;
  });
  if(typeId) ui.lastCableType = typeId;
  if(n) markDirty();
  return n;
}
function gearLinkIds(g, scope){
  var ids = [], i;
  if(scope !== "out") for(i = 1; i <= (g.ins || 0); i++){ var inc = incomingLink(gearChId(g.id, "in", i)); if(inc) ids.push(inc.id); }
  if(scope !== "in") for(i = 1; i <= (g.outs || 0); i++){ outgoingLinks(gearChId(g.id, "out", i)).forEach(function(l){ ids.push(l.id); }); }
  return ids;
}

function cableListRows(){

  var links = linkList().filter(function(l){ return idx[l.from] && idx[l.to]; }).slice();
  links.sort(function(p, q){
    var a = p.ct && order[p.ct] != null ? order[p.ct] : 999, b = q.ct && order[q.ct] != null ? order[q.ct] : 999;
    return a - b;
  });
  rows.push(["cable_type","from_label","from_bay","from_position","to_label","to_bay","to_position","carries_clock"]);
  links.forEach(function(l){

function flowPinY(nd, row){ return nd.y + FLOW.HEAD_H + row.ri * FLOW.ROW_H + FLOW.ROW_H / 2; }

function flowAssignManual(nodes, edges){
  var pairs = {};

function flowModel(){
  var g = flowBuildGraph(!!ui.flowShowAll), nodes = g.nodes, edges = g.edges;
  var mode = (state.diagram && state.diagram.mode === "manual") ? "manual" : "auto";
  flowLayoutAuto(nodes, edges);
  var autoPos = {};
  nodes.forEach(function(nd){ autoPos[nd.id] = {x:nd.x, y:nd.y}; });
  if(mode === "manual"){
    var pos = state.diagram.pos || {}, missing = [], placed = 0, minX = Infinity, maxB = -Infinity;
    nodes.forEach(function(nd){
      var p = (ui.flowDrag && ui.flowDrag.id === nd.id) ? ui.flowDrag : pos[nd.id];
      if(p){ nd.x = p.x; nd.y = p.y; placed++; minX = Math.min(minX, nd.x); maxB = Math.max(maxB, nd.y + nd.h); }
      else missing.push(nd);
    });
    if(missing.length && !placed){
      missing.forEach(function(nd){ nd.x = autoPos[nd.id].x; nd.y = autoPos[nd.id].y; });
    } else if(missing.length){
      var y = maxB + 40;
      missing.forEach(function(nd){ nd.x = minX; nd.y = y; y += nd.h + FLOW.GAP_Y; });

// every cable on the path of one cable: back to where it starts, forward to where it ends
function flowPathSet(linkId){

    cur = up.id;

function renderFlowTab(host){
  var prev = document.getElementById("flowScroll"), sl = prev ? prev.scrollLeft : 0, st = prev ? prev.scrollTop : 0;
  var m = flowModel(), ro = !!ui.readOnly, manual = m.mode === "manual";
  ui.flowModel = m;

  var counts = {}, total = 0;
  m.edges.forEach(function(e){ var k = e.link.ct || ""; counts[k] = (counts[k] || 0) + 1; total++; });
  var allTypes = state.cableTypes || [], hiddenTypes = 0;
  var shownTypes = allTypes.filter(function(t){
    var keep = ui.flowLegendAll || counts[t.id] || ui.flowHidden[t.id];

  });
  var chips = shownTypes.map(function(t){

  else if(ui.flowLegendAll && allTypes.some(function(t){ return !counts[t.id]; })) chips += '<button type="button" class="flow-chip flow-chip-more" data-flow-legend-more title="Hide the cable types that have no cables">Hide unused</button>';
  if(counts[""]) chips += '<button type="button" class="flow-chip'+(ui.flowHidden[""] ? ' is-off' : '')+'" data-flow-chip="" aria-pressed="'+(ui.flowHidden[""] ? "false" : "true")+'"><span class="flow-sw" style="background:'+UNTYPED_COLOR+'"></span>Untyped <b>'+counts[""]+'</b></button>';
  var html = '<div class="flow-tab"><div class="flow-bar">' +
    '<div class="segmented" role="group" aria-label="Layout"><button type="button" class="seg-btn'+(manual ? '' : ' is-active')+'" data-flow-mode="auto" title="Boxes are laid out for you">Auto</button><button type="button" class="seg-btn'+(manual ? ' is-active' : '')+'" data-flow-mode="manual" title="Drag the boxes where you want them">Manual</button></div>' +
    (manual && !ro ? '<button type="button" class="btn btn-sm btn-ghost" data-flow-reset>Reset layout</button>' : '') +

    (ro ? '' : '<button type="button" class="btn btn-sm" data-flow-types>Cable types…</button>') +
    '<span class="clk-sum" id="flowSummary">'+m.nodes.length+(m.nodes.length === 1 ? ' box' : ' boxes')+' · '+total+(total === 1 ? ' cable' : ' cables')+(counts[""] ? ' · '+counts[""]+' untyped' : '')+'</span>' +
    '</div><div class="flow-chips">' + chips + '</div>' +

}
function flowTabChange(e){
  if(e.target.matches("[data-flow-showall]")){ ui.flowShowAll = e.target.checked; renderGrid(); }
}
function flowTabClick(e){
  var t = e.target;
  if(ui.flowJustDragged){ ui.flowJustDragged = false; return; }
  var b = t.closest("[data-flow-mode]");
  if(b){ flowSetMode(b.getAttribute("data-flow-mode")); return; }
  if(t.closest("[data-flow-reset]")){ flowResetLayout(); return; }
  if(t.closest("[data-flow-types]")){ openCableTypesManager(); return; }
  var z = t.closest("[data-flow-zoom]");
  if(z){
    var kind = z.getAttribute("data-flow-zoom"), cur = ui.flowZoom;
    if(!cur){ var svg = document.getElementById("flowSvg"), vb = svg && svg.viewBox.baseVal; cur = svg && vb && vb.width ? svg.getBoundingClientRect().width / vb.width : 1; }
    ui.flowZoom = kind === "fit" ? null : kind === "one" ? 1 : Math.max(0.1, Math.min(4, cur * (kind === "in" ? 1.25 : 0.8)));
    renderGrid(); return;
  }
  if(t.closest("[data-flow-legend-more]")){ ui.flowLegendAll = !ui.flowLegendAll; renderGrid(); return; }
  var chip = t.closest("[data-flow-chip]");
  if(chip){ var k = chip.getAttribute("data-flow-chip"); if(ui.flowHidden[k]) delete ui.flowHidden[k]; else ui.flowHidden[k] = true; renderGrid(); return; }
  var shift = e.shiftKey || e.metaKey || e.ctrlKey;
  var lk = t.closest("[data-flow-link]");
  if(lk){ var id = lk.getAttribute("data-flow-link"); flowSelectLinks([id], shift, shift ? ui.flowFocus : id); return; }
  var nodeEl = t.closest("[data-flow-node]");
  if(nodeEl){
    var nid = nodeEl.getAttribute("data-flow-node"), m = ui.flowModel, hidden = ui.flowHidden || {};
    var ids = m ? m.edges.filter(function(x){ return (x.a.id === nid || x.b.id === nid) && !hidden[x.link.ct || ""]; }).map(function(x){ return x.link.id; }) : [];
    if(shift){ ids.forEach(function(i){ ui.flowSel[i] = true; }); ui.flowFocus = null; renderGrid(); renderInspector(); }
    else flowSelectLinks(ids, false, null);
    return;
  }
  if(t.closest("#flowScroll") && (Object.keys(ui.flowSel).length || ui.flowFocus)){ ui.flowSel = {}; ui.flowFocus = null; renderGrid(); renderInspector(); }
}
function flowTabPointerDown(e){
  if(e.button !== 0 || ui.readOnly || !state.diagram || state.diagram.mode !== "manual") return;
  var nodeEl = e.target.closest && e.target.closest("[data-flow-node]");
  if(!nodeEl || !ui.flowModel) return;
  var id = nodeEl.getAttribute("data-flow-node");
  var nd = ui.flowModel.nodes.filter(function(x){ return x.id === id; })[0];
  var svg = document.getElementById("flowSvg");
  if(!nd || !svg) return;
  var scale = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width || 1;
  var drag = {sx:e.clientX, sy:e.clientY, ox:nd.x, oy:nd.y, moved:false}, raf = 0;
  e.preventDefault();
  function mv(ev){
    if(!drag.moved && Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) < 4) return;
    drag.moved = true;
    ui.flowDrag = {id:id, x:Math.round(drag.ox + (ev.clientX - drag.sx) / scale), y:Math.round(drag.oy + (ev.clientY - drag.sy) / scale)};
    if(!raf) raf = requestAnimationFrame(function(){ raf = 0; flowRefreshSvg(); });
  }
  function up(){
    document.removeEventListener("pointermove", mv); document.removeEventListener("pointerup", up);
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
    if(!drag.moved) return;
    var m = flowModel();
    historyBreak();
    var pos = state.diagram.pos || {};
    m.nodes.forEach(function(n){ pos[n.id] = {x:Math.round(n.x), y:Math.round(n.y)}; });
    state.diagram.pos = pos;
    ui.flowDrag = null; ui.flowJustDragged = true;
    setTimeout(function(){ ui.flowJustDragged = false; }, 0);
    markDirty(); renderGrid();
  }
  document.addEventListener("pointermove", mv);
  document.addEventListener("pointerup", up);
}
function renderFlowInspector(host){

      '<span class="flow-norm"> · ' + escapeHtml(a ? a.bay.name : "") + ' → ' + escapeHtml(b ? b.bay.name : "") + (links[0].clk ? ' · carries clock' : '') + '</span></div></div>';

    '<div class="field"><label for="flowCtSel">Cable type</label><select id="flowCtSel">' + (mixed ? '<option value="__mixed" selected disabled>Mixed</option>' : '') + cableTypeOptions(mixed ? null : tk[0]) + '</select></div>' +
    '<div class="field"><label>Actions</label><div class="btn-row"><button type="button" class="btn btn-sm" id="flowCtManage">Cable types…</button>' +
    '<button type="button" class="btn btn-sm btn-ghost" id="flowSelClear">Clear selection</button>' +
    '<button type="button" class="btn btn-sm btn-danger" id="flowSelRemove">Remove ' + (links.length === 1 ? 'cable' : 'cables') + '</button></div></div></div>';
  document.getElementById("flowCtSel").addEventListener("change", function(e){

  document.getElementById("flowSelClear").addEventListener("click", function(){ ui.flowSel = {}; ui.flowFocus = null; renderGrid(); renderInspector(); });
  wireInlineConfirm(document.getElementById("flowSelRemove"), function(){
    historyBreak();
    ids.forEach(function(id){ removeLink(id); });
    ui.flowSel = {}; ui.flowFocus = null;
    renderAll();

}
function flowRasterize(format){
  var m = flowModel();
  if(!m.edges.length){ showToast("No connections to draw yet — link some ports first.", "error"); return; }
  var out = flowSvg(m, {export:true});
  var url = URL.createObjectURL(new Blob([out.svg], {type:"image/svg+xml;charset=utf-8"}));
  var img = new Image();
  img.onload = function(){
    var sc = Math.min(2, 16000 / Math.max(out.w, out.h), Math.sqrt(100e6 / (out.w * out.h)));
    var cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(out.w * sc)); cv.height = Math.max(1, Math.round(out.h * sc));
    var cx = cv.getContext("2d");
    cx.fillStyle = "#24272A"; cx.fillRect(0, 0, cv.width, cv.height);
    cx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    cv.toBlob(function(blob){
      if(!blob){ showToast("Couldn't render the diagram image.", "error"); return; }
      saveFile("patch-sheet-signal-flow." + (format === "jpg" ? "jpg" : "png"), blob);
    }, format === "jpg" ? "image/jpeg" : "image/png", 0.95);
  };
  img.onerror = function(){ URL.revokeObjectURL(url); showToast("Couldn't render the diagram image.", "error"); };
  img.src = url;
}
function flowExportSvg(){
  var m = flowModel();
  if(!m.edges.length){ showToast("No connections to draw yet — link some ports first.", "error"); return; }
  saveFile("patch-sheet-signal-flow.svg", new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + flowSvg(m, {export:true}).svg], {type:"image/svg+xml"}));
}

/* ---------- printing ---------- */
// The page prints as a clean white sheet (see the print styles). Wide bays are scaled down to fit the paper.
function wirePrint(){
  window.addEventListener("beforeprint", function(){
    var head = document.getElementById("printHead");
    var tab = (SECTION_TYPES.filter(function(t){ return t.type === ui.section; })[0] || {}).label || "";
    if(head) head.innerHTML = "<b>" + escapeHtml(state.name || "Patch sheet") + "</b><span>" + escapeHtml(tab) + " · printed " + escapeHtml(new Date().toLocaleDateString(undefined, {year:"numeric", month:"short", day:"numeric"})) + " · Carter\u2019s Studio Tools</span>";
    var panel = document.getElementById("rackPanel");
    Array.prototype.forEach.call(document.querySelectorAll("#rackPanel .rack-panel"), function(p){ p.style.zoom = ""; });
    if(panel){
      document.documentElement.style.removeProperty("--print-zoom");
      // Fit the widest / tallest bay on one landscape sheet (about 960 x 640 CSS px of usable area).
      var w = panel.scrollWidth || 0, h = 0;
      Array.prototype.forEach.call(panel.querySelectorAll(".rack-panel"), function(p){ h = Math.max(h, p.offsetHeight); });
      var z = Math.min(1, w > 0 ? 960 / w : 1, h > 0 ? 640 / h : 1);
      if(z < 1) document.documentElement.style.setProperty("--print-zoom", String(Math.max(0.3, z)));
    }
  });
  window.addEventListener("afterprint", function(){ document.documentElement.style.removeProperty("--print-zoom"); fitBayPanels(); });
}
/* ---------- global wiring ---------- */
function renderAll(){
  renderSectionTabs();
  renderBayTabs();
  updateViewModeToggle();
  renderGrid();
  renderInspector();
  renderMenus();
  renderSharedBar();
  applyReadOnlyLocks();
}
function init(){
  if(CHANNEL === "beta"){
    document.documentElement.setAttribute("data-channel", "beta");
    document.getElementById("betaBadge").hidden = false;
  }
  initTheme();
  initViewMode();
  initInspectorToggle();
  document.getElementById("sectionTabs").addEventListener("scroll", updateTabFade);
  window.addEventListener("resize", function(){ updateTabFade(); fitBayPanels(); });
  wirePrint();
  wireMenus();
  document.getElementById("manageGroupsBtn").addEventListener("click", openGroupsModal);
  document.getElementById("projectBtn").addEventListener("click", function(e){ e.stopPropagation(); toggleMenu("projectMenu"); });
  document.getElementById("bayMenuBtn").addEventListener("click", function(e){ e.stopPropagation(); toggleMenu("bayMenu"); });
  wireSearch();
  wirePhotoInput();
  document.getElementById("exportMenuBtn").addEventListener("click", function(e){ e.stopPropagation(); toggleMenu("exportMenu"); });
  document.getElementById("importMenuBtn").addEventListener("click", function(e){ e.stopPropagation(); toggleMenu("importMenu"); });
  document.addEventListener("click", function(){ closeAllMenus(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      var openMenu = ALL_MENU_IDS.filter(function(id){ return !document.getElementById(id).hidden; })[0];
      if(openMenu){ closeAllMenus(); return; }
      if(ui.pick && !ui.dialog){ endPick(); return; }
      if(ui.groupsModalOpen){ closeGroupsModal(); renderAll(); }
      else if(ui.addRackModalOpen){ closeAddRackModal(); }
      else if(ui.addGearModalOpen){ closeAddGearModal(); }
      else if(ui.resizeRackModalOpen){ closeResizeRackModal(); }
      else if(ui.snakeModal){ closeSnakeModal(); }
      else if(ui.dialog){ closeDialog(); }
      else if(ui.selection.length){ clearSelection(); }
    }
  });
  // Copy / paste of rack gear rides on the browser's own copy and paste
  // events so ordinary text copy/paste in the name and notes fields is never
  // hijacked: a copy only becomes a gear copy when no text is selected, and a
  // paste only becomes a gear paste when the clipboard holds copied gear (or
  // is empty and we're not typing in a field).
  function anyModalOpen(){ return ui.groupsModalOpen || ui.addRackModalOpen || ui.addGearModalOpen || ui.resizeRackModalOpen || !!ui.snakeModal || !!ui.dialog; }
  function isTextField(el){
    return !!el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT" || el.tagName === "SELECT" || el.isContentEditable);
  }
  document.addEventListener("copy", function(e){
    if(anyModalOpen() || !isGearSection(ui.section)) return;
    var el = document.activeElement;
    if(isTextField(el) && typeof el.selectionStart === "number" && el.selectionStart !== el.selectionEnd) return;
    var pageSel = window.getSelection ? String(window.getSelection()) : "";
    if(pageSel && !isTextField(el)) return;
    var bay = getActiveBay();
    var list = selectedGear(bay);
    if(!list.length) return;
    copyGear(list, e);
  });
  document.addEventListener("paste", function(e){
    if(anyModalOpen() || !isGearSection(ui.section)) return;
    var text = "";
    try{ text = e.clipboardData ? e.clipboardData.getData("text/plain") : ""; }catch(err){ /* ignore */ }
    var items = parseGearClip(text);
    if(!items){
      if(isTextField(document.activeElement)) return; // ordinary text paste
      if(text || !GEAR_CLIPBOARD.length) return;      // something else is on the clipboard
      items = GEAR_CLIPBOARD;
    }
    var bay = getActiveBay();
    if(!isGearBay(bay)) return;
    e.preventDefault();
    pasteGearIntoRack(bay.id, items);
  });
  // Undo / redo. Inside a text field that's been typed in, ⌘Z keeps its
  // normal job of undoing that typing; everywhere else it steps the project
  // back (the name field's own typing is folded into one project step too).
  var typedEls = new WeakSet();
  document.addEventListener("input", function(e){ typedEls.add(e.target); });
  document.addEventListener("focusin", function(e){ typedEls.delete(e.target); });
  document.addEventListener("keydown", function(e){
    if(!(e.metaKey || e.ctrlKey) || e.altKey) return;
    var k = String(e.key).toLowerCase();
    var isUndo = k === "z" && !e.shiftKey;
    var isRedo = (k === "z" && e.shiftKey) || (k === "y" && e.ctrlKey && !e.metaKey);
    if(!isUndo && !isRedo) return;
    if(anyModalOpen()) return;
    var el = document.activeElement;
    if(isTextField(el) && el.tagName !== "SELECT" && typedEls.has(el)) return;
    e.preventDefault();
    if(isUndo) undo(); else redo();
  });
  document.getElementById("groupChips").addEventListener("click", function(e){
    var chip = e.target.closest(".group-chip"); if(!chip) return;
    setHighlightGroup(chip.getAttribute("data-group") || null);
  });
  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("redoBtn").addEventListener("click", redo);
  resetHistory();
  document.getElementById("fileInputJson").addEventListener("change", function(e){
    var f = e.target.files[0]; e.target.value = "";
    if(f) handleImportJSON(f);
  });
  document.getElementById("fileInputCsv").addEventListener("change", function(e){
    var f = e.target.files[0]; e.target.value = "";
    if(f) handleImportCSV(f);
  });

  // Open the last project; first run of v4 moves any v3 draft in as Project 1.
  var migratedNote = null;
  var idx = loadProjectIndex();
  var opened = null;
  if(idx && idx.projects.length){
    projectIndex = idx;
    var order = [idx.current].concat(idx.projects.map(function(pr){ return pr.id; }));
    for(var oi = 0; oi < order.length && !opened; oi++){
      if(order[oi] && idx.projects.some(function(pr){ return pr.id === order[oi]; })){
        var st = loadProjectState(order[oi]);
        if(st){ opened = st; currentProjectId = order[oi]; }
      }
    }
  }
  if(!opened){
    var legacy = loadLegacyDraft();
    opened = legacy ? normalizeState(legacy) : createDefaultState();
    var hasLegacyContent = legacy && (legacy.groups && legacy.groups.length ||
      (legacy.bays||[]).some(function(b){ return (b.ports||[]).some(function(pt){ return pt.label || pt.notes; }); }) ||
      (legacy.bays||[]).length !== 2);
    if(legacy && !legacy.name) opened.name = "Project 1";
    projectIndex = {current:null, projects:[]};
    currentProjectId = addProjectFromState(opened);
    if(hasLegacyContent) migratedNote = "Your previous work is now saved as “" + opened.name + "”.";
  }
  state = opened;
  saveProjectIndex();
  resetHistory();
  try{ ui.exportPhotos = lsGet(PHOTOEXP_KEY) !== "0"; }catch(e){ ui.exportPhotos = true; }
  try{ ui.autoLib = lsGet(AUTOLIB_KEY) === "1"; }catch(e){ ui.autoLib = false; }
  renderAll();
  setSaveStatus(false);
  if(migratedNote) showToast(migratedNote, "success");
  // Photos load from IndexedDB after first paint; show them as soon as they're in, then tidy up unused ones.
  loadAllPhotos().then(function(){ renderAll(); gcPhotos(); });
  document.getElementById("sharedCopyBtn").addEventListener("click", saveSharedCopy);
  document.getElementById("sharedCloseBtn").addEventListener("click", exitSharedView);
  window.addEventListener("hashchange", checkShareHash);
  checkShareHash();
}
document.addEventListener("DOMContentLoaded", init);
